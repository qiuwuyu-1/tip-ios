name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 选择机器上任意一个 Xcode（不写死版本）
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Show available signing identities
        run: security find-identity -v -p codesigning || true

      - name: Set up keychain for ad-hoc signing
        run: |
          # 使用 ad-hoc 签名（-s -），无需 Apple 开发者账号即可编译出 IPA
          mkdir -p build
          echo "Using ad-hoc code sign"

      - name: Build (ad-hoc signed .app)
        run: |
          xcodebuild \
            -project TipScan.xcodeproj \
            -scheme TipScan \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            clean archive -archivePath build/TipScan.xcarchive

      - name: Export .ipa
        run: |
          mkdir -p build/export
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string></string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/TipScan.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist || {
              # ad-hoc 导出若失败，直接从 .app 打包成 ipa
              echo "exportArchive failed, fallback to manual .ipa packaging"
              mkdir -p build/export/Payload
              cp -R build/TipScan.xcarchive/Products/Applications/TipScan.app build/export/Payload/
              cd build/export && zip -qry TipScan.ipa Payload
            }

      - name: List build output
        run: find build -name "*.ipa" -o -name "*.app" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TipScan-IPA
          path: |
            build/export/*.ipa
            build/export/Payload/*.app
          if-no-files-found: warn
          retention-days: 30
