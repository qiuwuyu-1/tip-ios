《灭亡》、《新生》","B. 《激流三部曲》","C. 《火》三部曲","D. 《爱情三部曲》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"在《家》的高家三代人中，第二代克字辈属于（）","answer":"B","options":["A. 第三代觉字辈反抗、斗争的主要对象","B. 迂腐的卫道士、荒淫的纨绔子弟","C. 封建家庭的家长","D. 封建大家庭的孝子贤孙"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"巴金的《雾》、《雨》、《电》的题材是（）","answer":"A","options":["A. 表现社会革命、探索青年革命道路","B. 工人生活","C. 农村生活","D. 封建家庭生活"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"巴金创作的第一部小说是（）","answer":"C","options":["A. 《家》","B. 《雾》","C. 《灭亡》","D. 《新生》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"小说《寒夜》的背景是（）","answer":"B","options":["A. 沦陷时期的北平","B. 抗战胜利前后的重庆","C. 孤岛时期的上海","D. 大革命时期的武汉"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"巴金的小说《新生》、《灭亡》主要表现了（）","answer":"C","options":["A. 异域生活","B. 旧式家庭的罪恶","C. 对青年革命道路和社会革命的探索","D. 时代青年的爱情生活"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"属于小说巴金《家》中的一组女性形象是（）","answer":"C","options":["A. 梅、瑞珏、愫芳","B. 鸣凤、梅、曾树生","C. 梅、鸣凤、瑞珏","D. 鸣凤、愫芳、瑞珏"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"《家》的情节主线是（）","answer":"C","options":["A. 觉慧与父辈（克字辈）的冲突","B. 觉新对高老太爷的妥协","C. 觉慧、觉新、觉民等年青人的命运与封建大家庭的矛盾","D. 觉慧与冯乐山的斗争"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"曾树生这个人物出自于（）","answer":"C","options":["A. 《雾》","B. 《第四病室》","C. 《寒夜》","D. 《憩园》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"下列均属于巴金的作品是（）","answer":"C","options":["A. 《雪》、《砂丁》、《文博士》","B. 《憩园》、《新时代的旧悲剧》、《砂丁》","C. 《爱情三部曲》、《新生》、《憩园》","D. 《第四病室》、《旅途随笔》、《倪焕之》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"巴金创作于抗战时期的小说是（）","answer":"D","options":["A. 《灭亡》","B. 《爱情三部曲》","C. 《激流三部曲》","D. 《火》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"巴金创作的三个中篇《雾》、《雨》、《电》小说结集为（）","answer":"C","options":["A. 《激流三部曲》","B. 《复仇集》","C. 《爱情三部曲》","D. 《光明集》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"曹禺剧作《日出》的时代背景是（）","answer":"B","options":["A. “五四”前后","B. 30年代初期","C. 抗战时期","D. 大革命时期"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"下面属于沈从文小说《边城》的一组人物是（）","answer":"A","options":["A. 翠翠、船总、傩送、老船夫","B. 夭夭、傩送、老船夫、天保","C. 翠翠、王团总、老船夫、滕长顺","D. 萧萧、傩送、船总、老船夫"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"沈从文小说《丈夫》表现的思想内涵是（）","answer":"B","options":["A. 对封建男权主义的批判","B. 对穷苦人不幸命运的同情与追问","C. 对都市文明的批判","D. 对田园生活的向往"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"曹禺描写复仇的一部话剧是（）","answer":"C","options":["A. 《雷雨》","B. 《日出》","C. 《原野》","D. 《北京人》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"下面属于《雷雨》的一组人物是（）","answer":"B","options":["A. 周朴园、侍萍、愫方","B. 周朴园、鲁大海、四风","C. 陈白露、蘩漪、周朴园","D. 周萍、蘩漪、方达生"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"老舍以中英两个民族文化心理对比来剖析国民性的小说是（）","answer":"A","options":["A. 《二马》","B. 《老张的哲学》","C. 《赵子曰》","D. 《离婚》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"从作品整体看，贯穿长篇小说《骆驼祥子》的情节发展主线是（）","answer":"B","options":["A. 虎妞与刘四的矛盾冲突","B. 祥子买车的“三起三落”","C. 祥子与虎妞的纠葛","D. 祥子与刘四的矛盾冲突"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"《四世同堂》中的冠晓荷是（）","answer":"D","options":["A. 老派市民的形象","B. 革命者的形象","C. 正直的知识分子形象","D. 民族败类的形象"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"老舍反映沦陷区人民生活的小说是（）","answer":"C","options":["A. 《月牙儿》","B. 《骆驼祥子》","C. 《四世同堂》","D. 《二马》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"曹禺在抗战初期创作的以革新一所医院腐败现象为内容的剧本是（）","answer":"B","options":["A. 《咖啡店之一夜》","B. 《蜕变》","C. 《上海屋檐下》","D. 《正在想》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"曹禺以暴露“损不足以奉有余”的“社会形态”为创作思想的剧作是（）","answer":"B","options":["A. 《原野》","B. 《日出》","C. 《北京人》","D. 《家》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"曹禺唯一一部以农村生活为题材的作品是（）","answer":"C","options":["A. 《桥》","B. 《北京人》","C. 《原野》","D. 《家》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"标志老舍创作幽默风格成熟的作品是（）","answer":"C","options":["A. 《二马》","B. 《骆驼祥子》","C. 《离婚》","D. 《月牙儿》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"《激流三部曲》","answer":"《激流三部曲》由《家》《春》《秋》三部长篇组成。其思想内容为控诉封建大家庭的罪恶腐朽及其走向崩溃，表现了青年一代的民主主义觉醒及其反封建斗争。《家》描写高家祖孙之间的矛盾，以三个女性的悲剧控诉封建家庭的罪恶，以觉明抗婚觉慧出走表现了青年一代民主主义觉醒和反抗，高老太爷在绝望中死去标志封建大家庭开始走向崩溃。《春》继续这一主题。惠和觉新相爱，但由于封建包办婚姻酿成了悲剧；淑英则在觉民等的帮助下，敢于反抗包办婚姻离家到上海，走上新生。《秋》写封建大家庭彻底崩溃。一方面一些年轻生命的悲剧在继续，另一方面败家子变本加厉的挥霍，最后把高公馆卖掉，大家族解体。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","名词解释"]},{"question":"革命文学派","answer":"革命文学派创作了大量的革命小说。他们站在鲜明的革命立场上反映时代尖端的现实革命斗争，将革命历史上的一些重大事件和历史人物引进小说创作领域。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","名词解释"]},{"question":"简述《家》的艺术特点。","answer":"《家》是一部具有很浓的主观情感色彩的现实主义作品。（1）它再现了五四时期内地四川封建势力浓重但五四时代浪潮已冲击着古老土地的典型环境，作品中的祖孙间的矛盾冲突也正是当时典型的社会矛盾冲突，塑造了高老太爷、觉新等典型环境中的典型性格。许多生活细节也具有现实主义的真实性。（2）作者极端憎恨就制度旧家庭，热情歌颂敢于反抗旧势力的新生力量。强烈的爱憎感情渗透于《家》中，使《家》具有很浓的抒情色彩。或通过作品中人物抒发对旧制度的愤懑；或通过人物的心灵描写来倾诉旧制度的黑暗，如鸣凤投湖前的心理描写。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","简答"]},{"question":"简述《寒夜》的艺术特点。","answer":"《寒夜》在艺术上达到了巴金所追求的无技巧的境界，风格朴素自然，是巴金最优秀、成熟的现实主义杰作。抗战时重庆的典型环境和这环境中产生的最普通的小人物悲剧性格和命运，揭示出人物命运的社会根源。情节发展在日常生活琐事中推进；结构布局，一切象现实生活本身一样流动。人物平凡，具有复杂性格和复杂感情。大量的客观生活细节和日常生活琐事的描写支撑了小说的框架，这使得作品逼近生活，表现出一种与现实生活浑然一体的艺术境界。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","简答"]},{"question":"简述《雷雨》、《日出》的结构特点。","answer":"（1）《雷雨》是属于锁闭式结构。时间集中，从第一幕到第四幕时间不到20小时；地点集中，三幕都在周家客厅；剧本巧妙地以明线、暗线交织布局，以幕前情节推动现在的剧情。（2）《日出》则是人像展览式的结构，“用多少人生的零碎来阐明一个观念”，没有中心事件和中心人物，让陈白露将一个个人物引出。每个角色都占有相等的轻重，交相陪衬，共同烘托一个“损不足以奉有余”的社会，结构联系的是“人之道损不足以奉有余”这一基本观念，用的是“横断面的描写”。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","简答"]},{"question":"论述评价《家》的思想成就。","answer":"《家》的思想成就有三方面：（1）揭露和控诉的封建大家庭罪恶。这集中表现在三个年轻女性的悲剧中。梅是封建婚姻制度的牺牲品。她是旧式才女，与觉新青梅竹马。但父母之命的婚姻制度，使有情人不能成眷属。封建婚姻给她带来的是不幸、痛苦，最终抑郁而死。鸣凤死于封建家奴制。高老太爷把她送给六十来岁的冯乐三为妾，她最终以投湖自尽的方式来抗议黑暗的社会。瑞珏是封建伦理和迷信的牺牲品。她温柔贤淑，是典型的贤妻良母，对梅也是感情真纯。但封建伦理和迷信导致瑞珏难产而死。这一切的悲剧都是由于封建家长制。三位女性的悲剧及高家的一切罪恶，都和封建家长制及其代表人物高老太爷有关。家长制使高家这个典型的中国旧式大家庭成为一个罪恶的深渊和黑暗的王国。（2）《家》表现和赞颂了年轻一代民主主义的觉醒及其反封建斗争。高家的第三代中的觉民、觉慧就是觉醒青年的代表。觉慧在学校里参加了反对军阀的学潮，和同学一起半反封建的刊物，在家里支持觉民抗婚，怒斥“捉鬼”闹剧，并离家出走到社会上去，成为封建家庭的叛逆者。觉民是个个性主义者。他和琴的自由恋爱，反对封建包办婚姻，决然离家抗婚。觉慧、觉民代表着一种生气勃勃的青春力量，一种反对封建的叛逆力量。（3）对封建大家庭的腐朽及其在时代潮流冲击下趋向没落、崩溃的描写。高家是官僚地主家庭，成都北门首富，书香门第。表面上很融洽，内里却极其腐朽。第二代克安、克定便是高家腐朽的败家子的代表。克定在外面吃喝嫖赌。克安和他狼狈为奸。这个大家庭经济上挥霍亏空，精神上腐朽分裂。高老太爷一死，克定等在灵堂前就把家分了个彻底，“四世同堂”的封建大家庭崩溃解体了。内部的腐败导致大家庭彻底崩溃，时代潮流冲击下产生的新生代进一步敲响了封建家庭的丧钟，使小说具有鲜明的时代色彩。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","论述"]},{"question":"论述《家》中觉新的形象、觉慧的形象及高老太爷的形象","answer":"（1）觉新是一个复杂性格的人物。他是一个清醒认识到自己悲剧命运的懦夫。自愿的牺牲自己。因为受到过五四新思潮和反封建的新空气的影响，他切身认识到封建家庭制度必然崩溃的命运。但他受到的封建教育和封建家庭伦理观念的影响太深，作为封建家庭的“孝子贤孙”，使他自愿地挑起家庭的担子。他自愿为家庭牺牲自己，不敢反抗。他是一个自觉的懦夫，对封建家长的专制意志处处退让、顺从甚至做帮凶。他牺牲了梅、瑞珏，还劝说觉民接受高老太爷定的冯家的亲事。为了维护封建家庭他付出了自己和亲人的惨重代价。觉新的悲剧是封建末世的封建知识分子的悲剧。他清醒的认识到自己的命运，由此产生了绝望、悲观等心态。这一形象对现代中国的某些知识分子具有很大概括力。（2）觉慧的形象：觉慧是封建家庭大胆而幼稚的叛逆者。大胆表现在：他受五四思想影响，以改造天下为己任，积极参加社会活动，在学校里参加了反对军阀的学潮，和同学一起半反封建的刊物，在家里中，和鸣凤恋爱，支持觉民抗婚，怒斥“捉鬼”闹剧。他极端憎恨这个家庭，第一个冲出封建家庭的牢笼，成为封建家庭的叛逆者，代表着青年人追求真理的道路。幼稚表现在：他以个性解放为武器，对封建家庭的认识是个逐渐的过程。觉慧是五四时期具有民主主义觉悟的知识青年形象，旧家庭礼教叛逆者的形象。（3）高老太爷是封建制度的人格化。高家的家长，依借封建制度和伦理道德来统治这个大家庭。他是高家一切悲剧的元凶。他要抱承重孙，于是依封建婚姻制度而造成了梅和觉新的悲剧；把鸣凤送给冯乐三为妾；甚至在他死后还受到迷信保护造成瑞珏的悲剧。但他对儿孙也有温情的一面，这是表现了他实现“四世同堂”家庭形式的一种满足。高老太爷是封建末世的家长制代表人物，他是在理想幻灭极度失望后病死的。临死前他破天荒地答应取消觉民婚事要觉民觉慧不要走，是他为维护封建大家庭所做的最后的努力。他是带着幻灭感死去的。他的死具有象征意义，敲响了封建制度的丧钟。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","论述"]},{"question":"论述《骆驼祥子》的艺术特色。","answer":"（1）结构紧凑，落笔谨严。作品以祥子的“三起三落”为发展线索，以他和虎妞的“爱情”纠葛为中心，两相交织，单纯中略有错综。既通过祥子与周围人的关系，把笔触伸向更广大的不同阶级、不同家庭的生活面貌，真实地反映了社会的黑暗景象，又借此自然地揭示了祥子悲剧的必然性与社会意义。（2）丰富、多变、细腻的心理描写。通过以下方面来表现：祥子的个性沉默、坚韧乃至木讷，心理描写就补充了祥子不善言语的个性。以动作、情状写心理。从语言方面写心理。通过作者直接的剖析，托出祥子心理的变化。通过别人的眼睛观察祥子的心理。借助祥子眼中景物的变化来衬托心理。（3）鲜明突出的“京味儿”。对北京的风俗民情、地理风貌、自然景物的描写。祥子及其周围各种人物的描写别置于一个老舍所熟悉的北平下层社会中。虎妞筹备婚礼的民俗的交代；北平景物的情景交融的描写到祥子拉车路线的详细叙述，都使小说透出北平特有的地方色彩。在烈日与暴雨下拉车的祥子，对瞬息间变化莫测的大自然的感受，既切合北平的自然地理情况，又与祥子这个特定人物的身份相一致。“京味儿”还强烈地体现在小说的语言上。提炼了北京口语，生动鲜明地描绘北京的自然景物和社会风情，准确传神地刻画北平下层社会民众的言谈心理，简洁朴实、自然明快。人物语言，都是个性化的；叙述语言《日出》是以30年代初期半殖民地半封建社会中国大都市生活为背景的四幕话剧。《日出》的思想是暴露半殖民地大都市黑暗糜烂面，控诉“损不足以奉有余”的社会。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","论述"]},{"question":"论述《日出》的思想内容。","answer":"（1）剧本通过对半殖民地都是群丑的出色描绘暴露社会的黑暗糜烂。有工于心计的银行家潘月亭、卑躬屈膝的李石清、俗不可耐的顾八奶奶、洋奴张乔治等。这些都市群丑聚在陈白露的寓所里寻欢作乐，而又尔虞我诈，充分暴露了被金钱扭曲了的畸形人性。（2）描绘“不足”者的被受欺凌。“小东西”被卖进妓院；小职员黄省三走投无路毒死自己的孩子后自尽被救发了疯。剧本描写了他们的悲惨命运，也描写了他们善良、忠厚和倔强的平性。（3）剧本正是通过对都市群丑和下层被侮辱被剥夺者的描写，反映了20世纪30年代半殖民地中国大都市光怪陆离的社会生活图景，一方面是剥削者、“有余者”贪得无厌，醉生梦死；另一方面是被损害者、“不足者”备受侮辱。“有余者”和“不足者”形成强烈对比，表达了控诉“损不足以奉有余”的黑暗社会的主题。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第12章","论述"]},{"question":"沈从文批判、嘲讽现代都市文明的短篇小说是（）","answer":"C","options":["A. 《萧萧》","B. 《菜园》","C. 《八骏图》","D. 《牛》"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"现代作家中，始终称自己是“乡下人”的是（）","answer":"B","options":["A. 赵树理","B. 沈从文","C. 王鲁彦","D. 王统照"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"概括沈从文《边城》艺术风格的准确词语是（）","answer":"B","options":["A. 优美的散文","B. 抒情的诗，浪漫主义的牧歌","C. 现实主义的图画","D. 匕首与投枪"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"沈从文的《湘西》是（）","answer":"C","options":["A. 诗歌集","B. 小说集","C. 散文集","D. 小说散文合集"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"下列沈从文塑造的人物中“作为美的精灵与化身”的是（）","answer":"D","options":["A. 夭夭","B. 三三","C. 《丈夫》中的妻子","D. 翠翠"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"下列沈从文小说中表现“湘西人性世界”的作品是（）","answer":"B","options":["A. 《绅士的太太》","B. 《柏子》","C. 《大小阮》","D. 《八骏图》"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"沈从文讽刺知识分子的代表作是（）","answer":"B","options":["A. 《绅士的太太》","B. 《八骏图》","C. 《有学问的人》","D. 《王谢子弟》"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"以下不是沈从文散文集的是（）","answer":"A","options":["A. 《边城》","B. 《湘西》","C. 《湘行散记》","D. 《从文自传》"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"沈从文创作的中篇小说是（）","answer":"C","options":["A. 《丈夫》","B. 《长河》","C. 《边城》","D. 《湘西》"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"自称为“乡下人”的沈从文，其小说主题的最准确的概括是（）","answer":"D","options":["A. 表现了都市文明世界","B. 表现了湘西人性世界","C. 表现了宗法制农村世界","D. 表现了湘西人性世界与都市文明世界"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"沈从文的主要文学观念与创作倾向是（）","answer":"D","options":["A. 表现社会主义的理想","B. 表现农民的命运与前途","C. 表现阶级斗争与社会矛盾","D. 表现理想的“人性”"],"explanation":"","tags":["中国现代文学史","P11502","第13章","单选"]},{"question":"简述《边城》中的老船夫形象。","answer":"（1）老船夫是“善”的化身，主要表现在两个方面：他是“边城”世界里的公仆，五十年如一日的摆渡，把它看成是自己的天职，任劳任怨，从不计较个人得失。他质朴憨厚、狭义心肠，不仅拘收过客的钱财，而且还善待乡亲。老船夫的“善”，主要通过对外孙女翠翠的呵护、关爱充分地表现出来。他是一位慈祥、仁爱，为孙女可以付出一切的爷爷。最大的心愿是翠翠能得到自由幸福的爱情。为此他遵循苗族婚恋习俗。他见天保对翠翠有意，便指出“马路”和“出路”求爱的途径，引来了天保家正式向他提亲，未料翠翠却把答应，好心办坏事。在明白翠翠心里有傩送之后，又为孙女与傩送的联姻劳碌奔波，受到船总的冷遇，他怕翠翠的自尊受到伤害，不讲实情，以至郁闷离世。（2）作者对老船夫的刻画是围绕着翠翠的婚事种种，特意“放大”了去表现一个平凡老人充满人情美、伦理美的宽大的胸襟，即一个纯真、至善、完美的人性的生命个体。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第13章","简答"]},{"question":"简述汪曾祺的文学思想。","answer":"他以个人化的细小琐屑的题材，使“日常生活审美化”，纠偏了那种集体的“宏大叙事”；以平实委婉而又有弹性的语言，反拨了笼罩一切的“毛话语”的僵硬；以平淡、含蓄节制的叙述，暴露了滥情的、夸饰的文风之矫情，让人重温曾经消逝的古典主义的名士风散文的魅力，从而折射出中国当代散文的空洞、浮夸、虚假、病态，让真与美、让日常生活、让恬淡与雍容回归散文，让散文走出“千人一面，千部一腔”，功不可没。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第13章","简答"]},{"question":"分析《边城》中的翠翠形象。","answer":"（1）翠翠是作者倾注“爱”与“美”的理想的艺术形象。翠翠来到人间，便是爱的天使与爱的精灵。她爷爷把她领大，一老一少相依为命。自然即长养她且教育她，为人天真活泼。她既是爱情的女儿，又是大自然的女儿。在她身上“天人合一”，她是美的精灵与化身。（2）翠翠身上的“美”，是通过她的爱情故事逐步表现出来的：①第一阶段：翠翠爱情萌生阶段。她在小镇看龙舟初遇傩送，爱情的种子就萌芽了。②第二阶段：翠翠爱情的觉悟阶段。两年后又进城看龙舟，她的爱情意识已完全觉醒。③第三阶段：翠翠对爱情执着的阶段。她在爱上傩送后，没想到傩送的哥哥也爱上了她。出于对爱情的忠贞，她明确向爷爷表示拒绝。然而，她与傩送的爱情却忽然受到严重挫折，傩送远走他乡、爷爷也死了使她一夜之间“长成大人”。④最后，她像爷爷那样守住摆渡的岗位，苦恋并等待着傩送的归来，这些充分表现了翠翠性格坚强的一面。在爱情挫折中翠翠的性格展现着柔中有刚的美。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第13章","论述"]},{"question":"论述沈从文《边城》的艺术特色。","answer":"《边城》在艺术表现方面具有鲜明、独特的个性。（1）作者擅长将人物的语言、行动描写与心理描写结合起来，以揭示人物的个性特征和丰富的内心世界。如对翠翠的描写，作者静观、揣摩少女在青春发育期性心理所表现的各种情态，通过粗线条的外部刻画与细腻入微的心理描写，从而把羞涩、温柔的个性突现出来。（2）小说结构寓严谨于疏放。全篇围绕翠翠的爱情故事这一中心逐步展开，情节集中、单纯；作品以傩送、天保两人钟情与翠翠为纬线，以老船夫关心、撮合孙女的婚事为纬线，推动故事有节奏地向前发展。又以翠翠与傩送、天保的爱情纠葛为明线，以王团总想傩送当女婿为暗线。经纬交织，明暗结合，将情节的单纯性与复杂性完美结合。（3）作者特意在故事的发展中穿插了对歌、提亲、赛龙舟等苗族风俗的描写。特别是关于端午节风俗的描写，来展示边城的自然环境、人文环境，既是“边城”乡土性的诗意揭示，又是扑朔迷离的诗意烘托。（4）《边城》的艺术风格，是一首抒情的诗，一曲浪漫主义的牧歌。①翠翠与傩送的爱情故事成为诗情的载体，抒情才是小说的“本事”与目的。作者叙事的笔端，倾泻着、流动着作者对“爱”与“美”的诗性的讴歌与咏叹。作者还在艺术上追求诗意化的表现。以关于动作、对话的白描与韵味发掘翠翠内心丰富的“潜台词”；情节结构方面，以经纬交织、明暗结合的手法，烘托内在的情绪节奏；在乡土风俗描写方面，将人物的活动置于一副副风俗风情画面上，形成了诗情画意的意境。②《边城》的故事基本上建筑在梦幻的基础上。运用的是浪漫主义的创作方法，一半是“梦”，一半是理想的“现实”，并非对当时社会的写真。人物与故事是当时社会真实的超脱与超越。作者在“边城”世界里有意识地消解了种种对立因素。作品的结尾采用了比较平和、并非绝望结局，结尾更与余味袅袅的牧歌的情韵。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第13章","论述"]},{"question":"20世纪40年代上海沦陷时期红极一时的作家是（）","answer":"A","options":["A. 张爱玲","B. 穆时英","C. 刘呐鸥","D. 施蛰存"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"三十年代的新感觉派作家有（）","answer":"C","options":["A. 沈从文、废名、萧乾等","B. 萧红、萧军、端木蕻良等","C. 刘呐鸥、穆时英等","D. 蒋光慈、叶紫、殷夫等"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"穆时英的作品有（）","answer":"B","options":["A. 《石秀》","B. 《夜总会里的五个人》","C. 《梅雨之夕》","D. 《上海的狐步舞》"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"30年代初期在文坛上崛起一批青年抒情散文家，他们是（）","answer":"C","options":["A. 李广田、穆时英、刘呐鸥等","B. 徐懋庸、唐弢、巴人等","C. 何其芳、丽尼、陆蠡等","D. 夏衍、宋之的、郑伯奇等"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"施蛰存一般被认为是（）","answer":"C","options":["A. 京派作家","B. 社会剖析派作家","C. 心理分析派作家","D. 东北作家群作家"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"下面属于第一代海派作家的是（）","answer":"A","options":["A. 张资平","B. 刘呐鸥","C. 艾青","D. 施蛰存"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"下面属于第二代海派作家的是（）","answer":"D","options":["A. 张资平","B. 许地山","C. 艾青","D. 施蛰存"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"下面属于第三代海派作家的是（）","answer":"A","options":["A. 张爱玲","B. 许地山","C. 艾青","D. 王统照"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"下面不属于海派作家的是（）","answer":"B","options":["A. 张资平","B. 许地山","C. 杜衡","D. 施蛰存"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"下面不属于穆时英作品的是（）","answer":"D","options":["A. 《交流》","B. 《南北极》","C. 《公墓》","D. 《寒夜》"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"下面不属于刘呐鸥作品的是（）","answer":"D","options":["A. 《都市风景线》","B. 《赤道下》","C. 《热情之骨》","D. 《包身工》"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"下面不属于施蛰存作品的是（）","answer":"D","options":["A. 《上元灯》","B. 《将军底头》","C. 《梅雨之夕》","D. 《死水》"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"下面属于新感觉派作家的是（）","answer":"A","options":["A. 施蛰存","B. 王统照","C. 台静农","D. 张恨水"],"explanation":"","tags":["中国现代文学史","P11502","第14章","单选"]},{"question":"海派文学","answer":"海派的概念是与京派对立的，最初这两个名词是沈从文在上世纪30年代挑起的一场文学争论中提出的，上世纪30年代写实小说和抒情小说流派基本上分别被京派和海派所分割。海派作家应该是指活跃在上海的作家（未必是上海人）。广义上的海派指所有活跃在上海的作家派别，包括左翼文学、新感觉派文学、鸳鸯蝴蝶派；狭义的话，就只指新感觉派。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第14章","名词解释"]},{"question":"简述新感觉派小说的艺术特色。","answer":"（1）从题材上看，新感觉派作家浓墨重彩表现的是机械文明中快节奏的现代大都市生活，展示人物的灵魂和病态，从而开拓了一种独特类型的都市文学。（2）在艺术表现上，新感觉派在表现都市特色时，“刻意捕捉那些新奇的感觉、印象“，将人的主观感觉、主观印象渗透、融合到客体的描写中，从而创造出带有强烈主观色彩的所谓“新现实”。（3）新感觉派在描绘感觉时，往往将视觉、听觉、嗅觉、味觉这些不同的方面结合起来写，用通感的手法表达一种新奇灵动的感觉。最后，在小说结构上，新感觉派小说创造了与传统小说不一样的结构方式。他们借鉴电影的表现手段，从表达主观感受的需要出发，采取相应的结构形式。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第14章","简答"]},{"question":"简述穆时英小说的艺术特色。","answer":"（1）用感觉主义、印象主义的方法，写了上海社会中的形形色色，人物尤以舞场男女为多，它们给当时文坛造成了一种描写都市爱情生活的甜腻腻而又轻飘飘的“海派文学”或者“洋场文学”的风气。（2）强调作家的主观感觉而不太注重对客观生活的真切描写。穆时英和施蛰存把“新感觉派”小说推向成熟和引身运用蒙太奇、人物心理分析等手法，凸现对现实生活的感觉和印象。《上海狐步舞》、《梅雨之夕》等是他们的代表作。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第14章","简答"]},{"question":"论述刘呐鸥小说的特点。","answer":"（1）在题材方面，刘呐鸥以现代都市作为他的创作表现对象，他笔下人物的活动空间大多是都市中的赛马场、夜总会、电影院、大旅馆、舞会、酒馆，霓虹灯下、特快列车。而他笔下的人物也大多是繁华场里沉醉于纸醉金迷生活中的人物，如舞女、少爷、姨太太、资本家、投机商、公司职员、流氓、妓女等等，写出了现代化都市中在一种急迫的机械文明节奏下人们“坐在速度的上面”的生活。集中笔力展现现代化都市及都市中人的生活，这在文学史上还是第一次。（2）刘呐鸥展示都市生活，目的在于暴露都市社会的畸形和人的精神病态。时人如此评论《都市风景线》：呐鸥先生是一位敏感的都市人，操着他的特殊的手腕，他把这飞机、电影、Jazz（爵士乐）、摩天楼、色情、长型汽车的高速度大量生产的现代生活，下着锐利的解剖刀。在他的作品中，我们显然看出了这不健全的、糜烂的、罪恶的资产阶级的生活的剪影和那即刻要抬起头来的新的力量的暗示。（3）刘呐鸥的小说还写出了在喧嚣的都市中人的疏离感、孤独感。如在《游戏》中就曾有这样痛彻的描述：我觉得这个都市的一切都死掉了。塞满街路上的汽车，轨道上的电车，从我的身边，摩着肩，走过前面去的人们，广告的招牌，玻璃，乱七八糟的店头装饰，都从我的眼界消灭了。我的眼前有的只是一片大沙漠，像太古一样地沉默。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第14章","论述"]},{"question":"下列属于张恨水的一组小说是（）","answer":"C","options":["A. 《春明外史》、《啼笑因缘》、《结婚十年》","B. 《啼笑因缘》、《八十一梦》、《金锁记》","C. 《五子登科》、《啼笑因缘》、《八十一梦》","D. 《生死场》、《春明外史》、《啼笑因缘》"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"“好一记鞭子”指的是（）","answer":"C","options":["A. 三篇杂文","B. 三篇小说","C. 三个街头剧","D. 三首枪杆诗"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"张恨水小说《五子登科》的时代背景是（）","answer":"A","options":["A. 抗战胜利以后","B. 抗日战争时期","C. 北洋军阀时期","D. 辛亥革命时期"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"张恨水《春明外史》中的“春明”是（）","answer":"C","options":["A. 形容春和景明的季节","B. 清明的别称","C. 北京的别称","D. 人物名"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"张恨水抗战时期的“社会讽喻小说”是（）","answer":"B","options":["A. 《啼笑因缘》","B. 《八十一梦》","C. 《金粉世家》","D. 《春明外史》"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"柯仲平的《边区自卫军》是（）","answer":"B","options":["A. 长篇抒情诗","B. 长篇叙事诗","C. 报告文学","D. 歌剧"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"柳青的第一部长篇小说是（）","answer":"A","options":["A. 《种谷记》","B. 《原动力》","C. 《高干大》","D. 《暴风骤雨》"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"张恨水创作于四十年代的社会讽刺小说是（）","answer":"A","options":["A. 《八十一梦》","B. 《金粉世家》","C. 《春明外史》","D. 《啼笑因缘》"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"刘半农诗作的主要特色在于（）","answer":"A","options":["A. 诗体的多样化和平民化","B. 口语化和民族化","C. 大众化和格律体","D. 乡士性和写实性"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"下列人物不属鸳鸯蝴蝶派的有（）","answer":"C","options":["A. 包天笑","B. 徐枕亚","C. 林纾","D. 周瘦鹃"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"“鸳鸯蝴蝶派”通常又称（）","answer":"D","options":["A. “才子佳人”派","B. 言情派","C. 游戏消遣派","D. “礼拜六”派"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"对鸳鸯蝴蝶派游戏的消遣的文学观进行批判，最有力的新文学社团是（）","answer":"A","options":["A. 文学研究会","B. 语丝社","C. 创造社","D. 新青年社"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"下列不属于社会言情小说的是（）","answer":"D","options":["A. 《新歇浦潮》","B. 《人间地狱》","C. 《上海春秋》","D. 《奇侠精忠传"],"explanation":"","tags":["中国现代文学史","P11502","第15章","单选"]},{"question":"通俗小说","answer":"通俗小说的概念一般比较模糊，是因为它的文学地位的不确定性。长时期以来人们强调它属于“旧文学”或“封建文学残余”，而来不及认识它由旧文学向现代性的新文学缓慢过渡的一面。最终它实际已经融入了新文学之中，成为新文学内部的现代通俗文学的一部分。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第15章","名词解释"]},{"question":"鸳鸯蝴蝶派小说","answer":"鸳鸯蝴蝶派小说：市井通俗言情、奇侠、黑幕小说，倡导文学是消遣的游戏的金钱的文学观念，主要以《礼拜六》杂志为代表。有影响的有：徐枕亚的《玉梨魂》，张恨水的《啼笑因缘》，李涵秋的《广陵潮》等。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第15章","名词解释"]},{"question":"简述通俗小说特点。","answer":"（1）现代通俗小说，从文学观念方面看，它比新文学、主流文学的政治功利性要弱些，商业目的性要强些；（2）从趣味上说，现代通俗小说更倾向于消遣、娱乐、游戏；（3）从创作方法上讲，现代通俗小说更有明显的民间传统小说特征，模式化、程式化的倾向比较显著。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第15章","简答"]},{"question":"论述《金粉世家》的思想内容。","answer":"（1）悲剧主题《金粉世家》具有强烈的悲剧意识及其气氛，这里最集中最内在地同样表现为存在悲剧的主题，其实是厌倦了人世的虚无和绝望感。比如，在第八十三回金太太还说：“人生无论什么都是空的，真无味呀。”其实，这是作者借人物之口表达自己的人生虚无观念，最能体现张恨水人生存在悲剧观者是他在《金粉世家》的《作者原序》里的话。他写道“至三十岁以来，则饱受社会人士之教训，但愿一杖一盂，作一旅方和尚而已。顾有时儿女情重，辄又忘之。今吾儿死，吾深感人生不过如是，富贵何为？名利何为？作和尚之念，又滋深也。此以吾思想而作小说，所以然，《金粉世家》之如此开篇，如此收场者矣。”而《金粉世家》的开篇和结尾都充满人生这种绝望和虚无感。（2）时代意识在这部作品中却处处体现着旧式女子的新式现代意识：追求自由、幸福的婚姻生活。首先，她们敢于冲破传统婚姻的牢笼。作品中的男主角燕西和女主角清秋：一个是世族豪门，一个是出身寒微的贫家女。两个出身背景差异如此之大的人结合在一起，完全是对传统“门当户对”谈婚论嫁观念的正面挑战。两人虽然还是一见钟情，但不再是偷香窃玉式的私定终身，而是光明正大的自由恋爱。爱情的背叛也没有导致主人公的自杀，爱情并非生命的全部，这种婚姻爱情观念和独立人格的追求，无疑是具有时代精神的。而丫鬟小怜为了爱情也决然出逃，更是体现下层女仆思想意识的提高。她与柳春江的结合完全排除了门第观念，排除了一切社会因素。她知道在那样的环境下，要靠自己去争取和追求自由幸福的婚姻。大少奶奶佩芳在对凤举无可救药时，大胆地提出离婚。这是一群旧式女子，生活在新旧矛盾交替的边缘，却有着强烈的现代意识。她们不屈服于被压迫的命运，采取了出走的形式来进行反抗。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第15章","论述"]},{"question":"“汉园三诗人”指的是（）","answer":"B","options":["A. 何其芳、金克木、李广田","B. 何其芳、卞之琳、李广田","C. 卞之琳、徐迟、金克木","D. 金克木、徐迟、路易士"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"何其芳《画梦录》的重要价值在于（）","answer":"C","options":["A. 表现青春的悲伤","B. 爱情的感叹和象征主义的艺术追求","C. 对散文艺术的自觉追求和散文的抒情美、形式美的创造","D. 对人生哲理的探求与表现和对颓废情调的表达"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"林语堂前期散文的准确概括应是（）","answer":"D","options":["A. 匕首与投枪","B. 独语式的内心抒情","C. 自由评点社会人生","D. 幽默闲适抒写性灵"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"林语堂主张幽默文学的命脉是（）","answer":"D","options":["A. “语言”","B. “闲适”","C. “笑料”","D. “性灵”"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"三十年代提倡幽默、闲适、性灵小品的主要是（）","answer":"C","options":["A. 新月派","B. 京派","C. 论语派","D. “自由人”"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"林语堂参与或主持的刊物是（）","answer":"B","options":["A. 《新月》","B. 《论语》半月刊","C. 《文学季刊》","D. 《水星》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"被林语堂先生称为“照彻古今的一切烽火”的是哪位诗人（）","answer":"A","options":["A. 陶渊明","B. 李白","C. 王维","D. 苏轼"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"被林语堂先生称为“中国文学史中最可爱的女人”是_____中的沈复的妻子芸娘（）","answer":"B","options":["A. 《三言二拍》","B. 《浮生六记》","C. 《京华烟云》","D. 《聊斋志异》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"下列哪部不是林语堂的作品（）","answer":"A","options":["A. 《雅舍小品》","B. 《京华烟云》","C. 《吾国与吾民》","D. 《苏东坡传》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"林语堂主办的刊物不包括（）","answer":"C","options":["A. 《人世间》","B. 《论语》半月刊","C. 《自由谈》","D. 《宇宙风》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"何其芳获1936年《大公报》文艺奖的《画梦录》，属于（）","answer":"D","options":["A. 长篇小说","B. 短篇小说集","C. 诗集","D. 散文集"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"诗集《鱼目集》的作者是（）","answer":"C","options":["A. 何其芳","B. 李广田","C. 卞之琳","D. 路易士"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"1933年开始，其诗由“主情”转向“主智”，克制感情的自我表现，追求思辨美的“非个人化”倾向的诗人是（）","answer":"B","options":["A. 戴望舒","B. 卞之琳","C. 何其芳","D. 王鲁彦"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"艾青到延安以后发表的诗集有（）","answer":"B","options":["A. 《火把》","B. 《黎明的通知》","C. 《北方》","D. 《向太阳》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"《月牙儿》的主要思想内容是（）","answer":"B","options":["A. 母亲沦为娼妓的悲惨命运","B. 母女两人的悲剧遭遇","C. 人力车夫的悲惨生活","D. 知识分子的爱情生活"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"三十年代现代派诗歌的代表人物是（）","answer":"D","options":["A. 徐志摩、卞之琳","B. 穆木天、蒲风","C. 艾青、臧克家","D. 戴望舒、何其芳"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"艾青第一本诗集诗集《大堰河》出版于（）","answer":"B","options":["A. 1935年","B. 1936年","C. 1938年","D. 1940年"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"汪中这一人物形象出于（）","answer":"D","options":["A. 郭沫若的《牧羊哀话》","B. 郁达夫的《沉沦》","C. 李劼人的《大波》","D. 蒋光慈的《少年漂泊者》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"连续性历史题材长篇小说《死水微澜》、《暴风雨前》和《大波》的作者是（）","answer":"D","options":["A. 王鲁彦","B. 王统照","C. 萧军","D. 李劼人"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"被称为“泥土诗人”的臧克家的第一本诗歌集是（）","answer":"A","options":["A. 《烙印》","B. 《泥土的歌》","C. 《泥淖集》","D. 《宝贝儿》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"被称为“泥土诗人”的作家是（）","answer":"B","options":["A. 田间","B. 臧克家","C. 艾青","D. 孙毓棠"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"艾青早期诗歌的代表作是（）","answer":"D","options":["A. 《火把》","B. 《向太阳》","C. 《黎明》","D. 《大堰河——我的保姆》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"艾青的成名作是（）","answer":"B","options":["A. 《北方》","B. 《大堰河——我的保姆》","C. 《向太阳》","D. 《我爱这土地》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"《我爱这土地》选自艾青的诗集（）","answer":"A","options":["A. 《北方》","B. 《大堰河——我的保姆》","C. 《艾青诗选》","D. 《旷野》"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"《我爱这土地》中诗人着力刻画的一个象征形象是（）","answer":"C","options":["A. 土地","B. 暴风雨","C. 鸟","D. 温柔的黎明"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"艾青曾被_____称为“吹芦笛的诗人”（）","answer":"A","options":["A. 胡风","B. 臧克家","C. 闻一多","D. 郭沫若"],"explanation":"","tags":["中国现代文学史","P11502","第16章","单选"]},{"question":"论语派","answer":"论语派是20世纪30年代的一个现代散文流派，以创办《论语》半月刊而得名，尚有《人间世》、《宇宙风》等刊物、主要人物是林语堂。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第16章","名词解释"]},{"question":"汉园三诗人","answer":"汉园三诗人是指中国现代派诗群中三位杰出的现代主义代表诗人卞之琳、何其芳、李广田，主要代表作品为《汉园集》。他们注重以诗歌传达独特的气质：何其芳主要表现青年人朦胧的理想和淡淡的忧伤；李广田的诗歌，风格质朴，蕴藉深沉；卞之琳善于在不露声色中深含着情感与哲理，对现代诗歌的客观化、非个人化等艺术手法进行了有益的探索，文字奇巧。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第16章","名词解释"]},{"question":"简述丰子恺作品的思想内容。","answer":"丰子恺的散文从内容上看大致可以划分为四类：①探究人生和自然的奥秘，带有玄思的色彩。②描写儿童的情趣。③回忆自己的创作历程。④取材于日常生活见闻，反映世态人情。这一类的散文也是丰子恺散文创作的主体部分，能够代表其散文创作的基本特色。名篇有《给我的孩子们》、《华瞻的日记》、《儿女》、《作父亲》、《车厢社会》等。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第16章","简答"]},{"question":"简述丰子恺作品的艺术特点。","answer":"丰子恺的散文只用平常的字句，务求明白，不喜欢装修粉饰，文字有一种朴讷而又明亮的味道，是典型的随笔体散文，其《缘缘堂随笔》融童心和禅趣为一体，既真率自然，又妙趣横生。抗战前，丰子恺的作品转而接触社会，开始写灾难性的现实，但文字仍然处处浸润着那种疏淡隽逸的调创作子，于细微处发掘宏旨精义，如《肉腿》、《半篇莫干山游记》。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第16章","简答"]},{"question":"简述艾青诗作的独特风格。","answer":"对多灾多难的祖国、民族、土地、人民尤其是农村劳动人民的爱，感情深沉；前期的诗带有“忧郁”的感情色彩。《大堰河——我的保姆》，诗篇抒发了对乳母大堰河的深厚真挚的爱，以铺陈手法，塑造和赞颂了这一农村妇女勤劳善良的动人形象，对造成她一家悲惨命运的“不公道世界”发出“咒语”。忧郁的色彩源于对灾难深重的祖国和人民的深情，增加了诗歌的动人力量。对光明的热烈向往、追求和火一般燃烧的热情。鲜明深刻的意象和浓郁的诗情，想象丰富，比喻新颖，有色调，有光彩，诗中有画，革命现实主义融进了象征主义、浪漫主义艺术技巧。《手推车》以手推车为中心意象；诗在色调、光彩、线条与音响的调配上十分成功。《我爱这土地》中，诗人运用了象征、暗示、移情等手法。以散文式的诗句自由抒写的自由体形式。不注重诗的外在节律，常用排比、反复等手法表达强烈的感情。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第16章","简答"]},{"question":"简述李劼人《死水微澜》中的蔡大嫂形象。","answer":"在李劼人的“大河小说”中，《死水微澜》在艺术成就上最高，既写出了历史时代的风云，又写出了地方风情和民俗，人物刻画也非常成功。人物刻画是在辛丑条约签订期间，四川社会的冲突及地方风习的变迁，折射到具体人物中，在蔡大嫂身上体现了一个富于幻想、泼辣爽直，敢作敢当的女性，她有蔑视礼教的大胆行为，但她也有着虚荣、追逐浮华精神侧面。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第16章","简答"]},{"question":"卞之琳作品的文学特色。","answer":"（1）其前期诗作，内容多写下层社会生活，并探索宇宙与人生哲理。卞之琳以“我”为主，将传统的“意境”与西方的小说化、典型化、非个人化的“戏剧性处境”融汇在一起，并将传统的“含蓄”与西方的“重暗示性”和““亲切感”融汇在一起，形成了“平淡中出奇”，“用冷淡掩深挚，从玩笑出辛酸”的特殊风格。他的诗显示出一种着意克制感情的自我表现，追求思辨美的“非个性”倾向的特色。在语言上，他则追求在口语基础上实现欧化词汇、句法与中国文言词汇、句法的杂糅。（2）卞之琳的新诗广泛地从中国古诗和西方现代派诗吸取营养，自成一格，充满智慧的闪光和哲理的趣味，是30年代中国文坛“现代派”诗歌的重要代表人物。抗日战争期间曾前往延安和太行山区访问，诗风有所转变，歌唱人民的战斗生活。诗作讲究音节的整饬，追求文字的奇巧，表现出当时青年知识份子对现实的不满与思考。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第16章","论述"]},{"question":"论述臧克家诗歌的主题思想。","answer":"（1）民间意识臧克家立足民间意识，试图再现当时的生活现实和民众的生存状态，这就注定了他的诗歌的题材大都是描绘民间大地和下层民众的。臧克家的主要的优秀作品基本上都是关于农村的。如《〈泥土的歌〉序句》中写道：“我用一支淡墨笔／速写乡村／一笔自然的风景／一笔农民生活的缩影／有愁苦、有悲愤／有希望、也有新生／我给了一个活栩栩的生命／连带着我湛深的感情”。（2）传达苦难当臧克家开始写作时，首先涌上他心头的是在苦难中挣扎的祖国与人民，展现于笔端的则是饥荒遍野、破败不堪的黑暗压抑的社会现实：“魔鬼撕破了真理的面孔”，“恐怖就让它是六月的淫雨”，“大好田园灾难当了家”（《自白》），难民开始逃荒，迎接他们的只能是妻离子散的悲哀和死亡的威胁。（3）生命意志臧克家的友情诗中乐于传达友人乐观达生的人生态度与坚韧不拔的人生意志。这在其赠予姚雪垠、徐迟、田汉、茅盾、巴金、方殷、冰心、白寿彝等人的诗词中表现的最为明显。即如《读田汉同志诗词》，诗中写道：“情亲朋辈呼‘老大’，往事纷纷到目前。“老大”一词，将田汉的豁达开朗、心胸宽广、积极乐观而又平易近人的性格特点展现出来，为读者刻画了一个艺术家田汉、一个革命者田汉，一个拥有着伟大人格的田汉，一个有着乐观人生态度的田老大。（4）革命情怀臧克家的劳动诗主要描写在“干校”的劳动生活，透露出一种紧张而又欢快的气息，表现出对于革命必胜的坚定信念。这里既有对于下田种植和收割作物等主要的劳作内容的描写，也有对于“干校”日常生活，如午休、做饭、养猪、挑粪等的描写。前者代表如《向阳湖》，这是一首描写田间种植水稻的劳动场景的诗。通过“干校”劳动，臧克家的身心状态发生了可喜变化，并且收获了醇厚友谊。诗人通过对于这两方面的描写，从侧面内涵了自己的革命情怀。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第16章","论述"]},{"question":"下列属于战国策派成员的是（）","answer":"B","options":["A. 台静农","B. 林同济","C. 黄震遐","D. 王平陵"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"抗战初期成立的中华全国文艺界抗敌协会是一个（）","answer":"A","options":["A. 全国文艺界抗日民族统一战线组织","B. 全国进步文艺家的组织","C. 全国革命文艺家的组织","D. 全国作家的群众性组织"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"抗战初期，提出“与抗战无关的材料，只要真实流畅，也是好的”，引发文学与抗战关系论争的是（）","answer":"B","options":["A. 沈从文","B. 梁实秋","C. 朱光潜","D. 萧乾"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"1936年，被称为“在中国的报告文学上开创了新的记录”的作品是（）","answer":"A","options":["A. 夏衍《包身工》","B. 宋之的《一九三六年春在太原》","C. 丘东平《第七连》","D. 范长江《塞上行》"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"1930年初，殷夫将他1929年以前的诗作65首编为诗集，题名为（）","answer":"B","options":["A. 《放脚时代的足印》","B. 《孩儿塔》","C. 《血字》","D. 《我们的诗》"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"左联成立后，文坛上出现的“民族主义文学”是一个（）","answer":"A","options":["A. 国民党的文学派别","B. 民族主义者的文学派别","C. 抗日救亡的文学派别","D. 民族统一战线的文学组织"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"“把对中国国民性的解剖放进世界民族之林这个大手术室中”的长篇小说是（）","answer":"A","options":["A. 《二马》","B. 《沉沦》","C. 《围城》","D. 《赤都心史》"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"鲁迅断言“不容于满洲帝国，但我看也因此当然不容于中华民国”的小说是（）","answer":"A","options":["A. 萧军《八月的乡村》","B. 萧红《生死场》","C. 叶紫《丰收》","D. 吴组缃《鸭嘴崂》"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"太阳社是一个（）","answer":"B","options":["A. 民族主义文学团体","B. 革命文学团体","C. 自由主义文学团体","D. 大众化文学团体"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"提出“伟大的文学乃是基于固定的普遍的人性”，“文学是没有阶级性的”这一文学观点的是（）","answer":"D","options":["A. 周作人","B. 沈从文","C. 徐志摩","D. 梁实秋"],"explanation":"","tags":["中国现代文学史","P11502","第17章","单选"]},{"question":"报告文学","answer":"报告文学是散文的一种，介于新闻报道和小说之间，兼有新闻和文学的特点的散文。报告文学是运用文学艺术，真实、及时地反映社会生活事件和人物活动的一种文学体裁。它的基本特征是新闻性、文学性、政论性。是用文学手段处理新闻题材的一种文体。叙写现实生活中确实存在的先进人物，反映多姿多彩的生活，揭露为人们嗤之以鼻的丑恶事物。特点是真实，艺术加工，形象性，抒情性。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第17章","名词解释"]},{"question":"抗战文学","answer":"“抗战文学”这个概念有广义和狭义之分。狭义的抗战文学，是指以抗战为题材的文学。从共时性角度考察，抗战文学存在大叙事、现实性、反形式化三大特点。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第17章","名词解释"]},{"question":"简述鲁迅后期杂文的艺术特色。","answer":"（1）鲁迅杂文是诗化的政论，是政论化的诗，做到了绵密的逻辑和生动的形象高度的统一、思想家的卓识和文学家的才华的高度统一。（2）从“砭锢蔽”的立意出发，塑造出了否定性的类型形象体系。这些形象都成了经典性的形象。（3）幽默讽刺和曲折冷峭的语言。他的杂文好用反语、夸张等幽默讽刺手法，亦庄亦谐，庄谐并出，往往三言两语就能画出论敌的“鬼脸”，语言简洁峭拔，充满幽默感。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第17章","简答"]},{"question":"简述报告文学兴起的原因。","answer":"（1）急剧变动的社会生活需要具有很强新闻性和纪实性的文学样式作出迅速的反映；（2）“左联”的积极倡导和组织；（3）外国报告文学理论和作品的翻译，为中国报告文学的发展提供了范式和推动力。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第17章","简答"]},{"question":"论述抗战题材小说创作的发展阶段。","answer":"（1）第一阶段是在战争进行中，即1931年到1945年。1931年日军悍然出兵中国，占据东北三省，挑起战争。作家们用手中的笔作为枪炮，写下激扬文字，直指侵略者的丑恶行径。这一阶段的小说创作主要特点可以概括为短、平、快，作家们以最迅捷的方式记录那段烽火岁月，也表达着对当时社会的观察和思考。（2）第二阶段是抗战胜利后到新时期之间。这一阶段，中国取得了抗战的胜利，却远没有达到真正的和平。此后又经历了解放战争、抗美援朝以及“十七年”的风雨。对于中国来说，建立一个什么样的国家、如何建立是亟待解决的问题。这一时期抗战题材创作往往和解放战争等题材的创作混合起来，重心还是放在当下社会，多带有强烈的政治色彩。（3）第三阶段是改革开放以来，对历史的深入挖掘和反思成为抗战文学创作的主流。近30年来，随着经济发展和文化交流的日益增多，尘封的历史资料相继被发掘，特别是战争亲历者口述历史及回忆录等大量出版，为文学创作提供了更丰富的素材和更广阔的空间。抗战文学开始走出简单的意识形态思维，吸收和借鉴历史、科学、时政等领域的研究成果，在表现手法、主题内容上都有了相当大的拓展。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第17章","论述"]},{"question":"九叶派诗人中成绩最突出的，风格显著是（）","answer":"D","options":["A. 冯至","B. 辛笛","C. 绿原","D. 穆旦"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"属于“九叶”诗派的诗人是（）","answer":"C","options":["A. 绿原","B. 曾卓","C. 辛笛","D. 鲁藜"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"代表中国十四行诗最高水平，并以其作品标志了中国十四行诗的成熟，这位诗人是（）","answer":"C","options":["A. 朱湘","B. 穆旦","C. 冯至","D. 闻一多"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"路翎以苏州巨室蒋捷三一家的风流云散为中心的小说是（）","answer":"B","options":["A. 《蜗牛在荆棘上》","B. 《财主底儿女们》","C. 《饥饿的郭素娥》","D. 《卸煤台下》"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"下列属于无名氏的两部中篇小说是（）","answer":"A","options":["A. 《北极风情画》、《塔里的女人》","B. 《鬼恋》、《风萧萧》","C. 《鬼恋》、《北极风情画》","D. 《塔里的女人》、《风萧萧》"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"“七月”派中创作《饥饿的郭素娥》等小说的作家是（）","answer":"B","options":["A. 绿原","B. 路翎","C. 鲁藜","D. 李健吾"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"“七月”诗派的特点是（）","answer":"A","options":["A. 以抗战现实为内容，以自由体为主要形式","B. 以抗战现实为内容，以民歌体为主要形式","C. 以抗战现实为内容，以格律诗为主要形式","D. 以抗战现实为内容，以阶梯诗为主要形式"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"下列不符合徐讠于小说特点的说法是（）","answer":"D","options":["A. “人性与爱”的主题","B. 传奇性情节","C. 雅俗共赏","D. 客观写实的风格"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"《财主底儿女们》的作者是（）","answer":"C","options":["A. 钱钟书","B. 李劼人","C. 路翎","D. 沙汀"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"现代文学中“后期浪漫派”的代表性作家是（）","answer":"C","options":["A. 郁达夫","B. 张恨水","C. 徐讠于","D. 无名氏"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"《海艳》是无名氏《无名书稿》的（）","answer":"B","options":["A. 第一卷","B. 第二卷","C. 第三卷","D. 第四卷"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"40年代中后期，国统区的喜剧性作品是（）","answer":"A","options":["A. 宋之的的《群猴》","B. 张恨水的《金粉世家》","C. 苏青的《结婚十年》","D. 黄谷柳的《虾球传》"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"路翎表现了作者对人物“原始强力”寻求的小说是（）","answer":"C","options":["A. 《蜗牛在荆棘上》","B. 《财主底儿女们》","C. 《饥饿的郭素蛾》","D. 《卸煤台下》"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"郭沫若的历史剧《虎符》的思想特色是（）","answer":"D","options":["A. 爱国主义","B. 舍己为人","C. 除暴安良","D. 宣扬“把人当成人”的民权思想"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"陈白尘的四幕剧《岁寒图》写于（）","answer":"C","options":["A. 1937年","B. 1942年","C. 1944年","D. 1948年"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"主要人物夏完淳出自郭沫若的历史剧（）","answer":"C","options":["A. 《高渐离》","B. 《虎符》","C. 《南冠草》","D. 《孔雀胆》"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"五四时期被视为现代报告文学滥觞的作品是（）","answer":"A","options":["A. 《赤都心史》","B. 《乱弹及其他》","C. 《是爱情还是痛苦？》","D. 《一日》"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"夏衍的以历史事件为题材的剧作是（）","answer":"B","options":["A. 《王昭君》、《赛金花》","B. 《秋瑾传》、《赛金花》","C. 《王昭君》、《虎符》","D. 《太平天国》、《芳草天涯》"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"文学的民族形式的论争发生于（）","answer":"C","options":["A. 左联时期的国统区","B. 解放战争时期","C. 抗战中期的国统区","D. 抗战后期的解放区"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"战国策派代表作家陈铨的剧本《野玫瑰》的主要内容是（）","answer":"C","options":["A. 一个曲折的爱情故事","B. 一个农村妇女的抗日故事","C. 一个国民党间谍的抗日故事","D. 人民群众抗日斗争"],"explanation":"","tags":["中国现代文学史","P11502","第18章","单选"]},{"question":"七月诗派","answer":"这是抗战及解放战争时期，在国统区出现的一个重要诗歌流派。1937年10月，抗战爆发不久，由胡风主编的《七月》（半月刊）创刊。《七月》发表各种题材的作品，以诗歌影响最大。与《七月》杂志联系密切，而又经常在《七月》发表诗歌的诗人，被称为七月诗派。属于这一诗派的诗人由胡风，鲁黎、绿园、曾卓、艾青、田间等。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","名词解释"]},{"question":"九叶诗派","answer":"是在40年代中后期形成的一个追求现实主义与现代主义相结合的诗歌流派。以《诗创造》和《中国新诗》等刊物为主要阵地，聚集了一群以辛笛、陈敬容、杜运燮、杭约赫（曹辛之）、郑敏、唐祈、唐湜、袁可嘉、穆旦为代表的“自觉的现代主义者”。这个诗派过去被称为“现代诗派”或“新现代诗派”，1981年江苏人民出版社出版了40年代九人诗选《九叶集》后，他们就被称为“九叶诗派”。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","名词解释"]},{"question":"中华全国戏剧界抗敌协会","answer":"为了加强团结，有计划、有组织地开展戏剧运动，中华全国戏剧界抗敌协会于一九三七年十二月三十一日在汉口成立。它会合数十个戏剧团体，包括全国不同阶级、阶层、剧种、流派的千百戏剧工作者。新兴话剧和传统戏曲的平剧、汉剧、楚剧、川剧、粤剧、陕西梆子、山西梆子、河南梆子等剧种，以及各种民间曲艺（如大鼓、相声等）和杂技、武术团体，都汇集在一起了。之后，全国各主要城市都成立了“剧协”分会。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","名词解释"]},{"question":"上海艺术剧社","answer":"1929年秋，郑伯奇、沈端先（夏衍）等在上海组织了上海艺术剧社，是我国最早在中国共产党领导下的左翼戏剧团体。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","名词解释"]},{"question":"简述七月诗派的艺术特点。","answer":"（1）普遍采用的是一种喷发式的抒情手段，注重主观感情的直接宣泄和抒发；（2）重视抒情的形象化，意象新颖明确，想象丰富奇丽，象征确切深刻；（3）诗的形式呈现出多姿多态的特征；（4）语言上重视运用灵活自然、充满生活气息的口语，简洁有力，色彩强烈。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","简答"]},{"question":"简述《升官图》的内容和艺术特色。","answer":"（1）剧情以两个强盗升官发财梦展开，揭露了反动官僚互相勾结，贪脏枉法的腐败黑暗现实。可称为国民党统治时期的“官场现形记”。（2）运用夸张与漫画的讽刺手法，荒诞与真实达到了统一，收到了很好的戏剧效果。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","简答"]},{"question":"简述夏衍《山海屋檐下》的思想艺术特色。","answer":"（1）《上海屋檐下》是夏衍的代表作品，这是一部从“席勒化”到“莎士比亚化”的转变之作。（2）在取材方面，做到了平凡朴素的市民生活与内在的时代深刻性相统一；结构方面，主线与副线配合得当；人物刻画方面，善于抓住性格特色，简洁鲜明；戏剧情感方面，含蓄，富有人情味。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","简答"]},{"question":"论述九月诗派的特点。","answer":"（1）扎根现实忠实地传达时代情绪，接受西方现代主义诗歌传统，既反对逃避现实的唯艺术论，也反对扼杀艺术的唯功利论，企图在现实和艺术之间求得恰当的平衡；（2）九叶诗人与西方现代主义最直接也是最深刻的联系，是对人的精神世界的关注；（3）九叶诗人在艺术上致力于新诗的“现代化”建设和“感受力的革命”，在吸收和运用西方象征派、现代派技巧，使之具有中国特色方面，超过了30年代的现代诗派，更超过了20年代的象征诗派。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","论述"]},{"question":"郭沫若《屈原》形象分析。","answer":"（1）在屈原形象的塑造中，作品突出了其深切的爱国爱民思想，光明磊落、刚直不阿的品格和大无畏的献身精神。这是屈原精神的本质方面，也是贯通古今，具有现实意义的民族灵魂。（2）作者对屈原形象的塑造又是全面的，他既有志洁行廉、坚贞自守的政治家的品格，又有抒情诗人耽于理想、敏感高傲的性格特征。（3）他虽凛冽难犯却屈辱于皇权，但终有被“逼到真狂的界线上而努力撑持着建设自己”的坚毅。这是一个伟大民族灵魂的代表，又有着独特性格的丰满鲜明的艺术形象。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第18章","论述"]},{"question":"赵树理的小说成名作是（）","answer":"D","options":["A. 《李家庄的变迁》","B. 《李有才板话》","C. 《邪不压正》","D. 《小二黑结婚》"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"水生嫂这个人物出自（）","answer":"C","options":["A. 《光荣》","B. 《麦收》","C. 《荷花淀》","D. 《芦花荡》"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"20世纪40年代我国新歌剧最早的一部代表作是（）","answer":"D","options":["A. 《刘胡兰》","B. 《王秀鸾》","C. 《赤叶河》","D. 《白毛女》"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"下列赵树理小说的人物形象中个性最鲜明生动的是（）","answer":"B","options":["A. 小二黑、小芹","B. 二诸葛、三仙姑","C. 李有才","D. 阎恒元"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"赵树理的第一部长篇小说是（）","answer":"C","options":["A. 《李有才板话》","B. 《邪不压正》","C. 《李家庄的变迁》","D. 《三里湾》"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"郭全海这个人物出自于（）","answer":"C","options":["A. 《光荣》","B. 《荷花淀》","C. 《暴风骤雨》","D. 《邪不压正》"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"下列不属于新歌剧的作品是（）","answer":"A","options":["A. 《兄妹开荒》","B. 《刘胡兰》","C. 《王秀鸾》","D. 《赤叶河》"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"下列不符合《白毛女》创作情况的一项是（）","answer":"B","options":["A. 根据民间故事加工、改编","B. 阮章竞、丁毅执笔","C. 贺敬之、丁毅执笔","D. 采用了民歌、小调和地方戏曲的曲调"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"“原生”和“秀梅”出自于孙犁的小说（）","answer":"C","options":["A. 《荷花淀》","B. 《嘱咐》","C. 《光荣》","D. 《麦收》"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"《李有才板话》中的阎恒元是一个（）","answer":"D","options":["A. 先进农民","B. 革命干部","C. 落后农民","D. 地主"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"《漳河水》的题材是（）","answer":"A","options":["A. 解放区的妇女解放","B. 北方乡村的农民暴动","C. 大革命时期的农民运动","D. 抗战时期的工人斗争"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"长篇小说《新儿女英雄传》的故事背景地是（）","answer":"D","options":["A. 吕梁山地区","B. 陕北地区","C. 胶东地区","D. 白洋淀地区"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"赵树理的以“想写出当时土改全过程中的经验教训，使土改中的干部和群众读了知所趋避”为创作意图的中篇小说是（）","answer":"C","options":["A. 《李家庄的变迁》","B. 《李有才板话》","C. 《邪不压正》","D. 《孟祥英翻身》"],"explanation":"","tags":["中国现代文学史","P11502","第19章","单选"]},{"question":"秧歌剧","answer":"秧歌本是在我国北方农村流行的一种群众性文艺工作形式，熔音乐、舞蹈、演唱、戏剧等多种因素于一炉，说唱结合、载歌载舞，既有生动吸引人的故事情节，又短小精悍、清新活泼，非常适合农民欣赏，特别受农民欢迎。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第19章","名词解释"]},{"question":"荷花淀派","answer":"荷花淀派，以孙犁为代表的一个当代文学的流派。主要作家还有刘绍棠、从维熙、韩映山等。荷花淀即白洋淀，这一流派得名，不但源于白洋淀这个地方，也源于孙犁的短篇小说《荷花淀》。荷花淀派，此派一般都充满乐观精神，清新朴素，描写逼真，心理刻画细腻，抒情味浓，富有诗情画意。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第19章","名词解释"]},{"question":"简述《小二黑结婚》的艺术成就。","answer":"（1）表现了新的生活和主题；（2）塑造了解放区农村的新人形象。体现在小二黑、小芹身上；（3）“评书体”的小说样式；（4）作品的语言通俗化。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第19章","简答"]},{"question":"简述孙犁小说的特点。","answer":"（1）通过日常生活画面显示时代风貌；（2）善于以细节和对话描写人物，尤其是在小说中塑造了一系列性格鲜明的女性形象；（3）写实和抒情的完美结合。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第19章","简答"]},{"question":"论述赵树理出现的文学史意义。","answer":"（1）从新文学史上的“大众化”这一文学史链条评价其文学意义：他长期从事农村实际工作，自觉将写作与农村变革实践相结合，作品与农民大众在思想感情上融为一体，并真正为农村读者所接受和喜爱，确实解决了新文学始终在探索而没能很好解决的“大众化”问题；（2）从解放区文学与当代文学的历史联系上来看，他的作品顺应了《讲话》的新的文艺政策，也顺应了解放区翻身农民的新的阅读要求，适合农民阅读习惯又有新的时代特征的作品，如《小二黑结婚》，赵树理方向，作为一种政策的引导，是这种双重要求的结果，对当代文学的创作与规范产生了巨大影响。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第19章","论述"]},{"question":"张爱玲小说处女作《沉香屑——第一炉香》发表于（）","answer":"B","options":["A. 1942年","B. 1943年","C. 1946年","D. 1947年"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"《马凡陀的山歌》属于（）","answer":"D","options":["A. 叙事诗","B. 枪杆诗","C. 政治抒情诗","D. 政治讽刺诗"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"“孤岛文学”指的是（）","answer":"A","options":["A. 抗战时期上海租界的文学","B. 抗战时期的上海文学","C. 抗战时期的解放区文学","D. 国民党统治区的左翼文学"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"将中国古典小说智慧与现代生存体验结合起来，描写都市男女的女作家是（）","answer":"B","options":["A. 苏青","B. 张爱玲","C. 冯沅君","D. 庐隐"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"长篇小说《虾球传》的作者是（）","answer":"B","options":["A. 欧阳山","B. 黄谷柳","C. 马烽","D. 袁静"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"小说集《传奇》的作者是（）","answer":"D","options":["A. 庐隐","B. 丁玲","C. 苏青","D. 张爱玲"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"曾被卞之琳誉为“抗战以来所出版的最好的一部长篇小说”是（）","answer":"B","options":["A. 《困兽记》","B. 《淘金记》","C. 《南行记》","D. 《还乡记》"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"张爱玲《传奇》的总体格局是（）","answer":"C","options":["A. 传统言情小说","B. 传统白话小说","C. 传统章回体小说","D. 传统文言小说"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"《围城》批判知识分子灰色与病态人生的最具有典型意义的人物是（）","answer":"A","options":["A. 方鸿渐","B. 苏文纨","C. 唐晓芙","D. 李梅亭"],"explanation":"","tags":["中国现代文学史","P11502","第20章","单选"]},{"question":"孤岛文学","answer":"1937年11月上海沦陷后，一部分文艺工作者利用上海租界的特殊环境，在日本侵略势力的四面包围中，坚持抗日文学活动。至1941年12月珍珠港事变日军侵入租界为止，历时四年零一个月，称之为“孤岛文学”。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第20章","名词解释"]},{"question":"简述钱钟书讽刺艺术特色。","answer":"（1）在情节、场景的自然推进中，描述人物的言语行为，给以调侃、揶揄和嘲弄；（2）善于具有讽刺意味的细节描写；（3）新颖奇绝的譬喻。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第20章","简答"]},{"question":"简述《围城》的艺术特点。","answer":"（1）作品表现出渊博的知识储备和极强的语言表达能力，被人们誉为知识度密集的现代“学人小说”；（2）以方鸿渐行踪为纵向线索的旅行者游记式结构，便于作品在简洁明快的叙述中蕴涵了丰富的人生联想；（3）作品奇妙的譬喻，婉转细腻而且风趣的语言，形成了作品讽刺幽默的表现手法。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第20章","简答"]},{"question":"分析方鸿渐人物形象。","answer":"（1）文化方面。方鸿渐是一个西方文明的传播者和传统文化的继承者，另一方面，他对西方文化的蹩脚的理解和对传统文化片面的认识形成了他畸形的文化人格；（2）人生方面。方鸿渐一方面对生活有积极的努力的追求，另一方面，他追求的结果又是一个个可怕的陷阱，所以他是一个既尴尬又痛苦的生存者；（3）性格方面。一方面他性格温和机敏，正直热情，具有一定民主主义思想，另一方面他又不求上进，懦弱无能，形成了一个若质知识分子形象。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第20章","论述"]},{"question":"曾被人们称为“台湾乡土文学之父”，他的作品被公认为“代表真正的台湾文学”。这位作家是（）","answer":"A","options":["A. 钟理和","B. 舒巷城","C. 欧阳子","D. 陈映真"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"诗集《香色酒》的作者是（）","answer":"B","options":["A. 张晓风","B. 舒兰","C. 郑愁予","D. 席慕蓉"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"下列不属于白先勇作品的是（）","answer":"D","options":["A. 《寂寞的十七岁》","B. 《纽约客》","C. 《孽子》","D. 《白毛女》"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"短篇小说集《城南旧事》的作者是（）","answer":"D","options":["A. 黄碧云","B. 於梨华","C. 聂华苓","D. 林海音"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"_____年代，以梁羽生和金庸为代表的新武侠小说的勃兴，称为香港文坛的一大景观（）","answer":"C","options":["A. 四十年代","B. 五十年代","C. 六十年代","D. 七十年代"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"席慕蓉的第一本新诗集是（）","answer":"B","options":["A. 《无怨的青春》","B. 《七里香》","C. 《一棵开花的树》","D. 《我折叠着我的爱》"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"被称为“世界文学组织的建筑师“世界文学组织之母”的台湾作家是（）","answer":"C","options":["A. 林海音","B. 金庸","C. 聂华苓","D. 白先勇"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"吴浊流的_____，通过描写胡太明一生的经历，尤其对他的“孤儿意识”的透视，以唤醒台湾人民的民族意识（）","answer":"C","options":["A. 《无花果》","B. 《台湾连翘》","C. 《亚细亚的孤儿》","D. 《蓝园集》"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"当代澳门文学，在各类体裁的创作方面，作品数量最多，成就最突出的首推（）","answer":"C","options":["A. 散文","B. 小说","C. 诗歌","D. 文学评论"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"散文是香港纯文学创作中最活跃的领域。其间又以_____为主潮（）","answer":"A","options":["A. 框框文","B. 漂泊文学","C. 鸳鸯蝴蝶派","D. 校园散文"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"称自己是“古典的头脑，浪漫的心肠”的作家是（）","answer":"C","options":["A. 余光中","B. 於梨华","C. 梁实秋","D. 白先勇"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"短篇小说集《像我这样一个女子》的作者是（）","answer":"A","options":["A. 西西","B. 琼瑶","C. 聂华苓","D. 三毛"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"陈映真是台湾乡土文学的开拓者、奠基者之一，下列哪部作品不是陈映真作品（）","answer":"D","options":["A. 《将军族》","B. 《唐倩的喜剧》","C. 《永恒的大地》","D. 《嫁枚一牛车》"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"被誉为“台湾的鲁迅”、“台湾乡士文学”的一面旗帜的作家是（）","answer":"D","options":["A. 余光中","B. 梁实秋","C. 龙应台","D. 陈映真"],"explanation":"","tags":["中国现代文学史","P11502","第21章","单选"]},{"question":"台湾乡土文学","answer":"主要是指靠回忆重组来描写台湾生活、带有浓重的乡土气息和台湾地方色彩的文学。由于特殊的历史原因，乡土一词在台湾人民心中有着特殊的意义，因此赋予了台湾乡土文学以浓厚的政治意味和悲情色彩，代表作家：陈映真。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第21章","名词解释"]},{"question":"简述陈映真小说的艺术特色。","answer":"（1）善于采用梦幻和现实相交织的超现实主义手法，使得小说的艺术和心理空间得到延伸，象征的寓意引导着读者去联想意会生活的真谛。这在早期的作品中表现得格外鲜明；（2）善于别出心裁地构建层次结构，使得作品具有立体感和真切感；（3）善于将民族特色与欧美风格相结合去探索人物内心世界，使得人物的独特个性非常鲜明。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第21章","简答"]},{"question":"论述白先勇《游园惊梦》的主题思想和艺术技巧","answer":"主题：（1）通过蓝天玉的一次赴宴经历的叙述；（2）描写守寡将军夫人悲剧性的命运遭遇；（3）反映了国民党上层阶级撤离大陆后的境遇变迁和五、六十年代台湾现实的一个侧面；（4）表达了人物的怀旧情结和对世事无常的沧桑感受。技巧：（1）意识流手法与内心独白的运用；（2）白描与象征手法的运用；（3）有中国古典小说的语言韵味；（4）小说结构严谨。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第21章","论述"]},{"question":"梁羽生在评价新派武侠小说时曾说：“开风气也，梁羽生；发扬光大者，_____。”（）","answer":"D","options":["A. 温瑞安","B. 诸葛青云","C. 古龙","D. 金庸"],"explanation":"","tags":["中国现代文学史","P11502","第22章","单选"]},{"question":"诗集《星岛小诗》的作者是（）","answer":"B","options":["A. 纪弦","B. 傅天虹","C. 舒兰","D. 罗兰"],"explanation":"","tags":["中国现代文学史","P11502","第22章","单选"]},{"question":"六十年代开始，香港文坛上老作家刘以鬯开始其_____的创作（）","answer":"D","options":["A. 实验小说","B. 具有幻想个性的奇诡作品","C. 嬉皮士文艺","D. 现实主义戏剧"],"explanation":"","tags":["中国现代文学史","P11502","第22章","单选"]},{"question":"香港经济的迅速发展促使城市市民阶层的形成，大众通俗小说应运而生，下列作品不属于这股潮流的是（）","answer":"C","options":["A. 《书剑恩仇录》","B. 《龙虎斗京华》","C. 《恋曲三重奏》","D. 《天龙八部》"],"explanation":"","tags":["中国现代文学史","P11502","第22章","单选"]},{"question":"台湾当代文坛公认的“标准乡土作家”、“小人物的代言人”的作家是（）","answer":"A","options":["A. 黄春明","B. 傅天虹","C. 席慕蓉","D. 刘以鬯"],"explanation":"","tags":["中国现代文学史","P11502","第22章","单选"]},{"question":"刘以鬯作品的特色不包括下列的（）","answer":"D","options":["A. 结构新","B. 多层次的内心探险","C. 强烈的本土意识","D. 豪放澎湃"],"explanation":"","tags":["中国现代文学史","P11502","第22章","单选"]},{"question":"集学识、财经界生活阅历及创作财经小说的志向等多重机综于一体，因财经小说而在回归前后的香港文坛上倍受世人瞩目的女作家是（）","answer":"A","options":["A. 梁凤仪","B. 西西","C. 李碧华","D. 亦舒"],"explanation":"","tags":["中国现代文学史","P11502","第22章","单选"]},{"question":"香港专栏文章","answer":"在香港出版物上撰写的文章，文章常含有作者对当下新闻热点和国家时事的犀利观点与评论。与一般的文章相比，更具时效性、务实性、针对性、思想性。如董桥、陶杰的文章。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第22章","名词解释"]},{"question":"简述抗战前期香港文学的特点。","answer":"（1）复刊和新办的一批鼓吹抗战文艺和刊载抗战文学作品的文艺杂志、报纸副刊，成为抗战文艺运动在香港开展的有力支柱；（2）诗歌和戏剧运动蓬勃兴起；（3）在理论上大力促进文学与时代与战斗的人生紧密结合；（4）从文学创作来看，形成了一支经常写稿的核心队伍，杜埃、林焕平、袁水拍等便是台柱。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第22章","简答"]},{"question":"简述刘以鬯《酒徒》的艺术特色。","answer":"（1）第一部长篇意识流小说，（着重描述心理活动。）使华文小说与世界新锐的现代主义文学接轨。（2）酒徒中的意识流表现在：①人物的内心独白，如小说中大段大段的括号中的文字。②人物的自由联想，这种联想打破时空顺序，逻辑联系。③人物的醉境与梦幻，逼真地再现人物的潜意识。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第22章","简答"]},{"question":"论述亦舒小说的主要内容","answer":"（1）对爱情婚姻的思考爱情是她观察社会、剖析社会的一个切入点，但她并没有被表面的所谓纯真浪漫的爱情所迷惑，也没有过多沉迷于表现现代人寻求纯真爱情的理想色彩，而是努力揭示隐藏其背后的深层内涵。清醒的亦舒始终怀疑世界上是否有真正的爱情，亦舒不再粉饰生活和美化现实，而是冷静地反思现实，客观地描写商业浪潮冲击下的都市爱情。事实上，在香港，劳燕分飞已是家常便饭。她小说中的爱情就像是一面镜子，照出香港社会的知识女性普遍存在的寂寞、孤独的心境，她们想寻找真爱，结果反而陷入更深的孤独与失落中。（2）关注女性的命运亦舒试图通过描绘都市女性在商业浪潮冲击下的情感变动和生活遭际，来展示香港社会多姿多彩的女性世界，进而表示自己对这个问题的看法。在香港这个更加开放和自由的环境下，女性受到中国传统社会男尊女卑思想的束缚要比大陆女性小得多，她们有更多的权利接受教育和进入社会，她们的视野不断拓宽、思想不断创新、自信心和能力也不断增强。但是，她们也不得不面对城市生活的多重身份和压迫感，需要同时扮演好女强人、好妻子、好母亲的角色，需要能够出得厅堂、入得厨房，从容应对来自各方面的压力。亦舒这种借都市背景下的婚姻爱情来展示女性寂寞无助的情感焦虑、曲折坎坷的婚恋变故、渴望异性的内心理想，并提出如何把握自身命运、实现自我价值的问题，是亦舒小说高于一般言情小说的最大特征。（3）剖析香港社会现实20世纪60年代至今，香港经济一直处于快速发展的状态，香港市民的物质生活水平也迅速提高，他们的价值观和消费观也随之发生变化。不断加快的生活节奏，日益加剧的生存竞争，华人为了在英国人的挤压下赢得一方生存的空间，发愤图强、艰苦创业，积极参与竞争，在各国资本的竞争中求得生存与发展。在这个过程中，一些传统道德被丢弃，而唯利是图、金钱至上已经成了人们普遍认同的人生观与价值观。港越来越成为一个欲望化的城市，一切物欲、肉欲都在商业之风的煽动下膨胀起来，在这中间，权衡利弊、考虑得失已经渗透到人们的意识形态中并构成了一种极普遍的心态。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第22章","论述"]},{"question":"根据不平等条约，外国船舰可在中国领海自由航行，破坏了中国的_____主权（）","answer":"B","options":["A. 领土","B. 领海","C. 商贸","D. 航海"],"explanation":"","tags":["中国近现代史纲要","S10002","第0章","单选"]},{"question":"_____年鸦片战争以后，中国逐步成为半殖民地半封建社会，国家蒙辱、人民蒙难、文明蒙尘，中华民族遭受了前所未有的劫难（）","answer":"A","options":["A. 1840","B. 1912","C. 1927","D. 1935"],"explanation":"","tags":["中国近现代史纲要","S10002","第0章","单选"]},{"question":"中国共产党第一次全国代表大会召开的时间是（）","answer":"B","options":["A. 1919年7月","B. 1921年7月","C. 1922年7月","D. 1923年7月"],"explanation":"","tags":["中国近现代史纲要","S10002","第0章","单选"]},{"question":"从五四运动到中华人民共和国成立阶段，中国的救国方案是什么？","answer":"在这个阶段，中国存在着三种主要的建国方案。第一种方案先由北洋军阀后由国民党统治集团代表，主张实行大地主大资产阶级专政，使中国社会继续走半殖民地半封建的道路。第二种方案由某些中间派别或中间人士代表，主张建立资产阶级共和国，使中国社会走上独立发展资本主义的道路。第三种方案由中国共产党代表，主张建立工人阶级领导的以工农联盟为基础的人民共和国，走经过新民主主义逐步到达社会主义和共产主义的道路。这三种方案在中国人民的实践中反复地受到检验。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第0章","简答"]},{"question":"在近代中国，侵占中国领土最多的国家是（）","answer":"C","options":["A. 英国","B. 日本","C. 沙俄","D. 法国"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"1895年，日本强迫清政府签订_____，割去台湾全岛及所有附属岛屿和澎湖列岛（）","answer":"C","options":["A. 《南京条约》","B. 《北京条约》","C. 《马关条约》","D. 《辛丑条约》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"在近代，通过战争向中国勒索赔款最多的国家是（）","answer":"D","options":["A. 英国","B. 俄国","C. 法国","D. 日本"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"在近代中国，规定中国向列强支付赔款最多的条约是（）","answer":"D","options":["A. 《南京条约》","B. 《北京条约》","C. 《马关条约》","D. 《辛丑条约》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"火烧圆明园发生在_____期间（）","answer":"B","options":["A. 鸦片战争","B. 第二次鸦片战争","C. 甲午战争","D. 八国联军侵华战争"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"规定外国人在中国享有领事裁判权的条约是（）","answer":"B","options":["A. 《南京条约》","B. 《五口通商章程》","C. 《黄埔条约》","D. 《天津条约》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"规定允许外国在中国办工厂的条约是（）","answer":"C","options":["A. 《南京条约》","B. 《北京条约》","C. 《马关条约》","D. 《辛丑条约》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"中国近代中国人民第一次大规模的反侵略武装斗争是（）","answer":"A","options":["A. 三元里人民抗英斗争","B. 太平天国农民战争","C. 义和团运动","D. 洋务运动"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"帝国主义对中国的争夺和瓜分的图谋，在_____后达到高潮（）","answer":"C","options":["A. 鸦片战争","B. 第二次鸦片战争","C. 甲午战争","D. 八国联军侵华战争"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"列强未能瓜分中国的最根本原因是（）","answer":"C","options":["A. 列强之间的矛盾","B. 国际舆论的谴责","C. 中华民族不屈不饶的反侵略斗争","D. 政府的妥协"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"在粉碎帝国主义列强瓜分中国的斗争中发挥了重大的历史作用的事件是（）","answer":"A","options":["A. 义和团运动","B. 戊戌维新","C. 太平天国运动","D. 辛亥革命"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"被誉而“中国近代睁眼看世界第一人”的是（）","answer":"A","options":["A. 林则徐","B. 魏源","C. 李鸿章","D. 康有为"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"“师夷长技以制夷”这一思想出自（）","answer":"B","options":["A. 《四洲志》","B. 《海国图志》","C. 《资政新篇》","D. 《盛世危言》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"近代以来中国反侵略战争失败的最根本原因是（）","answer":"B","options":["A. 帝国主义的强大","B. 社会制度的腐败","C. 经济技术的落后","D. 中国军队军事素质低下"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"1895年，响亮喊出“救亡”口号是（）","answer":"C","options":["A. 康有为","B. 梁启超","C. 严复","D. 孙中山"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"_____翻译的《天演论》中的社会进化论思想，为中国人民的危机意识和民族意识提供了理论根据（）","answer":"C","options":["A. 康有为","B. 梁启超","C. 严复","D. 孙中山"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"“振兴中华”的口号的提出者是（）","answer":"A","options":["A. 孙中山","B. 周恩来","C. 鲁迅","D. 梁启超"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"基督教在中国设立的最大出版机构广学会发行的报刊是（）","answer":"D","options":["A. 《中国丛报》","B. 《北华捷报》","C. 《字林西报》","D. 《万国公报》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"造成近代中国贫穷落后的根本原因是（）","answer":"A","options":["A. 中国落后的经济制度","B. 中国落后的政治制度","C. 资本—帝国主义的侵略","D. 统治集团的腐败"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"到_____的订立为止，庞杂的不平等条约体系已宣告中国半殖民地社会的完全形成（）","answer":"D","options":["A. 《天津条约》","B. 《北京条约》","C. 《马关条约》","D. 《辛丑条约》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"德国元帅瓦德西说：“无论欧、美、日本各国，皆无此脑力与兵力，可以统治此天下生灵四分之一，故瓜分一事，实为下策。”这表明（）","answer":"D","options":["A. 帝国主义已放弃灭亡中国的图谋","B. 帝国主义之间相互勾结","C. 帝国主义之间的矛盾","D. 帝国主义瓜分中国图谋的破产"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"帝国主义的经济侵略（）","answer":"B","options":["A. 促进了中国民族工商业的发展","B. 对中国农业经济造成严重破坏","C. 促进了中国在经济上具有独立性","D. 促进了中国经济发展的地区均衡发展"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"“三国干涉还辽”中的三国不包括（）","answer":"A","options":["A. 美国","B. 法国","C. 俄国","D. 德国"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"不含有割地内容的不平等条约是（）","answer":"D","options":["A. 《南京条约》","B. 《北京条约》","C. 《马关条约》","D. 《辛丑条约》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"资本——帝国主义对中国的侵略，首先和主要的是进行（）","answer":"A","options":["A. 军事侵略","B. 政治控制","C. 经济掠夺","D. 文化渗透"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"下面表述不正确的是（）","answer":"A","options":["A. 中国人民的反侵略战争，激起了帝国主义列强的侵华野心","B. 中国人民的反侵略战争，使我们的国家和民族历尽劫难、屡遭侵略而不亡","C. 中国人民的反侵略战争表现出来的爱国主义精神，铸成了中华民族的民族魂","D. 中国人民反侵略战争的失败，从反面教育了中国人民，极大地促进了中国人的思考、探索和奋起，反侵略战争的过程，是中华民族逐步觉醒的过程"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","单选"]},{"question":"晚清时期，在抗击外国侵略的战争中，许多爱国官兵英勇献身，其中鸦片战争期间有（）","answer":"BC","options":["A. 林则徐","B. 关天培","C. 陈化成","D. 邓世昌"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","多选"]},{"question":"俄国主要通过_____，侵占中国领土150万平方公里（）","answer":"ABCD","options":["A. 《瑷珲条约》","B. 《北京条约》","C. 《勘分西北界约记》","D. 《改订伊犁条约》"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","多选"]},{"question":"关于租借地，下列说法正确的是（）","answer":"ABCD","options":["A. 1898年，德国强租山东的胶州湾","B. 1898年，沙俄强租旅顺口、大连湾及其附近海面","C. 1898年，英国强租山东的威海卫及香港对岸的新界","D. 1899年，法国强租广东的广州湾及其附近海面"],"explanation":"","tags":["中国近现代史纲要","S10002","第1章","多选"]},{"question":"关于势力范围的划分，下列说法正确的有（）","answer":"ABD","options":["A. 德国把山东划为其势力范围","B. 沙俄以长城以北为其势力范围","C. 英国以长江流域为其势力范围","D. 法国把广东、广西、云南作为其势力范围"],"explanation" 为了弥补财政亏空，清政府加重了赋税的征收","B. 各级官吏在征收钱粮时往往浮收勒扣，横征暴敛，农民的负担更为加重","C. 由于西方资本主义的入侵，中国的农业和家庭手工业相结合的自然经济逐渐解体","D. 满汉民族矛盾"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"太平天国运动失败的主要原因是（）","answer":"ABCD","options":["A. 中外反动势力的联合镇压","B. 没有科学的理论指导","C. 对于西方资本主义侵略者缺乏理性认识","D. 太平天国政权的日益封建化"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"与以往农民战争相比，太平天国运动新的时代特点表现在（）","answer":"ABCD","options":["A. 发动规模空前巨大","B. 反对封建主义同时反对帝国主义侵略","C. 《天朝田亩制度》的平均主义思想以及《资政新编》的资本主义色彩","D. 一定程度上削弱了封建统治的精神支柱"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"太平天国起义及其失败表明（）","answer":"ABC","options":["A. 农民具有伟大的革命潜力","B. 农民不能担负起领导反帝反封建斗争取得胜利的重任","C. 单纯的农民战争不可能完成争取民族独立和人民解放的历史任务","D. 农民是中国革命的主力军"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"下列关于洋务运动叙述正确的是（）","answer":"AC","options":["A. 洋务运动是封建统治阶级为了维护自己的统治而进行的一场自救运动","B. 是由资产阶级发动的","C. 口号是“自强”和“求富”","D. 触及到了封建统治的根基"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"康有为、梁启超、谭嗣同、严复等维新派通过哪些行动宣传变法维新主张（）","answer":"ABCD","options":["A. 向皇帝上书","B. 著书立说","C. 介绍外国的变法的经验教训","D. 办学会、办报纸、设学堂"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"19世纪90年代，资产阶级维新派与封建守旧派激烈论战主要问题是（）","answer":"ACD","options":["A. 要不要变法","B. 要不要实行民主共和","C. 要不要废八股、改科举和兴西学","D. 要不要兴民权、设议院，实行君主立宪"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"近代中国戊戌变法主要内容有（）","answer":"ABCD","options":["A. 政治上，改革政治机构，裁撤冗官，任用维新人士","B. 经济上，鼓励私人兴办工矿企业","C. 文化教育方面，创设京师大学堂，在各地设立中、小学堂；提倡西学，翻译西方书籍，传播新思想","D. 军事上，训练新式军队"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"戊戌维新运动在中国近代史上的重大历史意义，主要体现在戊戌维新运动是一场（）","answer":"BCD","options":["A. 反对帝国主义的革命运动","B. 爱国救亡运动","C. 资产阶级性质的政治改革运动","D. 思想启蒙运动"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"下列关于戊戌维新运动中维新派与守旧派论战的表述正确的是（）","answer":"ABCD","options":["A. 论战的实质是资产阶级思想与封建主义思想在中国的第一次正面交锋","B. 论战主要围绕要不要变法；要不要兴民权、设议院，实行君主立宪；要不要废八股、改科举和兴西学等问题展开","C. 论战所涉及的领域十分广泛，进一步开阔了新型知识分子的眼界，解放了人们长期受到束缚的思想","D. 通过论战，西方资产阶级社会政治学说在中国得到进一步的传播，维新变法政治运动的帷幕随之拉开"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"戊戌维新运动的失败，主要是由于维新派自身的局限和以慈禧太后为首的强大的守旧势力的反对，其中维新派的局限性体现在（）","answer":"ABC","options":["A. 不敢否定封建主义","B. 对帝国主义抱有幻想","C. 害怕人民群众","D. 民族资产阶级力量弱小"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"下列关于戊戌变法的说法正确的是（）","answer":"ABCD","options":["A. “公车上书”为变法维新运动揭开了序幕","B. 戊戌变法从开始到失败历时103天","C. 慈禧太后为首的保守势力镇压了戊戌变法","D. 是中国民族资产阶级登上政治舞台的第一次表演"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"太平天国的历史意义有（）","answer":"ABCD","options":["A. 沉重打击了封建统治阶级，强烈撼动了清政府的统治根基","B. 比较完整地表达了千百年来农民对拥有土地的渴望","C. 冲击了孔子和儒家经典的正统权威，在一定程度是削弱了封建统治的精神支柱","D. 有力打击了外国侵略势力，冲击了西方殖民主义在亚洲的统治"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"洋务运动的历史地位（）","answer":"ABCD","options":["A. 是近代中国人探索国家出路的一次尝试","B. 客观上促进了中国早期工业和民族资本主义的发展","C. 是中国近代教育的开始","D. 传统观念受到冲击"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"在向西方学习的过程中，戊戌变法区别于洋务运动的地方有（）","answer":"BCD","options":["A. 学习西方的科学技术","B. 学习西方的政治制度","C. 宣传自由平等和社会进化观念，批判封建君权和封建纲常伦理","D. 主张用君主立宪制度取代君主专制制度"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"十九世纪下半叶，以自强求富为目标的洋务运动历时30年，其最终失败的重要原因是（）","answer":"ABD","options":["A. 指导思想的封建性","B. 对外具有依赖性","C. 资金人才的匮乏性","D. 洋务企业管理的腐朽性"],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","多选"]},{"question":"如何认识洋务运动的性质和失败的原因。","answer":"（1）性质：洋务运动是一场地主阶级的自救运动。（2）失败的原因①洋务运动具有封建性。②洋务运动对外国具有依赖性。③洋务企业的管理具有腐朽性。④顽固势力的阻挠。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","简答"]},{"question":"如何认识戊戌维新运动的意义和失败的原因。","answer":"（一）意义①是一次爱国救亡运动。②是一场资产阶级性质的政治改良运动。③更是一场思想启蒙运动。（二）失败的原因（1）客观原因戊戌维新运动的失败，主要是由于维新派自身的局限和以慈禧太后为首的强大的守旧势力的反对。（2）主观原因①不敢否定封建主义。②对帝国主义抱有幻想。③惧怕人民群众。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第2章","简答"]},{"question":"1906年清政府宣布“预备仿行立宪”，并于1908年颁布了（）","answer":"D","options":["A. 《临时约法》","B. 《暂时新政律》","C. 《中华民国约法》","D. 《钦定宪法大纲》"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1903年6月，_____在上海《苏报》发表《驳康有为论革命书》，批驳康有为所谓“中国之可立宪，不可革命”的谬论（）","answer":"C","options":["A. 陈天华","B. 邹容","C. 章炳麟","D. 梁启超"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1903年邹容写的_____是中国近代史上第一部宣传革命和资产阶级共和国思想的著作（）","answer":"C","options":["A. 《猛回头》","B. 《警世钟》","C. 《革命军》","D. 《驳康有为论革命书》"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"中国近代第一个资产阶级革命政党是（）","answer":"C","options":["A. 强学会","B. 兴中会","C. 同盟会","D. 国民党"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"孙中山三民主义思想的核心是（）","answer":"C","options":["A. 驱除鞑虏","B. 恢复中华","C. 创立民国","D. 平均地权"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1905年11月，孙中山在《民报》发刊词中将中国同盟会的政治纲领概括为（）","answer":"C","options":["A. 创立民国、平均地权","B. 驱除鞑虏、恢复中华、创立合众政府","C. 民族主义、民权主义、民生主义","D. 联俄、联共、扶助农工"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"武昌起义前同盟会领导的影响最大的武装起义是（）","answer":"D","options":["A. 广州起义","B. 萍浏醴起义","C. 镇南关起义","D. 黄花岗起义"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"武昌起义的导火线是（）","answer":"C","options":["A. 黄花岗起义","B. 萍浏醴起义","C. 保路运动","D. 广州起义"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1912年1月1日，孙中山在_____宣誓就职，宣告中华民国正式成立（）","answer":"B","options":["A. 北京","B. 南京","C. 广州","D. 上海"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"中国历史上第一部具有资产阶级共和国宪法性质的法典是（）","answer":"B","options":["A. 《钦定宪法大纲》","B. 《中华民国临时约法》","C. 《中华民国约法》","D. 《试训政纲领》"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"辛亥革命取得的最大成就是（）","answer":"A","options":["A. 推翻了封建帝制","B. 促进了资本主义的发展","C. 使人民获得了一些民主自由权利","D. 打击了帝国主义的殖民势力"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"下列关于辛亥革命历史意义的表述，不正确的一项是（）","answer":"B","options":["A. 推翻了清王朝，结束了中国两千多年的封建制度","B. 打击了帝国主义侵略势力，使其难以在中国建立稳定的统治秩序","C. 为民族资本主义的发展创造了条件","D. 使民主共和观念深入人心"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1912年8月，宋教仁为推行政党政治和建立责任内阁制，以同盟会为基础，联合其他党派在北京组成（）","answer":"B","options":["A. 中华革命党","B. 国民党","C. 统一共和党","D. 国民共进会"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"二次革命失败的最重要原因是（）","answer":"B","options":["A. 革命党人军队不足","B. 国民党力量涣散","C. 袁世凯军队强大","D. 袁世凯得到帝国主义的支持"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1914年7月孙中山在东京成立了_____，组织武装反袁（）","answer":"D","options":["A. 中国同盟会","B. 国民党","C. 兴中会","D. 中华革命党"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1915年，_____在云南率先举起反袁护国的旗帜，发动护国战争（）","answer":"C","options":["A. 黄兴","B. 段祺瑞","C. 蔡锷","D. 孙中山"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"在1840年至1919年期间，比较完全意义上的资产阶级民主革命是（）","answer":"A","options":["A. 辛亥革命","B. 戊戌维新运动","C. 太平天国革命","D. 义和团运动"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"袁世凯为复辟帝制不惜出卖主权，与日本签订了卖国的（）","answer":"C","options":["A. 中日共同防敌军事协定","B. 承认外蒙自治","C. “二十一条”","D. 出让川汉、粤汉铁路"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"袁世凯死后，中国出现军阀割据局面的社会根源是（）","answer":"A","options":["A. 半殖民地半封建的社会性质","B. 军阀拥有武装","C. 帝国主义扶植军阀","D. 军阀派系之间的矛盾"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"标志着整个中国民族资产阶级领导的旧民主主义革命终结的是（）","answer":"C","options":["A. 二次革命的失败","B. 护国运动的失败","C. 护法运动的失败","D. 保路风潮的失败"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"科举制是清政府在下列哪次活动中废除的（）","answer":"C","options":["A. 洋务运动","B. 戊戌变法","C. 清末“新政”","D. “预备仿行宪政”"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1894年，孙中山在美国的檀香山创立了中国第一个革命团体（）","answer":"A","options":["A. 兴中会","B. 同盟会","C. 华兴会","D. 光复会"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"辛亥革命与戊戌维新运动失败的共同原因是（）","answer":"A","options":["A. 不能依靠和发动人民群众","B. 列强的敌视和反对","C. 没有自己的纲领","D. 没有一个自己的政党"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"清末“预备立宪”的根本目的在于（）","answer":"C","options":["A. 仿效欧美政体","B. 发展资本主义","C. 延续清政府的统治","D. 缓和阶级矛盾"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"资产阶级革命政党中国同盟会的机关报是（）","answer":"C","options":["A. 《时务报》","B. 《国闻报》","C. 《民报》","D. 《新民丛报》"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"袁世凯暗杀国民党领袖宋教仁后，孙中山发动了（）","answer":"B","options":["A. 护国运动","B. “二次革命”","C. 护法运动","D. 中华革命党的起义"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1917年悍然拥立废帝溥仪，复辟清朝的封建军阀是（）","answer":"B","options":["A. 袁世凯","B. 张勋","C. 段祺瑞","D. 张作霖"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"组织“护国军”，发起护国运动的人是（）","answer":"C","options":["A. 孙中山","B. 黄兴","C. 蔡锷","D. 宋教仁"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"帝国主义在_____签订后，对中国侵略方式由瓜分政策转变为较为温和的“以华制华”政策（）","answer":"B","options":["A. 《南京条约》","B. 《辛丑条约》","C. 《马关条约》","D. 《北京条约》"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1914年7月，孙中山在日本东京组建了（）","answer":"B","options":["A. 保国会","B. 中华革命党","C. 同盟会","D. 中国国民党"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"1906年至1907年，革命派和立宪派在思想领域内展开了一场激烈论战。立宪派的主要代表人物是（）","answer":"C","options":["A. 黄兴、宋教仁","B. 陈天华、蔡元培","C. 康有为、梁启超","D. 章炳麟、刘揆一"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"中国民族资产阶级具有两面性的根本原因是（）","answer":"B","options":["A. 其产生晚于中国物产阶级","B. 其产生发展于中国社会半殖民地半封建化的过程中","C. 其产生晚于西方资产阶级","D. 中国资产阶级力量弱小"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"武昌起义前夕，在保路运动中规模最大、斗争最激烈的省份是（）","answer":"D","options":["A. 湖南","B. 湖北","C. 广东","D. 四川"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","单选"]},{"question":"辛亥革命爆发的历史条件包括（）","answer":"ABCD","options":["A. 民族危机加深","B. 社会矛盾激化","C. 清政府的新政及破产","D. 资产阶级革命派的壮大"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"下列哪些运动是针对袁世凯的（）","answer":"AB","options":["A. 二次革命","B. 护国运动","C. 护法运动","D. 辛亥革命"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"孙中山的资产阶级共和国方案的意义是（）","answer":"ABCD","options":["A. 打破了封建专制体制","B. 推动了社会进步","C. 改变了人们的精神世界","D. 指明了通向现代化的道路"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"袁世凯窃取政权，实行北洋军阀的专制统治，其主要表现在（）","answer":"ABCD","options":["A. 扩充军阀军队，建立警察特务系统","B. 制造“宋案”","C. 废除《中华民国临时约法》","D. 复辟帝制"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"以下对辛亥革命后成立的南京临时政府的表述正确的是（）","answer":"ACD","options":["A. 是资产阶级共和国性质的革命政权","B. 是过渡时期的政权","C. 有其局限性","D. 政权实行维护封建土地制度的政策"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"20世纪初资产阶级革命派和改良派围绕着_____展开了论战（）","answer":"ABC","options":["A. 要不要以革命手段推翻清王朝","B. 要不要推翻帝制，实行共和","C. 要不要社会革命","D. 要不要保皇"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"三民主义的局限性是（）","answer":"ABD","options":["A. 无明确的反帝纲领","B. 忽略人民群众的作用","C. 无民权思想","D. 平均地权设想有空想色彩"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"戊戌变法和辛亥革命是中国近代史上的重大进步运动，两者的共同点有（）","answer":"ABD","options":["A. 是爱国救亡的政治运动","B. 主张在中国建立资本主义制度","C. 主张改革君主专制制度","D. 未提出彻底的反帝反封建的纲领"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"辛亥革命之所以失败，从主观方面来说，在于它的领导者资产阶级革命派本身存在着许多弱点和错误，主要是（）","answer":"ABCD","options":["A. 没有提出彻底的反帝的革命纲领","B. 不能充分发动和依靠人民群众","C. 不能建立坚强的革命政党","D. 没有提出彻底的反封建的革命纲领"],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","多选"]},{"question":"为什么说孙中山领导的辛亥革命引起了近代中国的历史性巨大变化？","answer":"（1）辛亥革命的性质辛亥革命是资产阶级领导的以反对封建君主专制制度，建立资产阶级共和国为目的的革命，是一次比较完全意义上的资产阶级民主革命。（2）辛亥革命的历史意义①辛亥革命推翻了封建势力的政治代表，帝国主义在中国的代理人清王朝的统治。沉重打击了中外反动势力是中国反动统治者在政治上乱了阵脚。②辛亥革命结束了中国2000多年封建社会的君主专制制度经历了中国历史上第一个资产阶级共和国政府是民主共和的观念开始深入人心。③辛亥革命推动了中国人民的思想解放。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第3章","简答"]},{"question":"五四前的新文化运动是（）","answer":"C","options":["A. 新民主主义性质的文化运动","B. 封建主义性质的文化运动","C. 资产阶级的旧民主主义性质的文化运动","D. 小资产阶级领导的文化运动"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"五四后的新文化运动是（）","answer":"B","options":["A. 旧民主主义性质的文化运动","B. 新民主主义性质的文化运动","C. 社会主义性质的文化运动","D. 共产主义思想的文化运动"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"在《新青年》的发刊词中指出“盖改造青年之思想，辅导青年之修养，为本志之天职。”的人是（）","answer":"D","options":["A. 胡适","B. 鲁迅","C. 李大钊","D. 陈独秀"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"明确地把马克思主义称为“世界改造原动的学说”的是李大钊的（）","answer":"D","options":["A. 《法俄革命之比较观》","B. 《庶民的胜利》","C. 《Bolshevism的胜利》","D. 《我的马克思主义观》"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"马克思主义在中国广泛传播是在（）","answer":"D","options":["A. 新文化运动后","B. 辛亥革命失败后","C. 俄国十月革命后","D. 五四运动后"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"五四运动是近代中国第一次彻底反帝反封建的革命运动，是20世纪中国的（）","answer":"A","options":["A. 新民主主义革命的开端","B. 第一次历史性巨变","C. 第二次历史性巨变","D. 中国旧民主主义革命的终结"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"五四运动前夕，中国的产业工人数达到（）","answer":"B","options":["A. 60万","B. 200万","C. 100万","D. 150万"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"以毛泽东为主要代表的中国共产党人，把马克思列宁主义的普遍原理同中国革命的具体实践相结合，创立了（）","answer":"A","options":["A. 中国共产党","B. 中国人民解放军","C. 毛泽东思想","D. 中华人民共和国"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"中国工人阶级政党的最早的组织，建立在（）","answer":"B","options":["A. 北京","B. 上海","C. 湖南","D. 广东"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"1920年8月，《共产党宣言》中文全译本出版，其译者是：（）","answer":"C","options":["A. 陈独秀","B. 李大钊","C. 陈望道","D. 毛泽东"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"参加中国共产党第一次全国代表大会的广州代表是（）","answer":"D","options":["A. 刘仁静","B. 李达","C. 张国焘","D. 陈公博"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"在中国共产党影响下成立的中国第一个农民协会是（）","answer":"B","options":["A. 海丰总农会","B. 浙江萧山县衙前村农民协会","C. 韶山农民协会","D. 广州农民协会"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"第一次明确提出了彻底的反帝反封建的民主革命纲领的是（）","answer":"B","options":["A. 中共一大","B. 中共二大","C. 中共三大","D. 中共四大"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"中国共产党创建时期，其最主要精力是放在（）","answer":"A","options":["A. 发动工人罢工和开展民众运动上","B. 组织农民运动上","C. 组织武装斗争上","D. 组织学生运动上"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"国民革命后期，陈独秀右倾投降主义放弃无产阶级领导权，尤其是放弃了党对（）","answer":"C","options":["A. 农民的领导","B. 资产阶级左翼的领导","C. 革命武装的领导","D. 小资产阶级的领导"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","单选"]},{"question":"1918年11月和12月李大钊发表了歌颂十月革命的两篇文章是（）","answer":"BD","options":["A. 《法俄革命之比较观》","B. 《庶民的胜利》","C. 《我的马克思主义观》","D. 《Bolshevism的胜利》"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","多选"]},{"question":"五四运动爆发的社会历史条件主要是（）","answer":"ACD","options":["A. 新的社会力量的成长、壮大","B. 巴黎和会上中国外交的失败","C. 新文化运动掀起的思想解放的潮流﹑","D. 俄国十月革命对中国的影响"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","多选"]},{"question":"中国早期信仰马克思主义的人物，主要有以下类型（）","answer":"BCD","options":["A. 五四爱国运动的左翼骨干","B. 五四以前的新文化运动的精神领袖","C. 是一部分原中国同盟会会员","D. 辛亥革命时期的活动家"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","多选"]},{"question":"中国共产党早期组织成立以后着重进行了以下几方面的工作（）","answer":"BCD","options":["A. 发动农民开展土地革命","B. 到工人中去进行宣传和组织工作","C. 进行关于建党问题的讨论和实际组织工作","D. 研究和宣传马克思主义"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","多选"]},{"question":"1920年底，张东荪、梁启超挑起关于社会主义的论战，其主要观点是（）","answer":"ABCD","options":["A. 中国产业落后，“真的劳农革命决不会发生”","B. 中国不具备成立工人阶级政党的条件","C. 资本主义必倒而社会主义必兴","D. 解决中国的问题要依靠“绅商阶级”来振兴实业，发展资本主义"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","多选"]},{"question":"各地共产主义小组创办了一批专门供工人阅读的进行马克思主义启蒙教育的刊物（）","answer":"ABCD","options":["A. 《济南劳动月刊》","B. 《劳动音》","C. 《工人月刊》","D. 《劳动界》"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","多选"]},{"question":"在中国共产党的领导、组织、推动下，从1922年1月到1928年2月，中国工人阶级掀起了第一个罢工斗争的高潮，其中包括（（）","answer":"ABCD","options":["A. 开滦五矿工人罢工","B. 香港海员罢工","C. 安源路矿工人罢工","D. 京汉铁路工人罢工"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","多选"]},{"question":"1924年至1927年中国反帝反封建的革命，比之以往任何一次革命，包括辛亥革命和五四运动（）","answer":"ACD","options":["A. 群众的动员更为广大","B. 取得的经验比较少","C. 斗争的规模更加宏伟","D. 革命的社会内涵更其深刻"],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","多选"]},{"question":"中国的先进分子为什么选择了马克思主义？","answer":"①鸦片战争以来，先进的中国人不懈斗争，探索的必然结果。②马克思主义独特的思想力量，他揭示了人类发展规律，为中国发展指明了方向。③一战暴露了资本主义的弊端，说明了资本主义不能救中国。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","简答"]},{"question":"为什么说中国共产党的成立是开天辟地的大事件？","answer":"①中国共产党的成立是中国革命有了坚强的领导核心。在哪沉重的中国人民有了可以依赖的组织者和领导者，中国革命从此再无产阶级的领导下断向前发展，有民主主义革命向社会主义革命推进。②中国共产党的成立是中国革命有了科学的指导思想，中国共产党是以马克思列宁主义为指导思想的政党，他把马克思主义同中国革命实践相结合，制定了正确的革命纲领和各种政策，为中国人民指明斗争的目标和走向胜利的道路。③中国共产党的成立是中国革命有了新的革命方法。并沟通了中国革命同世界无产阶级革命之间的联系，为中国革命获得广泛的国际援助和避免资本主义的前途提供了可能。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","简答"]},{"question":"中国共产党成立后，中国革命呈现了哪些新面貌？","answer":"①第一次提出了反帝反封建的民主革命纲领，为中国人民指出了明确的斗争目标。②发动工农群众开展革命斗争，在中国掀起的第一次工人运动高潮，同时中共开始从事发动农民工作，农民运动蓬勃发展。③实行国共合作，并在国共合作中发挥了主导作用，掀起了大革命高潮，推翻了北洋军阀。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第4章","简答"]},{"question":"中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端是（）","answer":"D","options":["A. 秋收起义","B. 广州起义","C. 百色起义","D. 南昌起义"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"毛泽东在1927年中共八七会议上提出的著名论断是（）","answer":"B","options":["A. 没有调查，没有发言权","B. 须知政权是由枪杆子中取得的","C. 兵民是胜利之本","D. 一切反动派都是纸老虎"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"“须知政权是由枪杆子中取得的”，这一著名论断是毛泽东在哪一次会议上提出的（）","answer":"C","options":["A. 中共“六大”","B. 中共六届二中全会","C. “八七”会议","D. 遵义会议"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"八七会议和遵义会议的相同之处是（）","answer":"B","options":["A. 纠正了“左”倾错误","B. 挽救了党和中国革命","C. 标志着工作重心的转移","D. 带有“左”的色彩"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"中国共产党开创的第一个农村革命根据地是（）","answer":"A","options":["A. 井冈山","B. 湘鄂西","C. 左右江","D. 鄂豫皖"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"1931年11月在江西省瑞金县成立的红色政权是（）","answer":"D","options":["A. 工农共和国临时中央政府","B. 中华民主共和国临时中央政府","C. 人民共和国临时中央政府","D. 中华苏维埃共和国临时中央政府"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"土地革命战争时期，中国共产党所开辟的“中国革命的新道路”是指（）","answer":"C","options":["A. 以城市为中心的革命道路","B. 在中心城市武装暴动，然后全国响应","C. 农村包围城市，武装夺取政权","D. 建立农村革命根据地"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"1927年9月，毛泽东领导的武装起义是（）","answer":"B","options":["A. 南昌起义","B. 秋收起义","C. 广州起义","D. 广西左、右江起义"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"标志毛泽东思想初步形成的是（）","answer":"C","options":["A. 八七会议的决议","B. 井冈山农村革命根据地的建立","C. 农村包围城市、武装夺取政权理论的提出","D. 土地革命路线的制定"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"左翼文化运动中，被称为“文化新军的最伟大和最英勇的旗手”的中国文化革命的伟人是（）","answer":"B","options":["A. 瞿秋白","B. 鲁迅","C. 茅盾","D. 田汉"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"土地革命战争时期“左”倾错误党中央占据统治地位的有（）","answer":"C","options":["A. 一次","B. 二次","C. 三次","D. 四次"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"1936年10月，在甘肃会宁、静宁将台堡胜利会师的三大主力红军是（）","answer":"D","options":["A. 红一、二、三方面军","B. 红一、二方面军与红十五军团","C. 红二、四方面军与红十五军团","D. 红一、二、四方面军"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"在红军长征途中，中国共产党召开的、成为党的历史上生死攸关转折点的会议是（）","answer":"A","options":["A. 遵义会议","B. 古田会议2000","C. 八七会议","D. 瓦窑堡会议"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"在土地革命战争时期，毛泽东阐明了坚持辩证唯物主义的思想路线即坚持理论与实际相结合的原则的极端重要性，并提出“没有调查，没有发言权”重要思想的著作是（）","answer":"B","options":["A. 《井冈山的斗争》","B. 《反对本本主义》","C. 《中国的红色政权为什么能够存在？》","D. 《星星之火，可以燎原》"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"在土地革命战争时期，提出坚决打击富农和“地主不分田，富农分坏田”的主张是（）","answer":"C","options":["A. 瞿秋白","B. 毛泽东","C. 王明","D. 李立三"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"中国革命之所以能够得到坚持和发展，根本的原因，就在于（）","answer":"B","options":["A. 红军反“围剿”战争的胜利","B. 中国共产党紧紧地依靠了农民，领导农民进行了土地制度的革命","C. 工农红军长征的胜利","D. 及时地纠正1000了左右倾的错误路线"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","单选"]},{"question":"1927年党的八七会议决定（）","answer":"BC","options":["A. 继续北伐","B. 武装反抗国民党反动统治","C. 开展土地革命","D. 立工农苏维埃政权"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"大革命失败后中国共产党领导的三大起义是（）","answer":"ABC","options":["A. 南昌起义","B. 秋收起义","C. 广州起义","D. 百色起义"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"土地革命战争时期中国共产党内出现的几次严重错误分别是（）","answer":"BCD","options":["A. 陈独秀的右倾机会主义错误","B. 1927年11月至1928年4月的“左”倾盲动错误","C. 1930年6月至9月以李立三为代表的“左”倾冒险主义错误","D. 1931年1月至1935年1月以王明为代表的“左”倾教条主义错误"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"毛泽东形成“工农武装割据”思想的相关文章有（）","answer":"ACD","options":["A. 《井冈山的斗争》","B. 《矛盾论》","C. 《中国的红色政权为什么能够存在？》","D. 《星星之火，可以燎原》"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"土地革命战争时期，毛泽东关于农村包围城市革命道路的理论著作有（）","answer":"ABCD","options":["A. 《井冈山的斗争》","B. 《中国的红色政权为什么能够存在？》","C. 《星星之火，可以燎原》","D. 《反对本本主义》"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"井冈山时期，毛泽东提出红色政权存在与发展必须坚持（）","answer":"ABC","options":["A. 武装斗争","B. 土地革命","C. 根据地建设","D. 党的建设"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"毛泽东在论述中国革命新道路理论时，提出的“工农武装割据”思想的主要内容是（）","answer":"BCD","options":["A. 统一战线","B. 武装斗争","C. 土地革命","D. 农村根据地建设"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"中央革命根据地是由哪些根据地合组成的（）","answer":"BC","options":["A. 湘赣","B. 赣南","C. 闽西","D. 湘鄂西"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"中央红军主力长征后，留在南方坚持斗争的红军的主要领导人有（）","answer":"BD","options":["A. 朱德","B. 陈毅","C. 叶剑英","D. 项英"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"中国共产党在长征途中召开的遵义会议，集中解决了在当时具有决定意义的（）","answer":"CD","options":["A. 政治问题","B. 思想问题","C. 军事问题","D. 组织问题"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"20世纪30年代前期、中期，中国共产党内屡次出现严重的“左”倾错误，其原因有（）","answer":"ABCD","options":["A. 全党马克思主义理论准备不足，理论素养不高，实践经验也很缺乏","B. 全党对于中国的历史状况和社会状况、中国革命的特点、中国革命的规律不了解","C. 不善于把马克思主义与中国革命实际全面地、正确地结合起来","D. 共产国际对于中国共产党内部事务的错误干预和瞎指挥"],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","多选"]},{"question":"以毛泽东为主要代表的中国共产党人是如何探索和开辟中国革命新道路的？","answer":"①开展武装反抗国民党的斗争召开八七会议确定了土地革命和武装反抗国民党的方针。②走农村包围城市的道路，以农村为重点，到农村去发动农民，进行土地革命，开展武装斗争，建设根据地，这是1927年后中国革命发展的客观规律所要求的。③毛泽东不仅在实践中学会了把革命进攻的方向指向农村，而且从理论上阐明了武装斗争的必要性。④农村包围城市，武装夺取政权理论是对1927年大革命失败后，中国共产党领导的红军和根据斗争经验的科学概括。随着革命新道路的开辟，中国革命开始走向复兴。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","简答"]},{"question":"20世纪20年代后期至30年代前期，中国共产党内为什么连续出现“左”倾错误？","answer":"①八七会议以后党内一直存在着浓厚的左倾情绪始终没有得到认真的清理。②共产国际对中国共产党内部事务的错误干预和瞎指挥。③不善于把马克思主义与中国实际全面的正确的结合起来。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第5章","简答"]},{"question":"毛泽东明确地提出“马克思主义的中国化”这个命题是在中国共产党的（）","answer":"C","options":["A. 二大","B. 七大","C. 六届六中全会","D. 八七会议"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"近代以来中国第一次取得反侵略完全胜利的战争是（）","answer":"C","options":["A. 中法战争","B. 甲午战争","C. 抗日战争","D. 抗美援朝战争"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"全国抗战爆发后，共产党领导的敌后战场取得的第一个大的胜利是（）","answer":"A","options":["A. 平型关伏击战","B. 台儿庄战役","C. 百团大战","D. 淞沪会战"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"1927年日本召开“东方会议”，制定了（）","answer":"A","options":["A. 《对华政策纲要》","B. 《昭和十二年度对华作战计划》","C. 《反共产国际协定》","D. 《大陆政策》"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"抗日战争进入相持阶段的时间是（）","answer":"C","options":["A. 1937年7月","B. 1938年5月","C. 1938年10月","D. 1941年12月"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"1936年，东北各抗日武装统一为（）","answer":"A","options":["A. 东北抗日联军","B. 东北义勇军","C. 东北人民革命军","D. 抗日游击队"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"抗日战争进入相持阶段后，日本帝国主义对国民党采取的政策是（）","answer":"B","options":["A. 军事打击为主，政治诱降为辅","B. 政治诱降为主，军事打击为辅","C. 军事打击和政治诱降齐头并进","D. 政治诱降取代军事进攻"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"1939年1月，国民党确定“防共、限共、溶共、反共”方针的会议是（）","answer":"B","options":["A. 国民党五届三中全会","B. 国民党五届五中全会","C. 国民党五届六中全会","D. 国民党临时全国代表大会"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"确立毛泽东思想为全党的指导思想的会议是（）","answer":"D","options":["A. 遵义会议","B. 瓦窑堡会议","C. 洛川会议","D. 中共七大"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"面对日军的大举侵略，蒋介石在1931年7月的方针是（）","answer"
