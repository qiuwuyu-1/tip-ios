explanation":"","tags":["公共政策","XX1010","第9章","简答"]},{"question":"简述政策执行偏差产生的原因。","answer":"（1）主观原因。作为一种普遍现象，政策执行者的自身利益和需求影响着政策的有效执行。公共选择学派认为，政府内部的官僚集团也会有自己的利益，也是一个经济人，也会追求自身利益的最大化，由此甚至会导致公共权力的异化，如大量滋生寻租与腐败现象等，使政策执行扭曲、走样，蚀空政策的本来含义。执行者的素质缺陷、执行机构的管理缺陷、政策执行的宣传缺陷也容易造成政策执行偏差。但历史分析法也不是万能的，它的缺点主要有：虽然资料来源比较广泛，但缺乏足够的深入性、全面性和系统性；限于书面语言，难以见到具体环境下的行为和思想；定量化困难等。（2）客观原因。政策目标错位或模糊不清。目标是政策执行的方向和指南，目标错位或目标不明，都将导致政策执行偏差。政策“打架”。如果政出多门、内容相互矛盾，就会发生政策“打架”，使政策执行者难以把握正确的执行标准，从而产生执行混乱和执行偏差。政策不可行。政策不接“地气”，或缺乏具体的操作方案，或政策工具配置不当、供给不足，使政策的实际执行过程很困难，甚至不可能。政策缺乏稳定性和连续性，使政策执行者难以树立把政策实施下去的信心和决心，从而造成政策执行偏差。","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","论述"]},{"question":"怎样才能做到政策的正确解读，增大、增强政策知晓度？","answer":"（1）政策制定者在完成政策合法化之后，须及时、准确地向社会公开解读有关政策，真正做到信息公开。（2）各个层级的政策执行者须对自己履职范围内的各项政策准确知晓，并能够对政策对象正确告知。（3）对政策执行者加强监督和问责。（4）知道权是一项重要的公民权利。","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","案例分析"]},{"question":"_____主要指适用于评估政策过程的不同阶段的方法，主要有政策制定过程评估方法、政策执行过程评估方法（）","answer":"B","options":["A. 定性评估法","B. 过程评估方法","C. 定量评估法","D. 定性与定量相结合的方法"],"explanation":"","tags":["公共政策","XX1010","第10章","单选"]},{"question":"为了确保政策过程各项活动的合法性、合理性和有效性，及时纠正各个环节中出现的偏差，提高决策目标实现的程度，保障公民和组织的合法权益，有必要对政策运行过程的各个环节进行检查、督促、指导和纠偏，这就是（）","answer":"C","options":["A. 政策检查","B. 政策纠偏","C. 政策监控","D. 政策和谐"],"explanation":"","tags":["公共政策","XX1010","第10章","单选"]},{"question":"_____由政策监控主体和监控对象之间的关系模式以及监控主体的行为规则和方式等要素构成的一个系统（）","answer":"A","options":["A. 政策监控机制","B. 政策监督机制","C. 政策评估机制","D. 政策检查机制"],"explanation":"","tags":["公共政策","XX1010","第10章","单选"]},{"question":"政策评估的价值标准有（）","answer":"ABC","options":["A. 政策回应性","B. 政策公平性","C. 社会进步","D. 政策自由性"],"explanation":"","tags":["公共政策","XX1010","第10章","多选"]},{"question":"实施监控的时间先后为标准，可以分为（）","answer":"ABC","options":["A. 预防性监控","B. 过程性监控","C. 结果监控","D. 事后监控"],"explanation":"","tags":["公共政策","XX1010","第10章","多选"]},{"question":"对比评估法方法主要包括（）","answer":"ABCD","options":["A. “前－后”对比评估法","B. “始－终”对比评估法","C. “始－中”对比评估法","D. “有－无”对比评估法"],"explanation":"","tags":["公共政策","XX1010","第10章","多选"]},{"question":"政策评估和政策监控还有一个显著的共同点，即政策监控是一种特殊形式的政策评估，或者说是建立在评估基础上的一种权力行为。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","判断"]},{"question":"筹划是评估的基础和起点","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","判断"]},{"question":"公共政策评估","answer":"就是评估主体依据一定的标准和程序，使用科学方法与技术，考察公共政策过程的各个阶段、各个环节与各个方面，对政策产出和政策影响进行检测和评价，以判断政策结果实现政策目标、解决政策问题的程度的活动。","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","名词解释"]},{"question":"正式评估","answer":"是指专门的组织机构和人员根据一定的评估理论，为了实现评估目标，按照一定的评估程序而对相关的评估对象所进行的评估。","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","名词解释"]},{"question":"外部评估","answer":"是政府部门外的评估主体所完成的评估。它可以分为受委托和不受委托两种类型。","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","名词解释"]},{"question":"自上而下监控","answer":"这是指上级政府对下级政府所做的政策监控，既包括中央政府对地方政府的政策监控，也包括上级地方政府对下级地方政府的政策监控、上级政府的职能部门对下级政府的职能部门的政策监控。","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","名词解释"]},{"question":"简述在什么情况下不需要做政策评估。","answer":"（1）公共政策没有真正实施的时候（2）政策经常变动没有固定目标的（3）没有足够的人员和经费的时候（4）没有认识到应该进行政策评估的时候","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","简答"]},{"question":"评估的过程有哪些？","answer":"（1）评估筹划；（2）评估实施；（3）评估总结。","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","简答"]},{"question":"回应的建构性评估阶段的主要内容有哪些？","answer":"①确定政策评估中的利害相关者；②按照每一利益相关者的不同情况，选定评估项目的构想、声明、考量和问题；③了解和说明利益相关者之间的构想、声明、考量和问题；④在讨论的基础上，使利益相关者之间的构想、声明、考量和问题尽可能达成共识；⑤对于无法或没有达成共识的评估项目，釆取协商议程妥善处理；⑥收集和提供协商议程所需信息；⑦设置论坛供利益相关者之间相互协商；⑧提供利益相关者各自的报告，通过沟通，增加构想、声明、考量和问题上获得共识的可能性；⑨通过持续不断的评估，寻找构想、声明、考量和问题尚未解决的原因，釆取适当措施得以解决。","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","论述"]},{"question":"分析公共政策监控的功能问题。","answer":"（1）通过政策监控活动，使政策制定过程合法化、决策科学化和民主化，充分听取各种不同意见，拓宽人们参与的渠道，遵循科学决策程序，使政策内容最大限度地体现最大多数人的利益要求。（2）通过政策监控活动，排除主客观因素的干扰，整合各种推动政策运行的积极力量，充分发挥政策资源的潜能，提高政府效率，确保政策的有效性。（3）通过政策监控活动，在保证政策评估真实性和准确性的基础上，实现政策评估的公正性，最大限度地反映政策运行过程的客观现实，体现政策评估活动的价值。（4）通过政策监控活动，反映政策运行过程的实际情况，比较利弊得失，为政策调整确立一个基本的衡量标准，明确政策调整的方向。","options":[],"explanation":"","tags":["公共政策","XX1010","第10章","案例分析"]},{"question":"用新政策取代旧政策称为（）","answer":"C","options":["A. 政策分解","B. 政策合并","C. 政策替代","D. 政策缩减"],"explanation":"","tags":["公共政策","XX1010","第11章","单选"]},{"question":"_____在政策的实施过程中，为了适应形势的变化，在遵循政策目标的前提下突破原有的政策框架，或者撤旧换新，或者从无到有，对现行政策的局部内容进行调整（）","answer":"A","options":["A. 政策更新","B. 政策增删","C. 政策修正","D. 政策界定"],"explanation":"","tags":["公共政策","XX1010","第11章","单选"]},{"question":"_____是公共政策调整必须遵循的原则（）","answer":"B","options":["A. 渐进调试","B. 实事求是","C. 追踪反馈","D. 全体满意"],"explanation":"","tags":["公共政策","XX1010","第11章","单选"]},{"question":"政策调整具有以下三个特点（）","answer":"ABC","options":["A. 渐进性","B. 局部性","C. 动态性","D. 整体性"],"explanation":"","tags":["公共政策","XX1010","第11章","多选"]},{"question":"终结的代价指（）","answer":"ABCD","options":["A. 情感上的代价","B. 政治上的代价","C. 法律上的代价","D. 财政上的代价"],"explanation":"","tags":["公共政策","XX1010","第11章","多选"]},{"question":"政策创新是政策主体适应政策环境变化和需要的一种政策变迁。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","判断"]},{"question":"政策变动从总体上来说是积极的、正向的政策演变。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","判断"]},{"question":"政策的删减是由于原定目标过高、作用范围过于宽泛，或者存在与新形势、新情况不相适应的部分，而对政策的有关内容进行删除和缩减。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","判断"]},{"question":"方案是实现目标的具体安排，对目标的调整通常也会连带着对方案进行调整，但更多的是在目标明确的情况下，认识到原定方案存在这样或那样的不足，而对其进行必要的调整。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","判断"]},{"question":"政策变动或政策变迁","answer":"是政策系统的一种常态表现，是政策系统对内部因素和外部环境的变化所做出的一种适应性变革，是指既有的政策被其他的政策所取代或做若干调整的现象。","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","名词解释"]},{"question":"政策调整","answer":"在公共政策实施的过程中，根据政策评估和监控所反馈的信息对原有政策中不适应政策对象和政策环境变化的部分，采取渐进的方式，进行增删、修正和更新。","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","名词解释"]},{"question":"功能的终结","answer":"就是终止由政策执行而带来的某种或某些服务。","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","名词解释"]},{"question":"政策分解","answer":"指的是将旧政策的内容按照一定的规则分解出几个部分，每个部分各自形成一项新政策。","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","名词解释"]},{"question":"政策稳定的积极意义？","answer":"（1）政策稳定有利于国家与社会的稳定。（2）政策稳定有利于贯彻落实执政者或决策者的意志和决定，进而取得预期的成效。实施会实现他们的利益要求，他们才会真诚地支持它，并自觉选择自己的社会行为。（3）政策稳定有利于提高政策的可预见性。（4）政策稳定有利于降低社会管理成本。","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","简答"]},{"question":"政策调整的一般程序？","answer":"（1）重新界定问题。（2）提出调整方案。（3）选择调整方案。（4）执行调整决定。","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","简答"]},{"question":"政策终结的作用？","answer":"（1）政策终结有利于节省政策资源：政策的运行必须支付一定的成本，即要耗费一定的政策资源。对任何一个国家来说，政府的财政负担和可支配的社会资源都是有限的。（2）政策终结有利于提高政策绩效：人类已经进入了瞬息万变的信息社会。面对如此复杂多变的环境，政府的政策行为必须顺应时代发展和社会变革的需要，必须根据变化了的政策问题和政策环境，不断地调整自己的政策行为，以充分运用有限的资源，取得最大的政策绩效。（3）政策终结有利于促进政策优化：公共政策在社会发展中既能促进一个社会的繁荣，也能使一个社会濒于崩溃。","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","论述"]},{"question":"政策终结的策略，在我国要注意的点有哪些？","answer":"正是由于政策终结暗含着错综复杂的利益斗争，因此它要求决策者运用高度的政治智慧。高超的政治艺术，采取灵活的策略，加以妥善处理。否则，不仅达不到政策终结的目的，甚至会适得其反，引发政治危机和政治冲突。结合我国的实际，我们认为要顺利完成终结需要注意以下几个方面：（1）重视说服工作，消除抵触情绪。（2）注意因势利导，营造有利气氛。（3）公开评估结果，争取支持力量。（4）废旧、立新并举，缓和终结压力。（5）通过试探试点，避免矛盾激化。（6）终结必要部分，减少终结代价。","options":[],"explanation":"","tags":["公共政策","XX1010","第11章","案例分析"]},{"question":"_____是政策分析的材料和根据（）","answer":"B","options":["A. 政策模型","B. 政策信息","C. 评估标准","D. 分析路径"],"explanation":"","tags":["公共政策","XX1010","第12章","单选"]},{"question":"韦默和瓦伊宁的政策分析框架主要将政策分析过程分为问题分析和_____两个阶段（）","answer":"D","options":["A. 过程分析","B. 绩效分析","C. 合法性分析","D. 解决方案分析"],"explanation":"","tags":["公共政策","XX1010","第12章","单选"]},{"question":"美国密歇根大学心理学教授纳森·卡普兰提出了政策研究者与政策制定者之间的_____理论（）","answer":"C","options":["A. 制定者","B. 知识理论","C. 二元社群","D. 隔阂"],"explanation":"","tags":["公共政策","XX1010","第12章","单选"]},{"question":"政策分析的对象就是政策本身及其运行的过程和结果。主要有以下各个组成要件（）","answer":"ABCD","options":["A. 问题","B. 目标","C. 方案","D. 实施效果"],"explanation":"","tags":["公共政策","XX1010","第12章","多选"]},{"question":"政策分析师一般包括_____两种类型（）","answer":"AB","options":["A. 兼职政策研究人员","B. 专职政策研究人员","C. 咨询研究人员","D. 政府人员"],"explanation":"","tags":["公共政策","XX1010","第12章","多选"]},{"question":"政策知识则是有关政策的所有知识，除了政策学知识之外，还包括政策问题的知识。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","判断"]},{"question":"政策学知识包括政策知识。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","判断"]},{"question":"内参和政策报告是中国特色新型智库存在和发挥作用最为常用的方式。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","判断"]},{"question":"政策分析师应当具有政治头脑。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","判断"]},{"question":"政策学知识","answer":"简单地说就是人们对公共政策的科学认识，是通过政策研究而获得的学理性知识，其表现形式是政策研究的概念、命题、理论、模型、方法等。","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","名词解释"]},{"question":"中国特色新型智库","answer":"是以战略问题和公共政策为主要研究对象、以服务党和政府科学民主依法决策为宗旨的非营利性研究咨询机构。","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","名词解释"]},{"question":"知识联结者","answer":"他们可以将知识生产者的研究成果传送给知识应用者，同时也将知识应用者的理念传达给知识生产者。","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","名词解释"]},{"question":"政策分析的价值有哪些？","answer":"（1）通过整合性与科际性的分析，发现问题的要害和症结所在。（2）帮助决策者减少决策失误。（3）改善公共部门在决策上的低效状况。（4）增强决策的预期性和取向性。","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","简答"]},{"question":"政策分析的原则有哪些？","answer":"（1）民主化原则；（2）系统性原则；（3）协调性原则；（4）多样性原则；（5）分合原则；（6）预测性原则。","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","简答"]},{"question":"政策分析师的素质要求有哪些？","answer":"叶海卡·德洛尔认为政策分析师应该具备六个方面的素质：（1）政策分析师应当具有政治头脑；（2）政策分析师应当具有总体观念；（3）政策分析师应当致力于创新；（4）政策分析师应当具有洞察力；（5）政策分析师应当立足现实、放眼未来；（6）政策分析师应当具有弹性的思维。","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","简答"]},{"question":"简要介绍下特里·库珀的训练方案。","answer":"为让公共政策分析者尽快提升妥善处理职业伦理冲突的能力。该方案由六个步骤组成：（1）描述情状。（2）定义伦理问题。（3）界分可替代的行为过程。（4）设想可能的后果。（5）选择合适的方法。（6）做出决策。","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","简答"]},{"question":"中国智库的主要发展现状。","answer":"在中国经济发展转型和社会矛盾凸显的关键时期，智库的发展得到了国家的关注和重视，正在成为推进国家治理体系和治理能力现代化的重要支撑。（1）中国的智库从改革开放之后到现在有了长足的发展，形成了不同类型智库并存互补的总体格局。从改革开放之初的事业单位型的半官方智库到20世纪90年代初邓小平南方谈话之后民间智库的崛起，到1998年“985工程”后，国内主要研究型大学纷纷成立的政策研究和咨询机构，都使得中国智库的发展呈现多元化和多领域的发展态势。2009年3月由国务院原副总理曾培炎担任理事长的中国国际经济交流中心（国经中心）的成立，更是标志着中国智库发展进入新阶段。（2）进入21世纪以来，党的十八届三中全会通过的《中共中央关于全面深化改革若干重大问题的决定》明确提出，加强中国特色新型智库建设，建立健全决策咨询制度；《中共中央关于进一步繁荣发展哲学社会科学的意见》提出要使哲学社会科学界成为党和政府工作的“智库”和“智囊团”。2013年，习近平明确指示，中国要建设“中国特色新型智库”，适度超前，服务决策，为中国智库的发展指明了方向。翌年7月，他又指出广泛听取各方面专家学者意见并使之制度化，对提高党的执政能力、提高国家治理能力具有重要意义。（3）在日益复杂的国际国内经济社会发展与竞争中，信得过、靠得住、用得上是对一个国家智库的基本要求。全国各部门各地发展智库的热情空前高涨，各种类型的智库不断涌现，相关的研讨会和评估也络绎不绝。根据《全球智库报告2016》，中国拥有435家智库，智库数量稳居世界第二。在全球智库175强榜单中，有9家中国智库上榜；“全球最佳社会智库排名”120强榜单中，有7家中国智库上榜；而在“全球最值得关注智库排名”100强榜单中，有5家中国智库上榜，相比上年均有所增加。中国智库上榜的表单数量达到41个，与2015年相比增加了13个，反映出中国智库发展呈现的良性态势。","options":[],"explanation":"","tags":["公共政策","XX1010","第12章","案例分析"]}];

<script>
/* ============================================================
 * app.js —— 拍照搜题助手 PWA 主逻辑
 * 拍照/选图 → 云端 OCR（视觉模型）→ 题库相似度匹配 → AI/联网兜底 → 收录
 * 纯前端，数据存 localStorage；无 DOM 库依赖。
 * ============================================================ */
(function () {
  'use strict';

  var CORE = window.__QBankCore;
  var CFG_KEY = 'pq_config_v1';
  var BANK_KEY = 'pq_bank_v1';        // 用户自己的题目（内置题库单独内联，不落存储）
  var QUEUE_KEY = 'pq_queue_v1';      // 待收录队列（识别了但没点收录的临时态，可留空）

  // ---------- 服务商预设 ----------
  // 手机浏览器直连第三方 API 必须对方返回 Access-Control-Allow-Origin。
  // siliconflow / openrouter 经实测返回 `*`，最稳，列为默认推荐；
  // qwen / openai / moonshot / deepseek 视网络与网关策略可能被拦，保留但不推荐。
  var OCR_PRESET = {
    siliconflow: { endpoint: 'https://api.siliconflow.cn/v1/chat/completions', model: 'Qwen/Qwen2.5-VL-72B-Instruct' },
    openrouter:  { endpoint: 'https://openrouter.ai/api/v1/chat/completions', model: 'qwen/qwen2.5-vl-72b-instruct' },
    qwen:      { endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-vl-max-latest' },
    openai:    { endpoint: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o-mini' },
    moonshot:  { endpoint: 'https://api.moonshot.cn/v1/chat/completions', model: 'moonshot-v1-8k-vision-preview' },
    custom:    { endpoint: '', model: '' }
  };
  var AI_PRESET = {
    siliconflow: { endpoint: 'https://api.siliconflow.cn/v1/chat/completions', model: 'deepseek-ai/DeepSeek-V3' },
    openrouter:  { endpoint: 'https://openrouter.ai/api/v1/chat/completions', model: 'deepseek/deepseek-chat' },
    deepseek:  { endpoint: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-chat' },
    moonshot:  { endpoint: 'https://api.moonshot.cn/v1/chat/completions', model: 'moonshot-v1-8k' },
    qwen:      { endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-plus' },
    openai:    { endpoint: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o-mini' },
    custom:    { endpoint: '', model: '' }
  };
  // 默认改为手机直连可用的服务商；老用户已保存的配置不受影响。
  var DEFAULTS = {
    ocrProvider: 'siliconflow', ocrEndpoint: '', ocrModel: '', ocrKey: '',
    aiProvider: 'siliconflow', aiEndpoint: '', aiModel: '', aiKey: '',
    autoCollect: true,
    threshold: 0.32,
    fallbackMinScore: 0.5,
    maxResults: 5
  };

  var cfg = loadCfg();
  var userBank = loadBank();          // 用户题目数组
  var currentImage = null;            // base64 dataURL
  var currentQuestion = '';           // 当前题干（识别/编辑后）
  var currentAnswer = '';             // 当前展示的答案（命中或兜底）
  var currentAnswerMode = '';         // 'bank' | 'ai' | 'search'
  var currentOptions = [];
  var collectedFingerprint = '';      // 已收录的答案指纹，防止重复收录

  // ---------- DOM ----------
  function $(id) { return document.getElementById(id); }
  function toast(msg, ms) {
    var t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.hidden = true; }, ms || 2200);
  }

  // ---------- 存储 ----------
  function loadCfg() {
    try {
      var raw = localStorage.getItem(CFG_KEY);
      if (raw) return Object.assign({}, DEFAULTS, JSON.parse(raw));
    } catch (e) {}
    return Object.assign({}, DEFAULTS);
  }
  function saveCfg() {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  function loadBank() {
    try {
      var raw = localStorage.getItem(BANK_KEY);
      if (raw) { var a = JSON.parse(raw); if (Array.isArray(a)) return a; }
    } catch (e) {}
    return [];
  }
  function saveBank() {
    try { localStorage.setItem(BANK_KEY, JSON.stringify(userBank)); } catch (e) {}
  }

  // 全部题目 = 内置 + 用户
  function allBank() {
    var builtin = (window.__QBBuiltIn && Array.isArray(window.__QBBuiltIn.items)) ? window.__QBBuiltIn.items : [];
    return builtin.concat(userBank);
  }
  function bankStats() {
    var builtin = (window.__QBBuiltIn && Array.isArray(window.__QBBuiltIn.items)) ? window.__QBBuiltIn.items : [];
    var auto = 0, manual = 0, corrected = 0;
    userBank.forEach(function (it) {
      var tags = it.tags || [];
      if (tags.indexOf('手动收录') >= 0) manual++;
      else if (tags.indexOf('自动收录') >= 0) auto++;
      if (tags.indexOf('已更正') >= 0) corrected++;
    });
    return { builtin: builtin.length, mine: userBank.length, auto: auto, manual: manual, corrected: corrected, total: builtin.length + userBank.length };
  }
  function fp(text) { return CORE && CORE.normalize ? CORE.normalize(text) : String(text || '').trim(); }

  // ---------- 图片 → base64 ----------
  function fileToDataUrl(file, cb) {
    var r = new FileReader();
    r.onload = function () { cb(null, r.result); };
    r.onerror = function () { cb(new Error('图片读取失败')); };
    r.readAsDataURL(file);
  }
  // 压缩大图，避免 base64 过大导致请求失败
  function compress(dataUrl, maxSide, cb) {
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var nw = Math.round(w * scale), nh = Math.round(h * scale);
      var canvas = document.createElement('canvas');
      canvas.width = nw; canvas.height = nh;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, nw, nh);
      try { cb(null, canvas.toDataURL('image/jpeg', 0.85)); }
      catch (e) { cb(null, dataUrl); }
    };
    img.onerror = function () { cb(null, dataUrl); };
    img.src = dataUrl;
  }

  // ---------- 云端 OCR（视觉模型，OpenAI 兼容 chat/completions） ----------
  function ocrConfig() {
    var p = OCR_PRESET[cfg.ocrProvider] || OCR_PRESET.qwen;
    return {
      endpoint: (cfg.ocrEndpoint || p.endpoint || '').trim(),
      model: (cfg.ocrModel || p.model || '').trim(),
      key: (cfg.ocrKey || '').trim()
    };
  }
  function ocrPrompt() {

      '2. 只输出这道题的题号、题干和选项，保持原有分行和编号，不要改写、补充或纠错。\n' +
      '3. 下列内容一个字都不要输出：手机状态栏（时间/电量/信号/WiFi）、App 界面文字（返回/菜单/下一题/上一题/提交/交卷/答题卡/按钮/标签栏）、水印、二维码、Logo、广告、页眉页脚、页码、书名与章节标题、版权信息，以及答案、解析和答题反馈（✔✘、正确/错误、得分、计时）。\n' +
      '4. 不要输出任何说明、客套话或 Markdown 代码块。\n' +
      '5. 若图中没有完整的题目，只输出「未识别到题目」。';
  }
  function cleanOcrText(t) {
    var s = String(t || '').trim();
    // 去掉模型常见的包裹性客套话
    s = s.replace(/^(好的|以下是|题目如下|题目文字如下|识别结果如下)[:：]?\s*/i, '');
    s = s.replace(/^```(?:text|plaintext)?\s*/i, '').replace(/```\s*$/, '');
    // 过滤界面/状态栏/答案等噪音行（整行匹配，避免误伤题干）
    var NOISE = [
      /^(返回|菜单|更多|分享|收藏|下一题|上一题|提交|交卷|确定|取消|关闭|跳过|我知道了)$/,
      /^(首页|我的|练习|考试|错题本|设置|题库|会员|续费|开通)$/,
      /^\d{1,2}:\d{2}(:\d{2})?$/,
      /^\d{1,3}\s*%$/,
      /^第\s*\d{1,3}\s*页(\s*\/\s*共\s*\d{1,3}\s*页)?$/,
      /^(正确答案|参考答案|答案解析|答案|解析|答案提交成功)/,
      /^[✔✘✓✗]/,
      /^(正确|错误|答对|答错|得分|本题得分|用时|计时)/
    ];
    s = s.split('\n').filter(function (line) {
      var x = line.trim();
      if (!x) return false;
      for (var i = 0; i < NOISE.length; i++) { if (NOISE[i].test(x)) return false; }
      return true;
    }).join('\n');
    return s.trim();
  }
  // ---------- 统一网络层 ----------
  // Android APK 内注入原生桥接 window.NativeHttpBridge.post(url, headersJson, bodyJson, callbackId)，
  // 由原生层用 HttpURLConnection 发起请求，不受浏览器 CORS 限制；普通浏览器回退到 fetch。
  // 回调统一为 cb(err, jsonObj)，err.message 形如 "HTTP 401 ..." 与 fetch 路径保持一致。
  function httpPost(url, headers, bodyObj, cb) {
    var bodyStr = JSON.stringify(bodyObj);
    if (window.NativeHttpBridge && typeof window.NativeHttpBridge.post === 'function') {
      var id = 'cb' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
      window.__nativeCb = window.__nativeCb || {};
      window.__nativeCb[id] = function (errMsg, respText) {
        try { delete window.__nativeCb[id]; } catch (e2) {}
        if (errMsg) { cb(new Error(errMsg)); return; }
        var j;
        try { j = JSON.parse(respText); }
        catch (e3) { cb(new Error('接口返回格式异常')); return; }
        cb(null, j);
      };
      try {
        window.NativeHttpBridge.post(url, JSON.stringify(headers || {}), bodyStr, id);
      } catch (e4) {
        cb(new Error('原生网络调用失败：' + (e4 && e4.message ? e4.message : e4)));
      }
      return;
    }
    fetch(url, { method: 'POST', headers: headers, body: bodyStr })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (tx) { throw new Error('HTTP ' + r.status + ' ' + tx.slice(0, 120)); });
        return r.json();
      })
      .then(function (j) { cb(null, j); })
      .catch(function (e) { cb(e); });
  }

  // 把底层错误翻译成用户看得懂、可立即行动的提示。
  // 浏览器 fetch 遇到 CORS 时只会抛 TypeError: Failed to fetch，
  // 这里识别出来并给出「换服务商」的明确指引。
  function readableError(e, fallbackPrefix) {
    var raw = e && e.message ? e.message : String(e || '');
    var lower = raw.toLowerCase();
    var isFetchFail = /failed to fetch|networkerror|load failed|network request failed|typeerror/i.test(lower) &&
      !/^http\s/i.test(raw);
    var isCorsText = /access-control-allow-origin|cors|not allowed by access/i.test(raw);
    if (isFetchFail || isCorsText) {
      return new Error((fallbackPrefix || '请求失败') + '：当前服务商不允许手机网页直连（被浏览器的同源策略拦截）。' +
        '请到「设置」把服务商改为「硅基流动」或「OpenRouter」，填好对应 API Key 后再试（这两家已实测支持手机直连）。');
    }
    if (/^http\s+401/i.test(raw)) {
      return new Error((fallbackPrefix || '请求失败') + '：API Key 无效或未填写，请到设置核对密钥。');
    }
    if (/^http\s+429/i.test(raw)) {
      return new Error((fallbackPrefix || '请求失败') + '：调用过于频繁或额度用尽，请稍后再试。');
    }
    return new Error((fallbackPrefix || '请求失败') + '：' + raw);
  }
  function doOcr(dataUrl, cb) {
    var oc = ocrConfig();
    if (!oc.endpoint) { cb(new Error('请先在设置里填写 OCR 接口地址')); return; }
    if (!oc.key) { cb(new Error('请先到设置里填写 OCR 服务的 API Key')); return; }
    var body = {
      model: oc.model || OCR_PRESET.siliconflow.model,
      temperature: 0,
      messages: [{
        role: 'user',
        content: [
          { type: 'text', text: ocrPrompt() },
          { type: 'image_url', image_url: { url: dataUrl } }
        ]
      }]
    };
    httpPost(oc.endpoint, { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + oc.key }, body, function (err, j) {
      if (err) { cb(readableError(err, '识别失败')); return; }
      var text = j && j.choices && j.choices[0] && j.choices[0].message &&
        (j.choices[0].message.content);
      if (Array.isArray(text)) { // 部分服务 content 为多段数组
        text = text.map(function (x) { return x.text || x.content || ''; }).join('');
      }
      if (!text) { cb(new Error('识别失败：接口未返回识别文字')); return; }
      cb(null, cleanOcrText(text));
    });
  }

  // ---------- 题库匹配 ----------
  function matchBank(text) {
    if (!CORE || typeof CORE.search !== 'function') return [];
    return CORE.search(allBank(), text, {
      threshold: cfg.threshold,
      maxResults: cfg.maxResults
    });
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- AI 兜底 ----------
  function aiConfig() {
    var p = AI_PRESET[cfg.aiProvider] || AI_PRESET.deepseek;
    return {
      endpoint: (cfg.aiEndpoint || p.endpoint || '').trim(),
      model: (cfg.aiModel || p.model || '').trim(),
      key: (cfg.aiKey || '').trim()
    };
  }
  function aiPrompt(question, options) {
    var p = '你是答题助手。请根据题目给出正确答案。要求：\n' +
      '1. 直接给出答案，不要长篇解释；\n' +
      '2. 如果是选择题，只输出选项字母（如 D 或 ABD），务必从给定选项中选择；\n' +
      '3. 如果是简答/名词解释等主观题，给出精炼的要点式答案；\n' +
      '4. 不确定时给出最可能的答案。\n\n题目：\n' + question;
    if (options && options.length) p += '\n\n选项：\n' + options.join('\n');
    return p;
  }
  function doAi(question, options, cb) {
    var ac = aiConfig();
    if (!ac.endpoint) { cb(new Error('请先在设置里填写 AI 接口地址')); return; }
    if (!ac.key) { cb(new Error('请先到设置里填写 AI 服务的 API Key')); return; }
    var body = {
      model: ac.model || AI_PRESET.siliconflow.model,
      temperature: 0.2,
      messages: [{ role: 'user', content: aiPrompt(question, options) }]
    };
    httpPost(ac.endpoint, { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ac.key }, body, function (err, j) {
      if (err) { cb(readableError(err, 'AI 作答失败')); return; }
      var text = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (Array.isArray(text)) text = text.map(function (x) { return x.text || ''; }).join('');
      if (!text) { cb(new Error('AI 作答失败：AI 未返回答案')); return; }
      cb(null, String(text).trim());
    });
  }

  // ---------- 接口连通性测试 ----------
  // 用一条最小文本请求验证「地址 + 密钥 + 模型 + CORS」是否通，不消耗图片流量。
  function testConnection(kind, cb) {
    var c = kind === 'ocr' ? ocrConfig() : aiConfig();
    var fallbackModel = kind === 'ocr' ? OCR_PRESET.siliconflow.model : AI_PRESET.siliconflow.model;
    if (!c.endpoint) { cb(new Error('请先填写接口地址')); return; }
    if (!c.key) { cb(new Error('请先填写 API Key')); return; }
    var body = {
      model: c.model || fallbackModel,
      temperature: 0,
      max_tokens: 16,
      messages: [{ role: 'user', content: '只回复两个字：正常' }]
    };
    httpPost(c.endpoint, { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key }, body, function (err, j) {
      if (err) { cb(readableError(err, '连接失败')); return; }
      var text = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      cb(null, '连接成功' + (text ? '（模型回复：' + String(text).trim().slice(0, 20) + '）' : ''));
    });
  }

  // ---------- 收录 ----------
  function extractOptionsFromText(text) {
    var out = [], lines = String(text || '').split('\n'), seen = {};
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      var m = /^([A-Ha-h])\s*[.．、:：)）]\s*(.{1,120})$/.exec(t);
      if (m) {
        var line = m[1].toUpperCase() + '. ' + m[2].trim();
        var k = m[1].toUpperCase();
        if (!seen[k]) { seen[k] = 1; out.push(line); }
      }
    }
    return out.slice(0, 8);
  }
  // 从 OCR/输入文本里尽量提取纯题干（去掉选项行）
  function questionOnly(text) {
    var lines = String(text || '').split('\n');
    var q = lines.filter(function (l) {
      return !/^[A-Ha-h]\s*[.．、:：)）]/.test(l.trim());
    }).join('\n').trim();
    return q || String(text || '').trim();
  }
  function collectAnswer(question, answer, options, mode) {
    if (!question || !answer) return null;
    var q = questionOnly(question).slice(0, 500);
    var a = String(answer).trim().slice(0, 500);
    if (!q || !a) return null;
    var key = fp(q);
    // 查同题：精确指纹或高相似度
    var idx = -1, i;
    for (i = 0; i < userBank.length; i++) {
      if (fp(userBank[i].question) === key) { idx = i; break; }
    }
    if (idx < 0 && CORE && CORE.search) {
      var near = CORE.search(userBank, q, { threshold: 0.92, maxResults: 1 });
      if (near.length && near[0].score >= 0.92) {
        for (i = 0; i < userBank.length; i++) { if (userBank[i] === near[0].item) { idx = i; break; } }
      }
    }
    var tag = mode === 'manual' ? '手动收录' : '自动收录';
    var opts = Array.isArray(options) ? options.slice(0, 8) : [];
    if (idx >= 0) {
      var old = String(userBank[idx].answer || '').trim().toUpperCase();
      var newA = a.length <= 12 ? a.toUpperCase() : a;
      if (old === newA.toUpperCase()) return { action: 'same' };
      userBank[idx].answer = newA;
      if (opts.length) userBank[idx].options = opts;
      if (!userBank[idx].tags) userBank[idx].tags = [];
      if (userBank[idx].tags.indexOf('已更正') < 0) userBank[idx].tags.push('已更正');
      saveBank(); refreshCount();
      return { action: 'correct', old: old, answer: newA };
    }
    var ans = a.length <= 12 ? a.toUpperCase() : a;
    userBank.push({
      question: q,
      answer: ans,
      options: opts,
      explanation: '',
      tags: [tag, mode === 'manual' ? '手动收录' : '自动收录']
    });
    saveBank(); refreshCount();
    return { action: 'add', answer: ans };
  }

  // ---------- 渲染 ----------
  function refreshCount() {
    var s = bankStats();
    $('bankCount').textContent = s.total + ' 题';
    $('bankStat').textContent = '内置 ' + s.builtin + ' 题 · 我的 ' + s.mine +
      ' 题（自动 ' + s.auto + ' · 手动 ' + s.manual + ' · 其中更正 ' + s.corrected + '）';
  }
  function renderMatch(results) {
    var box = $('resultBody');
    $('resultCard').hidden = false;
    $('fallbackCard').hidden = true;
    if (!results.length) {
      box.innerHTML = '<div class="no-hit">题库里没有找到匹配的题目，点下方按钮联网 / AI 作答。</div>';
      currentAnswer = ''; currentAnswerMode = '';
      return;
    }
    var best = results[0];
    var hit = best.score >= cfg.fallbackMinScore;
    var html = '<div class="answer-box ' + (hit ? 'hit' : '') + '">';
    html += '<div class="lbl">' + (hit ? '题库答案' : '相似题答案（分数偏低，建议 AI 复核）') + '</div>';
    html += '<div class="ans">' + escapeHtml(best.item.answer || '') + '</div>';
    if (best.item.options && best.item.options.length) {
      html += '<div class="opts">' + escapeHtml(best.item.options.join('\n')) + '</div>';
    }
    html += '<div class="meta"><span class="tag score">相似度 ' + (best.score * 100).toFixed(0) + '%</span>';
    var tags = best.item.tags || [];
    if (tags.length) html += '<span class="tag src">' + escapeHtml(tags.slice(0, 3).join(' · ')) + '</span>';
    html += '</div></div>';
    if (results.length > 1) {
      html += '<div class="more-row"><b style="font-size:12px;color:#6b7280">其他相似题：</b>';
      for (var i = 1; i < results.length; i++) {
        html += '<div class="more-item">' + escapeHtml((results[i].item.question || '').slice(0, 60)) +
          ' → ' + escapeHtml(results[i].item.answer || '') + '（' + (results[i].score * 100).toFixed(0) + '%）</div>';
      }
      html += '</div>';
    }
    box.innerHTML = html;
    if (hit) {
      currentAnswer = best.item.answer || '';
      currentAnswerMode = 'bank';
      maybeAutoCollect();
    } else {
      currentAnswer = ''; currentAnswerMode = '';
    }
  }
  function renderFallbackLoading() {
    $('fallbackCard').hidden = false;
    $('fallbackBody').innerHTML = '<div class="fb-loading"><span class="spinner"></span> AI 正在作答…</div>';
  }
  function renderFallbackAnswer(text, mode) {
    $('fallbackCard').hidden = false;
    $('fallbackBody').innerHTML = '<div class="fb-answer"><div class="lbl" style="font-size:12px;color:#6b7280">' +
      (mode === 'search' ? '联网结果' : 'AI 答案') + '</div><div class="ans">' + escapeHtml(text) + '</div></div>';
    currentAnswer = text;
    currentAnswerMode = mode;
    maybeAutoCollect();
  }
  function renderFallbackError(msg) {
    $('fallbackCard').hidden = false;
    $('fallbackBody').innerHTML = '<div class="no-hit">' + escapeHtml(msg) + '</div>';
  }
  function showCollectBar(show) {
    $('collectBar').hidden = !show;
  }
  function maybeAutoCollect() {
    if (!cfg.autoCollect || !currentAnswer || !currentQuestion) { showCollectBar(false); return; }
    var f = fp(currentQuestion) + '\u0001' + fp(currentAnswer);
    if (f === collectedFingerprint) { showCollectBar(true); return; }
    // 题库命中本身就来自题库，不必重复收录；只对 AI/兜底答案自动收录
    if (currentAnswerMode === 'bank') { showCollectBar(false); return; }
    collectedFingerprint = f;
    var rec = collectAnswer(currentQuestion, currentAnswer, currentOptions, currentAnswerMode);
    showCollectBar(true);
    if (rec && rec.action === 'add') toast('已自动收录进题库');
    else if (rec && rec.action === 'correct') toast('已更正题库答案');
  }

  // ---------- 主流程 ----------
  function onImagePicked(file) {
    if (!file) return;
    $('ocrStatus').textContent = '图片已选择，正在处理…';
    fileToDataUrl(file, function (err, dataUrl) {
      if (err) { $('ocrStatus').textContent = err.message; return; }
      compress(dataUrl, 1600, function (e2, small) {
        currentImage = small || dataUrl;
        $('previewImg').src = currentImage;
        $('imgPreview').hidden = false;
        $('btnOcr').disabled = false;
        $('ocrStatus').textContent = '图片已就绪，点「识别题目文字」';
      });
    });
  }
  function runOcr() {
    if (!currentImage) { toast('请先拍照或选图'); return; }
    $('btnOcr').disabled = true;
    $('ocrStatus').innerHTML = '<span class="spinner" style="display:inline-block;vertical-align:middle"></span> 正在云端识别…';
    doOcr(currentImage, function (err, text) {
      $('btnOcr').disabled = false;
      if (err) { $('ocrStatus').textContent = err.message; toast(err.message); return; }
      if (!text || /未识别到题目/.test(text)) {
        $('ocrStatus').textContent = '没识别到题目，请手动输入题干';
        $('questionText').value = '';
      } else {
        $('questionText').value = text;
        $('ocrStatus').textContent = '识别完成，可修改题干后查询';
      }
      currentQuestion = $('questionText').value.trim();
      currentOptions = extractOptionsFromText(currentQuestion);
      $('btnMatch').disabled = !currentQuestion;
      // 识别后自动匹配一次
      if (currentQuestion) runMatch();
    });
  }
  function runMatch() {
    currentQuestion = $('questionText').value.trim();
    if (!currentQuestion) { toast('请先输入或识别题干'); return; }
    currentOptions = extractOptionsFromText(currentQuestion);
    collectedFingerprint = '';
    var results = matchBank(currentQuestion);
    renderMatch(results);
    if (!results.length || (results[0].score || 0) < cfg.fallbackMinScore) {
      // 题库没找到，自动走兜底
      runFallback();
    }
  }
  function runFallback() {
    currentQuestion = $('questionText').value.trim();
    if (!currentQuestion) { toast('请先输入或识别题干'); return; }
    renderFallbackLoading();
    doAi(currentQuestion, currentOptions, function (err, text) {
      if (err) { renderFallbackError(err.message); return; }
      renderFallbackAnswer(text, 'ai');
    });
  }

  // ---------- 设置 ----------
  function fillSettings() {
    $('ocrProvider').value = cfg.ocrProvider || 'siliconflow';
    $('ocrEndpoint').value = cfg.ocrEndpoint || '';
    $('ocrModel').value = cfg.ocrModel || '';
    $('ocrKey').value = cfg.ocrKey || '';
    $('aiProvider').value = cfg.aiProvider || 'siliconflow';
    $('aiEndpoint').value = cfg.aiEndpoint || '';
    $('aiModel').value = cfg.aiModel || '';

    $('autoCollect').checked = cfg.autoCollect !== false;
    refreshCount();
  }
  function readSettings() {
    cfg.ocrProvider = $('ocrProvider').value;
    cfg.ocrEndpoint = $('ocrEndpoint').value.trim();
    cfg.ocrModel = $('ocrModel').value.trim();
    cfg.ocrKey = $('ocrKey').value.trim();
    cfg.aiProvider = $('aiProvider').value;
    cfg.aiEndpoint = $('aiEndpoint').value.trim();
    cfg.aiModel = $('aiModel').value.trim();
    cfg.aiKey = $('aiKey').value.trim();
    cfg.autoCollect = $('autoCollect').checked;
  }
  function exportBank() {
    var data = {
      app: '拍照搜题助手',
      exportedAt: new Date().toISOString(),
      stats: bankStats(),
      items: userBank
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '拍照搜题题库-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('题库已导出');
  }
  function importBank(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        var items = Array.isArray(data) ? data : (data.items || data.questions || []);
        if (!Array.isArray(items) || !items.length) { toast('文件里没有题目'); return; }
        var added = 0, updated = 0;
        items.forEach(function (it) {
          var q = String(it.question || '').trim();
          var a = String(it.answer || '').trim();
          if (!q || !a) return;
          var key = fp(q), idx = -1, i;
          for (i = 0; i < userBank.length; i++) { if (fp(userBank[i].question) === key) { idx = i; break; } }
          var rec = {
            question: q, answer: a,
            options: Array.isArray(it.options) ? it.options : [],
            explanation: String(it.explanation || ''),
            tags: Array.isArray(it.tags) ? it.tags : ['导入']
          };
          if (idx >= 0) { userBank[idx] = rec; updated++; }
          else { userBank.push(rec); added++; }
        });
        saveBank(); refreshCount();
        toast('导入完成：新增 ' + added + ' 题，更新 ' + updated + ' 题');
      } catch (e) { toast('导入失败：文件格式不对'); }
    };
    r.readAsText(file);
  }

  // ---------- 事件绑定 ----------
  function bind() {
    $('fileCamera').addEventListener('change', function () { onImagePicked(this.files && this.files[0]); });
    $('fileGallery').addEventListener('change', function () { onImagePicked(this.files && this.files[0]); });
    $('btnClearImg').addEventListener('click', function () {
      currentImage = null;
      $('imgPreview').hidden = true;
      $('btnOcr').disabled = true;
      $('ocrStatus').textContent = '';
    });
    $('btnOcr').addEventListener('click', runOcr);
    $('btnMatch').addEventListener('click', runMatch);
    $('questionText').addEventListener('input', function () {
      $('btnMatch').disabled = !this.value.trim();
    });
    $('btnFallback').addEventListener('click', runFallback);
    $('btnCollect').addEventListener('click', function () {
      currentQuestion = $('questionText').value.trim();
      if (!currentQuestion || !currentAnswer) { toast('没有可收录的题目或答案'); return; }
      var rec = collectAnswer(currentQuestion, currentAnswer, currentOptions, 'manual');
      showCollectBar(false);
      if (rec && rec.action === 'add') toast('已收录进题库');
      else if (rec && rec.action === 'correct') toast('已更正题库答案');
      else if (rec && rec.action === 'same') toast('题库里已有相同答案');
      else toast('收录失败');
    });

    // 接口连通性测试：先暂存当前输入框里的值再测，避免必须「保存」后才能测
    function bindTest(btnId, statusId, kind) {
      var btn = $(btnId), status = $(statusId);
      if (!btn || !status) return;
      btn.addEventListener('click', function () {
        // 把当前界面上的值临时写入 cfg 供 testConnection 读取
        cfg[kind + 'Provider'] = $(kind + 'Provider').value;
        cfg[kind + 'Endpoint'] = $(kind + 'Endpoint').value.trim();
        cfg[kind + 'Model'] = $(kind + 'Model').value.trim();
        cfg[kind + 'Key'] = $(kind + 'Key').value.trim();
        btn.disabled = true; status.textContent = '正在测试…'; status.style.color = '';
        testConnection(kind, function (err, okMsg) {
          btn.disabled = false;
          if (err) { status.textContent = err.message; status.style.color = '#c62828'; }
          else { status.textContent = okMsg; status.style.color = '#2e7d32'; }
        });
      });
    }
    bindTest('btnTestOcr', 'ocrTestStatus', 'ocr');
    bindTest('btnTestAi', 'aiTestStatus', 'ai');

    function openSettings() {
      try { fillSettings(); } catch (e) {}
      var m = $('settingsMask');
      m.hidden = false;
      m.style.setProperty('display', 'flex', 'important'); // 强制显示，绕过任何 CSS hidden 冲突
    }
    function closeSettings() {
      var m = $('settingsMask');
      m.hidden = true;
      m.style.setProperty('display', 'none', 'important');
    }
    $('btnSettings').addEventListener('click', openSettings);
    $('btnCloseSettings').addEventListener('click', closeSettings);
    $('settingsMask').addEventListener('click', function (e) { if (e.target === this) closeSettings(); });
    $('btnSaveSettings').addEventListener('click', function () {
      readSettings(); saveCfg(); closeSettings(); toast('设置已保存');
    });
    $('btnExport').addEventListener('click', exportBank);
    $('importFile').addEventListener('change', function () { if (this.files && this.files[0]) importBank(this.files[0]); });
    $('btnClearAll').addEventListener('click', function () {
      if (!confirm('确定清空你手动/自动收录的题目吗？内置题库不受影响，此操作不可恢复。')) return;
      userBank = []; saveBank(); refreshCount(); toast('已清空我的题目');
    });
    $('btnResetBuiltin').addEventListener('click', function () {
      // 内置题库是内联脚本，重新加载页面即可恢复；这里仅提示
      toast('内置题库随应用更新，刷新页面即可加载');
    });
  }

  // ---------- 缓存清理（保险）----------
  // 不使用 Service Worker 缓存：资源 URL 已带版本号，每次都走网络拿最新版，
  // 从根本上避免「改了代码但用户被旧缓存卡住」的问题。这里只做一次性清理旧的 SW 缓存。
  function clearOldCache() {
    try {
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    } catch (e) {}
  }

  // ---------- 启动 ----------
  function init() {
    bind();
    refreshCount();
    clearOldCache();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();


</script>
</body>
</html>
