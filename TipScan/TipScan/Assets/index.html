<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8250df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>拍照搜题助手</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* hidden 属性必须能覆盖作者样式里的 display（如 .mask{display:flex}），
   否则 JS 设 hidden=true 后元素仍显示——设置抽屉的 × 关不掉就是这个原因 */
[hidden] { display: none !important; }
:root {
  --purple: #8250df;
  --purple-d: #6b3fc0;
  --bg: #f6f7f9;
  --card: #fff;
  --line: #e4e6eb;
  --text: #24292f;
  --muted: #6b7280;
  --ok: #1a7f37;
  --ok-bg: #e8f7ec;
  --warn: #b35900;
  --warn-bg: #fff4e0;
  --err: #c0392b;
  --err-bg: #fdecea;
}
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
.hd {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: var(--purple); color: #fff;
}
.hd-t { font-size: 17px; font-weight: 700; }
.hd-r { display: flex; align-items: center; gap: 10px; }
.badge { font-size: 12px; background: rgba(255,255,255,.2); padding: 3px 9px; border-radius: 12px; }
.icon-btn {
  border: none; background: rgba(255,255,255,.2); color: #fff;
  width: 34px; height: 34px; border-radius: 8px; font-size: 20px; line-height: 1; cursor: pointer;
}
main { padding: 12px; max-width: 560px; margin: 0 auto; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.03);
}
.sec-title { font-weight: 700; margin-bottom: 10px; font-size: 15px; }
.sec-title .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
.cam-row { display: flex; gap: 10px; margin-bottom: 10px; }
.cam-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px dashed var(--line); border-radius: 10px; padding: 16px 8px;
  font-size: 14px; cursor: pointer; background: #fafbfc;
}
.cam-btn input { display: none; }
.cam-btn.primary { border: 1px solid var(--purple); background: #f3ecff; color: var(--purple-d); font-weight: 600; }
.img-preview { position: relative; margin: 8px 0; }
.img-preview img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); }
.clear-img {
  position: absolute; top: 6px; right: 6px; width: 28px; height: 28px;
  border: none; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 18px; cursor: pointer;
}
.btn {
  border: 1px solid var(--purple); background: var(--purple); color: #fff;
  border-radius: 9px; padding: 10px 14px; font-size: 14px; cursor: pointer;
  width: 100%; font-weight: 600;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { padding: 13px; font-size: 15px; margin-top: 6px; }
.btn.ghost { background: #fff; color: var(--purple-d); border-color: var(--line); }
.btn.danger { background: #fff; color: var(--err); border-color: #f0c4bf; }
.btn.small { padding: 8px 10px; font-size: 13px; }
.btn-row { display: flex; gap: 8px; margin: 8px 0; }
.btn-row > * { flex: 1; }
.file-label { display: flex; align-items: center; justify-content: center; }
.hint { color: var(--muted); font-size: 12px; min-height: 16px; margin-top: 6px; }
.q-input {
  width: 100%; border: 1px solid var(--line); border-radius: 9px;
  padding: 10px; font: inherit; resize: vertical; color: var(--text); background: #fff;
}
#btnMatch { margin-top: 8px; }

/* 结果 */
.answer-box { border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.answer-box.hit { background: var(--ok-bg); border: 1px solid #b7e4c4; }
.answer-box .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.answer-box .ans { font-size: 20px; font-weight: 800; color: var(--ok); word-break: break-word; white-space: pre-wrap; }
.answer-box .opts { margin-top: 8px; font-size: 13px; color: #444; white-space: pre-wrap; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: 11px; background: #eef0f3; color: #555; padding: 2px 8px; border-radius: 10px; }
.tag.src { background: #ede4ff; color: var(--purple-d); }
.tag.score { background: #e8f0fe; color: #1a56db; }
.more-row { margin-top: 6px; }
.more-item { font-size: 12px; color: var(--muted); padding: 6px 8px; border-top: 1px dashed var(--line); white-space: pre-wrap; }
.no-hit { background: var(--warn-bg); border: 1px solid #f0d8a8; color: var(--warn); border-radius: 10px; padding: 12px; }
.result-actions { margin-top: 10px; }
.fb-answer { background: var(--ok-bg); border: 1px solid #b7e4c4; border-radius: 10px; padding: 12px; }
.fb-answer .ans { font-size: 17px; font-weight: 700; color: var(--ok); white-space: pre-wrap; word-break: break-word; }
.fb-loading { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--purple); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn.link { width: auto; background: none; border: none; color: var(--purple-d); padding: 4px 0; text-decoration: underline; font-weight: 500; }

.collect-bar { position: sticky; bottom: 12px; z-index: 10; margin: 12px; }
.btn.collect { background: var(--ok); border-color: var(--ok); }

/* 设置抽屉 */
.mask { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; align-items: flex-end; }
.sheet { background: var(--card); width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; }
.sheet-hd { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet-hd .icon-btn { background: #eef0f3; color: #333; }
.sheet-bd { overflow-y: auto; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); }
.grp { margin-bottom: 18px; }
.grp-t { font-weight: 700; margin-bottom: 8px; color: var(--purple-d); }
.tip { font-size: 12px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
.grp label { display: block; font-size: 13px; color: #555; margin-bottom: 10px; }
.grp label input[type=text], .grp label input[type=password], .grp label select {
  display: block; width: 100%; margin-top: 4px; padding: 9px 10px;
  border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; color: var(--text); background: #fff;
}
.grp label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.grp label.check input { width: 18px; height: 18px; }

.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
  background: rgba(0,0,0,.82); color: #fff; padding: 10px 18px; border-radius: 20px;
  font-size: 14px; z-index: 100; max-width: 86%; text-align: center;
}
.foot { text-align: center; color: #9aa0a6; font-size: 12px; margin: 18px 0; }

</style>
<script>
/* 突破旧 Service Worker 缓存死锁：任何情况下先注销旧 SW、清空旧缓存。
   放在 head 最前面，早于资源加载。（APK 内为本地资源，无需版本号绕缓存） */
(function () {
  try {
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="hd">
  <div class="hd-t">📷 拍照搜题</div>
  <div class="hd-r"><span id="bankCount" class="badge">题库加载中…</span><button id="btnSettings" class="icon-btn" aria-label="设置">⚙</button></div>
</header>

<main>
  <!-- 拍照 / 选图 -->
  <section class="card">
    <div class="sec-title">① 拍下题目</div>
    <div class="cam-row">
      <label class="cam-btn primary">
        <input type="file" id="fileCamera" accept="image/*" capture="environment">
        <span>📸 拍照</span>
      </label>
      <label class="cam-btn">
        <input type="file" id="fileGallery" accept="image/*">
        <span>🖼 相册选图</span>
      </label>
    </div>
    <div id="imgPreview" class="img-preview" hidden>
      <img id="previewImg" alt="题目预览">
      <button id="btnClearImg" class="clear-img" aria-label="移除图片">×</button>
    </div>
    <button id="btnOcr" class="btn big" disabled>🔍 识别题目文字</button>
    <div id="ocrStatus" class="hint"></div>
  </section>

  <!-- 题干（可编辑） -->
  <section class="card">
    <div class="sec-title">② 题干 <span class="sub">识别后可修改</span></div>
    <textarea id="questionText" class="q-input" rows="4" placeholder="拍照识别后题干会显示在这里；也可以直接粘贴题目文字查询"></textarea>
    <button id="btnMatch" class="btn" disabled>从题库查找答案</button>
  </section>

  <!-- 匹配结果 -->
  <section id="resultCard" class="card" hidden>
    <div class="sec-title">③ 答案</div>
    <div id="resultBody"></div>
    <div class="result-actions">
      <button id="btnFallback" class="btn ghost">🤖 题库没找到？联网 / AI 作答</button>
    </div>
  </section>

  <!-- 兜底进度/结果 -->
  <section id="fallbackCard" class="card" hidden>
    <div class="sec-title">联网 / AI 兜底</div>
    <div id="fallbackBody" class="hint"></div>
  </section>

  <!-- 收录 -->
  <div id="collectBar" class="collect-bar" hidden>
    <button id="btnCollect" class="btn collect">✅ 收录进题库</button>
  </div>

  <p class="foot">题库与识别结果仅保存在本机 · 无需登录</p>
</main>

<!-- 设置抽屉 -->
<div id="settingsMask" class="mask" hidden>
  <div class="sheet">
    <div class="sheet-hd">
      <b>设置</b>
      <button id="btnCloseSettings" class="icon-btn" aria-label="关闭">×</button>
    </div>
    <div class="sheet-bd">
      <div class="grp">
        <div class="grp-t">云端 OCR（拍照识别）</div>
        <p class="tip">用视觉大模型识别题目。<b>手机浏览器直连推荐「硅基流动」或「OpenRouter」</b>（已实测支持跨域，需自行注册领 Key）；其余服务商可能在手机上被拦截。填好可点「测试连接」验证。</p>
        <label>服务商
          <select id="ocrProvider">
            <option value="siliconflow">硅基流动（推荐·手机可直连）</option>
            <option value="openrouter">OpenRouter（推荐·手机可直连）</option>
            <option value="qwen">通义千问 VL（阿里云）</option>
            <option value="openai">OpenAI（GPT-4o mini）</option>
            <option value="moonshot">Kimi 视觉</option>
            <option value="custom">自定义（OpenAI 兼容）</option>
          </select>
        </label>
        <label>接口地址 <input id="ocrEndpoint" type="text" placeholder="留空用服务商默认地址"></label>
        <label>模型 <input id="ocrModel" type="text" placeholder="留空用服务商默认模型"></label>
        <label>API Key <input id="ocrKey" type="password" placeholder="sk-..."></label>
        <div class="btn-row">
          <button id="btnTestOcr" class="btn ghost small">测试 OCR 连接</button>
        </div>
        <div id="ocrTestStatus" class="hint"></div>
      </div>

      <div class="grp">
        <div class="grp-t">AI 兜底（题库未命中时）</div>
        <label>服务商
          <select id="aiProvider">
            <option value="siliconflow">硅基流动（推荐·手机可直连）</option>
            <option value="openrouter">OpenRouter（推荐·手机可直连）</option>
            <option value="deepseek">DeepSeek</option>
            <option value="moonshot">Kimi / Moonshot</option>
            <option value="qwen">通义千问</option>
            <option value="openai">OpenAI</option>
            <option value="custom">自定义</option>
          </select>
        </label>
        <label>接口地址 <input id="aiEndpoint" type="text" placeholder="留空用默认地址"></label>
        <label>模型 <input id="aiModel" type="text" placeholder="留空用默认模型"></label>
        <label>API Key <input id="aiKey" type="password" placeholder="sk-..."></label>
        <div class="btn-row">
          <button id="btnTestAi" class="btn ghost small">测试 AI 连接</button>
        </div>
        <div id="aiTestStatus" class="hint"></div>
      </div>

      <div class="grp">
        <div class="grp-t">题库</div>
        <label class="check"><input id="autoCollect" type="checkbox" checked> 采纳答案后自动收录进题库</label>
        <div class="btn-row">
          <button id="btnExport" class="btn ghost">导出题库</button>
          <label class="btn ghost file-label">导入题库<input type="file" id="importFile" accept=".json,application/json" hidden></label>
        </div>
        <div class="btn-row">
          <button id="btnResetBuiltin" class="btn ghost small">恢复内置题库</button>
          <button id="btnClearAll" class="btn danger small">清空我的题目</button>
        </div>
        <div id="bankStat" class="hint"></div>
      </div>

      <button id="btnSaveSettings" class="btn big primary">保存设置</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
/* ============================================================
 * qbank-core.js —— 题库解析与相似度匹配核心（无 DOM 依赖）
 * 供 content script 使用；也可在 Node 中 require 后单独测试。
 * 兼容老内核：仅使用 ES5 语法。
 * ============================================================ */
(function (global) {
  'use strict';

  // ---------- 文本归一化 ----------
  function normalize(s) {
    var out = String(s == null ? '' : s);
    // 全角 -> 半角
    out = out.replace(/[\uFF01-\uFF5E]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
    out = out.replace(/\u3000/g, ' ');
    // 去掉空白与常见标点，保留中英文与数字
    out = out.replace(/\s+/g, '');
    out = out.replace(/[，。！？；：、,.!?;:"'`“”‘’《》<>（）()\[\]{}【】\-—_/\\|~·※]/g, '');
    return out.toLowerCase();
  }

  function bigrams(s) {
    var out = [];
    if (s.length === 1) return [s];
    for (var i = 0; i < s.length - 1; i++) out.push(s.charAt(i) + s.charAt(i + 1));
    return out;
  }

  function words(s) {
    return s.match(/[a-z0-9]+/g) || [];
  }

  function intersectCount(a, b) {
    var m = {}, n = 0, i;
    for (i = 0; i < a.length; i++) m[a[i]] = (m[a[i]] || 0) + 1;
    for (i = 0; i < b.length; i++) {
      if (m[b[i]] > 0) { m[b[i]]--; n++; }
    }
    return n;
  }

  function jaccard(a, b) {
    if (!a.length && !b.length) return 1;
    var set = {}, inter = 0, i;
    for (i = 0; i < a.length; i++) set[a[i]] = true;
    for (i = 0; i < b.length; i++) if (set[b[i]]) inter++;
    var union = 0;
    for (i = 0; i < a.length; i++) if (!set['__c_' + a[i]]) { set['__c_' + a[i]] = true; union++; }
    for (i = 0; i < b.length; i++) if (!set['__d_' + b[i]]) { set['__d_' + b[i]] = true; union++; }
    return union ? inter / union : 0;
  }

  /**
   * 相似度 0~1：中文以字符二元组 Dice 为主，英文补充词级 Jaccard。
   */
  function similarity(a, b) {
    var x = normalize(a), y = normalize(b);
    if (!x || !y) return 0;
    if (x === y) return 1;
    var min = Math.min(x.length, y.length), max = Math.max(x.length, y.length);
    if (min >= 6 && (x.indexOf(y) >= 0 || y.indexOf(x) >= 0)) return 0.96;
    var ba = bigrams(x), bb = bigrams(y);
    var dice = ba.length && bb.length ? (2 * intersectCount(ba, bb)) / (ba.length + bb.length) : 0;
    var wj = jaccard(words(x), words(y));
    var lenFactor = min / max;
    return Math.min(1, dice * 0.82 + wj * 0.10 + lenFactor * 0.08);
  }

  // ---------- 导入解析 ----------
  function isDelim(c, delim) {
    return c === delim || (delim === ',' && c === '，');
  }

  function parseDelimited(text, delim) {
    var rows = [], row = [], field = '', inQuote = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text.charAt(i);
      if (c === '"') {
        if (inQuote && text.charAt(i + 1) === '"') { field += '"'; i++; }
        else inQuote = !inQuote;
      } else if (isDelim(c, delim) && !inQuote) {
        row.push(field); field = '';
      } else if (c === '\n' && !inQuote) {
        row.push(field); rows.push(row); row = []; field = '';
      } else if (c === '\r') {
        // ignore
      } else {
        field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) {
      for (var i = 0; i < r.length; i++) if (String(r[i]).trim()) return true;
      return false;
    });
  }

  function findColumn(headers, names) {
    var i, j, h, name;
    for (j = 0; j < names.length; j++) {
      name = names[j];
      for (i = 0; i < headers.length; i++) {
        h = normalize(headers[i]);
        if (name.length === 1 ? h === name : h.indexOf(name) >= 0) return i;
      }
    }
    return -1;
  }

  function splitOptions(v) {
    if (Array.isArray(v)) return v.map(function (x) { return String(x).trim(); }).filter(Boolean);
    var s = String(v == null ? '' : v).trim();
    if (!s) return [];
    return s.split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
  }

  function normalizeItem(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var q = raw.question || raw.q || raw.stem || raw.title || raw['题目'] || raw['题干'] || raw['问题'] || raw['试题'] || '';
    var a = raw.answer || raw.a || raw.correct || raw['答案'] || raw['正确答案'] || raw['答'] || '';
    var tags = raw.tags || raw.tag || raw.chapter || raw.category || raw['章节'] || raw['标签'] || raw['分类'] || [];
    if (typeof tags === 'string') tags = tags.split(/[,，;；]/).map(function (x) { return x.trim(); }).filter(Boolean);
    q = String(q).trim();
    if (!q) return null;
    return {
      question: q,
      answer: String(a).trim(),
      options: splitOptions(raw.options || raw.choice || raw.choices || raw['选项']),
      explanation: String(raw.explanation || raw.analysis || raw['解析'] || raw['解释'] || raw['说明'] || '').trim(),
      tags: tags
    };
  }

  function parseJson(text) {
    var data = JSON.parse(text);
    var list = Array.isArray(data) ? data :
      (data && (data.questions || data.items || data.data || data.list || data['题库'])) || [];
    if (!Array.isArray(list)) return null;
    var items = [];
    for (var i = 0; i < list.length; i++) {
      var it = normalizeItem(list[i]);
      if (it) items.push(it);
    }
    return items;
  }

  function parseTable(text, delim) {
    var rows = parseDelimited(text, delim);
    if (rows.length < 1) return [];
    var head = rows[0].map(function (x) { return String(x).trim(); });
    var qi = findColumn(head, ['题目', '题干', '问题', '试题', 'question', 'stem', 'title', 'q']);
    var ai = findColumn(head, ['答案', '正确答案', '答', 'answer', 'correct', 'a']);
    var oi = findColumn(head, ['选项', 'options', 'choices', 'choice']);
    var ei = findColumn(head, ['解析', '解释', '说明', 'explanation', 'analysis']);
    var ti = findColumn(head, ['章节', '标签', '分类', 'tag', 'chapter', 'category']);
    var hasHeader = qi >= 0 || ai >= 0;
    if (!hasHeader) { qi = 0; ai = 1; oi = 2; ei = 3; ti = 4; }
    var start = hasHeader ? 1 : 0;
    var items = [];
    for (var r = start; r < rows.length; r++) {
      var row = rows[r];
      var raw = {
        question: row[qi] || '',
        answer: row[ai] || '',
        options: oi >= 0 ? row[oi] : '',
        explanation: ei >= 0 ? row[ei] : '',
        tags: ti >= 0 ? row[ti] : ''
      };
      var it = normalizeItem(raw);
      if (it) items.push(it);
    }
    return items;
  }

  function parseTextBlocks(text) {
    var t = String(text).replace(/\r\n?/g, '\n').trim();
    var blocks = t.split(/\n\s*\n+/);
    if (blocks.length < 2 && /\n\s*\d+[.．、]/.test(t)) {
      blocks = t.split(/\n(?=\s*\d+[.．、])/);
    }
    var items = [];
    for (var i = 0; i < blocks.length; i++) {
      var lines = blocks[i].split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!lines.length) continue;
      // 去掉题号前缀，避免 "1. 下列…" 被误判成选项
      lines[0] = lines[0].replace(/^\s*\d+\s*[.．、]\s*/, '');
      var answer = '', explanation = '', qLines = [], opts = [];
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j];
        var m = line.match(/^(?:正确答案|答案|答|answer|correct)\s*[:：]?\s*(.*)$/i);
        if (m) { answer = m[1].trim(); continue; }
        var e = line.match(/^(?:解析|解释|说明|analysis|explanation)\s*[:：]\s*(.*)$/i);
        if (e) { explanation = e[1].trim(); continue; }
        var o = line.match(/^\s*(?:[A-Za-z]|[①-④]|[1-4])\s*[.．、:：]\s*(.*)$/);
        if (o) { opts.push(line); continue; }
        qLines.push(line);
      }
      var q = qLines.join('\n').replace(/^\s*\d+\s*[.．、]\s*/, '').trim();
      if (!q && opts.length) q = opts.join('\n');
      if (!q) continue;
      items.push({ question: q, answer: answer, options: opts, explanation: explanation, tags: [] });
    }
    return items;
  }

  /**
   * 支持 JSON / CSV / TSV / 竖线分隔 / 纯文本。
   * 返回 { items, format, error }
   */
  function parseBank(text, filename) {
    var t = String(text == null ? '' : text).trim();
    if (!t) return { items: [], format: 'empty', error: '内容为空' };
    var name = String(filename || '').toLowerCase();
    var trimmed = t.charAt(0) === '\ufeff' ? t.slice(1) : t;

    if (trimmed.charAt(0) === '[' || trimmed.charAt(0) === '{') {
      try {
        var items = parseJson(trimmed);
        if (items && items.length) return { items: items, format: 'json', error: null };
      } catch (e) { /* 继续尝试其它格式 */ }
    }

    var firstLines = trimmed.split('\n').slice(0, 5).join('\n');
    var delim = null;
    if (firstLines.indexOf('\t') >= 0) delim = '\t';
    else if (firstLines.indexOf('|') >= 0) delim = '|';
    else if (/,/.test(firstLines) && /(题目|答案|question|answer)/i.test(firstLines)) delim = ',';
    if (!delim && /\.csv$/.test(name)) delim = ',';
    if (!delim && /\.tsv$/.test(name)) delim = '\t';

    if (delim && typeof delim === 'string') {
      var table = parseTable(trimmed, delim);
      if (table.length) return { items: table, format: delim === '\t' ? 'tsv' : 'delimited', error: null };
    }

    var blocks = parseTextBlocks(trimmed);
    if (blocks.length) return { items: blocks, format: 'text', error: null };
    return { items: [], format: 'unknown', error: '未能识别题库格式，请检查内容' };
  }

  function search(bank, query, opt) {
    opt = opt || {};
    var threshold = opt.threshold == null ? 0.32 : opt.threshold;
    var max = opt.maxResults || 5;
    var qn = normalize(query);
    if (!qn) return [];
    var out = [];
    for (var i = 0; i < bank.length; i++) {
      var item = bank[i];
      var score = similarity(qn, item.question || '');
      // 标签/章节命中给少量加分
      if (item.tags && item.tags.length && opt.chapterHint) {
        for (var j = 0; j < item.tags.length; j++) {
          if (normalize(opt.chapterHint).indexOf(normalize(item.tags[j])) >= 0) { score += 0.03; break; }
        }
      }
      if (score >= threshold) out.push({ item: item, score: Math.min(1, score) });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, max);
  }

  global.__QBankCore = {
    normalize: normalize,
    similarity: similarity,
    parseBank: parseBank,
    search: search
  };
})(typeof window !== 'undefined' ? window : globalThis);

C. 按劳分配得到实施","D. 传统的社会伦理秩序被颠覆"],"explanation":"","tags":["改革开放史","BKS006","第1章","单选"]},{"question":"1955年，针对万隆会议上某些国家提出“和平共处”是“共产党用的词”的言论，周恩来说：“有人不喜欢‘共处’这个词，那好，我们可以用《联合国宪章》中的‘和平相处’这个词。”这反映出当时中国外交（）","answer":"D","options":["A. 以联合国为中心","B. 坚持独立自主原则","C. 以广交朋友为宗旨","D. 具有灵活性和务实性"],"explanation":"","tags":["改革开放史","BKS006","第1章","单选"]},{"question":"1954年6月至9月，中国有组织地开展了宪法草案的讨论和宣传。据统计，许多地区的参与者超过当地成年人口的70%，有些地方甚至超过90%，共收到118万多个意见、建议和问题。这一活动（）","answer":"B","options":["A. 反映了过渡时期的根本任务","B. 体现了宪法的社会主义性质","C. 标志着社会主义时代的到来","D. 彰显了社会主义制度的优越性"],"explanation":"","tags":["改革开放史","BKS006","第1章","单选"]},{"question":"第一个五年计划期间，全国同时开展了一万多个工矿建设单位的施工，从而使我国的社会经济结构和国民经济面貌发生了重大变化。对此“变化”表述正确的是（）","answer":"B","options":["A. 初步完成了社会主义工业化","B. 开始改变我国工业落后的面貌","C. 促进了我国国民经济迅速恢复","D. 实现了农轻重各部门协调发展"],"explanation":"","tags":["改革开放史","BKS006","第1章","单选"]},{"question":"中国人民政治协商会议第一届全体会议主要工作之一是确定国名、国体。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","判断"]},{"question":"我国的国名是中华人民共和国。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","判断"]},{"question":"我国的国体资产阶级领导的、以工农联盟为基础的团结各民主阶级和国内各民族的人民民主专政。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","判断"]},{"question":"中国人民政治协商会议第二届全体会议通过《共同纲领》等三大奠基性文件。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","判断"]},{"question":"中国人民政治协商会议第一届全体会议确定国名、国体、国旗和国歌等。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","判断"]},{"question":"中国人民政治协商会议第一届全体会议没有选举产生中央人民政府委员会。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","判断"]},{"question":"“三反”有力地打击了不法资本家。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","判断"]},{"question":"简述中华人民共和国成立的伟大意义。","answer":"（1）是中国历史和20世纪世界历史的重大事件。（2）标志着近代中国被侵略、被奴役的历史已经过去。（3）中国人民从此站起来了，成为新社会、新国家的主人。（4）中华民族从此进入了伟大复兴的历史新纪元。","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","简答"]},{"question":"简述抗美援朝的主要原因和伟大意义。","answer":"（1）主要原因：①朝鲜半岛是美苏对抗之地，苏联和朝鲜都希望中国出兵援朝；②美国干涉中国内政，战争威胁中国安全。（2）伟大意义①保卫了新中国的国家安全，国家的经济建设和社会改革获得了一个相对稳定的和平环境；②中国的国际地位空前提高；③激发了中国人民的民族自豪感和自信心。","options":[],"explanation":"","tags":["改革开放史","BKS006","第1章","简答"]},{"question":"一部电影中有这样一个场景：20世纪50年代后期，一小孩找出父亲的铁皮箱，交给街道干部用来炼铁。当时的人们曾普遍这样做，他们是为（）","answer":"B","options":["A. 向即将召开的中共八大献礼","B. 迅速将中国建成社会主义工业国","C. 支援“抗美援朝”战争","D. 发展中国的国防尖端科技"],"explanation":"","tags":["改革开放史","BKS006","第2章","单选"]},{"question":"1972年，美国总统尼克松曾提到：“多年来我对中华人民共和国的态度是主席和总理全然不能同意的。把我们带到一起来的，是认识到世界上出现了新形势。”对上述材料理解正确的是（）","answer":"B","options":["A. 中美之间根本利益完全一致","B. 国际形势变化影响美国对华态度","C. 中美开始正式结盟以对抗苏联","D. 有利于新中国恢复联合国合法席位"],"explanation":"","tags":["改革开放史","BKS006","第2章","单选"]},{"question":"一部反映社会主义建设中某模范人物的传记有如下目录（部分）：新的征途；“1·5书记”；弥艰赴兰考；灾难中的领路人。该人物应当是（）","answer":"A","options":["A. 焦裕禄","B. 王进喜","C. 邓稼先","D. 雷锋"],"explanation":"","tags":["改革开放史","BKS006","第2章","单选"]},{"question":"20世纪60年代初，大庆工人吃大苦，耐大劳，坚持“三老四严”（即对待革命事业，要当老实人，说老实话，办老实事。对待工作，要有严格的要求、严密的组织、严肃的态度、严明的纪律）从大庆工人身上所反映的主要时代精神是（）","answer":"B","options":["A. 坚持奉献、助人为乐","B. 自力更生、艰苦奋斗","C. 团结友爱、与人为善","D. 精益求精、敢于创新"],"explanation":"","tags":["改革开放史","BKS006","第2章","单选"]},{"question":"“改变生产资料私有制为社会主义公有制这个极其复杂和困难的历史任务。现在在我国已经基本上完成了。我国社会主义和资本主义谁战胜谁的问题，现在已经解决了。”提出这一论断的大会最可能是（）","answer":"D","options":["A. 中共七届二中全会","B. 一届全国人大","C. 中共十一届三中全会","D. 中共八大"],"explanation":"","tags":["改革开放史","BKS006","第2章","单选"]},{"question":"20世纪50年代中期，我国开始探索自己的社会主义建设道路。被称为“我国建设社会主义道路的一次成功探索”的是（）","answer":"B","options":["A. 一届政协","B. 中共八大","C. “大跃进”运动","D. 人民公社化运动"],"explanation":"","tags":["改革开放史","BKS006","第2章","单选"]},{"question":"1958年某领导到江苏视察中稻丰产实验田，他问党委书记：亩产可以打多少﹖回答说：可以打1万斤。领导说：“1万斤，还能再多吗？你们这里条件好，再搞一搞深翻，还能多打些。”产生这一认识的原因是（）","answer":"C","options":["A. 新中国成立后，人民群众精神振奋，斗志昂扬，生产积极性高","B. 当时国家领导人对农业的特别重视，提出“以粮为纲”","C. 人们迫切发展生产力而夸大了主观意志和主观努力的作用","D. 人们对社会主义建设的客观规律有了正确的认识"],"explanation":"","tags":["改革开放史","BKS006","第2章","单选"]},{"question":"小说《平凡的世界》中有一段描述：孙少平“不关心无产阶级政治、光看‘反动书’的行为很快就被人揭发，每天被人监督。”该情节最有可能发生于（）","answer":"C","options":["A. 人民解放战争时期","B. 新中国成立初期","C. “文化大革命”时期","D. 改革开放新时期"],"explanation":"","tags":["改革开放史","BKS006","第2章","单选"]},{"question":"三大改造从1953年开始，到1956年底完成，社会主义基本制度在中国建立起来。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第2章","判断"]},{"question":"中共五大提出我国主要任务是大力发展生产力，变农业国为工业国。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第2章","判断"]},{"question":"中共八大确立“既反保守又反冒进，坚持在综合平衡中稳步前进”的经济建设方针。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第2章","判断"]},{"question":"在英雄模范人物的引领下，中国取得了二十年建设成就。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第2章","判断"]},{"question":"简述中共八大的内容和意义。","answer":"（1）内容：①指出国内的主要矛盾；②提出党和人民的主要任务；③确立经济建设的方针。（2）意义：①开始全面、大规模的社会主义建设；②一次成功的探索。","options":[],"explanation":"","tags":["改革开放史","BKS006","第2章","简答"]},{"question":"简述“建设社会主义”总路线的利弊。","answer":"（1）利反映了人民群众迫切要求改变我国经济落后的愿望。（2）弊忽视了客观规律。","options":[],"explanation":"","tags":["改革开放史","BKS006","第2章","简答"]},{"question":"简述艰难的探索之路，给今天中国的社会主义建设提供哪些经验教训。","answer":"（1）从国情出发制定方针政策；（2）生产关系的变革一定要适合生产力发展水平；（3）要正确处理主观能动性与客观实际的关系；（4）国民经济发展符合经济发展规律，不要急于求成。","options":[],"explanation":"","tags":["改革开放史","BKS006","第2章","简答"]},{"question":"有一首歌的歌词写道：“1979年，那是一个春天，有一位老人在中国的南海边画了一个圈，神话般地崛起座座城，奇迹般地聚起座座金山……”这里“画了一个圈”是指（）","answer":"A","options":["A. 建立深圳等经济特区","B. 建立环渤海经济开放区","C. 开发上海浦东新区","D. 开发河北雄安新区"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"“走向世界丛书”无20世纪80年代开始出版，所收著作记录了近代国人亲历西方的见闻感言，如容阔的《西学东渐记》、康有为的《欧洲十一国游记》等，反响极大。该丛书的出版：①展现了近代国人走出国门、了解世界的历程；②改变了近代中国闭关锁国、盲目自大的局面；③为中国改革开放、融入世界提供了历史借鉴；④开创了中国独立自主、和平外交的新局面（）","answer":"C","options":["A. ①②","B. ②③","C. ①③","D. ②④"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"1979年前，“凤阳地多不打粮，磙子一住就逃荒。只见凤阳女出嫁，不见新娘进风阳。”到1979年，凤阳全县粮食产量比1978年增长49%，卖给国家粮食4450万千克。出现这种变化的原因是（）","answer":"D","options":["A. 农业社会主义改造的完成","B. 人民公社化运动的开展","C. “大跃进”运动的开展","D. 家庭联产承包责任制的实行"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"1978年以后，中国开始进行农村经济体制改革。下列说法正确的是：①实行家庭联产承包责任制；②农民有了生产和分配的自主权；③改变了农村土地的所有权；④极大地调动了农民的生产积极性（）","answer":"C","options":["A. ①②③","B. ②③④","C. ①②④","D. ①③④"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"《中国扶贫开发报告（2016）》显示，我国农村贫困人口从、1978年到2015年，减少了92.8%。中国经济总量在1990-1996年占世界总量的1.83%，2017年占世界比重达到14.84%。中国取得这些巨大成就的因素包括：①农村和城市先后开展改革；②主动融入世界经济体系；③积极推进城镇化建设；④积极支持不结盟运动（）","answer":"A","options":["A. ①②③","B. ②③④","C. ①②④","D. ①③④"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"1978年5月，《光明日报》刊发的《实践是检验真理的唯一标准》引起了广泛关注，开始了真理标准问题的讨论。这场讨论最为深远的意义在于（）","answer":"A","options":["A. 解放了人们的思想","B. 建立了社会主义市场经济","C. 十一届三中全会精神深入人心","D. 激发了农民的劳动热情"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"据统计，1992年，全国辞去公职经商者达12万人，未辞职而以各种方式投身商海者超过1000万人，这种现象被称为“下海潮”。这反映了（）","answer":"A","options":["A. 市场经济改革成为社会共识","B. 多种经济成分开始共同发展","C. 城市经济体制改革全面展开","D. 中国开始利用WTO规则贸易"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"中国起诉美国商务部对中国产品发起的13起反倾销措施。这一事件发生的背景是（）","answer":"D","options":["A. 中国参加了亚非会议","B. 中国加入了亚太经合组织","C. 中国恢复了联合国的合法席位","D. 中国加入了世界贸易组织"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"改革开放的过程也是中国特色社会主义理论体系形成与发展的过程。下列思想出现的先后顺序是：①社会主义市场经济理论；②可持续发展的科学发展观；③“三个代表”重要思想；④新时代中国特色社会主义思想（）","answer":"B","options":["A. ②①③④","B. ①③②④","C. ①④③②","D. ①②③④"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"1992年被人们称为中国30年改革进程标志性的分水岭。“如果说此前中国一直在隧道中探索，1992年应该说人们终于看到了隧道口的光亮。”作出这一判断的主要依据是（）","answer":"C","options":["A. 制定了改革开放的基本国策","B. 肯定了私营经济的合法地位","C. 确立了市场经济的改革目标","D. 形成了立体全面的开放格局"],"explanation":"","tags":["改革开放史","BKS006","第3章","单选"]},{"question":"十一届三中全会将党和国家的工作重心转移到“以阶级斗争为纲”。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第3章","判断"]},{"question":"十一届三中全会确立了以邓小平为核心的党中央领导集体。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第3章","判断"]},{"question":"实践是检验真理的唯一标准。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第3章","判断"]},{"question":"十一届三种全会确定的思想路线是：阶级斗争-经济建设-改革开放。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第3章","判断"]},{"question":"简述农村改革的意义。","answer":"（1）直接影响：有力地促进了农村改革的突破和农业生产的发展；（2）间接影响：带动了城市经济体制改革。","options":[],"explanation":"","tags":["改革开放史","BKS006","第3章","简答"]},{"question":"简述南方谈话的意义。","answer":"在改革开放推进过程的关键节点上，从理论上回答了什么是社会主义，怎样建设社会主义的问题；对一些长期困扰人们的问题，比如说市场经济问题等给予了明确的回答，从而推进了改革开放进入到新的阶段。这是呼应时代需要的产物。","options":[],"explanation":"","tags":["改革开放史","BKS006","第3章","简答"]},{"question":"清代刺绣的五大名绣是京绣、苏绣、湘绣、蜀绣和_____（）","answer":"A","options":["A. 粤绣","B. 闽绣","C. 藏绣","D. 鲁绣"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"虞舜之时，已有刺绣。东周已设官专司其职，宫廷刺绣则出现在_____（）","answer":"B","options":["A. 秦","B. 汉","C. 唐","D. 宋"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"目前传世最早的刺绣，为湖南长沙楚墓中出土的两件绣品，属于_____时期（）","answer":"B","options":["A. 周朝","B. 战国","C. 汉朝","D. 唐"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"明代董其昌《筠清轩秘录》载：“...之绣，针线细密，用绒止一二丝，用针如发细者，为之设色精妙光彩射目。山水分远近之趣，楼阁待深邃之体，人物具瞻眺生动之情，花鸟极绰约谗唼之态。佳者较画更胜，望之三趣悉备，十指春风，盖至此乎”。此段描述，大致说明了_____之特色（）","answer":"C","options":["A. 汉绣","B. 唐绣","C. 宋绣","D. 元绣"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"新婚夫妇用品喜欢用_____图案象征婚姻和谐。期盼家庭美满，多子多福；姑娘送给情郎定情香包、手帕等，以蝴蝶翩翩起舞之形或并蒂莲花图案含蓄地表达隐藏在姑娘心底的秘密﹐针针线线都浸染着爱慕之情（）","answer":"C","options":["A. 鸳鸯戏水","B. 莲生贵子","C. 鲤鱼闹莲","D. 连年有鱼"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"中国古代的布艺主要有绣花﹑挑花、贴花等。挑花又称_____，要求严格的按照面料经纬纹路，挑绣等距离、等长度的十字，排列成各种花纹图案的刺绣形式，有独特的变形吉祥几何纹装饰风格（）","answer":"B","options":["A. 辫绣","B. 十字绣","C. 锁绣","D. 铺针"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"若以釉彩来分类陶瓷器约可分为釉上彩与釉下彩。釉下彩就是在坯体完成干燥后，在表面上上用蓝色的色料（例如氧化钴）画上各式图案。之后再淋上透明釉，进行釉烧。因为蓝色的色料是用在透明釉之下，所以名为“釉下彩”。而色彩在底釉上，则称为釉上彩。青花瓷属于（）","answer":"B","options":["A. 釉上彩","B. 釉下彩","C. 珐琅彩","D. 墨彩"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"三彩陶俑和三彩陶器，是_____时期的艺术记录和生活情趣的风情画（）","answer":"B","options":["A. 汉","B. 唐","C. 宋","D. 明"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"素有“瓷都”之称的是（）","answer":"A","options":["A. 景德镇","B. 醴陵","C. 高安","D. 德化"],"explanation":"","tags":["改革开放史","BKS006","第4章","单选"]},{"question":"青瓷是一种颜色釉瓷器，因其胎轴中含有适量的氧化铁，经还原火焰烧成，釉面呈现出来淡青、翠青、粉青等各种优雅悦目的釉色。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第4章","判断"]},{"question":"南宋官窑是指由北宋政权出资建立，集中北方著名窑工艺匠专门生产宫廷用瓷的瓷窑，窑址至今未能确定。","answer":"错误","options":[],"explanation":"","tags":["改革开放史","BKS006","第4章","判断"]},{"question":"定宏是五大名窑中专烧白瓷、黄轴瓷的历史名窑，窑址在今河北曲阳县，宋代属定州，故称定窑。","answer":"正确","options":[],"explanation":"","tags":["改革开放史","BKS006","第4章","判断"]},{"question":"简述中国丝绸文化在世界历史上有什么影响。","answer":"（1）作为服装面料，中国的丝绸为服装的发展提供了更好的条件，而丝绸同时也代表着中国古代的文明与进步，为世界服装的发展做出了重要的贡献。（2）丝绸贸易的展开，也促进了中国与世界各国经济的发展和文化的交流。","options":[],"explanation":"","tags":["改革开放史","BKS006","第4章","简答"]},{"question":"简述刺绣文化对中国的意义。","answer":"中国刺绣作为中国文化艺术的代表之一，中国刺绣主要有苏绣，湘绣，蜀绣和粤绣，中国传统手工刺绣作为一种历史悠久的手工艺，其中，凝聚着深厚的民族文化底蕴，展现出了独特的中华文化与民族特色，也在历史舞台上广受欢迎和推送，吸引了无数国外友人的目光，刺绣不仅样式精美，而且手艺也非常精湛，是非常好的一门传统手工艺。","options":[],"explanation":"","tags":["改革开放史","BKS006","第4章","简答"]},{"question":"在发刊词中提出“论究学术，闻求真理，昌明国粹，融化新知”的复古主义流派是（）","answer":"B","options":["A. 甲寅派","B. 学衡派","C. 国粹派","D. 礼拜六派"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"提倡复古读经，压迫学生运动的复古派人物是（）","answer":"C","options":["A. 吴宓","B. 梅光迪","C. 章士钊","D. 林纾"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"学衡派的代表人物有（）","answer":"B","options":["A. 吴宓","B. 梅光迪","C. 章士钊","D. 林纾"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"晚清文坛“诗界革命”的代表人物是（）","answer":"B","options":["A. 梁启超","B. 黄遵宪","C. 裘廷梁","D. 谭嗣同"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"旗帜鲜明地提出文学革命的“三大主义”的理论建设文章是（）","answer":"B","options":["A. 《文学改良刍议》","B. 《文学革命论》","C. 《建设的文学革命论》","D. 《人的文学》"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"晚清时期，维新思想家_____倡导“小说界革命”，重视小说的社会地位和社会作用（）","answer":"A","options":["A. 梁启超","B. 谭嗣同","C. 夏曾佑","D. 黄遵宪"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"晚清时期，_____规定了言论、著作、出版等自由（）","answer":"A","options":["A. 《钦定宪法大纲》","B. 《文学改良刍议》","C. 《什么是文学》","D. 《人的文学》"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"下列不属于提出“诗界革命”的是（）","answer":"A","options":["A. 鲁迅","B. 梁启超","C. 夏曾佑","D. 谭嗣同"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"最早提出了用白话文进行文学创作的是（）","answer":"A","options":["A. 黄遵宪","B. 胡适","C. 李大钊","D. 周作人"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"认为“小说为文学之最上乘”的是（）","answer":"A","options":["A. 梁启超","B. 黄遵宪","C. 胡适","D. 谭嗣同"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"下列属于四大谴责小说家的是（）","answer":"D","options":["A. 田汉","B. 茅盾","C. 鲁迅","D. 曾朴"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"下列不属于四大谴责小说的是（）","answer":"D","options":["A. 《老残游记》","B. 《二十年目睹之怪现状》","C. 《孽海花》","D. 《伤逝》"],"explanation":"","tags":["中国现代文学史","P11502","第1章","单选"]},{"question":"谴责小说","answer":"晚清四大谴责小说分别是李伯元的《官场现形记》、吴趼（jiǎn）人的《二十年目睹之怪现状》、刘鹗的《老残游记》以及曾朴的《孽海花》。《官场现形记》以晚清官场为表现对象，集中描写封建社会崩溃时期旧官场的种种腐败、黑暗和丑恶的情形。《二十年目睹之怪现状》以主人公“九死一生”的经历，揭露了晚清社会和封建制度行将灭亡、无可挽救的历史命运。《老残游记》以一位走方郎中老残的游历为主线，对社会矛盾开掘很深，独具慧眼地指出清官的昏庸。《孽海花》揭露了清朝统治的腐朽，同时批判当时封建的科举制度。表达了作者反对封建专制，鼓吹民族民主革命的爱国救亡思想。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第1章","名词解释"]},{"question":"简述梁启超的小说理论。","answer":"梁启超在《译印政治小说序》（1896），《论小说与群治的关系》（1902）、《告小说家》（1915）等文中阐释了他小说革命的主张。认为“小说为文学之最上乘”，提出“欲新一国之民，不可不先新一国之小说”，“小说有不可思议之力支配人道故”等观点，认为小说的不可思议之力具体表现为“熏、浸、刺、提”四个方面，重点表达了他小说新民救国的主张。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第1章","简答"]},{"question":"简述现代通俗小说的兴起。","answer":"中国的现代通俗小说从晚清即开始萌发，并且逐渐开始走向成熟。即使是在遭遇了“五四”这个大冲击后，通俗小说的创作群体依然人才辈出，如“在地狱边缘写尽人间纯情”的毕倚红、民国武侠小说奠基人的向恺然、现代讽刺幽默大师程瞻庐，以及30年代出现的几位通俗大家——张恨水、王度庐、秦瘦鸥，及至40年代的张爱玲、徐訏、无名氏，他们三人的小说超越了雅俗的界限，将通俗小说的层次又大大地提升了。此后，现代通俗小说随着新中国的建立才告一段落。这里，展现在我们面前的是一条清晰的通俗文学的发展线路。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第1章","简答"]},{"question":"简述社会变革对文学的促进。","answer":"（1）文学活动和创办报刊有了法律保障，1908年《钦定宪法大纲》规定了言论、著作、出版等自由；（2）具有大众化、平民化、民主特征的现代出版业逐步兴盛，为现代知识分子提供了理性交往的空间，为文化和文学的普及奠定了传播基础；（3）知识分子传统地位和角色的转换（科举制度的废除，传统知识分子学而优则仕的路子被阻断），社会出现了知识分子为主体的自由撰稿人队伍，出现了职业作家群，如郑振铎、老舍、巴金、鲁迅等；（4）文学平民化、大众化的价值取向，使传统的文学接受主体发生变化，文学成为民众文化参与的工具，培养了多样化的读者群。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第1章","简答"]},{"question":"文学革命前20年中国文学概况。","answer":"成就最高，对后来文学革命造成了直接影响的是政论散文、小说翻译和创作。（1）政论散文：以梁启超成就最高，梁启超把自己的新文体作为新民的觉世之文，以此传播西方的政治思想，鼓吹立宪、新民、强国，是富含感情，汪洋恣肆的魔力文字，如《少年中国说》、《新民说》等；（2）革命派散文：以章太炎（有学问的革命家）成就最高。文章动人心魄，自由尖锐，富于创造，革命派散文具有革命性、斗争性、鼓动性与通俗性的统一。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第1章","论述"]},{"question":"主导倾向是浪漫主义的新文学社团有（）","answer":"D","options":["A. 浅草社","B. 弥洒社","C. 湖畔诗社","D. 南国社"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"中国最早的话剧团体是（）","answer":"A","options":["A. 南国社","B. 春阳社","C. 春柳社","D. 民众戏剧社"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"长篇小说《光明在我们的前面》的作者是（）","answer":"A","options":["A. 胡也频","B. 柔石","C. 洪灵菲","D. 茅盾"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"下列属于苏曼殊小说作品的是（）","answer":"A","options":["A. 《天涯红泪记》","B. 《四世同堂》","C. 《阿Q正传》","D. 《茶馆》"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"下列属于苏曼殊翻译作品的是（）","answer":"B","options":["A. 《日记》","B. 《悲惨世界》","C. 《茶花女》","D. 《高老头》"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"苏曼殊诗歌创作受到影响最大的是（）","answer":"B","options":["A. 现实主义","B. 浪漫主义","C. 现代主义","D. 表现主义"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"下列不属于南社的重要代表作家的是（）","answer":"D","options":["A. 柳亚子","B. 高旭","C. 陈去病","D. 林语堂"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"春柳社的发起人是（）","answer":"A","options":["A. 李叔同","B. 王统照","C. 芦隐","D. 许钦文"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"章太炎驳斥康有为思想观点的著作是（）","answer":"D","options":["A. 《宝剑歌》","B. 《两种文学论战》","C. 《反论战》","D. 《驳康有为论革命书》"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"秋瑾是（）","answer":"A","options":["A. 中国女权和女学思想的倡导者","B. 有神论者","C. 迷狂说者","D. 未来主义者"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"下列属于秋瑾作品的是（）","answer":"D","options":["A. 《女神》","B. 《屈原》","C. 《蔡文姬》","D. 《宝剑歌》"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"秋瑾诗歌作品的主题是（）","answer":"A","options":["A. 宣传男女平等和民族民主思想","B. 反对革命","C. 拥护专制统治","D. 拥护帝国主义"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"李叔同被后人尊称为（）","answer":"A","options":["A. 弘一法师","B. 亚庐","C. 曼殊","D. 太炎先生"],"explanation":"","tags":["中国现代文学史","P11502","第2章","单选"]},{"question":"民族主义","answer":"民族主义是指社会成员对于自己所生活的有共同语言、共同地域、共同经济生活以及表现在共同文化特点上的共同心理素质的共同体的体认，指社会成员对这一共同体的忠诚心理状态。（民族文化认同）","options":[],"explanation":"","tags":["中国现代文学史","P11502","第2章","名词解释"]},{"question":"南社","answer":"南社是一个曾经在中国近现代史上产生过重要影响的资产阶级革命文化团体，1909成立于苏州，其发起人是柳亚子、高旭和陈去病等。南社受孙中山先生领导的同盟会的影响，取“操南音，不忘本也”之意，支持资产阶级民主革命，提倡民族气节，反对满清王朝的腐朽统治，为辛亥革命做了非常重要的舆论准备。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第2章","名词解释"]},{"question":"简述革命派文学的特点。","answer":"（1）揭露清政府的无能；（2）宣扬革命思想；（3）高扬民族意识，唤醒民族爱国精神；（4）注重文学的“国民教育”功能。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第2章","简答"]},{"question":"论述苏曼殊作品的思想内容和艺术成就。","answer":"（1）苏曼殊作品所表现的基本思想，是同资产阶级的民族、民主革命息息相通的，是为反帝反封建服务的。譬如，当1903年全国人民掀起声势浩大的拒俄运动和资产阶级革命派与保皇派展开大论战的时候，苏曼殊写下了这样的诗句：“蹈海鲁连不帝秦，茫茫烟水着浮身。国民孤愤英雄泪，洒上鲛绡赠故人。”“海天龙战血玄黄，披发长歌览大荒。易水萧萧人去也，一天明月白如霜。”作者用战国时鲁仲连力主抗秦和荆轲刺秦王的故事，抒发了忧国忧民的悲愤心情和深沉的爱国主义思想。同时他又发表了杂文《呜呼广东人》，对那些数典忘祖、认贼作父的洋奴买办之流进行了猛烈的批判。同年发表的《惨世界》，则不但批判了清政府统治下的“悲惨世界”和数千年来的封建观念，而且塑造了一个资产阶级革命者的英雄形象，并主张用暴力手段推翻专制统治，建立一个没有剥削和压迫的“公道的新世界”。因而曾经受到了青年鲁迅的称赞。（2）苏曼殊也取得了一定的艺术成就，这是他的作品得以风传的重要原因之一。他的诗风格别致，自成一家。诗作现存约百首，多数为七绝，内容多是感怀之作，这种倾向在辛亥革命后诗作中体现得尤为明显。在艺术上他受李商隐的影响，诗风幽怨凄恻，弥漫着自伤身世的无奈与感叹。（3）抒情则缠绵悱恻，千回百转；状物则形象逼真，历历如见；写人则栩栩如生，呼之欲出。例如：“柳阴深处马蹄骄，无际银沙逐退潮。茅店冰旗知市近，满山红叶女郎樵。”确实不失为诗中有画、情景交融、清新秀丽的好诗。无怪乎连郭沫若也说“苏曼殊的诗很清新”。他的小说则既保留了中国小说情节曲折、故事完整、描写简洁等优点，又吸收了西洋小说注重描写自然环境、人物心理、人物外貌等长处，从而提高了小说的文学性。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第2章","论述"]},{"question":"1917－1920年文学革命时期的文学思潮，下列哪种占主潮地位（）","answer":"A","options":["A. 现实主义","B. 浪漫主义","C. 现代主义","D. 新浪漫主义"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"文学研究会成立于（）","answer":"B","options":["A. 1919年","B. 1921年","C. 1922年","D. 1924年"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"被鲁迅称为“中国的最坚韧，最诚实，挣扎得最久的团体”是（）","answer":"C","options":["A. 语丝社","B. 浅草社","C. 沉钟社","D. 新月社"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"1928年后，下列哪一社团在文学上提出“健康”和“尊严”的原则（）","answer":"D","options":["A. 语丝社","B. 创造社","C. 文学研究会","D. 新月社"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"“真正专心致志做情诗”的新文学社团是（）","answer":"A","options":["A. 湖畔诗社","B. 创造社","C. 浅草社","D. 新月社"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"1921年1月成立的第一个新文学社团是（）","answer":"D","options":["A. 创造社","B. 语丝社","C. 新月社","D. 文学研究会"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"《青年杂志》（后改为《新青年》）创刊于（）","answer":"A","options":["A. 1915年","B. 1917年","C. 1919年","D. 1921年"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"下列哪位作家是创造社的重要成员（）","answer":"C","options":["A. 朱自清","B. 冰心","C. 郁达夫","D. 王统照"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"“五四”新文化运动的主要阵地是（）","answer":"D","options":["A. 《语丝》","B. 《小说月报》","C. 《创造》季刊","D. 《新青年》"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"最早在《新青年》上发表白话诗的一批诗人是（）","answer":"B","options":["A. 胡适、鲁迅、郭沫若、钱玄同","B. 胡适、沈尹默、刘半农、周作人","C. 胡适、沈尹默、周作人、郭沫若","D. 周作人、钱玄同、郭沫若、胡适"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"倡导文学革命的第一篇理论文章是（）","answer":"B","options":["A. 《文学革命论》","B. 《文学改良刍议》","C. 《建设的文学革命论》","D. 《历史的文学观念论》"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"创造社在文艺思想上倾向于（）","answer":"C","options":["A. 自然主义","B. 现实主义","C. 浪漫主义","D. 现代主义"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"莽原社和未名社成立于1925年，（）","answer":"A","options":["A. 都是鲁迅发起和领导的","B. 未名社不是鲁迅发起的","C. 莽原社不是鲁迅发起的","D. 都是高长虹发起和领导的"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"“五四”以来最早的小说流派是（）","answer":"A","options":["A. 问题小说","B. 乡土文学","C. 自传性小说","D. 反封建小说"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"最能体现五四时期狂飙突进的时代精神的诗篇或诗集是（）","answer":"A","options":["A. 胡适的《尝试集》","B. 周作人的《小河》","C. 郭沫若的《女神》","D. 朱自清的《毁灭》"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"“五四\"文学革命开始于（）","answer":"C","options":["A. 1915年","B. 1916年","C. 1917年","D. 1919年"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"下列属于创造社的一组作家是（）","answer":"B","options":["A. 郁达夫田汉废名","B. 郭沫若郁达夫张资平","C. 郁达夫庐隐许地山","D. 郭沫若郁达夫许地山"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"提出文学改良“须从八事入手”的理论建设文字是（）","answer":"A","options":["A. 《文学改良刍议》","B. 《文学革命论》","C. 《建设的文学革命论》","D. 《人的文学》"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"“五四”文学革命初期，撰文反对新文化运动与文学革命的封建复古主义思潮代表人物是（）","answer":"A","options":["A. 林纾","B. 梁启超","C. 章士钊","D. 严复"],"explanation":"","tags":["中国现代文学史","P11502","第3章","单选"]},{"question":"文学研究会","answer":"1921年1月在北京成立，发起人有周作人、郑振铎、沈雁冰、叶绍均等12人；以上海商务印书馆出版的《小说月报》为代用会刊，以“研究介绍世界文学，整理中国旧文学，创造新文学”为宗旨；受俄国和欧洲现实主义文学思潮的影响，倡导“写实主义”文学精神。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第3章","名词解释"]},{"question":"五四文学革命的历史评价","answer":"（1）五四新文化运动是中国历史上一次空前的思想解放运动，而文学革命作为其中的组成部分，以激进的态度否定了以封建思想为主导的传统文化体系；宣扬了个性解放、人性自觉、自由平等等新思想、新观念；为新文化运动深入展开发挥了巨大作用；（2）在中国文化现代转型的过程中，五四新文化运动为白话最终成为中国现代民族语言奠定了基础；（3）打破中国文学孤立封闭的格局，建立了与世界文学的密切关系；（4）建构起现代启蒙精神和人文主义文学传统；（5）建立起中国现代的精英文学；（6）实践了中国文学与世界文学的对话、交流。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第3章","论述"]},{"question":"鲁迅小说的代表作是（）","answer":"A","options":["A. 《阿Q正传》","B. 《风波》","C. 《狂人日记》","D. 《祝福》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"下列小说具有明显“自叙传”特点的是（）","answer":"D","options":["A. 《潘先生在难中》","B. 《断魂枪》","C. 《伤逝》","D. 《春风沉醉的晚上》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅《阿Q正传》共有几个章节（）","answer":"D","options":["A. 6个","B. 7个","C. 8个","D. 9个"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅唯一的表现爱情题材的小说是（）","answer":"C","options":["A. 《离婚》","B. 《祝福》","C. 《伤逝》","D. 《风波》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"《狂人日记》最初发表于（）","answer":"B","options":["A. 1917年","B. 1918年","C. 1919年","D. 1921年"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"阿Q认为，他一生“行状”上的惟一的一个污点在于（）","answer":"C","options":["A. 被革命党剪了辫子","B. 死前没能唱戏文","C. 画圈画不圆","D. 被抓进又抓出"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅的散文诗集《野草》的主要思想内容是（）","answer":"C","options":["A. 针砭黑暗现实","B. 批判封建文明","C. 抒写内心矛盾","D. 歌颂光明理想"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"《祝福》收入鲁迅哪一部作品集（）","answer":"B","options":["A. 《呐喊》","B. 《彷徨》","C. 《野草》","D. 《故事新编》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"《狂人日记》塑造的狂人形象，就其象征意义来说，是（）","answer":"B","options":["A. 一个吃人者的形象","B. 一个清醒的启蒙主义者的形象","C. 一个精神异常者的形象","D. 一个卫道士的形象"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅在留学日本期间弃医从文的最主要原因是（）","answer":"C","options":["A. 纯属个人爱好","B. 探索新文学发展道路","C. 想以文艺唤醒国民麻木的灵魂","D. 受日本文学家的引导"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"阿Q性格中最突出的特点是（）","answer":"D","options":["A. 纯朴","B. 勤劳","C. 敢于反抗","D. 精神胜利法"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅“杂取种种人，合成一个”的方法即是（）","answer":"B","options":["A. 个性化手法","B. 典型化手法","C. “画眼睛”的手法","D. “眉毛胡子一把抓”的手法"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"《伤逝》中“局长的儿子的赌友”是（）","answer":"B","options":["A. “穿布底鞋的长班的儿子”","B. “穿新皮鞋的邻院的擦雪花膏的小东西”","C. “鲇鱼须的老东西”","D. “我伯父的幼年的同窗”"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅知识分子题材的主要作品有_____等（）","answer":"C","options":["A. 《阿Q正传》","B. 《风波》","C. 《狂人日记》","D. 《明天》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅小说中，“亲手造了独头茧，将自己裹在里面”的人物是（）","answer":"C","options":["A. 夏瑜","B. 吕纬甫","C. 魏连殳","D. 涓生"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅收入《野草》一集中，为纪念“三·一八”惨案而作的文章是（）","answer":"A","options":["A. 《淡淡的血痕中》","B. 《纪念刘和珍君》","C. 《为了忘却的纪念》","D. 《铸剑》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"鲁迅的第一篇小说是发表在1918年5月的_____上的（）","answer":"B","options":["A. 小说月报","B. 新青年","C. 新潮","D. 每周评论"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"何彬是冰心哪一篇小说中的人物（）","answer":"D","options":["A. 《两个家庭》","B. 《斯人独憔悴》","C. 《去国》","D. 《超人》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"“袋里无钱，心头多恨”、“于世无补”、自卑颓唐的“零余者”形象较多出现在（）","answer":"D","options":["A. 庐隐笔下","B. 张爱玲笔下","C. 艾芜笔下","D. 郁达夫笔下"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"小说《缀网劳蛛》的作者是（）","answer":"B","options":["A. 叶绍钧","B. 许地山","C. 王统照","D. 冰心"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"二十年代中期与冰心齐名的“闺秀派”女作家是（）","answer":"A","options":["A. 庐隐","B. 淦女士","C. 苏雪林","D. 欧阳予倩"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"朱自清发表于“五四”之后的抒情长诗是（）","answer":"B","options":["A. 《踪迹》","B. 《毁灭》","C. 《火把》","D. 《北游》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"许地山的《空山灵雨》是（）","answer":"B","options":["A. 小说集","B. 散文集","C. 童话集","D. 诗集"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"下列不属于许地山作品的是（）","answer":"D","options":["A. 《缀网劳蛛》","B. 《春桃》","C. 《空山灵雨》","D. 《海滨故人》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"叶圣陶被称为（）","answer":"A","options":["A. 优秀的语言艺术家","B. 小说之父","C. 短篇小说巨匠","D. 散文鼻祖"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"下列不属于朱自清作品的是（）","answer":"C","options":["A. 《匆匆》","B. 《毁灭》","C. 《欧游杂记》","D. 《寄小读者》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"冰心于1931年发表的标志她小说创作新阶段的作品是（）","answer":"D","options":["A. 《超人》","B. 《悟》","C. 《斯人独憔悴》","D. 《分》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"“五四”时期创作内容主要是对母爱、童心与大自然讴歌的作家是（）","answer":"D","options":["A. 徐志摩","B. 宗白华","C. 王统照","D. 冰心"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"许地山写的小说是（）","answer":"A","options":["A. 《春桃》","B. 《山雨》","C. 《斯人独憔悴》","D. 《潘先生在难中》"],"explanation":"","tags":["中国现代文学史","P11502","第4章","单选"]},{"question":"精神胜利法","answer":"阿Q以自欺欺人和自我安慰的方式来寻求精神的慰藉，他在现实中是被打败的对象，但是他在精神上是胜利的，体现为妄自尊大和自轻自贱、敏感忌讳和麻木健忘、质朴愚昧和圆滑无赖、率真任性和正统卫道、争强好胜和忍辱屈从、善于变通和自我解脱等特点。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","名词解释"]},{"question":"教育小说","answer":"叶圣陶以教育界、以学校生活为题材创作的小说叫“教育小说”，主要思想内容有：暴露旧中国教育界黑暗的内幕，并透过教育界而把批判的矛头指向整个旧社会。如《一篇宣言》暴露反动当局对教育的迫害。严峻的解剖与审视知识阶层。名篇如《潘先生在难中》里的潘先生，写出了知识分子灰色卑琐的人生和自私软弱的性格。展现教育知识分子身上出现的革命反抗的一面。如《抗争》中的郭先生、《城中》的丁雨生。在中国现代作家中，像叶圣陶这样多方面地、深刻地、成功地描写教育界的种种现象和心态者，并无第二人可与匹敌。叶圣陶是新文学史上最早和最有成就的“教育小说家”。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","名词解释"]},{"question":"“冰心体”","answer":"冰心同时从事小说、散文（包括儿童文学）、小诗几种体裁的创作。歌颂母爱、童真、自然，宣扬“爱的哲学”，是其共同的主题。这种泛爱思想同冰心对冷酷、黑暗的现实的失望和反感形成对立面，有积极的社会价值。但因只限于提出问题无法找到答案而有明显的局限。冰心的创作，主观倾向、理想色彩、抒情气氛很浓，呈现出浪漫主义色彩，富于哲理，清新、含蓄，形成其独特的艺术风格，被称为“冰心体”。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","名词解释"]},{"question":"简述《呐喊》、《彷徨》对封建社会、封建思想礼教的深刻批判。","answer":"小说集《呐喊》和《彷徨》的总主题是反封建，对封建社会、封建思想礼教的揭露批判极其深刻。多数作品描写了封建势力对人民压迫及制造的一系列人生悲剧，主人公主要是农民、知识分子和妇女。阿Q、孔乙己、祥林嫂，他们以自己被侮辱、被损害的血泪人生，控诉封建社会的黑暗。如孔乙己身受封建科举制度和等级观念毒害，沦落到下层穷愁潦倒，表现了封建社会人与人之间关系的惊人冷漠。揭示了封建思想道德的“吃人”本质及其对人民群众毒害的深广。如《药》的悲剧是双重封建统治者用钢刀杀害革命者，封建迷信思想使华老栓把人血馒头当药为华小栓，但却治不老病。悲剧在于，华小栓吃的人血馒头，竟是反青革命志士的鲜血做成的。革命者为人民革命而献身，作为人民一员的华老栓并不理解。表现粗群众的愚昧麻木，受封建迷信思想毒害之深。小说既暴露了封建势力造成的人民物质上的“病苦”，更着重暴露了人们精神上的“病苦”，以惊醒“不幸的人们”起来摆脱封建思想道德的枷锁。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","简答"]},{"question":"简述叶圣陶现实主义小说的艺术风格。","answer":"（1）冷静观察和客观描写。“意”常见于言外，“情”不外露文中，如《多收了三五斗》作者对农民的同情深深地潜伏在不露声色的笔致后面。同情与讽刺兼备，是作者对小市民知识分子用笔的基本特色。对于潘先生等主人公，作者看不惯他们的怯弱、自私自利，不由得要刺他们一下；但他也深知他们的甘苦，造成他们这些不良表现的原因是复杂的，有时他们自己也不能掌握自己的命运。这样既有讽刺，又有同情，于是讽刺也显得温婉。（2）结构多变，讲究结尾饶有余味。如《倪焕之》以一个人的遭遇为纵线；《多收了三五斗》无一中心人物，颇有散文风。《多收了三五斗》《潘先生在难中》等不少小说结尾的艺术匠心，尤见功力。（3）语言平实、纯正。叶圣陶的文学语言没有“五四”作家常有的欧化气味，为中国现代汉语的规范、健康做出了不可磨灭的贡献。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","简答"]},{"question":"简述许地山散文集《空山灵雨》的思想和艺术特色。","answer":"（1）对人生哲理的玄想，是《空山灵雨》的基本内容。“生本不乐”的佛教多苦乐观，他悠怨地对“死”的礼赞，流露出许地山思想的迷惘和矛盾。（2）平民主义的礼赞，如《落花生》它以质朴无华的语言，写质朴无华的落花生是“有用的，不是伟大好看的东西”，自然地引发出为人的道理：“人要做有用的人，不要做伟大、体面的人”。（3）夫妇情感的抒写，写闺房之趣相思之苦，透露出性爱有信仰、人性与佛性的冲突，以及二者由共处到对抗的经路，而以人本主义对禁欲主义的胜利表明了作者终于弃佛入世的心路历程。（4）艺术：“空”与“灵”的韵味境界，上《空山灵雨》在艺术上的独特造诣。不少作品都带着若隐若现、朦胧、洒脱的语言蕴含着破费咀嚼的玄理思辨。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","简答"]},{"question":"简述冰心“问题小说”的发展。","answer":"（1）“问题小说”起步，表现了探究人生意义的热忱。代表作《两个家庭》《斯人独憔悴》揭露了“旧社会、旧家庭的不良现状”。（2）宣扬爱的哲学。如果说初期“问题小说”只是问病源，不开药方。《超人》则标志着冰心对种种社会问题开出了她的“药方”——这就是“爱”的哲学。《超人》《烦闷》《悟》构成了冰心“爱的三步曲”，爱的核心是“母爱”。（3）冰心的思想中萌发的某种阶级观念。《分》将教授与屠夫的孩子从同一个产院的婴室“分”道扬镳的不同前途加以比照，透露了作者思想中开始萌发的某种阶级观念。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","简答"]},{"question":"论述《呐喊》、《彷徨》的艺术特色。","answer":"（1）艺术特色一：①“杂取种种人，合成一个”的典型化方法，人物形象具有深广的社会历史内涵，同时又非常个性化。②白描手法，采取“画眼睛”和“勾灵魂”的方法。抓住最能表现人物性格特点的各种特征进行描写，如祥林嫂和子君的神态和眼睛、祥林嫂的三次肖像描写、孔乙己的长衫，挖掘和表现人物复杂的内心世界，写幻觉、潜意识等，深入揭示人物的灵魂，人物语言简洁传神，高度个性化。（2）艺术特色二：艺术多姿多彩。将浓烈的感情寓于客观的叙事之中为主要特色，但也常有诗意的抒情和以抒情手法为主的作品。主要是以人物的语言和动作来刻画性格，但也不乏对人物心理、幻想等的描写和以心理刻画见长。基本上是悲剧的结局，但在悲剧中常融进幽默夸张的悲剧因素，形成悲喜剧交融的特色，并有以讽刺手法为主的喜剧作品。创作手法以现实主义为主，但也有浪漫主义、象征主义成分。（3）艺术特色三：注意典型环境的勾勒和环境、气氛的渲染，浓郁的浙东地方风光和民俗民情，使小说成为中国现代最早的乡土文学。（4）艺术特色四：结构形式丰富多样。小说多截取生活的横断面，以一个或几个生活场景、片段连缀而成；或第三人称，或第一人称；顺序为主，也有倒叙；多为单线发展，也有两条线索的交叉叠合；体式有日记体、随笔体、章回体、速写等多种；（5）艺术特色五：以口语为基础，吸取有生命的古代语言，具有简洁、生动的特点。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","论述"]},{"question":"论述王统照小说创作的风格。","answer":"（1）纵观王统照从20年代前到40年代的创作历程，可以看到，他的艺术风格有着比较明显的数度转变，而对于象征的艺术手法，他始终都未释怀。以《沉思》为代表的早期小说，以女人体模特儿象征艺术之美。作者的暗示和象征往往失之虚玄。《沉船》的象征意味比起《沉思》多了点凝重。（2）现实主义的力作《山雨》标志着王统照从早期的象征趋向写实的重大转变。《山雨》展现的广阔生活画面正是当时中国现实“山雨欲来风满楼”的象征。写实与象征较为融洽的结合。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","论述"]},{"question":"论述朱自清散文的创作特色。","answer":"（1）将自己真挚深厚的感情注入作品，以家庭生活为素材的作品中，多表现父子之情、夫妇之情、儿女之情等。如《背影》中父亲的深情，《给亡妇》中悼妻与自忏之情，《荷塘月色》以景物之“静”反衬心情之不静。（2）情景交融的意境刻画。文中有画，画中有诗。清华园的一个平常的荷塘，一到作者的笔下，简直无美不备：淡淡的月色，田田的荷叶，组成了一幅意境幽美的工笔画。（3）缜密精巧的构思。朱自清的散文大多篇幅不长，构思更见匠心。如《背影》里的四次背影四次眼泪，《荷塘月色》意在写心中“颇不宁静”，一路写来，却处处见“静”。（4）清幽细密的语言艺术。如《背影》的质朴，《浆声灯影里的秦淮河》的文字极富色彩感，呈现出视觉感官上的绘画美，《荷塘月色》里的26个叠词，颇有听觉的美感。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","论述"]},{"question":"论述庐隐小说题材和思想特点。","answer":"（1）对女性婚恋题材的偏好。她触及了男女情爱中的各个侧面。作者本人坎坷而丰富的感情生活，使她对“爱情”、“婚姻”获得了相当深入透彻的理解。虽然她对人生问题的答案不同于冰心的“爱”，而反复地渲染异性的不可靠、爱情不是医治人生的灵丹。庐隐的这些作品确实能给青年人更多人生的真谛与警悟，在感伤哀怨的基调中投射出力量。（2）庐隐小说的基调，深受中国古典言情小说和“婉约派”诗词的影响，低沉郁闷。作者对女性心理大胆、真率、细腻的剖白，与社会心理、道德标准紧紧相连，从而突破了单纯的男女之爱的描写。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第4章","论述"]},{"question":"田汉1923年创办了（）","answer":"C","options":["A. 民众戏剧社","B. 上海戏剧协社","C. 南国社","D. 春柳社"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"《女神》中的多数诗篇写于（）","answer":"B","options":["A. “五四”前夕","B. “五四”高潮时期","C. “五四”退潮时期","D. 大革命时期"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"“五四\"时期，以强烈的反抗、叛逆与创造精神为鲜明特色的诗集是（）","answer":"A","options":["A. 郭沫若的《女神》","B. 朱自清的《踪迹》","C. 闻一多的《红烛》","D. 徐志摩的《志摩的诗》"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"下列哪部作品是朱自清的长诗（）","answer":"B","options":["A. 《踪迹》","B. 《毁灭》","C. 《你我》","D. 《背影》"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"郭沫若历史剧的艺术特色是（）","answer":"D","options":["A. 忠于历史事实的客观描绘","B. 戏说历史的主观编造","C. 赋予历史以象征色彩","D. 浪漫主义和诗情"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"郁达夫30年代的小说《迟桂花》主要表现了（）","answer":"C","options":["A. 反帝反封建的思想","B. 性苦闷的情绪","C. 隐逸的思想","D. 追求革命的思想"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"以下郁达夫创作的小说中，流露较多隐逸思想的作品是（）","answer":"D","options":["A. 《沉沦》","B. 《薄奠》","C. 《采石矶》","D. 《迟桂花》"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"郭沫若的历史剧《屈原》、《南冠草》宣扬的基本思想是（）","answer":"D","options":["A. 忠君报国","B. 士为知己者死","C. 英雄主义","D. 舍身报国的爱国精神"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"郁达夫表现“五四”青年性苦闷的小说是（）","answer":"B","options":["A. 《薄奠》","B. 《沉沦》","C. 《春风沉醉的晚上》","D. 《迟桂花》"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"郭沫若的诗集《女神》出版于（）","answer":"C","options":["A. 1919年","B. 1920年","C. 1921年","D. 1922年"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"代表郭沫若历史剧最高成就的剧作是（）","answer":"C","options":["A. 《高渐离》","B. 《南冠草》","C. 《屈原》","D. 《孔雀胆》"],"explanation":"","tags":["中国现代文学史","P11502","第5章","单选"]},{"question":"简述《女神》的浪漫主义特色。","answer":"（1）郭沫若的《女神》是一部浪漫主义诗集，主要特色有：浪漫主义精神。浪漫主义重主观，强调自我表现。《女神》是“自我表现”的诗作，诗中的凤凰等，都是诗人的“自我表现”。诗中的“自我”主观精神，是强烈的反抗、叛逆精神，是追求光明的理想主义精神。喷发式宣泄的表达方式。浪漫主义以直抒胸臆为主要表达方式，诗中的直抒胸臆表现为喷发式的宣泄，《凤凰涅槃》等诗最典型地体现这一表达特点。奇特的想象和夸张。如从民间天狗吞月，想象为天狗把全宇宙都吞了，“如大海一样地狂叫”等。这种极度夸张的奇特想象最能表现强烈的个性解放要求和对旧世界的反抗、叛逆精神。（2）形象描绘的方式上，具有英雄主义的格调。语言方面，带有强烈的主观性的色彩。一些描写自然的语句中，染上诗人当时的主观感觉。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第5章","简答"]},{"question":"简述《沉沦》的思想内容。","answer":"《沉沦》的主人公“我”是一个留日学生，因对爱情的渴望得不到满足，又兼不堪忍受异族的欺凌，最后投海自尽。小说大胆描写了这个受“五四”思潮的洗礼而觉醒的现代知识青年“性的要求与灵肉的冲突”，以及由此而生的变态性心理。追求个性解放的反封建意义。作品最后通过主人公之口喊出的“祖国呀祖国！……你快富起来！强起来罢！”表达了郁达夫鲜明的反帝爱国思想，具有积极的思想意义。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第5章","简答"]},{"question":"论述郁达夫小说的艺术风格。","answer":"（1）自我的写真。“自叙传”的色彩。相当多的作品中，可以看到作者的个人出身、经历、个性等。第一人称主观叙事的角度，这个具有连贯性的主人公，是一个以“自我”为原型、浸透着作者本人强烈主观色彩的文学形象。构成了时代的“零余者”的心史、情绪史。（2）感伤的抒情。郁达夫的小说通常都没有完整的情节，注重抒发主人公抑郁寡欢的情怀，坦诚率真地暴露和宣泄人物感伤的、悲观的甚至厌世颓废的心境。他特别对忧伤的情绪感兴趣。以感伤的抒情为中心的郁达夫小说，轻视情节的营构，而注重情绪的倾诉。（3）结构的散文化。郁达夫小说以抒情为中心，必然造就郁氏抒情小说的散文化倾向。如《沉沦》几乎都没有以完整的情节为中心的结构框架，也不讲究谋篇布局。以人物情绪为中心，依人物感情的波澜起伏结撰成篇。创造了现代小说中一种崭新的体式——自我写真的抒情小说。（4）流丽、清新的文笔。郁达夫的用笔与其主观色彩、抒情倾向相契合，饱孕感情，富有色彩与节奏。很少使用静观的笔触叙事、抒情、写景。郁达夫小说的文学语言是与他独特的文体风格高度一致的。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第5章","论述"]},{"question":"分析《屈原》中爱国诗人屈原形象。","answer":"郭沫若的历史剧《屈原》塑造了战国时代楚国的政治家爱国诗人屈原的光辉形象。他的性格特征是热爱祖国人民、坚贞不屈、勇于和种种危害国家的邪恶势力作斗争及诗人的气质。屈原的政治主张是面对强秦的侵略，联齐以抗秦。为此，遭到了南后的迫害，南后以“淫乱宫廷”的罪名使他罢官。在险恶的政治环境中，屈原不是为个人荣辱，而是为国家的前途忧虑。他愤怒痛斥张仪。屈原的斗争使南后老羞成怒，进行更的迫害，把屈原关在庙中，并阴谋毒死他。屈原忧国忧民的强烈情感，想火山岩浆。写出了震撼人心的“雷电颂”，“雷电颂”是对黑暗势力的愤怒诅咒，是对毁灭黑暗势力的光明与力的歌颂。表现了屈原崇高的内心世界：痛恨黑暗、追求光明，不屈的斗争精神和诗人的气质。结尾屈原随卫士到汉北人民中间去，寄托了作者的美好愿望。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第5章","论述"]},{"question":"小说集《地之子》的作者是（）","answer":"C","options":["A. 冯文炳","B. 许钦文","C. 台静农","D. 王鲁彦"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"提出“象征即兴”说的是（）","answer":"C","options":["A. 朱自清","B. 李金发","C. 周作人","D. 王独清"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"30年代提倡战斗的小品文的是（）","answer":"C","options":["A. 《论语》","B. 《人间世》","C. 《太白》","D. 《宇宙风》"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"在乡土文学之外，最早开辟现代田园小说别一支派，并对后起的沈从文有直接影响的作家是（）","answer":"C","options":["A. 台静农","B. 彭家煌","C. 废名","D. 许杰"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"周作人在“五四”文学革命中的主要贡献是（）","answer":"A","options":["A. 发表《人的文学》等论文","B. 主编和改革《小说月报》","C. 发起和组织莽原社等新文学社团","D. 主编《新青年》等刊物"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"台静农在五四时期参加的文学社团是（）","answer":"C","options":["A. 文学研究会","B. 语丝社","C. 未名社","D. 莽原社"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"周作人对现代文学最可贵的贡献在于他对_____的倡导与创作（）","answer":"B","options":["A. 小说","B. 美文","C. 现实主义","D. 浪漫主义"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"革新后的《小说月报》是下列哪一文学社的机关刊物（）","answer":"A","options":["A. 文学研究会","B. 创造社","C. 语丝社","D. 新月社"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"鲁迅的《文化偏至论》收于其杂文集（）","answer":"C","options":["A. 《热风》","B. 《南腔北调集》","C. 《坟》","D. 《华盖集》"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"周作人对现代文学最可贵的贡献在于（）","answer":"A","options":["A. 他对“美文”的倡导与创作","B. 他是“文学研究会”的发起人","C. 他对“人的文学”的倡导","D. 他对“平民文学”的倡导"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"下列均属于文学研究会作家的是（）","answer":"B","options":["A. 台静农、废名、许地山、闻一多","B. 周作人、沈雁冰、郑振铎、冰心","C. 郭沫若、叶绍钧、沈雁冰、郑振铎","D. 周作人、郁达夫、蒋光慈、徐志摩"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"冯文炳的《竹林的故事》主要表现了（）","answer":"C","options":["A. 村民的愚昧与无知","B. 农村劳动者的贫穷与痛苦","C. 乡村劳动妇女的本色美","D. 美丽的自然山水风光"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"周作人在《人的文学》一文中所提倡的“人的文学\"，原话是（）","answer":"D","options":["A. 以人的生活为材料的文字","B. 视人的一切生活本能都是美的善的文字","C. 合乎礼教道德的生活的文字","D. 以人道主义为本，对于人生诸问题，加以记录研究的文字"],"explanation":"","tags":["中国现代文学史","P11502","第6章","单选"]},{"question":"乡土文学","answer":"乡土文学，源于鲁迅的《故乡》，20世纪20年代，现代文坛上出现了一批比较接近农村的年轻作家，他们的创作较多受到鲁迅影响，以农村生活为题材，以农民疾苦为主要内容，形成所谓“乡土文学”。乡土文学是在“为人生”文学主张的影响和发展下出现的。代表作家有彭家煌、王鲁彦、许杰、许钦文、王任叔、萧红、台静农，莫言、屈远志等。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第6章","名词解释"]},{"question":"简述周作人散文的风格。","answer":"周作人的散文的文字是简练的，没有废话，字字句句恰到好处，并且充满了俊逸的情趣，并且在其散文作品中“达到忘情忘我的境地”。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第6章","简答"]},{"question":"简述废名小说的艺术特色。","answer":"平和冲淡的生死之思，宁静致远的世外桃源，简约典雅的世情禅心。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第6章","简答"]},{"question":"论述台静农的艺术风格。","answer":"在艺术上，台静农的小说“师法鲁迅”前面已有论述，其格调沉郁阴冷，手法质朴圆熟，出色地写出了当时农村社会的环境气氛。因此，杨义先生认为：“如果说三十年代一批优秀杂文家发扬了杂文上的‘鲁迅风’，那么台静农则在二十年代继承了小说上的‘鲁迅风’，他主要不是继承鲁迅小说格调中那种果戈理式‘含泪的笑’，而是继承了安特莱夫式的阴冷”。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第6章","论述"]},{"question":"论述王鲁彦乡土小说的艺术特点","answer":"生活中的王鲁彦可谓铁骨铮铮，而在文学世界里对人性的体察则细致入微，心理开掘广袤而深邃。早期创作所表现的伤感与愤激、迷惘与执著，在五四新文化运动落潮之后具有典型意义。如果想要了解那个时期的知识分子心态，他的早期作品也像郁达夫、王统照、庐隐、石评梅、丁玲的小说，戴望舒、徐志摩、闻一多、冯至的诗歌与鲁迅的《孤独者》、《在酒楼上》、《野草》一样，具有精神史的价值。他的恋爱题材小说，表面上看起来似乎是对幼稚爱情的戏拟，实际上真实地表现出青少年在恋爱不同阶段的心理真实。他在《菊英的出嫁》里对菊英娘的心理刻画尤其入木三分。透过冥婚风俗的表层，可以看到这位母亲对冥婚的热衷，其实不只因为她对夭折的女儿的刻骨铭心的思念，还有她作为丈夫常年在外的商人妇对性爱生活的渴求。个体心理与性别心理之外，社会心理的剖析更为犀利深邃。《柚子》勾勒出专制暴政所必然产生的冷酷心理与冷嘲现象，《许是不至于罢》表现出在一个中产阶级匮乏的社会里带有普遍性的仇富心理与小有产者的惶恐不安，《黄金》通过主人公经济生活的一次小波澜揭示出社会等级意识的无所不在及其戕害人心的严重性。《自立》还通过堂兄弟之间的一场官司触及了嫉妒这种人类的普遍心理，告诫世人：原始欲望一旦失控，亲情就会被烧得灰飞烟灭。当年，王鲁彦在听鲁迅讲授《中国小说史》时，仿佛听到了全人类的灵魂的历史，感受到揭去虚饰的巨大震撼力。也许与鲁迅的影响有关，王鲁彦始终如一地关注心灵问题，翻译时注意选择心理内涵丰富的作品，创作中也十分注重心理世界的开掘，这是王鲁彦小说区别于其他乡土文学作家的重要特征。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第6章","论述"]},{"question":"胡适在下列哪部作品中提出“国语的文学，文学的国语”的宗旨（）","answer":"C","options":["A. 《易卜生主义》","B. 《文学改良刍议》","C. 《建设的文学革命论》","D. 《历史的文学观念论》"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"提出“三美”理论主张的是（）","answer":"A","options":["A. 闻一多","B. 徐志摩","C. 梁实秋","D. 朱湘"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"贯穿闻一多《红烛》、《死水》两部诗集的思想线索是（）","answer":"B","options":["A. 唯美主义","B. 爱国主义","C. 人道主义","D. 个性解放"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"下列文章出自胡适之手的有（）","answer":"B","options":["A. 《文学革命论》","B. 《谈新诗》","C. 《文学改良刍议》","D. 《我之文学改良观》"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"下列哪些人物是现代评论派成员（）","answer":"A","options":["A. 胡适","B. 徐志摩","C. 陈西滢","D. 王独清"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"提出“国语的文学，文学的国语”的文学革命倡导者是（）","answer":"A","options":["A. 胡适","B. 鲁迅","C. 陈独秀","D. 李大钊"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"胡适的《文学改良刍议》于哪一年发表于《新青年》杂志（）","answer":"A","options":["A. 1917年","B. 1918年","C. 1921年","D. 1923年"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"诗歌《再别康桥》的作者是（）","answer":"C","options":["A. 闻一多","B. 艾青","C. 徐志摩","D. 戴望舒"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"1926年，徐志摩、闻一多编《晨报副刊·诗镌》所提倡的诗体是（）","answer":"C","options":["A. 散文诗","B. 民歌体诗","C. 格律诗","D. 自由体诗"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"徐志摩的诗歌创作以1927年为界分为前后两期，属于前期的两本诗集是（）","answer":"B","options":["A. 《志摩的诗》、《云游》","B. 《志摩的诗》、《翡冷翠的一夜》","C. 《翡冷翠的一夜》、《云游》","D. 《翡冷翠的一夜》、《猛虎集》"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"贯穿闻一多《红烛》、《死水》两部诗集的诗魂是（）","answer":"B","options":["A. 唯美主义","B. 爱国主义","C. 人道主义","D. 个性解放"],"explanation":"","tags":["中国现代文学史","P11502","第7章","单选"]},{"question":"新月诗派","answer":"中国现代文学史上的新诗流派之一。形成于1926年春夏之际，前期的“新月诗派”主要以北京的《晨报》副刊的《诗镌》为活动的阵地，主要成员有闻一多、徐志摩、钱孟侃、朱湘、刘梦苇、孙大雨等诗人。他们提倡新格律诗，对新诗的艺术进步作过一定的贡献。后期新月诗派，主要以《新月》月刊和《诗刊》（季刊）为主要阵地。他们提倡所谓的“健康”“尊严”和“人性”，艺术上借鉴欧美格律派，就其创作，有不少诗作有积极的意义，但有一些诗作也有脱离现实的倾向。新月诗派随着《新月》终刊，不久也就衰落下去了。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第7章","名词解释"]},{"question":"结合作品，简述徐志摩诗歌的主要艺术特色。","answer":"（1）诗歌轻盈，节奏明快，韵律和谐《雪花的快乐》为例；（2）富有色彩感和音乐感《再别康桥》为例；（3）善于描写稍纵即逝的幻境和梦境《偶然》为例；（4）感伤的抒情《我不知道风是在哪一个方向吹》为例。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第7章","简答"]},{"question":"简述以徐志摩、闻一多为代表的新月诗派对白话新诗的贡献。","answer":"提倡新格律诗，在一定程度上改变了诗坛的无治状态。丰富了新诗的格式，巩固了白话诗的地位，为新诗的成熟作出了贡献。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第7章","简答"]},{"question":"论述徐志摩前期诗集的思想。","answer":"徐志摩前期诗集是《志摩的诗》《翡冷翠的一夜》，大多具有比较积极的思想意义，在一定程度上反映了“五四”的时代精神。具体说来，主要表现在以下几个方面：（1）追求光明与自由的思想。由于作者长期英美式的资产阶级教育，他的关于“新的政治、新的人生”的理想，是英美式的资产阶级民主政治与空想主义的混合物。如《婴儿》里，寄托着他的政治理想。《为要寻一个明星》、《我有一个恋爱》抒发了作者对这一理想执着的追求。追求的过程中，他显得自信、乐观。由于他的政治理想与中国现实情况的矛盾，作者又感到这理想有如一个梦，作为中国资产阶级开山诗人，他的内心也不无悲凉之慨。这些诗篇中，闪耀着资产阶级个人主义的诗魄。（2）反映现实社会。如《太平景象》《人变兽》揭示了反动军阀统治的罪恶，发出了对黑暗现实生活的诅咒。《先生！先生！》写出了劳动人民的痛苦。这些诗篇，明晰地显示了诗人关注现实、憎恨封建军阀、同情下层劳动人民的人道主义、民主主义的倾向，具有积极的社会意义。（3）描写爱情体验。爱情诗是他全部诗作中最有特色的部分。他有时以自己的感情经历为基础，有时以假想的异性为对象，真挚、坦率地表现了对纯真爱情的追求。如《起造一座墙》《望月》《决断》《翡冷翠的一夜》等包含着反对封建伦理道德、要求个性解放的积极因素。（4）歌咏大自然。徐志摩把大自然称为“最伟大的一部书”。不少诗作中，经常出现众多美丽的物象景观。如《再别康桥》《康桥再会吧》都以自己曾留学的英国剑桥大学的校园景色为对象写出的佳作，抒发了对母校的深厚感情。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第7章","论述"]},{"question":"论述闻一多爱国主义诗篇的内容。","answer":"（1）歌颂祖国、思恋祖国。身在美国，他笔下流泻出浓烈的思乡念国之情。表现在《太阳吟》、《忆菊》中、《孤雁》中他以流落的孤雁自比，从内心深处发出“不如归去”的感叹。他眷念的家不仅仅是小家，抒发的情也不是小“我”之情，在一定程度上，正准确地代表了所有身在异国心念故土的炎黄子孙的共同心态。（2）反帝反种族歧视。一些诗篇中抨击了“金元帝国”的罪恶，护卫民族尊严，抒写华工的劳碌和遭受凌辱的境遇，喊出对民族压迫的沉痛抗议。如《洗衣歌》中从另一个角度表现了对帝国主义“文明”的鄙视和中国人的正气以及民族自豪感。在平易的诉说中，包含着对同胞的深厚同情与尊敬。（3）对军阀统治下祖国黑暗现实的失望和对祖国新生的信念。《死水》等为代表的一些直面中国现实的作品中，一面为祖国人民唱出了悲哀的歌声，表现出自己希望破灭的深深痛楚。另一面《一句话》中对自己心爱的祖国怀者总有“铁树开花”一日的信念，这就是一直浅埋在心底的“一句话”：“咱们的祖国”。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第7章","论述"]},{"question":"诗集《微雨》的作者是（）","answer":"B","options":["A. 冯至","B. 李金发","C. 徐志摩","D. 闻一多"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"冯至所属的新文学社团是（）","answer":"D","options":["A. 弥洒社","B. 莽原社","C. 未名社","D. 沉钟社"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"冯至参加过的文学社团是（）","answer":"D","options":["A. 弥洒社","B. 莽原社","C. 未名社","D. 沉钟社"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"李金发实验象征主义创作方法的诗集是（）","answer":"C","options":["A. 《尝试集》","B. 《红烛》","C. 《微雨》","D. 《昨日之歌》"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"中国现代文学史上最早的象征主义诗人是（）","answer":"A","options":["A. 李金发","B. 戴望舒","C. 冯乃超","D. 穆木天"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"作为初期象征主义诗歌的探索者，李金发的第一部诗集是（）","answer":"A","options":["A. 《微雨》","B. 《毁灭》","C. 《昨日之歌》","D. 《为幸福而歌》"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"戴望舒将其1934—1945年间显示诗风变化的25首诗结集，题名为（）","answer":"C","options":["A. 《我的记忆》","B. 《望舒草》","C. 《灾难的岁月》","D. 《旧锦囊》"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"对中国现代散文的发展作出最重要贡献的新文学社团是（）","answer":"A","options":["A. 语丝社","B. 莽原社","C. 沉钟社","D. 弥洒社"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"沉钟社的前身是（）","answer":"B","options":["A. 语丝社","B. 浅草社","C. 创造社","D. 新月社"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"下面不属于沉钟社的成员的是（）","answer":"D","options":["A. 杨晦","B. 陈炜谟","C. 陈翔鹤","D. 鲁迅"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"被称为“诗怪”的诗人是（）","answer":"A","options":["A. 李金发","B. 何其芳","C. 冯至","D. 徐志摩"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"收入戴望舒1934－1945年间诗作的诗集是（）","answer":"B","options":["A. 《我底记忆》","B. 《灾难的岁月》","C. 《望舒草》","D. 《乐园鸟》"],"explanation":"","tags":["中国现代文学史","P11502","第8章","单选"]},{"question":"象征派诗歌","answer":"中国现代的象征诗派，是指“五四”文学革命后以李金发为代表的新诗流派。李金发在这时期连续推出三本象征诗集，以象征的意象表现内心的感受、情绪。同时，后期创造社穆木天、王独清、冯乃超三位诗人，这时也致力于象征诗创作，各自出版象征诗集。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第8章","名词解释"]},{"question":"“雨巷诗人”","answer":"“⾬巷诗⼈”是对现代诗⼈戴望舒的称呼。戴望舒是新诗现代派的代表⼈物，他将法国的象征主义诗歌的朦胧美和中国传统诗歌的古朴美结合在⼀起，追求纯诗的艺术，表现病态的⼼理和浊世的哀⾳。《⾬巷》是他最具影响的代表作，选⽤李“丁⾹空结⾬中愁”的意象，个⼈理想和现实的撞击是其要抒发的中⼼情感。表达的是⼀种普遍的忧郁性的时代情绪，甚⾄可以说是⼀曲理想的哀歌。故戴望舒被称为⾬巷诗⼈。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第8章","名词解释"]},{"question":"简述冯至《十四行集》的思想和艺术特色。","answer":"《十四行集》不仅代表了冯至诗歌创作的新成就，也代表着十四行体在中国的最高水平，冯至的《十四行集》是中国十四行诗成熟的标志。诗人关注国家、人民和人类、宇宙的根本问题。表现出了对诗情哲理化的追求，能从敏锐的感觉出发，注重从细节着眼捕捉诗意，在日常的境界里体味出精微的哲理。善于进行艺术的节制，内敛有度，不露“锋芒”。利用十四行诗结构上的特点保持语调的自然，堪称十四行体中国化的成功实践。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第8章","简答"]},{"question":"简述李金发作品的艺术特色。","answer":"（1）灰色意象李金发把一系列灰色意象引进诗歌领域，以“丑、怪、忧郁”等为美。（2）象征意义。李金发善于将思想直觉化。李金发善于用富于象征意义的形象来表现自己的情感、感受与思想。李金发的所有诗歌，几乎都不用“直说”，而是通过具体的形象来一点一点地暗示、隐喻，即以主要意象来表现审美感受与审美体验。仍以《弃妇》为例，最后一段有这样的句子，“衰老的裙裾发出哀怜”，这是对心如死灰、身心皆已苍老的弃妇发出的哀叹。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第8章","简答"]},{"question":"简述戴望舒诗歌的艺术特点。","answer":"（1）把传统诗歌的意象、类似于民歌的夸饰、复沓和意象朦胧的现代象征手法不露痕迹地结合在一起，表现诗人身处理想失落的现代社会，不愿舍弃、百却又无力追回的挣扎的无奈和哀伤。（2）用亲切的日常口语说话的调子，将复杂化、精微化的现代人的感受含蓄地表达出来。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第8章","简答"]},{"question":"论述冯至《昨日之歌》的思想艺术特色。","answer":"《昨日之歌》是冯至在诗坛上确立地位的第一部诗集。对青春、爱情的歌颂，对生命的沉思。如《我是一条小河》。从平凡的生活中窥见社会与人生的真貌。对黑暗的社会现实发出了不平之鸣，也表达了知识者的苦闷。叙事诗的创作是冯至20年代中国新诗发展所作的独到贡献。如《帷幔》从中国民间故事与神话传说中取材，反封建的色彩尤为浓烈。冯至的叙事诗，融抒情于叙事，为新文学叙事诗的起步，作出了开创性的贡献。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第8章","论述"]},{"question":"属于田汉早期的代表作品是（）","answer":"A","options":["A. 《获虎之夜》","B. 《名优之死》","C. 《回春之曲》","D. 《丽人行》"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"1907年在日本东京演出五幕话剧《黑奴吁天录》的是下列哪一话剧团体（）","answer":"A","options":["A. 春柳社","B. 民众戏剧社","C. 戏剧协社","D. 春阳社"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"用话剧形式创作“农村三部曲”（《五奎桥》《香稻米》《青龙潭》）的作家是（）","answer":"C","options":["A. 田汉","B. 夏衍","C. 洪深","D. 李健吾"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"洪深《农村三部曲》中的独幕剧是（）","answer":"A","options":["A. 《五奎桥》","B. 《香稻米》","C. 《赵阎王》","D. 《青龙潭》"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"田汉的下列剧作中，属于象征剧的是（）","answer":"B","options":["A. 《名优之死》","B. 《南归》","C. 《丽人行》","D. 《回春之曲》"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"写作“农村三部曲”（《五奎桥》、《香稻米》、《青龙潭》）的剧作家是（）","answer":"D","options":["A. 夏衍","B. 田汉","C. 丁西林","D. 洪深"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"话剧最初被称作（）","answer":"A","options":["A. 文明新戏（“新剧”）","B. 爱美剧","C. 歌剧","D. 戏剧"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"田汉创作的以刘金妹、梁若英、李新群三位女性为主人公的作品是（）","answer":"B","options":["A. 《三个叛逆的女性》","B. 《丽人行》","C. 《三姊妹》","D. 《漳河水》"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"现代最早的白话新剧剧本是（）","answer":"A","options":["A. 《终身大事》","B. 《泼妇》","C. 《幽兰女士》","D. 《咖啡店之一夜》"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"剧本《赵阎王》的作者是（）","answer":"B","options":["A. 田汉","B. 洪深","C. 曹禺","D. 夏衍"],"explanation":"","tags":["中国现代文学史","P11502","第9章","单选"]},{"question":"话剧","answer":"话剧（drama）是以演员对话为主同时可以使用少量音乐、歌唱等舞台效果的戏剧形式。话剧是一门综合性艺术，剧本创作、指导导演、舞台表演、舞台美化、灯光效果、观众评论缺一不可。中国传统戏剧都不能算是话剧，一些西方传统戏剧如古希腊戏剧因为大量使用歌队，也不被认为是严格的话剧。现代西方舞台剧如果不是特别注明为音乐剧、歌剧等的一般都视为话剧。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第9章","名词解释"]},{"question":"内心独白","answer":"剧中人物不使用有声语言，通过肢体动作来表达自己内心言语的方式。这种言语是不直接通过嘴巴发出声音，而是在人物冷静思考等过程中就已经把这样内心的言语信息传达给其他人物和观众，这也是人物之间以及人物和观众交流的一种重要方式。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第9章","名词解释"]},{"question":"潜台词","answer":"人物角色所说台词的内在本质体现。包括说法目的、弦外之音、未完之言等无需演员说出观众就可以自行明白的。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第9章","名词解释"]},{"question":"话剧的特点。","answer":"（1）舞台性话剧这门艺术表现的空间就是舞台，而话剧的目的就是要将现实生活中的故事情节通过舞台展现给观众，很强的时间和空间的集合感。这样既可以方便演员进行表演又可以让观众从各个视角直观地欣赏这门艺术。（2）直观性观众在欣赏话剧所使用的两个感觉器官是眼睛和耳朵，而演员的形态、语言、对话、独白作用于观众的视觉和听觉，使用化妆、服饰、道具等其他手法可以使观众对人物的形象特征及进一步了解和认识。（3）综合性话剧是一门综合性的艺术，话剧的内容选自于社会现实生活的方方面面，其目的就是为了向人们体现具体的艺术形象和直接展现社会生活的适应于需求。（4）对话性话剧是主要通过大量的舞台人物对话来塑造具体的人物形象和表达主题。期间有人物独白，有观众对话，在很短的时间和空间内完成戏剧内容。而这也是话剧区别于其他剧种的主要特点。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第9章","简答"]},{"question":"欧阳予倩的戏剧理论。","answer":"（1）戏剧创作更加贴近民众和社会大革命失败后，欧阳予倩的创作思想发生了转变，1929年到1932年，欧阳予倩的戏剧创作更加贴近民众和社会，写出了《车夫之家》《小英姑娘》《同住的三家人》等作品。“九·一八”事变之后，他的话剧创作都是以抗日斗争为题材的，如《李团长之死》《不要忘了》《上海之战》等。（2）以传统戏曲为抗战现实服务如1913年创作的《运动力》，是他在辛亥革命后对“革命新贵”的嘲弄。“五四”运动时期，他的《回家以后》《泼妇》和《屏风后》，都表现了强烈的反封建主题，它们或揭露旧道德的伪善，或宣扬妇女解放和个性解放，艺术构思也是多姿多彩的。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第9章","简答"]},{"question":"欧阳予倩的艺术特点。","answer":"欧阳予倩一生重视改革，注意汲取外来经验，他较早地介绍西方和苏联的各种导演流派及不同的艺术见解，善于吸取古今中外一切精华，为创造中国民族的演剧艺术体系奋斗了一生。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第9章","简答"]},{"question":"下列属于台湾新文化运动的重要代表作家是（）","answer":"B","options":["A. 陈映真","B. 赖和","C. 西西","D. 亦舒"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"钟理和惟一完成的长篇小说，也是他的主要代表作是（）","answer":"C","options":["A. 《原乡人》","B. 《夹竹桃》","C. 《笠山农场》","D. 《雨》"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"被誉为“留学生文学的鼻祖”，“无根一代的代言人”的台湾作家是（）","answer":"B","options":["A. 钟理和","B. 於梨华","C. 白先勇","D. 七等生"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"於梨华的代表作品是（）","answer":"A","options":["A. 《梦回青河》","B. 《永远的尹雪艳》","C. 《将军族》","D. 《看海的日子》"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"《又见棕榈又见棕榈》这部小说的作者是（）","answer":"B","options":["A. 黄春明","B. 於梨华","C. 琼瑶","D. 琦君"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"被称为“世界文学组织的建筑师”，“世界文学组织之母”的台湾作家是（）","answer":"C","options":["A. 林海音","B. 金庸","C. 聂华苓","D. 白先勇"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"《儿子的大玩偶》这部小说集的作者是（）","answer":"C","options":["A. 钟理和","B. 西西","C. 黄春明","D. 施淑青"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"被评论界誉为“中国首部意识流长篇小说”的作品是（）","answer":"B","options":["A. 《世纪末的华丽》","B. 《酒徒》","C. 《游园惊梦》","D. 《烟雨濛濛》"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"故事虽取材于《白蛇传》，但很有新意的《蛇》是台湾实验小说代表作，其作者是（）","answer":"D","options":["A. 王鼎钧","B. 张晓风","C. 龙应台","D. 刘以鬯"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"短篇小说《我爱黑眼珠》的作者是（）","answer":"B","options":["A. 欧阳子","B. 七等生","C. 林海音","D. 余光中"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"洛夫在《宝岛文艺》月刊发表第一首诗是（）","answer":"A","options":["A. 《火焰之歌》","B. 《石室之死亡》","C. 《外外集》","D. 《无岸之河》"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"具有“秀外慧中的大家闺秀”风范的台湾散文作家是（）","answer":"A","options":["A. 琦君","B. 西西","C. 琼瑶","D. 三毛"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"抒写故国情怀的散文《愁乡石》的作者是（）","answer":"C","options":["A. 董桥","B. 也斯","C. 张晓风","D. 郑愁予"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"“新民会”创办的《台湾青年》创刊后来改名为（）","answer":"A","options":["A. 《台湾》","B. 《伴侣》","C. 《新青年》","D. 《汉园》"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"诗歌《我是一勺静美的小花朵》的作者是（）","answer":"C","options":["A. 纪弦","B. 黎青","C. 痖弦","D. 洛夫"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"陆梦萍是琼瑶哪部小说中的人物（）","answer":"D","options":["A. 《半生缘》","B. 《梅花烙》","C. 《一帘幽梦》","D. 《烟雨濛濛》"],"explanation":"","tags":["中国现代文学史","P11502","第10章","单选"]},{"question":"台湾文学","answer":"台湾文学是在大陆新文学运动的直接影响和推动下产生的。广义而言，指“出生或客居台湾所发表的所有文字和作品。”狭义指“描写台湾乡土人物、再现台湾典型环境、运用台湾方言的作品、表现台湾人生活和思想”的文学作品，代表人物有赖和、张深切、白先勇、朱天心、朱天文。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第10章","名词解释"]},{"question":"琼瑶小说的创作特点。","answer":"（1）题材上：爱情是琼瑶作品的主题①以美的情感追求爱的真谛，构筑理想的爱情；②以多元化的人物关系营造曲折蜿蜒、生动离奇的故事情节；③钟情—遇阻、冲突—回归、团圆的传统模式；④以细腻的笔触探向初恋中的少男少女，着力刻画其内心世界，揭示心灵的奥秘。（2）艺术上：①构思奇巧，诗文并茂；②文笔清新，语言优美生动，轻松流畅。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第10章","简答"]},{"question":"张天翼《速写三篇》包括的三篇作品是（）","answer":"B","options":["A. 《三天半的梦》、《华威先生》、《新生》","B. 《谭九先生的工作》、《华威先生》、《新生》","C. 《脊背与奶子》、《三天半的梦》、《华威先生》","D. 《包氏父子》、《谭九先生的工作》、《新生》"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"萧涧秋这个人物形象出自于（）","answer":"A","options":["A. 柔石的《二月》","B. 蒋光慈的《短裤党》","C. 丁玲的《梦珂》","D. 艾芜的《故乡》"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"下列属于茅盾《子夜》中的一组人物是（）","answer":"D","options":["A. 吴荪甫赵伯韬屠维岳四凤","B. 赵伯韬屠维岳周朴园吴老太爷","C. 吴荪甫屠维岳吴老太爷鲁贵","D. 吴荪甫屠维岳赵伯韬冯云卿"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"丁玲小说《太阳照在桑干河上》的时代背景是（）","answer":"A","options":["A. 解放战争时期","B. 抗日战争时期","C. 大革命时期","D. 建国初期"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"在茅盾下列小说中，较多运用象征主义手法的是（）","answer":"A","options":["A. 《蚀》三部曲","B. “农村三部曲”","C. 《虹》","D. 《霜叶红似二月花》"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"茅盾描写延安人民革命生活风貌的散文名篇是（）","answer":"C","options":["A. 《雷雨前》","B. 《沙滩上的脚迹》","C. 《风景谈》","D. 《卖豆腐的哨子》"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"茅盾的《蚀》三部曲包括的三部作品是（）","answer":"D","options":["A. 《幻灭》《彷徨》《追求》","B. 《呐喊》《动摇》《追求》","C. 《幻灭》《动摇》《新生》","D. 《幻灭》《动摇》《追求》"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"30年代初，《水》、《田家冲》被称为一种“新的小说的诞生”，其作者是（）","answer":"C","options":["A. 蒋光慈","B. 沙汀","C. 丁玲","D. 萧红"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"茅盾在“五四”时期提倡（）","answer":"B","options":["A. 革命文学","B. 为人生文学","C. 为艺术文学","D. 表现自我文学"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"赵惠明是茅盾哪一部小说中的主要人物（）","answer":"B","options":["A. 《子夜》","B. 《腐蚀》","C. 《走上岗位》","D. 《林家铺子》"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"在茅盾下列散文中，写于30年代的是（）","answer":"A","options":["A. 《雷雨前》","B. 《卖豆腐的哨子》","C. 《白杨礼赞》","D. 《风景谈》"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"符合蒋光慈《少年飘泊者》内容概括的是（）","answer":"C","options":["A. 表达游子思乡情怀","B. 描述20年代少男少女的真挚爱情","C. 早期工人革命斗争的写真","D. 轰轰烈烈的北伐战争"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"长篇小说《故乡》的作者是（）","answer":"B","options":["A. 鲁迅","B. 艾芜","C. 沙汀","D. 张天翼"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"符合萧红《呼兰河传》的完整、正确的判断是（）","answer":"D","options":["A. 爱情小说","B. 抗战小说","C. “问题小说”","D. 回忆、自传性小说"],"explanation":"","tags":["中国现代文学史","P11502","第11章","单选"]},{"question":"左翼文学","answer":"左翼文学，现代文艺团体，简称“左联”。1928至1929年间的革命文学论争，传播了马克思主义文艺理论，提高了革命作家的思想理论水平。通过论争，各方的观点逐渐接近，提倡和发展普罗（英语prole－tariate音译“普罗利塔利亚”的简称，意为“无产阶级”）文学成为他们的共同要求，资产阶级文艺家对于革命文学的攻击，从另一个方面促使革命作家认识到必须联合起来才能有力地进行文艺思想斗争；苏联的“拉普”（全称“俄罗斯无产阶级作家联合会”），日本的“纳普”（全称“全日本无产者艺术联盟”）和“革命文学国际局”先后成立，也对中国革命作家的联合起了推动作用。革命文艺运动的发展及其由于论争而暴露出来的弱点，引起中国共产党中央的重视，加强了对文艺工作的领导，帮助革命作家成立联合的团体。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第11章","名词解释"]},{"question":"东北作家群","answer":"东北作家群：是指“九·一八”事变后，一群从东北流亡到关内的文学青年在左翼文学运动推动下共同自发地开始文学创作的群体。他们的作品及时反映了处于日寇铁蹄下的东北人民的悲惨遭遇，表达了对侵略者的仇恨、对父老乡亲的怀念以及早日收回国土的强烈愿望。他们的作品具有粗犷宏大的风格，写出了东北的民俗风情，显示了浓郁的地方色彩。“东北作家群”的主要作家有萧军、萧红、舒群、白朗、端木蕻良、李辉英等。代表作有萧红的《呼兰河传》、《生死场》，萧军的《八月的乡村》等。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第11章","名词解释"]},{"question":"简述《子夜》的艺术特色。","answer":"（1）宏大严谨的结构作品以吴荪甫为矛盾冲突的轴心，辐射出各种人物和事件。几条线索错落有致地进行铺叙，其中以吴赵斗法为整个作品的主线，以此带动其他几条线索的展开，使之融合为一个有机的整体。整个作品的情节发展十分紧凑，时间跨度小人物众多。径纬交汇地建成了《子夜》这部作品的“网状结构”。（2）心理描写采用传统的肖像描写、人物语言描写以及细节描写的方法刻画人物。对人物下意识和幻觉的描写增强了整个作品心理分析的色彩。运用象征主义的手法。吴老太爷的一切言行总是围绕着一个总体象征展开。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第11章","简答"]},{"question":"简述《子夜》赵伯韬的艺术形象。","answer":"《子夜》里的赵伯韬是个买办资产阶级的形象：他是美国垄断资产阶级走狗，并且与反动统治阶级有关系，后台的撑腰，他完全主宰着上海滩的金融市场。他的目的是消灭和吞并中国的民族工业。他是个心狠手辣的大魔王。在赵吴斗法中，他设下了个大陷阱，不遗余力地要把民族工业置于死地。作者还用他荒淫的生活方式来揭示他骄奢的性格特征，他玩弄各种女人，并以此为豪。在他带有兽行的表演中，我们可以看出他带有流氓习气的洋奴精神。","options":[],"explanation":"","tags":["中国现代文学史","P11502","第11章","简答"]},{"question":"《爱情三部曲》指的是（）","answer":"C","options":["A. 《新生》、《萌芽》、《灭亡》","B. 《雾》、《雷》、《电》","C. 《雾》、《雨》、《电》","D. 《雨》、《电》、《雷》"],"explanation":"","tags":["中国现代文学史","P11502","第12章","单选"]},{"question":"巴金创作于抗战时期的作品是（）","answer":"C","options":["A.
