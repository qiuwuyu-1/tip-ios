战争时期","B. 抗日战争时期","C. 土地革命时期","D. 大革命时期"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"1938年5月，毛泽东发表的论述抗日战争发展规律的著作是（）","answer":"B","options":["A. 《论反对日本帝国主义的策略》","B. 《论持久战》","C. 《中国共产党在民族战争中的地位》","D. 《抗日游击战争的战略问题》"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"标志着中国人民抗日救亡运动新高潮的到来的是（）","answer":"D","options":["A. 第十九路军抗战","B. 卢沟桥抗战","C. 华北事变","D. 一二九运动"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"中国共产党内反复出现“左”、右倾错误的思想认识根源是（）","answer":"D","options":["A. 经验主义","B. 宗派主义","C. 官僚主义","D. 主观主义"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"抗战后期，国民党军队遭到大溃败的战役是（）","answer":"B","options":["A. 长沙会战","B. 豫湘桂战役","C. 淞沪会战","D. 武汉会战"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"1937年8月，中国共产党制定《抗日救国十大纲领》的会议是（）","answer":"C","options":["A. 瓦窑堡会议","B. 中共七大","C. 洛川会议","D. 中共扩大的六届六中全会"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"中国共产党在抗日民族统一战线中必须坚持独立自主原则的实质是（）","answer":"A","options":["A. 力争中国共产党对抗日战争的领导权","B. 扩充自己的军事实力","C. 防止国民党顽固派的反共政策","D. 独自抗击日本侵略者"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","单选"]},{"question":"延安整风运动是一场伟大的思想解放运动。这一运动最主要的任务是反对主观主义，主观主义的主要表现形式为（）","answer":"AC","options":["A. 教条主义","B. 形式主义","C. 经验主义","D. 宗派主义"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"抗战初期国民党正面战场上组织的会战是（）","answer":"ABCD","options":["A. 忻口会战","B. 淞沪会战","C. 徐州会战","D. 武汉会战"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"新民主主义革命的三大法宝是（）","answer":"BCD","options":["A. 独立自主","B. 统一战线","C. 武装斗争","D. 党的建设"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"20世纪30年代后期和40年代前期，毛泽东撰写的重要的理论的著作有（）","answer":"BCD","options":["A. 《反对本本主义》","B. 《〈共产党人〉发刊词》","C. 《中国革命和中国共产党》","D. 《新民主主义论》"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"1941年和1942年毛泽东为延安整风所做的报告和演讲是（）","answer":"ABC","options":["A. 《改造我们的学习》","B. 《整顿党的作风》","C. 《反对党八股》","D. 《中国革命和中国共产党》"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"延安整风运动的主要内容是（）","answer":"ACD","options":["A. 反对主观主义以整顿学风","B. 反对主观主义以整顿党风","C. 反对宗派主义以整顿党风","D. 反对党八股以整顿文风"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"1939年7月，中共中央发表宣言，明确提出的口号是（）","answer":"ABC","options":["A. 坚持抗战到底，反对中途妥协","B. 巩固国内团结，反对内部分裂","C. 力求全国进步，反对向后倒退","D. 放手发动群众，壮大人民力量"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"抗战时期国民党第一次反共高潮的军事进攻，主要集中在以下地区（）","answer":"BCD","options":["A. 山东地区","B. 陕甘宁边区","C. 山西地区","D. 河北地区"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"毛泽东在《新民主主义论》中提出了党关于新民主主义革命的三大纲领是（）","answer":"ABD","options":["A. 政治纲领","B. 经济纲领","C. 军事纲领","D. 文化纲领"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"毛泽东在《论持久战》中指出，抗日战争要经过三个阶段是（）","answer":"ABC","options":["A. 战略相持","B. 战略反攻","C. 战略防御","D. 战略退却"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"抗日战争是近代以来中华民族反抗外敌入侵第一次取得完全胜利的民族解放战争，中国赢得抗日战争胜利的主要原因是（）","answer":"ACD","options":["A. 中国共产党发挥了中流砥柱的作用","B. 中国的国力空前强大","C. 得到了国际反法西斯力量的同情和支持","D. 中国人民空前的民族觉醒和民族团结"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安举行。中共七大的主要内容包括（）","answer":"ACD","options":["A. 制定了党的政治路线","B. 决定在全党范围内开展整风运动","C. 将毛泽东思想规定为党的一切工作的指针","D. 总结了党的建设的历史经验，把党在长期奋斗中形成的优良传统作风概括为三大作风"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"抗日战争时期，不符合统一战线的口号是（）","answer":"BD","options":["A. 又联合又斗争","B. 一切服从统一战线","C. 发展进步势力","D. 孤立中间势力"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"抗日民族统一战线中的进步势力，主要有（）","answer":"ABD","options":["A. 工人","B. 农民","C. 民族资产阶级","D. 城市小资产阶级"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"抗日民族统一战线正式形成的标志是（）","answer":"CD","options":["A. 西安事变和平解决","B. 国民党五届三中全会","C. 蒋介石在庐山发表谈话，承认中国共产党的合法地位","D. 《中共中央为公布国共合作宣言》的发表"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"1938年10月后日本侵华政策的调整是（）","answer":"ABCD","options":["A. 实施“以华制华”和“以战养战”的策略","B. 对国民党采取政治诱降为主、军事打击为辅的方针","C. 在占领区扶植傀儡政权，建立发展汉奸组织","D. 逐渐加强对共产党领导的敌后根据地的“扫荡”"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"以下对瓦窑堡会议的表述正确的有（）","answer":"BCD","options":["A. 明确提出党的抗日总方针是“逼蒋抗日”","B. 提出了在抗日的条件下与民族资产阶级重建统一战线的新政策","C. 批评了党内长期存在的“左”倾冒险主义、关门主义的错误倾向","D. 中国共产党在新的历史时期即将到来时掌握了政治上的主动权"],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","多选"]},{"question":"为什么说中国人民抗日战争是弱国战胜强国的范例？","answer":"（1）从实力对比来看，抗日战争是弱国对强国的战争。中国是半殖民地半封建社会，政治、军事、经济、文化等各方面综合实力都很落后，是弱国。而日本是世界上一等强国，军事、经济实力和政治组织力量都很强大。（2）从战争性质上看，抗日战争是半殖民地半封建的中国和帝国主义的日本之间在20世纪30年代展开的一场决死战争，中国的抗战是抵御日本侵略的正义的、进步的反侵略战争，而日本对中国发动的是极其野蛮的、充满掠夺和屠杀的罪恶的战争。（3）从战争结果上看，在敌我力量对比极为悬殊的形势下，中国人民万众一心，铸成了抗日民族统一战线的钢铁长城，与敌人殊死搏斗，在极端困难的条件下坚持抗战，终于彻底打败了日本侵略者，取得了近代以来的第一次反侵略战争的完全胜利。（4）历史证明，亡国论和速胜论都是错误的，决定战争胜负的是人而不是物，只要实行全民动员，就会造成陷敌于灭顶之灾的、人民战争的汪洋大海，造成弥补武器等缺陷的补救条件，造成克服一切战争困难的前提，就能获得最后的胜利。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","简答"]},{"question":"为什么说中国共产党是中国人民抗日战争的中流砥柱？","answer":"（1）中国共产党吹响了挽救民族危亡的第一声号角，举起了全民族奋起抗战的第一面旗帜，它积极倡导、促成、维护抗日统一战线，最大限度地动员全国军民共同抗战，成为凝聚全民族抗战力量的杰出组织者和鼓舞着。（2）以毛泽东为首的中国共产党人，进一步把马克思列宁主义基本原理同中国具体实践相结合，制定、实施了一套完整的坚持抗战和巩固抗日民族统一战线的理论、路线、策略和方针，提出了持久抗战的战略思想，对抗战胜利发挥了重要作用。（3）中国共产党通过游击战开辟敌后战场，建立抗日根据地，牵制和消灭了日军大量有生力量，特别是抗战进入相持阶段后，抗日根据地正面牵制和打击了侵华日军三分之二以上兵力，逐步成为全国抗战的主战场，不仅减轻了正面战场的压力，也为抗日战争的战略反攻准备了条件。（4）中国共产党领导的八路军、新四军和其他抗日武装力量，以自己最富于献身的爱国主义精神，不怕牺牲、浴血奋战的模范行动，支撑起全民族救亡图存的希望，成为夺取抗战胜利的民族先锋。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","简答"]},{"question":"怎样评价国民党政府在抗日战争中执行的路线和正面战场的地位与作用？","answer":"（1）国民党政府执行的是片面抗战路线，即不敢放手发动和武装民众，实行单纯的政府和军队的抗战，这是一条反人民的路线，它的目的是要保证大地主大资产阶级的剥削利益和一党专政的政治制度。（2）国民党在战略战术上，没有采取积极防御的方针，而是实行“以空间换时间”的战略和单纯的阵地防御战，并存在利用暂时的抵御换取日方妥协的思想，因而导致正面战场的溃败，使大面积的国土沦入敌手。（3）国民党正面战场的广大爱国官兵面对凶残的日本侵略军，进行了英勇顽强的抵抗，表现了空前的爱国激情和不畏强暴、不怕流血牺牲的精神，给日本侵略者以沉重的打击，为抗战的胜利作出了贡献。（4）国民党正面战场起到了维系全国抗战的作用，但在抗战各个阶段中表现不同，其地位和作用也不同。抗战初期的战略防御阶段，国民党政府能够积极抗战；在抗战进入战略相持阶段，开始实行“消极抗战，积极反共”的方针，不断制造反共摩擦，在抗战中的地位、作用明显下降；在战略反攻阶段，虽坚持抗战，但对夺取抗战最后胜利的作用是有限的。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第6章","简答"]},{"question":"抗战胜利后，中国人民的根本利益是（）","answer":"D","options":["A. 维护国民党的统治地位","B. 与国民党进行内战","C. 维持国家现状","D. 为建立新中国而奋斗"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"抗日战争胜利后，中国社会的主要矛盾是（）","answer":"D","options":["A. 中美民族矛盾","B. 中日民族矛盾","C. 无产阶级同资产阶级的矛盾","D. 中国人民同国民党反动派之间的矛盾"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"抗战胜利后，美国在中国追求的短期目标，首先是（）","answer":"C","options":["A. 把中国变成完全的殖民地","B. 维持国共分治的局面","C. 避免共产党完全控制中国","D. 推动建立一个统一的亲美政府"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"抗战胜利后，美国在中国追求的长期的基本目标是（）","answer":"D","options":["A. 把中国变成完全的殖民地","B. 维持中国半殖民地半封建社会的现状","C. 维持中国的分裂现状","D. 推动建立一个统一的亲美政府"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1945年10月10日，国共双方签署了双十协定，确定的基本方针是（）","answer":"D","options":["A. 再造民国","B. 维护现状","C. 继续内战","D. 和平建国"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1946年，政治协商会议确定的最高国务机关是（）","answer":"A","options":["A. 政府委员会","B. 人民代表大会","C. 国务院","D. 政协"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1946年，政治协商会议确定的最高行政机关是（）","answer":"C","options":["A. 立法院","B. 国务院","C. 行政院","D. 政协"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1946年，政治协商会议确定的最高立法机关是（）","answer":"A","options":["A. 立法院","B. 人民代表大会","C. 政协","D. 国务院"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1946年，政协闭幕的第二天，中共中央发出党内指示“从此中国即走上了和平民主建设的新阶段”，国内问题的解决方式是（）","answer":"C","options":["A. 经济方式","B. 文化方式","C. 政治方式","D. 斗争方式"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"全面内战爆发的标志是国民党军队大举进攻（）","answer":"A","options":["A. 中原解放区","B. 山东解放区","C. 东北解放区","D. 西北解放区"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"全面内战爆发不久，毛泽东提出了“必须打败蒋介石”的论断，原因是（）","answer":"A","options":["A. 蒋介石发动的战争，是反对中国民族独立和人民解放的反革命战争","B. 蒋介石是美国的代理人","C. 蒋介石试图继续维护现状","D. 蒋介石是我们的阶级敌人"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"毛泽东提出“一切反动派都是纸老虎”的著名论断，针对的是（）","answer":"D","options":["A. 打垮国民党的历次反革命军事围剿","B. 国民党顽固派制造皖南事变等反共浪潮","C. 日本帝国主义被迫宣布无条件投降","D. 内战初期国民党在军事和经济方面占有明显优势"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1946年6月至1947年6月，人民军队处于战略防御阶段，战争区域是（）","answer":"A","options":["A. 解放区","B. 国统区","C. 东北解放区","D. 中原解放区"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1947年6月，中国人民解放军开始实行战略进攻的战略意图是（）","answer":"D","options":["A. 与敌军主力进行决战","B. 全面扩大解放区","C. 解放中原、进取华中","D. 由内线作战转向外线作战"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1947年6月，人民解放军开始战略反攻时，国民党军队正在实施的战略是（）","answer":"B","options":["A. 全国进攻解放区","B. 重点进攻山东和陕北解放区","C. 抢占战略要地和交通线","D. 集中兵力防守战略要地"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1947年，刘邓大军挺进中原的重大意义在于（）","answer":"D","options":["A. 影响战略决战主攻方向","B. 粉碎蒋介石的重点进攻","C. 改变敌我双方的力量对比","D. 改变解放战争的战略态势"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1947年中共中央召开全国土地会议，制订《中国土地法大纲》的地点是（）","answer":"C","options":["A. 陕北米脂县杨家沟","B. 陕北瓦窑堡","C. 河北平山县","D. 江西井冈山"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1947年7月，中共中央制订的《中国土地法大纲》规定（）","answer":"A","options":["A. 没收地主的土地","B. 没收一切土地","C. 按贫雇农人口分配土地","D. 实行减租减息政策"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"中国共产党得到农民衷心拥护的原因是（）","answer":"D","options":["A. 工作重心转移到农村","B. 建立农村革命根据地","C. 取得反“围剿”的胜利","D. 进行了土地革命"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"解放战争时期，国民党统治区人民民主运动高涨的根本原因是（）","answer":"C","options":["A. 中国共产党组织了反蒋统治的第二条战线","B. 上海学生举行了声势浩大的“三反”斗争","C. 蒋介石国民党政府的经济崩溃和政治危机","D. 民主党派的联合斗争和人民起义遍及各地"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"1945年底爆发的一二一运动，昆明学生提出的口号是（）","answer":"A","options":["A. 反对内战，争取自由","B. 参军保田","C. 打倒蒋介石","D. 解放全中国"],"explanation":"","tags":["中国近现代史纲要","S10002","第7章","单选"]},{"question":"对解放战争时期反蒋斗争第二条战线的准确表述是（）","answer _____社会主义改造（）","answer":"ABD","options":["A. 农业","B. 手工业","C. 重工业","D. 资本主义工商业"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"1958年，党轻率地发动了（）","answer":"BC","options":["A. 反右派活动","B. 大跃进","C. 人民公社化运动","D. “反右倾”斗争"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"新中国建国初期党与政府着重抓的几方面工作包括（）","answer":"ABD","options":["A. 完成民主革命遗留的任务","B. 恢复国民经济","C. 进行社会主义改造","D. 争取国家财政经济状况基本好转"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"“三反”运动包括（）","answer":"ABD","options":["A. 反贪污","B. 反浪费","C. 反宗派主义","D. 反官僚主义"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"中国新民主主义社会经济的主要三种经济成分就是（）","answer":"ACD","options":["A. 社会主义经济","B. 合作社经济","C. 个体经济","D. 私人资本主义经济"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"新中国最先建成的三大钢铁生产基地在（）","answer":"ABC","options":["A. 武汉","B. 鞍山","C. 包头","D. 上海"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"中国共产党领导的革命，包括_____两个阶段（）","answer":"AC","options":["A. 新民主主义革命","B. 旧民主主义革命","C. 社会主义革命","D. 农民革命"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"中共七届二中全会决议指出：全国胜利并解决了土地问题以后，中国社会经济中存在着_____等经济成分（）","answer":"ABCD","options":["A. 国营经济","B. 合作社经济","C. 农民与手工业者的个体经济","D. 私人资本主义经济与国家资本主义经济"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"中共七届二中全会决议指出：全国胜利并解决了土地问题以后，中国还存在的两种基本的矛盾就是（）","answer":"BC","options":["A. 封建主义与人民大众的矛盾","B. 新中国同帝国主义的矛盾","C. 工人阶级与资产阶级的矛盾","D. 人民的需要同落后的社会生产的矛盾"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"我国手工业合作化的组织形式包括（）","answer":"ABD","options":["A. 供销合作社","B. 生产合作小组","C. 行业合作社","D. 生产合作社"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"对资产阶级实行与平赎买，最早就是_____提出的设想（）","answer":"AB","options":["A. 马克思","B. 恩格斯","C. 列宁","D. 斯大林"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"新中国在利用资本主义工商业的过程中，已经开始对它进行适当的限制，并把其中的大部分引上了初级形式的国家资本主义的道路。1952年，私营工业产值的56%，已属于（）","answer":"ABCD","options":["A. 加工","B. 定货","C. 统购","D. 包销"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"在农业合作化运动中，几种过渡性组织形式有（）","answer":"ABC","options":["A. 互助组","B. 初级农业生产合作社","C. 高级农业生产合作社","D. 人民公社"],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","多选"]},{"question":"怎样理解社会主义制度在中国的确立是历史和人民的选择？","answer":"①社会主义性质的国营经济力量相对来说比较强大，他是实现国家工业化的主要基础。②资本主义经济力量弱小，发展困难，不可能成为中国工业起飞的基础。③对个体农业进行社会主义改造时，保证工业发展实现国家工业化的一个必要条件。④当时的国际环境，也促使中国选择社会主义。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第8章","简答"]},{"question":"中共八大分析了社会主义改造完成后中国社会的主要矛盾是（）","answer":"B","options":["A. 资产阶级和无产阶级之间的矛盾","B. 人民对经济文化迅速发展的需求与当前经济文化不能满足人民需求的矛盾","C. 资产阶级与工人阶级之间的矛盾","D. 地主阶级和农民阶级之间的矛盾"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"中国进入全面建设社会主义的历史阶段后，毛泽东适时提出了（）","answer":"C","options":["A. 反对本本主义的任务","B. 马克思主义中国化的历史任务","C. 实行马克思主义同中国实际的“第二次结合”的任务","D. 大规模调查研究的任务"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"邓小平同志多次谈到，新中国建立以来，我国的社会主义建设取得了巨大的成就，但也犯过“左”的或右的错误，“左”是主要的。其中，时间最长、影响最严重的“左”的错误是（）","answer":"C","options":["A. 反右斗争扩大化","B. 大跃进运动","C. 文化大革命","D. 人民公社化运动"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"造成1959年至1961年我国国民经济严重困难的最主要原因是（）","answer":"D","options":["A. 自然灾害的影响","B. 苏联撕毁经济技术合作协议","C. 帝国主义的经济封锁","D. 经济建设中的“左”倾错误"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"奠定粉碎“四人帮”群众基础的是（）","answer":"B","options":["A. “二月逆流”","B. “天安门事件”","C. “反击右倾翻案风”","D. “批林批孔”"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"中共“八大”明确提出当时的根本任务是（）","answer":"C","options":["A. 正确处理人民内部矛盾","B. 在综合平衡中稳步前进","C. 保护和发展生产力","D. 反对官僚主义、宗派主义和主观主义"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"中国共产党人开始探索中国社会主义建设道路的标志（）","answer":"B","options":["A. 《实践论》","B. 《论十大关系》","C. 《关于正确处理人民内部矛盾问题的讲话》","D. 《矛盾论》"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"中国共产党第八次全国代表大会最主要的贡献表现在（）","answer":"B","options":["A. 坚持既反保守又反冒进的方针","B. 正确指出了国内的主要矛盾","C. 坚持在综合平衡中稳步前进","D. 提出了如何正确处理“十大关系”"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"毛泽东指出要正确处理人民内部矛盾，主要是为了（）","answer":"C","options":["A. 开展整风运动，克服官僚主义","B. 维护社会主义团结、稳定","C. 团结一切力量建设社会主义","D. 巩固、发展三大改造的成果"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"20世纪60年代初中央召开七千人大会期间，代表们“白天出气，晚上看戏，两干一稀，大家满意”。这里说的“出气”实际上是指（）","answer":"A","options":["A. 对“大跃进”中的“左”倾错误进行批评","B. 对苏联撕毁两国经济技术协议的行为进行谴责","C. 对“以阶级斗争为纲”的错误方针进行斗争","D. 对“反右倾”运动中被错误批判的人进行平反"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"70年代，中国国际地位进一步提高的最主要标志是（）","answer":"A","options":["A. 恢复联合国合法席位","B. 中美、中日关系正常化","C. 成为第三世界核心","D. 以五大国地位参加国际会议"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"《论十大关系》借鉴了哪一个国家建设的经验教训（）","answer":"D","options":["A. 美国","B. 英国","C. 日本","D. 苏联"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"毛泽东指出，我国国家政治生活的主题是正确处理哪方面的矛盾（）","answer":"D","options":["A. 生产关系与生产力之间的矛盾","B. 敌我矛盾","C. 上层建筑与经济基础之间的矛盾","D. 人民内部矛盾"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"在1959年庐山会议上受到错误批判和处分的主要人物是（）","answer":"C","options":["A. 刘少奇","B. 邓小平","C. 彭德怀","D. 陈云"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"由于主客观原因我国国民经济在下列哪一时期发生严重困难（）","answer":"C","options":["A. 1958—1960年","B. 1958—1961年","C. 1959—1961年","D. 1959—1962年"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"“文化大革命”的导火线是（）","answer":"A","options":["A. 《评新编历史剧“海瑞罢官”》的发表","B. 中央“五一六通知”","C. 聂元梓等人的大字报","D. 毛泽东《炮打司令部——我的一张大字报》"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","单选"]},{"question":"建国后社会主义建设中出现一系列挫折的原因主要是（）","answer":"BCD","options":["A. 社会主义制度本身造成的","B. 中国共产党长期处于战争环境，对社会主义建设缺乏思想准备和科学研究","C. 民主集中制和集体领导制度被破坏","D. 将社会主义建设时期的新矛盾视为阶级斗争"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"我国于50年代提出的外交方针、原则，至今仍富有生命力并被国际社会广泛接受的有（）","answer":"AC","options":["A. “求同存异”的方针","B. 反对霸权主义强权政治","C. 和平共处五项原则","D. 发展与第三世界国家的友好合作关系"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"1972年美国总统尼克松访华，两国关系开始走向正常化，这一事件影响到（）","answer":"AB","options":["A. 中苏关系","B. 中日关系","C. 中国与第三世界国家的关系","D. 中法关系"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"20世纪50—70年代美国对中国的政策经历了由封锁、威胁、孤立到谋求中美关系正常化的转变，导致这种转变的主要原因是（）","answer":"ABD","options":["A. 中国国力大为提高","B. 中国推行了正确灵活的外交政策","C. 国际社会主义与国际资本主义矛盾缓和","D. 苏联的争霸使美国感到应联合中国对付苏联"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"下列哪些人是“四人帮”成员（）","answer":"BCD","options":["A. 康生","B. 王洪文","C. 张春桥","D. 姚文元"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"在“文化大革命”中被当作“资产阶级司令部”为首者的是（）","answer":"AD","options":["A. 刘少奇","B. 朱德","C. 周恩来","D. 邓小平"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"在反右派运动中采取的斗争形式有哪些（）","answer":"ABCD","options":["A. 大鸣","B. 大放","C. 大辩论","D. 大字报"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"在“大跃进”和人民公社运动中“左”倾错误的主要标志包括（）","answer":"ABCD","options":["A. 高指标","B. 瞎指挥","C. 浮夸风","D. “共产风”"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"作为中国科技成就一个标志的“两弹一星”是指（）","answer":"ABD","options":["A. 原子弹","B. 氢弹","C. 导弹","D. 人造地球卫星"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"在社会主义文化建设方面，毛泽东提出的方针有（）","answer":"AC","options":["A. 百花齐放、百家争鸣","B. 长期共存、互相监督","C. 洋为中用、古为今用","D. 又红又专"],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","多选"]},{"question":"中国共产党人在1956年至1957年的早期探索中，社会主义建设有哪些理论建树？","answer":"（1）《论十大关系》的发表，是以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主义建设道路的标志，它在新的历史条件下从经济方面（这是主要的）和政治方面提出了新的指导方针，为中共八大的召开做了理论准备。（2）中共八大路线的制定。中共八大的路线是正确的，它为社会主义事业的发展和党的建设指明了方向。中共八大后，中国共产党往探索中又提出一些重要的新思想，如“可以消灭了资本主义，又搞资本主义”等。（3）《关于正确处理人民内部矛盾的问题》的发表。它创造性地阐述了社会主义社会矛盾学说，是对科学社会主义理论的重要发展，对中国社会主义事业具有长远的指导意义。（4）进行整风和提出建设“六又”政治局面等思想是中共八大路线的继续和发展，是党探索社会主义建设道路的新成果。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","简答"]},{"question":"怎样认识建立独立的、比较完整的工业体系和国民经济体系的重大意义？","answer":"（1）独立的比较完整的工业体系和国民经济体系的建立，是了不起的巨大成就，是中国人民在中国共产党领导下英勇奋斗的伟大成果，是社会主义制度优越性的生动体现，具有极其重要的战略意义，它为我们继续推进社会主义建设开拓了可以依靠的阵地，为实现现代化的伟大事业奠定了初步的物质基础。（2）随着独立的比较完整的工业体系的形成，工业在国民经济中的主导地位日益明显，发挥着越来越重要的作用。工业部门不仅为改善人民生活提供了大量的日用消费品，为国民经济其他部门和国防建设提供了大批燃料、动力、原材料和技术装备，而且还为出口提供了相当数量的产品，它使中国在赢得政治上的独立之后赢得了经济上的独立。（3）集中统一的经济管理体制，在当时物质缺乏、经济基础薄弱的条件下，起到了积极作用。它有利于把有限的资金、物力和技术力量集中起来，保证重点建设项目的完成，为中国以后的发展奠定了牢固的物质技术基础。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第9章","简答"]},{"question":"中国进入改革开放和社会主义建设新时期的标志是（）","answer":"C","options":["A. 中共十届三中全会","B. 中共十一大","C. 中共十一届三中全会","D. 中共十二大"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"标志党和国家在指导思想上拨乱反正任务完成的是（）","answer":"B","options":["A. 真理标准问题的讨论","B. 十一届六中全会通过《关于建国以来党的若干历史问题的决","C. 1980年邓小平做《目前的形势和任务》的讲话","D. 十二届六中全会作出《关于社会主义精神文明建设指导方针的决议》"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"下列哪次会议系统阐述了社会主义初级阶段理论（）","answer":"C","options":["A. 中共“十二大”","B. 中共十一届三中全会","C. 中共十三大","D. 中共十二届三中全会"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"1976年]0月粉碎“四人帮”后，党和国家的工作出现了在徘徊中前进的局面，主要是因为主持中央工作的华国锋仍然坚持（）","answer":"B","options":["A. “无产阶级专政下继续革命的理论”","B. “两个凡是”的错误方针","C. “以阶级斗争为纲”的方针","D. “批邓、反击右倾反案风”"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"被称为开创我国社会主义建设事业发展新时期的宣言书，并为十一届三中全会召开作了思想准备的重要文献是（）","answer":"A","options":["A. 《解放思想，实事求是，团结一致向前看》","B. 《在全国科学大会开幕式上的讲话》","C. 《中国共产党第十二次代表大会开幕词》","D. 《南方谈话》"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"正式提出坚持以人为本、全面协调可持续的科学发展观的是（）","answer":"C","options":["A. 党的十六大","B. 党的十六届一中","C. 党的十六届三中","D. 党的十六届六中"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"以邓小平为核心的党的第二代领导集体形成于（）","answer":"A","options":["A. 党的十一届三中全会","B. 党的十二大","C. 党的十一届六中全会","D. 党的十三大"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"十一届三中全会后，经济体制改革逐步展开，其前提是（）","answer":"B","options":["A. 邓小平理论的指导","B. 坚持社会主义制度","C. 尊重客观经济规律","D. 建立市场经济体"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"中共“十三大”明确了“一个中心，两个基本点”的基本路线，“一个中心”是（）","answer":"B","options":["A. 以改革开放为中心","B. 以经济建设为中心","C. 以四项基本原则为中心","D. 以社会主义道路为中心"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"中共哪一次代表大会提出在中国建立社会主义市场经济体制（）","answer":"C","options":["A. 党的十二大","B. 党的十三大","C. 党的十四大","D. 党的十五大"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"中共哪一次代表大会将邓小平理论确立为党的指导思想（）","answer":"C","options":["A. 党的十三大","B. 党的十四大","C. 党的十五大","D. 党的十六大"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"中国恢复对香港行使主权是在哪一年（）","answer":"C","options":["A. 1995年","B. 1996年","C. 1997年","D. 1998年"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"“九二共识”是中国的哪两方之间达成的（）","answer":"C","options":["A. 大陆与香港","B. 大陆与澳门","C. 大陆与台湾","D. 大陆与港、澳"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"中共十六大提出的全面建设小康社会的奋斗目标要在哪一时期实现（）","answer":"B","options":["A. 本世纪头十年","B. 本世纪头二十年","C. 本世纪头三十年","D. 本世纪前五十年"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"中共十六届四中全会提出构建社会主义和谐社会的任务使中国特色社会主义事业的总体布局增加了下列哪一项建设（）","answer":"D","options":["A. 经济建设","B. 政治建设","C. 文化建设","D. 社会建设"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"科学发展观的核心是（）","answer":"B","options":["A. 发展","B. 以人为本","C. 全面协调可持续","D. 统筹兼顾"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","单选"]},{"question":"中共十一届三中全会的意义有（）","answer":"ABD","options":["A. 否定了“以阶级斗争为纲”的指导思想","B. 中国开始进入改革开放时期","C. 形成了有中国特色的社会主义建设理论","D. 形成了以邓小平为核心的党的中央领导集体"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","多选"]},{"question":"关于真理标准问题讨论的论述正确的有（）","answer":"BC","options":["A. 坚持了“两个凡是”的方针","B. 重新确立了实事求是的思想路线","C. 为改革开放做了思想理论准备","D. 标志改革开放的开始"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","多选"]},{"question":"1992年，邓小平同志在视察南方的谈话中阐述了一系列重要思想，其中有（）","answer":"BCD","options":["A. 关于社会主义本质的思想","B. 关于计划和市场都是经济手段的思想","C. 关于发展才是硬道理的思想","D. 关于“三个有利于”的思想"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","多选"]},{"question":"下列哪些是经济体制改革的重大举措（）","answer":"ACD","options":["A. 家庭联产承包责任制","B. 政社合一","C. 扩大国有企业经营自主权","D. 政企分开"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","多选"]},{"question":"在政治体制改革方面，干部队伍建设实行下列哪些（）","answer":"ABCD","options":["A. 革命化","B. 年轻化","C. 知识化","D. 专业化"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","多选"]},{"question":"“三个代表”重要思想的概念是（）","answer":"ABD","options":["A. 代表中国先进生产力的发展要求","B. 代表中国先进文化的前进方向","C. 代表中国工人阶级的根本利益","D. 代表中国最广大人民的根本利益"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","多选"]},{"question":"根据科学发展观，发展应该是包括下列哪几点的发展（）","answer":"ABD","options":["A. 全面的","B. 协调的","C. 迅速的","D. 可持续的"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","多选"]},{"question":"中国特色社会主义理论体系包括（）","answer":"ABCD","options":["A. 毛泽东思想","B. 邓小平理论","C. “三个代表”重要思想","D. 科学发展观"],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","多选"]},{"question":"为什么说中国特色社会主义是党和人民九十多年奋斗、创造、积累的根本成就？","answer":"中国特色社会主义是党和人民九十多年奋斗、创造、积累的根本成就。党的十八大报告在我们党关于中国特色社会主义探索历程和成就的问题上，明确指出：中国特色社会主义道路，中国特色社会主义理论体系，中国特色社会主义制度，是党和人民九十多年奋斗、创造、积累的根本成就，必须倍加珍惜、始终坚持、不断发展。这一重要论断，是我们党对中国特色社会主义认识的进一步深化，体现了党站在时代高度对中国特色社会主义道路、理论体系和制度的充分自信和高度自觉。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","简答"]},{"question":"为什么必须坚定道路自信、理论自信、制度自信？","answer":"（1）中国特色社会主义在党领导人民取得的伟大成就中居于根本地位，既是其他成就的必然发展，又在更高层次上体现了其他成就。（2）中国特色社会主义的坚持和发展是巩固其他一切成就的根本保证。（3）中国特色社会主义为党和人民在未来不断取得新的更大成就提供了可能。","options":[],"explanation":"","tags":["中国近现代史纲要","S10002","第10章","简答"]},{"question":"用人单位应当自用工之日起_____内与劳动者订立书面劳动合同（）","answer":"B","options":["A. 15日","B. 1个月","C. 2个月","D. 1年"],"explanation":"","tags":["劳动合同法","XX1004","第1章","单选"]},{"question":"根据《劳动合同法》调整的用人单位是指_____等与劳动者建立劳动合同关系的组织和个人（）","answer":"ABCD","options":["A. 企业","B. 个体经济组织","C. 民办非企业单位","D. 国家机关"],"explanation":"","tags":["劳动合同法","XX1004","第1章","多选"]},{"question":"按照就业方式的不同，劳动合同分为（）","answer":"AD","options":["A. 全日制劳动合同","B. 集体劳动合同","C. 个人劳动合同","D. 非全日制劳动合同"],"explanation":"","tags":["劳动合同法","XX1004","第1章","多选"]},{"question":"关于全日制劳动合同和非全日制用工，下列说法正确的有（）","answer":"ABC","options":["A. 全日制劳动合同双方当事人必须订立书面协议","B. 全日制劳动合同中用人单位与劳动者在用工前订立劳动合同的，劳动关系自用工之日起建立","C. 非全日制用工以小时计酬为主","D. 非全日制用工中，劳动者在同一用人单位一般平均每日工作时间不超过6小时"],"explanation":"","tags":["劳动合同法","XX1004","第1章","多选"]},{"question":"关于当事人订立无固定期限劳动合同符合法律规定的有（）","answer":"ABD","options":["A. 赵某到某公司应聘，提议在双方协商一致的基础上订立无固定期限劳动合同","B. 王某在某公司连续工作满十年，要求与该公司签订无固定期限劳动合同","C. 李某在某国有企业连续工作满十年，距法定退休年龄还有十二年，在该企业改制重新订立劳动合同时，主张企业有义务与自己订立无固定期限劳动合同","D. 杨某与某公司连续订立的第二次固定期限劳动合同到期，公司提出续订时，杨某要求与该公司签订无固定期限劳动合同"],"explanation":"","tags":["劳动合同法","XX1004","第1章","多选"]},{"question":"关于劳务合同，说法正确的有（）","answer":"ABCD","options":["A. 劳务合同属于私合同，除法律规定外当事人可以自由选择、决定合同的形式与内容","B. 劳务合同劳务费的支付遵循等价交换原则","C. 劳务合同发生纠纷，当事人协商、调解不成，可以诉讼也可以仲裁","D. 劳务合同属于民事合同，适用民法的规定"],"explanation":"","tags":["劳动合同法","XX1004","第1章","多选"]},{"question":"适用《劳动合同法》调整的劳动者包括（）","answer":"ABC","options":["A. 与我国境内的企业、个体经济组织、民办非企业单位等组织形成劳动关系的劳动者","B. 实行企业化管理的事业组织人员","C. 用人单位党群专职人员、高级管理人员","D. 农村劳动者"],"explanation":"","tags":["劳动合同法","XX1004","第1章","多选"]},{"question":"《劳动合同法》的立法宗旨是（）","answer":"ABCD","options":["A. 完善劳动合同制度，明确劳动合同当事人双方的权利与义务","B. 承认和强化事实劳动关系","C. 强调对最低工资制的坚持","D. 强化用人单位的责任"],"explanation":"","tags":["劳动合同法","XX1004","第1章","多选"]},{"question":"按照劳动合同的期限，劳动合同分为（）","answer":"ABC","options":["A. 固定期限劳动合同","B. 无固定期限劳动合同","C. 任务期限劳动合同","D. 不定期劳动合同"],"explanation":"","tags":["劳动合同法","XX1004","第1章","多选"]},{"question":"劳动合同","answer":"劳动合同也称劳动协议、劳动契约，是劳动者和用人单位之间明确劳动权利义务，确立、变更、解除和终止劳动关系的协议。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第1章","名词解释"]},{"question":"全日制劳动合同","answer":"全日制劳动合同，是劳动者依照国家法定工作时间，从事全日制劳动而建立的劳动合同。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第1章","名词解释"]},{"question":"非全日制劳动合同","answer":"非全日制用工，是指以小时计酬为主，劳动者在同一用人单位一般平均每日工作时间不超过四小时，每周工作时间累计不超过二十四小时的用工形式。从事非全日制劳动而建立的劳动合同为非全日制劳动合同。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第1章","名词解释"]},{"question":"劳务合同","answer":"劳务合同是一方为完成某项工作而使用另一方提供的劳动并为此而支付报酬的协议。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第1章","名词解释"]},{"question":"劳动合同的法律特征是什么？","answer":"（1）合同主体的特定性（2）合同内容的法定性（3）劳动合同的继续性","options":[],"explanation":"","tags":["劳动合同法","XX1004","第1章","简答"]},{"question":"劳动合同与雇佣合同有哪些不同之处？","answer":"（1）合同形式不同根据《劳动合同法》和《劳动法》的规定，劳动合同应当采用书面形式；雇佣合同受《合同法》《民法总则》的调整，根据《合同法》的规定，雇佣合同在合同形式上可以采用书面或者口头的形式，在实践中雇佣合同多为口头合同，比如雇佣钟点工、保姆等，因为时间短暂一般不签订书面合同。（2）主体范围不同根据《劳动合同法》和《劳动法》的规定，劳动合同关系主体一方为劳动者本人，另一方为用人单位，即中华人民共和国境内的企业、国家机关、事业单位、社会团体民办非企业单位组织和个体经济组织；而雇佣关系没有特殊的规定，凡平等主体的公民之间、公民与法人之间均可以形成雇佣关系。（3）合同当事人的权利义务不同雇佣合同主要由《合同法》《民法总则》调整，属于民事合同，以意思自治为基本原则，合同当事人在合同条款约定上有较大的自由，只要不违反法律法规的强制性规定即可；劳动合同由《劳动合同法》和《劳动法》调整，劳动合同中规定了劳动者的工资报酬、社会保险、劳动安全卫生标准等，使得用人单位必须履行相关的法律义务，劳动者在合同中的约定也不能超出劳动法规的规定。（4）解决争议的程序不同因劳动合同发生争议，申请仲裁是必经程序，即当事人必须先向有管辖权的劳动争议仲裁委员会申请仲裁，对仲裁裁决不服才可以向人民法院起诉；因雇佣合同履行发生争议的，当事人可以直接向人民法院起诉，因为是民事争议，双方当事人还可以约定其他手段解决争议，显然雇佣合同双方当事人具有宽松的选择权。（5）责任形式不同因雇佣合同的履行问题，双方当事人产生的责任主要是民事责任，包括违约责任和侵权责任；而劳动合同的履行问题产生的责任可能包括民事责任、行政责任，用人单位极有可能受到行政处罚。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第1章","简答"]},{"question":"劳动合同与劳务合同有哪些不同之处？","answer":"（1）主体不同劳动合同的主体具有特定性，一方是劳动者，另一方是用人单位，不能同时都是自然人。劳务合同的主体具有广泛性，双方当事人可以是自然人、法人或者其他组织。（2）主体的地位不同劳动合同的双方主体间不仅存在财产关系，还存在人身关系，劳动者在劳动合同中的地位具有双重性。劳务合同的双方主体之间只存在财产关系，二者地位平等，彼此之间没有从属性，也不存在隶属关系。（3）主体的待遇不同对于劳动者而言，劳动合同的必备条款中明确规定了劳动者的劳动报酬、社会保险待遇及其他劳动条件等。劳务关系中的提供劳务者，一般只能获得劳动报酬。对于接收劳务一方而言，义务也不同：在劳动关系中，法律给用人单位较多的义务，以保护劳动者的合法权益，弥补劳动者的弱势地位；在劳务关系中，因为双方主体的平等地位，法律并未给雇佣方特别的义务。（4）合同的内容不同劳动合同的主要条款由法律明确规定，当事人自由协商的空间相对较小，合同的内容体现了较强的国家干预和强制性。劳务合同的主要内容主要由双方协商决定，合同内容体现了较强的意思自治。（5）合同的形式不同根据《劳动合同法》第10条的规定，应当自用工之日起1个月内订立书面劳动合同，即劳动合同的形式应当是书面的；而劳务合同一般没有这个要求。（6）适用法律不同劳动合同由《劳动合同法》和《劳动法》等劳动法律法规调整；劳务合同主要由《民法总则》及相关经济法律法规调整。（7）纠纷的处理方式不同劳动合同纠纷发生以后，双方协商未果，应当先到劳动仲裁委员会仲裁，不服仲裁时可在法定的期间到人民法院起诉，劳动仲裁是诉讼的前置程序。劳务合同纠纷出现以后，双方可协商解决，也可直接诉讼。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第1章","简答"]},{"question":"劳动合同可以根据不同的标准分为哪几种不同的类型？","answer":"（1）按照就业方式的不同，劳动合同分为全日制劳动合同和非全日制劳动合同。（2）按照劳动合同的期限，劳动合同分为固定期限劳动合同、无固定期限劳动合同和以完成一定工作任务为期限的劳动合同。（3）按照劳动合同主体的数目划分，劳动合同分为个人劳动合同和集体劳动合同两类。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第1章","简答"]},{"question":"订立劳动合同，应当遵守合法、_____、平等自愿、协商一致、诚实信用原则（）","answer":"D","options":["A. 公道","B. 公认","C. 公开","D. 公平"],"explanation":"","tags":["劳动合同法","XX1004","第2章","单选"]},{"question":"劳动合同期限1年以上不满3年的，试用期不得超过（）","answer":"B","options":["A. 1个月","B. 2个月","C. 半个月","D. 一个半月"],"explanation":"","tags":["劳动合同法","XX1004","第2章","单选"]},{"question":"劳动者违反竞业限制约定的，应当按照约定向用人单位支付（）","answer":"A","options":["A. 违约金","B. 赔偿金","C. 补偿金","D. 损失费"],"explanation":"","tags":["劳动合同法","XX1004","第2章","单选"]},{"question":"根据《劳动合同法》第22条的规定，用人单位为劳动者提供专项培训费用，对其进行专业技术培训，可以与该劳动者订立协议，约定服务期，在服务期中可约定劳动者违反服务期约定的，应支付的违约金数额（）","answer":"A","options":["A. 不得超过用人单位提供的培训费用","B. 应等于用人单位提供的培训费用","C. 可以大于用人单位提供的培训费用","D. 少于用人单位提供的培训费用"],"explanation":"","tags":["劳动合同法","XX1004","第2章","单选"]},{"question":"根据《劳动合同法》第10条第1款的规定，建立劳动关系，应当订立（）","answer":"A","options":["A. 书面劳动合同","B. 口头劳动合同","C. 书面或者口头劳动合同","D. 纸质劳动合同"],"explanation":"","tags":["劳动合同法","XX1004","第2章","单选"]},{"question":"王某是甲公司的员工，1999年开始与甲公司连续签订了两份五年期的劳动合同，2000年王某与甲公司再续订劳动合同时，王某（）","answer":"A","options":["A. 有权要求订立无固定期限的劳动合同","B. 只能要求订立无固定期限的劳动合同","C. 无权要求订立无固定期限的劳动合同","D. 与甲公司协商一致可以订立无固定期限劳动合同"],"explanation":"","tags":["劳动合同法","XX1004","第2章","单选"]},{"question":"劳动合同期限在1年以上不满3年的，试用期为（）","answer":"B","options":["A. 1个月","B. 2个月","C. 6个月","D. 12个月"],"explanation":"","tags":["劳动合同法","XX1004","第2章","单选"]},{"question":"用人单位和劳动者已建立劳动关系，但未同时订立书面劳动合同，则下列处理中正确的是（）","answer":"BCD","options":["A. 自用工之日起1个月内，劳动者不与用人单位订立书面劳动合同，则用人单位无须向劳动者支付经济补偿","B. 用人单位自用工之日起6个月未与劳动者订立书面劳动合同的，应当向劳动者每月支付2倍的工资，且与劳动者补订合同","C. 用人单位自用工之日起满1年未与劳动者订立书面劳动合同的，则视为自用工之日起满1年的当日已经与劳动者订立无固定期限劳动合同，应当立即与劳动者补订书面劳动合同","D. 用人单位自用工之日起超过7个月未与劳动者订立书面劳动合同的，向劳动者每月支付2倍工资的起算时间为用工之日起满1个月的次日"],"explanation":"","tags":["劳动合同法","XX1004","第2章","多选"]},{"question":"以下关于试用期的规定表述正确的是（）","answer":"BCD","options":["A. 劳动合同期限不满3年的，试用期不得超过2个月","B. 同一用人单位与同一劳动者只能约定一次试用期","C. 试用期包含在劳动合同期限内","D. 劳动合同仅约定试用期的，试用期不成立"],"explanation":"","tags":["劳动合同法","XX1004","第2章","多选"]},{"question":"下列劳动合同无效或者部分无效的有（）","answer":"AB","options":["A. 以欺诈、胁迫的手段或者乘人之危，使对方在违背真实意思的情况下订立的劳动合同","B. 用人单位免除自己的法定责任、排除劳动者权利的劳动合同","C. 某地下传销组织与劳动者订立的劳动合同","D. 中国公民张某依法与用人单位签订的劳动合同"],"explanation":"","tags":["劳动合同法","XX1004","第2章","多选"]},{"question":"以下属于劳动合同约定条款的是（）","answer":"ABC","options":["A. 劳动报酬","B. 试用期","C. 服务期","D. 竞业限制"],"explanation":"","tags":["劳动合同法","XX1004","第2章","多选"]},{"question":"劳动者在以下哪种情况下，应当按照约定向用人单位支付违约金？（）","answer":"BCD","options":["A. 劳动者违反竞业限制约定","B. 劳动者违反服务期约定","C. 劳动者违反用人单位规章制度给用人单位造成损失","D. 劳动者严重失职给用人单位造成重大损失"],"explanation":"","tags":["劳动合同法","XX1004","第2章","多选"]},{"question":"无效劳动合同","answer":"劳动合同无效，是指当事人所订立的劳动合同不符合法律、法规规定，或缺少有效要件，导致劳动合同全部或部分不具有法律效力。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第2章","名词解释"]},{"question":"服务期","answer":"服务期，是指劳动者因为接受用人单位提供的特殊待遇而承诺必须为用人单位工作的最短期限。服务期的一个重要的前提是劳动者享受了用人单位提供的特殊待遇，一般是指用人单位为劳动者提供专项培训费用或对其进行专业技术培训。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第2章","名词解释"]},{"question":"劳动合同法关于试用期有哪些规定？","answer":"（1）明确规定了劳动合同试用期期限的上限。劳动合同期限在3个月以上的才可以约定试用期，劳动合同期限在3个月以上不满1年的，试用期不得超过1个月；劳动合同期限在1年以上不满3年的，试用期不得超过2个月；3年以上固定期限和无固定期限的劳动合同，试用期不得超过6个月。（2）三个“一”。三个“一”是指同一用人单位只能与同一劳动者约定一次试用期。（3）不能约定试用期的情形。其一，以完成一定的工作任务为期限的劳动合同，不得约定试用期。其二，劳动合同期限不满3个月的，不得约定试用期。其三，非全日制用工的劳动合同不得约定试用期。（4）不允许只有试用期。（5）不允许单设试用期。（6）试用期的工资标准。劳动者和用人单位可以在法定限度内协商约定试用期的工资，试用期工资一般不会高于试用期满后正常的工资。对劳动者在试用期的工资标准的确定，根据《劳动合同法》和《劳动合同法实施条例》的规定，明确试用期工资的法定最低标准，以岗位工资或合同工资和当地最低工资为两重标准。劳动合同法规定了两个“不低于”原则：首先，不得低于用人单位所在地的最低工资标准，这是试用期工资的底线。其次，不得低于本单位相同岗位最低档工资或者劳动合同约定工资的80%，即如果本单位相同岗位最低档工资或者劳动合同约定工资的80%高于用人单位所在地的最低工资标准的，则二者取其高。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第2章","简答"]},{"question":"劳动合同无效的情形都有哪些？","answer":"（1）以欺诈、胁迫的手段或者乘人之危，使对方在违背真实意思情况下订立或者变更劳动合同的（2）用人单位免除自己的法定责任、排除劳动者权利（3）劳动合同违反法律、行政法规的强制性规定","options":[],"explanation":"","tags":["劳动合同法","XX1004","第2章","简答"]},{"question":"劳动合同生效的要件有哪些？","answer":"（1）劳动合同的主体合格（2）意思表示真实（3）劳动合同内容合法（4）劳动合同订立的程序合法","options":[],"explanation":"","tags":["劳动合同法","XX1004","第2章","简答"]},{"question":"劳动合同变更的形式应当是（）","answer":"B","options":["A. 口头形式","B. 书面形式","C. 口头或者书名形式","D. 口头和书名形式"],"explanation":"","tags":["劳动合同法","XX1004","第3章","单选"]},{"question":"用人单位发生合并或者分立等情况，原劳动合同（）","answer":"A","options":["A. 继续有效","B. 失去效力","C. 用人单位与劳动者协商是否有效","D. 由用人单位决定是否有效"],"explanation":"","tags":["劳动合同法","XX1004","第3章","单选"]},{"question":"用人单位应当按照劳动合同约定和国家规定，向劳动者_____支付劳动报酬（）","answer":"D","options":["A. 提前","B. 及时分期","C. 提前足额","D. 及时足额"],"explanation":"","tags":["劳动合同法","XX1004","第3章","单选"]},{"question":"用人单位拖欠或者未足额支付劳动报酬的，劳动者可以依法向当地人民法院申请（）","answer":"B","options":["A. 法律援助","B. 支付令","C. 社会救济","D. 依法制裁用人单位"],"explanation":"","tags":["劳动合同法","XX1004","第3章","单选"]},{"question":"劳动者拒绝用人单位管理人员违章指挥、强令冒险作业的，_____违反劳动合同（）","answer":"C","options":["A. 视为","B. 有时视为","C. 不视为","D. 部分视为"],"explanation":"","tags":["劳动合同法","XX1004","第3章","单选"]},{"question":"变更后的劳动合同文本（）","answer":"A","options":["A. 由用人单位和劳动者各执一份","B. 由用人单位留存备","C. 由劳动者一方保存","D. 由劳动行政部门备案"],"explanation":"","tags":["劳动合同法","XX1004","第3章","单选"]},{"question":"甲公司与张某签订了3年期的劳动合同，在劳动合同中约定月工资800元，甲公司所在地的最低月工资标准为750元。根据《劳动合同法》的规定，张某在试用期的月工资不得低于_____元（）","answer":"C","options":["A. 640","B. 720","C. 750","D. 800"],"explanation":"","tags":["劳动合同法","XX1004","第3章","单选"]},{"question":"根据《劳动合同法》的规定，国家实行劳动者每日工作_____小时、每周工作_____小时的标准工时制度（）","answer":"B","options":["A. 6，36","B. 8，40","C. 8，48","D. 9，45"],"explanation":"","tags":["劳动合同法","XX1004","第3章","单选"]},{"question":"下列用人单位延长工作时间不受限制的情形有（）","answer":"ABC","options":["A. 甲市下暴雨，部分电力设施倒塌，市区大面积断电，电力公司组织工作人员抢修","B. 乙市地震，某医院组织医生赴灾区抢救伤员","C. 丙市冬季供暖管道故障，导致市区二分之一住户供暖受阻，供暖公司组织人员抢修","D. 丁市某商场在十一“黄金周”开展促销活动，要求相关人员必须到岗工作"],"explanation":"","tags":["劳动合同法","XX1004","第3章","多选"]},{"question":"根据《职工带薪年休假条例》的规定，职工有下列_____情形，不享受当年的带薪年休假（）","answer":"ABCD","options":["A. 职工请事假累计20天以上且单位按照规定不扣工资的","B. 累计工作满1年不满10年的职工，请病假累计2个月以上的","C. 累计工作满10年不满20年的职工，请病假累计3个月以上的","D. 累计工作满20年以上的职工，请病假累计4个月以上的"],"explanation":"","tags":["劳动合同法","XX1004","第3章","多选"]},{"question":"下列属于工资范围的是（）","answer":"AB","options":["A. 津贴和补贴","B. 加班加点工资","C. 计划生育补贴","D. 讲课费"],"explanation":"","tags":["劳动合同法","XX1004","第3章","多选"]},{"question":"劳动合同变更","answer":"劳动合同的变更，是指劳动合同依法签订后，在合同尚未履行或者尚未履行完毕以前，因订立劳动合同的主客观条件发生变化，劳动关系双方当事人协商一致，对原劳动合同内容作部分修改、补充或者删减的法律行为。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第3章","名词解释"]},{"question":"加班加点","answer":"加班加点即延长劳动时间，是劳动者的工作时数超过法律规定的标准工作时间。加班是指劳动者在法定节假日或公休假日从事生产或工作。加点是指劳动者在标准工作时间外继续从事劳动或工作。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第3章","名词解释"]},{"question":"休息休假","answer":"休息休假又称休息时间，是指劳动者在国家规定的法定工作时间外自行支配的时间。休息休假的权利是每个公民都应享受的权利。休息，是指劳动者无须履行劳动义务自行支配的时间。用人单位应当保证劳动者每周至少休息一日。同时，用人单位还应当保证劳动者在一个工作日内有一定的休息时间。休假，是指劳动者无须履行劳动义务且有工资保障的法定休息时间。用人单位在法定节假日安排劳动者休假，此外还应安排劳动者进行年休假。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第3章","名词解释"]},{"question":"客观原因导致的劳动合同变更的情形有哪些？","answer":"（1）订立劳动合同时依据的法律、法规及其相应政策修改甚至废止，如果劳动合同继续履行会与现行法律、法规冲突，劳动合同当事人应当及时根据法律、法规、政策的变化变更劳动合同可能涉及的相关条款。（2）不可抗力的发生以及客观经济形势的变化。不可抗力是劳动合同当事人不能预见、不能避免、不能克服的客观情况，比如自然灾害、意外事故、战争等。此外，随着国际经济一体化程度日益加深，金融危机、汇率变动、货币政策调整等经济形势的变化，政治关系的变化都会对国内相关行业产生影响。此时允许双方当事人对劳动合同相关内容进行变更，以体现公平与合理。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第3章","简答"]},{"question":"劳动合同履行过程中劳动者享有的特殊权利有哪些？","answer":"（1）劳动者对用人单位违法指令有权拒绝。（2）劳动者对危害生命和身体健康的劳动条件有批评、检举和控告的权利。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第3章","简答"]},{"question":"加班加点的特殊条件有哪些？","answer":"当出现特殊情况或者紧急事件，用人单位延长工作时间不受限制：（1）发生自然灾害、事故或者其他原因，威胁人民的安全健康和国家资产受到严重威胁，需要紧急处理的。（2）生产设备、交通运输路线路、公共设施发生故障，影响生产和公众利益，必须及时抢修的。（3）必须利用法定节假日或者公休日的停产期间进行设备检修、保养的。（4）国家机关、事业单位为维持国家紧急任务或完成上级安排的紧急任务的；商业、供销企业在旺季完成收购、运输、加工农副产品紧急任务的。（5）法律、行政法规规定的其他情形等。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第3章","简答"]},{"question":"不属于非过错解除合同的情况的是（）","answer":"C","options":["A. 劳动者因伤病不能从事原工作","B. 劳动者不能胜任工作","C. 劳动者被追究刑事责任","D. 合同订立的客观情况发生重大变化"],"explanation":"","tags":["劳动合同法","XX1004","第4章","单选"]},{"question":"劳动者_____，用人单位不可以解除劳动合同（）","answer":"B","options":["A. 在试用期间被证明不符合录用条件的","B. 患病或非因工负伤，在规定的医疗期内的","C. 严重违反用人单位的规章制度的","D. 被依法追究刑事责任的"],"explanation":"","tags":["劳动合同法","XX1004","第4章","单选"]},{"question":"劳动者可以解除劳动合同的法定情形是用人单位（）","answer":"D","options":["A. 变更名称、法定代表人、主要负责人","B. 发生合并或者分立","C. 变更投资人","D. 未依法为劳动者缴纳社会保险费"],"explanation":"","tags":["劳动合同法","XX1004","第4章","单选"]},{"question":"法律给予用人单位的单方解除权不包括（）","answer":"CD","options":["A. 过错性解除","B. 非过错性解除","C. 预告解除","D. 经营性裁员"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"由劳动者过错性解除劳动合同的情况不包括（）","answer":"CD","options":["A. 在试用期间，被证明不符合录用条件","B. 严重违反用人单位的规章制度","C. 严重失职、营私舞弊","D. 员工被拘留或者逮捕"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"下面哪些是用人单位实施经济性裁员的条件？（）","answer":"ABCD","options":["A. 依照企业破产法规定进行重整的","B. 生产经营发生严重困难的","C. 企业转产、重大技术革新或者经营方式调整，经变更劳动合同后，仍需裁减人员的","D. 其他因劳动合同订立时所依据的客观经济情况发生重大变化，致使劳动合同无法履行的"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"过错性解除合同的纠纷中，企业胜诉的要点不包括（）","answer":"AB","options":["A. 有足够证据证明员工有违纪行为","B. 有足够证明说明该行为的后果在企业的规章制度中有规定","C. 解除合同的所有程序与约定内容一致","D. 充分履行举证责任"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"根据《劳动合同法》第38条第2款的规定，用人单位有以下_____情形之一，劳动者无须告知可以立即解除劳动合同（）","answer":"ABCD","options":["A. 用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动的","B. 用人单位违章指挥、强令冒险作业危及劳动者人身安全的","C. 用人单位以欺诈、胁迫的手段或者乘人之危，使劳动者在违背真实意思的情况下订立或者变更劳动合同的","D. 用人单位的规章制度违反法律、法规的规定，损害劳动者权益的"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"根据《劳动合同法》第40条的规定，下列_____情形中，用人单位须提前30天以书面形式通知劳动者本人或者额外支付劳动者一个月工资，可以解除劳动合同（）","answer":"AB","options":["A. 劳动者患病或者非因工负伤，在规定的医疗期满后不能从事原工作，也不能从事由用人单位另行安排的工作的","B. 劳动合同订立时所依据的客观情况发生重大变化，致使劳动合同无法履行，经用人单位与劳动者协商，未能就变更劳动合同内容达成协议的","C. 劳动者同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响，或者经用人单位提出，拒不改正的","D. 企业生产经营发生严重困难的"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"根据《劳动合同法》的规定，下列情形中，用人单位不得再约定试用期的有（）","answer":"ABCD","options":["A. 在试用期内由用人单位解除劳动合同，用人单位再次招用该劳动者的","B. 在试用期内由劳动者解除劳动合同，用人单位再次招用该劳动者的","C. 劳动合同终止后一段时间又招用该劳动者的","D. 用人单位与劳动者续订劳动合同的"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"钱某系A公司员工，2009年5月份钱某因预产期届至，向公司要求享受产假，A公司不仅不批准，而且提出和钱某解除劳动合同，双方争执不下，钱某向劳动仲裁委员会提请仲裁，仲裁员对该纠纷提出了各自的意见其中符合《劳动合同法》规定的是（）","answer":"ABCD","options":["A. 女职工在孕期、产期、哺乳期的，用人单位不得解除劳动合同","B. 钱某有权要求A公司继续履行合同","C. 钱某可以依法享受产假和哺乳期间的各项待遇","D. 如果钱某不愿意继续履行合同，可以要求两倍经济补偿的赔偿金"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"根据《劳动合同法》的规定，如果劳动者出现法定情形，用人单位既不得解除劳动合同，也不得终止劳动合同，劳动合同应当续延至相应的情形消失时终止。该法定情形包括（）","answer":"ABCD","options":["A. 在本单位患职业病或者因工负伤并被确认丧失或者部分丧失劳动能力的","B. 患病或者非因工负伤，在规定的医疗期内的","C. 从事接触职业病危害作业的劳动者未进行离岗前职业健康检查，或者疑似职业病病人在诊断或者医学观察期间的","D. 在本单位连续工作满15年，且距法定退休年龄不足5年的"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"甲公司因生产经营发生严重困难，拟裁减人员。根据《劳动合同法》的规定，下列各项中，甲公司应当提前30日向工会或者全体职工说明情况，听取工会或者职工的意见后，裁减人员方案经向劳动行政部门报告，方可以裁减人员的有（）","answer":"CD","options":["A. 裁减人员10人，占职工总数的5.56%","B. 裁减人员15人，占职工总数的8.33%","C. 裁减人员19人，占职工总数的10.56%","D. 裁减人员22人，占职工总数的12.22%"],"explanation":"","tags":["劳动合同法","XX1004","第4章","多选"]},{"question":"协商解除劳动合同","answer":"用人单位与劳动者不需要专门法律规定或者事先约定，只要双方当事人协商一致就可以解除劳动合同。劳动合同的订立是在双方协商一致的基础上订立的，当然也允许其自愿协商解除，协议解除劳动合同是双方当事人意思表示一致的结果。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第4章","名词解释"]},{"question":"经济性裁员","answer":"用人单位经济性裁员解除劳动合同，是指用人单位由于生产经营状况发生变化或其他客观经济情况发生重大变化等经济性原因，与部分劳动者解除劳动合同的情形，是用人单位用以改善生产经营状况的一种手段。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第4章","名词解释"]},{"question":"劳动合同终止的情形包括哪些？","answer":"（1）劳动合同期满（2）劳动者开始依法享受基本养老保险待遇（3）劳动者死亡，或被人民法院宣告死亡或失踪（4）用人单位被依法宣告破产（5）用人单位被吊销营业执照、责令关闭、撤销或者用人单位决定提前解散（6）法律、行政法规规定的其他情形","options":[],"explanation":"","tags":["劳动合同法","XX1004","第4章","简答"]},{"question":"在哪些情形下用人单位可以解除劳动合同并且不用支付经济补偿？","answer":"（1）劳动者在试用期间被证明不符合录用条件的。（2）劳动者严重违反用人单位的规章制度的。（3）劳动者严重失职，营私舞弊，给用人单位造成重大损害的。（4）劳动者同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响，或者经用人单位提出，拒不改正的。（5）劳动者以欺诈、胁迫的手段或者乘人之危，使用人单位在违背真实意思的情况下订立或者变更劳动合同的。（6）劳动者被依法追究刑事责任的。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第4章","简答"]},{"question":"企业职工一方与用人单位可以订立劳动安全卫生、女职工权益保护、工资调整机制等集体合同，这称为（）","answer":"A","options":["A. 专项集体合同","B. 行业集体合同","C. 区域集体合同","D. 单项集体合同"],"explanation":"","tags":["劳动合同法","XX1004","第5章","单选"]},{"question":"集体合同中劳动报酬和劳动条件等标准_____当地人民政府规定的最低标准（）","answer":"A","options":["A. 不得低于","B. 可以低于","C. 必须高于","D. 应当高于"],"explanation":"","tags":["劳动合同法","XX1004","第5章","单选"]},{"question":"进行集体协商、签订集体合同，职工方协商代表由工会选派，首席代表由_____担任（）","answer":"A","options":["A. 工会主席","B. 企业法人","C. 双方首席代表轮流","D. 工资集体协商指导员"],"explanation":"","tags":["劳动合同法","XX1004","第5章","单选"]},{"question":"应有_____以上职工代表或者职工出席讨论集体协商草案，须经半数以上同意方获通过（）","answer":"B","options":["A. 1/2","B. 2/3","C. 3/4","D. 3/5"],"explanation":"","tags":["劳动合同法","XX1004","第5章","单选"]},{"question":"集体合同期满前_____内，任何一方均可向对方提出重新签订或续订的要求（）","answer":"A","options":["A. 3个月","B. 4个月","C. 5个月","D. 6个月"],"explanation":"","tags":["劳动合同法","XX1004","第5章","单选"]},{"question":"集体合同订立后，应当报送劳动行政部门；劳动行政部门自收到集体合同文本之日起_____内未提出异议的，集体合同即行生效（）","answer":"C","options":["A. 1个月","B. 7日","C. 15日","D. 6个月"],"explanation":"","tags":["劳动合同法","XX1004","第5章","单选"]},{"question":"因_____集体合同发生争议，经协商解决不成的，工会可以依法申请仲裁，提起诉讼（）","answer":"B","options":["A. 签订","B. 履行","C. 订立","D. 检查"],"explanation":"","tags":["劳动合同法","XX1004","第5章","单选"]},{"question":"企业职工一方与用人单位可以就以下_____等事项进行平等协商，签订集体合同（）","answer":"ABCD","options":["A. 劳动报酬","B. 工作时间","C. 休息休假","D. 劳动安全卫生"],"explanation":"","tags":["劳动合同法","XX1004","第5章","多选"]},{"question":"按照集体合同主体和适用范围的不同，可以把集体合同分为（）","answer":"ABCD","options":["A. 企业集体合同","B. 行业性集体合同","C. 区域性集体合同","D. 国家性集体合同"],"explanation":"","tags":["劳动合同法","XX1004","第5章","多选"]},{"question":"在县级以下区域内，哪些行业可以由工会与企业方面代表订立行业性集体合同或者区域性集体合同？（）","answer":"ABC","options":["A. 建筑业","B. 采矿业","C. 餐饮服务业","D. 加工业"],"explanation":"","tags":["劳动合同法","XX1004","第5章","多选"]},{"question":"集体协商代表应履行的职责是（）","answer":"ABCD","options":["A. 接受本方人员质询，及时向本方人员公布协商情况并征求意见","B. 提供与集体协商有关的情况和资料","C. 代表本方参加集体协商争议的处理","D. 监督集体合同或专项集体合同的履行"],"explanation":"","tags":["劳动合同法","XX1004","第5章","多选"]},{"question":"协商代表在集体协商中的义务有（）","answer":"ABC","options":["A. 集体协商代表应当维护本单位正常的生产、工作秩序","B. 不得采取威胁、收买、欺骗等行为","C. 应当保守在集体协商过程中知悉的用人单位的商业秘密","D. 代表本方参加集体协商争议的处理"],"explanation":"","tags":["劳动合同法","XX1004","第5章","多选"]},{"question":"变更或解除集体合同或专项集体合同需要出现下列哪些情形？（）","answer":"ABCD","options":["A. 用人单位因被兼并、解散、破产等原因，致使集体合同或专项集体合同无法履行的","B. 因不可抗力等原因致使集体合同或专项集体合同无法履行或部分无法履行的","C. 集体合同或专项集体合同约定的变更或解除条件出现的","D. 法律、法规、规章规定的其他情形"],"explanation":"","tags":["劳动合同法","XX1004","第5章","多选"]},{"question":"简述集体合同的概念与特征。","answer":"（1）概念：集体合同，又称团体协议、集体协议，是指用人单位与本单位全体职工之间依照法律法规的规定就劳动报酬、工作条件、工作时间、休息休假、劳动安全卫生、社会保险福利等事项，在平等协商的基础上进行协商谈判所缔结的书面协议。（2）特征：主体的特定性、内容的广泛性、合同的要式性","options":[],"explanation":"","tags":["劳动合同法","XX1004","第5章","简答"]},{"question":"简述集体合同与劳动合同的区别。","answer":"（1）合同的目的不同实行集体合同的目的是维护劳动者整体的合法权益，调整和改善劳动关系，促进企业和劳动者的共同发展；劳动合同是劳动者个人与用人单位确立劳动关系，明确双方权利义务的协议，劳动合同的目的在于在双方当事人之间建立劳动关系，利用合同制度实现和保护当事人的权利和义务。（2）合同的主体不同集体合同当事人一方是用人单位，另一方是工会组织或劳动者按照合法程序推举的代表；劳动合同当事人是用人单位和劳动者个人。（3）合同的内容不同集体合同的内容是关于用人单位的一般劳动条件标准的约定，以全体劳动者共同权利和义务为内容，具有整体性；劳动合同的内容则是对单个劳动者的劳动条件和劳动标准的约定，内容细致具体，针对性相对较强。（4）合同的法律效力不同根据《劳动合同法》第54条第2款的规定，依法订立的集体合同对用人单位和劳动者具有约束力。第55条规定：“集体合同中劳动报酬和劳动条件等标准不得低于当地人民政府规定的最低标准；用人单位与劳动者订立的劳动合同中劳动报酬和劳动条件等标准不得低于集体合同规定的标准。”据此，集体合同对于签订集体合同的用人单位和全体劳动者都发生效力，而劳动合同只能对用人单位和单个劳动者发生效力。集体合同的法律效力高于劳动合同，且对劳动合同的内容有规范作用，当劳动合同与集体合同发生冲突时，应优先适用集体合同。凡劳动合同约定的标准低于集体合同标准的一律无效，无效部分依据集体合同标准执行。（5）违约责任不同就解除集体合同来说，在劳动者违反集体合同时，用人单位不能解除集体合同；集体合同中的用人单位违反集体合同的规定，侵害了工会和全体职工的合法权益并造成损失时，应承担物质赔偿责任；工会不履行集体合同的规定，一般不承担物质赔偿责任。而劳动合同则不同，只要符合违约条件，就构成违约，都可能根据其后果及损失的大小予以赔偿，而且可能因为违约导致合同的解除。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第5章","简答"]},{"question":"简述集体合同的主要内容。","answer":"集体合同应当包括以下条款：（1）劳动报酬；（2）工作时间；（3）休息休假；（4）劳动安全与卫生；（5）补充保险和福利；（6）女职工和未成年工特殊保护；（7）职业技能培训；（8）劳动合同管理；（9）奖惩；（10）裁员；（11）集体合同期限；（12）变更、解除集体合同的程序；（13）履行集体合同发生争议时的协商处理办法；（14）违反集体合同的责任；（15）双方认为应当协商的其他内容。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第5章","简答"]},{"question":"简述集体合同争议的解决途径。","answer":"（1）因签订集体合同发生争议的解决集体合同当事人在订立集体合同过程中发生的争议，由双方当事人协商解决，协商不成的，在政府劳动行政部门、上级工会和企业方面的代表组织参与下，通过调解解决纠纷。（2）因履行集体合同发生争议的解决因履行集体合同发生争议，当事人协商解决不成的，工会可以向劳动争议仲裁委员会申请仲裁；对仲裁裁决不服的，可以自收到仲裁裁决书之日起十五日内工会可以代表劳动者向人民法院提起诉讼；或者在不申请仲裁的前提下协商解决集体合同争议不成的，工会还可以直接向法院提起诉讼。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第5章","简答"]},{"question":"根据《劳动合同法》第58条的规定，劳务派遣单位与被派遣劳动者订立的劳动合同，除应当载明《劳动合同法》第17条规定的事项外，还应当载明被派遣劳动者的用工单位以及派遣期限、（）","answer":"D","options":["A. 试用期","B. 培训","C. 保守秘密","D. 工作岗位"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"劳务派遣单位应当与被派遣劳动者订立_____以上的固定期限劳动合同，按月支付劳动报酬（）","answer":"B","options":["A. 1年","B. 2年","C. 3年","D. 4年"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"被派遣劳动者在无工作期间，劳务派遣单位应当按照所在地人民政府规定的_____，向其按月支付报酬（）","answer":"A","options":["A. 最低工资标准","B. 最低生活保障标准","C. 行业工资指导线","D. 失业保险金领取标准"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"劳务派遣单位派遣劳动者应当与接受以劳务派遣形式用工的单位订立（）","answer":"D","options":["A. 劳动合同","B. 集体合同","C. 用工协议","D. 劳务派遣协议"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"劳务派遣单位违反《劳动合同法》的规定，给被派遣劳动者造成损害的，劳务派遣单位与用工单位承担_____赔偿责任（）","answer":"B","options":["A. 共同","B. 连带","C. 按份","D. 违约"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"劳务派遣协议应当约定派遣岗位和人员数量、派遣期限、_____和社会保险费的数额与支付方式以及违反协议的责任（）","answer":"B","options":["A. 试用期","B. 劳动报酬","C. 培训","D. 保守秘密"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"非全日制用工的计酬方式主要是（）","answer":"B","options":["A. 按件计酬","B. 按小时计酬","C. 按天计酬","D. 按月计酬"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"下列关于非全日制用工的表述正确的是（）","answer":"D","options":["A. 劳动者每周工作时间累计不超过40小时","B. 劳动者不能同多家单位同时签订非全日制用工合同","C. 非全日制用工当事人可以约定短时间的试用期","D. 非全日制用工合同终止时，用人单位不向劳动者支付经济补偿"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"从事非全日制用工的劳动者可以与一个或者一个以上用人单位订立劳动合同；但是，后订立的劳动合同_____先订立的劳动合同的履行（）","answer":"A","options":["A. 不得影响","B. 优先于","C. 可以代替","D. 依赖于"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"非全日制用工小时计酬标准不得低于（）","answer":"A","options":["A. 用人单位所在地人民政府规定的最低小时工资标准","B. 劳动者住所地人民政府规定的最低小时工资标准","C. 用人单位所在地人民政府公布的平均小时工资标准","D. 劳动者住所地人民政府公布的平均小时工资标准"],"explanation":"","tags":["劳动合同法","XX1004","第6章","单选"]},{"question":"根据《劳动合同法》第57条的规定，劳务派遣单位应符合哪些条件？（）","answer":"ABCD","options":["A. 注册资本不得少于人民币200万元","B. 有与开展业务相适应的固定的经营场所和设施","C. 有符合法律、行政法规规定的劳务派遣管理制度","D. 法律、行政法规规定的其他条件"],"explanation":"","tags":["劳动合同法","XX1004","第6章","多选"]},{"question":"在劳务派遣中，用工单位应当履行的义务有（）","answer":"ABCD","options":["A. 执行国家劳动标准，提供相应的劳动条件和劳动保护","B. 告知被派遣劳动者的工作要求和劳动报酬","C. 支付加班费、绩效奖金，提供与工作岗位相关的福利待遇","D. 对在岗被派遣劳动者进行工作岗位所必需的培训"],"explanation":"","tags":["劳动合同法","XX1004","第6章","多选"]},{"question":"根据《劳动合同法》第65条第2款的规定，被派遣劳动者有_____情形，用工单位可以将劳动者退回劳务派遣单位（）","answer":"ABD","options":["A. 被派遣劳动者在试用期内被证明不符合录用条件的","B. 被派遣劳动者严重违反用工单位的规章制度的","C. 被派遣劳动者严重失职，营私舞弊，给用工单位的利益造成重大损害的","D. 被派遣劳动者患病或者非因工负伤的"],"explanation":"","tags":["劳动合同法","XX1004","第6章","多选"]},{"question":"简述劳务派遣主体之间的法律关系。","answer":"劳务派遣法律关系在逻辑上可以划分为三个双边法律关系：劳务派遣单位和用工单位之间的劳务派遣协议关系、劳务派遣单位与被派遣劳动者之间的形式劳动关系、用工单位和被派遣劳动者之间的实际劳动关系。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第6章","简答"]},{"question":"简述被派遣劳动者在劳务派遣中享有的权利。","answer":"（1）享有与用工单位的劳动者同工同酬的权利；（2）享有依法参加或者组织工会的权利；（3）依法享有解除合同的权利。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第6章","简答"]},{"question":"简述用工单位在劳务派遣中的法定义务。","answer":"《劳动合同法》第62条、第67条及《劳动合同法实施条例》相关条文规定，用工单位应当履行下列义务：（1）执行国家劳动标准，提供相应的劳动条件和劳动保护；（2）告知被派遣劳动者的工作要求和劳动报酬；（3）支付加班费、绩效奖金，提供与工作岗位相关的福利待遇；（4）对在岗被派遣劳动者进行工作岗位所必需的培训；（5）连续用工的，实行正常的工资调整机制，及时调整被派遣劳动者的工资、奖金及福利待遇；（6）不得将被派遣劳动者再派遣到其他用人单位，只对被派遣劳动者享有直接使用管理权，不得实施二次派遣；（7）不得设立劳务派遣单位向本单位或者所属单位派遣劳动者，包括用人单位或者其所属单位出资或者合伙设立的劳务派遣单位向本单位或所属单位派遣劳动者的情形；（8）不得向被派遣劳动者收取费用。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第6章","简答"]},{"question":"简述劳动合同法对非全日制用工的特殊规定。","answer":"（1）劳动合同订立的特殊规定《劳动合同法》第69条规定：“非全日制用工双方当事人可以订立口头协议。从事非全日制用工的劳动者可以与一个或者一个以上用人单位订立劳动合同；但是，后订立的劳动合同不得影响先订立的劳动合同的履行。”（3）劳动合同试用期的特殊规定：非全日制用工双方当事人不得约定试用期。（4）劳动报酬的特殊规定：非全日制用工小时计酬标准不得低于用人单位所在地人民政府规定的最低小时工资标准。非全日制用工劳动报酬结算支付周期最长不得超过十五日。（5）劳动合同解除和终止的特殊规定。《劳动合同法》第71条规定：“非全日制用工双方当事人任何一方都可以随时通知对方终止用工。终止用工，用人单位不向劳动者支付经济补偿。”“终止用工”既包括因劳动合同期满而导致的终止，也包括劳动合同期没有届满而解除劳动合同的情形。这种通知无须提前发出，即时提出即可实现终止劳动关系的目的，而且，在非全日制用工状态下，用人单位提出终止的，无须向劳动者支付经济补偿，这和全日制用工是截然不同的。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第6章","简答"]},{"question":"劳动行政部门开展监督检查的方式主要有（）","answer":"ABCD","options":["A. 日常巡视检查","B. 针对用人单位报送的书面材料进行检查","C. 专项检查","D. 对举报和投诉的查处"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"相关行政部门的监督，主要包括企业所在地的_____等机关进行的监督检查工作（）","answer":"ABCD","options":["A. 财政部门","B. 税务部门","C. 工商行政管理部门","D. 教育行政管理部门"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"劳动行政部门实施劳动保障监察，有权采取的调查、检查措施有（）","answer":"ABC","options":["A. 进入用人单位的劳动场所进行检查","B. 就调查、检查事项询问有关人员","C. 采取记录、录音、录像、照相或者复制等方式收集有关情况和资料","D. 对有关人员采取强制措施"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"用人单位的民事责任包括（）","answer":"ABCD","options":["A. 返还财产","B. 继续履行","C. 支付相关费用","D. 赔偿损失"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"关于拒不支付劳动报酬罪，说法正确的是（）","answer":"AC","options":["A. 拒不支付劳动报酬罪是纯正的不作为犯罪","B. 拒不支付劳动报酬罪是纯正的作为犯罪","C. 拒不支付劳动报酬罪的主观方面是故意犯罪","D. 拒不支付劳动报酬罪的主观方面是故意犯罪和过失犯罪相结合"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"用人单位_____应按应付金额50%以上100%以下标准向劳动者支付赔偿金（）","answer":"ABCD","options":["A. 克扣或者无故拖欠劳动者工资报酬的","B. 解除劳动合同未依法给予劳动者经济补偿的","C. 支付劳动者的工资低于当地最低工资标准的","D. 以上三项劳动行政部门责令限期支付，用人单位逾期不支付的"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"关于劳动者的民事责任，说法正确的是（）","answer":"AD","options":["A. 承担民事责任的前提是劳动者有过错","B. 承担民事责任的前提是劳动者无过错","C. 责任的性质主要是严格责任","D. 责任的性质主要是约定责任"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"监督用人单位是否遵守《劳动合同法》的相关规定，是_____赋予工会的一项基本职责（）","answer":"AB","options":["A. 《劳动合同法》","B. 《工会法》","C. 《行政监察法》","D. 《宪法》"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"劳动者对用人单位造成损失的，赔偿的项目包括（）","answer":"ABCD","options":["A. 招收录用劳动者所支付的费用","B. 为劳动者支付的培训费用（双方另有约定的按约定办理）","C. 对生产、经营和工作造成的直接经济损失","D. 劳动合同约定的其他赔偿项目"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"下列选项中，用人单位需要对劳动者承担实际赔偿责任的有（）","answer":"ABCD","options":["A. 用人单位违反《劳动合同法》规定，以担保或者其他名义向劳动者收取财物的，给劳动者造成损害的","B. 用人单位提供的劳动合同文本未载明本法规定的劳动合同必备条款或者用人单位未将劳动合同文本交付劳动者，给劳动者造成损害的","C. 用人单位直接涉及劳动者切身利益的规章制度违反法律、法规规定，给劳动者造成损害的","D. 用人单位违反《劳动合同法》规定未向劳动者出具解除或者终止劳动合同的书面证明，给劳动者造成损害的"],"explanation":"","tags":["劳动合同法","XX1004","第7章","多选"]},{"question":"劳动监督检查","answer":"劳动监督检查是指法律规定的行政主体或法律授权的社会组织及个人为保护劳动者的合法权益，对用人单位和劳动服务主体遵守劳动法律法规的情况进行的监督检查。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第7章","名词解释"]},{"question":"劳动行政部门监督检查的主要内容有哪些？","answer":"（1）检查用人单位制定直接涉及劳动者切身利益的规章制度及其执行的情况。（2）监督检查用人单位与劳动者订立和解除劳动合同的情况。（3）监督检查劳务派遣单位和用工单位遵守劳务派遣有关规定的情况。（4）监督检查用人单位遵守国家关于劳动者工作时间和休息休假规定的情况。（5）监督检查用人单位支付劳动合同约定的劳动报酬和执行最低工资标准的情况。（6）监督检查用人单位参加各项社会保险和缴纳社会保险费的情况。（7）监督检查法律、法规规定的其他劳动监察事项。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第7章","简答"]},{"question":"用人单位承担责令改正的法律责任的情形有哪些？","answer":"（1）用人单位直接涉及劳动者切身利益的规章制度违反法律、法规规定的，由劳动行政部门责令改正。（2）用人单位提供的劳动合同文本未载明《劳动合同法》规定的劳动合同必备条款或者用人单位未将劳动合同文本交付劳动者的，由劳动行政部门责令改正。（3）用人单位违反《劳动合同法》规定与劳动者约定试用期的，由劳动行政部门责令改正。（4）用人单位违反《劳动合同法》规定未向劳动者出具解除或者终止劳动合同的书面证明，由劳动行政部门责令改正。（5）劳务派遣单位违反《劳动合同法》规定的，由劳动行政部门和其他有关主管部门责令改正。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第7章","简答"]},{"question":"用人单位违法解除或终止劳动合同的，应当怎样处理？","answer":"根据《劳动合同法》第四十八条、第八十七条的规定，用人单位违法解除或者终止劳动合同，劳动者要求继续履行劳动合同的，用人单位应当继续履行；劳动者不要求继续履行劳动合同或者劳动合同已经不能继续履行的，用人单位应当依照经济补偿标准的两倍向劳动者支付赔偿金。","options":[],"explanation":"","tags":["劳动合同法","XX1004","第7章","简答"]},{"question":"_____年，由美国著名的政治学家勒纳和拉斯韦尔共同主编的《政策科学：视野与方法的近期展》一书面世。该书首次提出并界定了“政策科学”这一概念（）","answer":"D","options":["A. 1947","B. 18、19世纪","C. 1950","D. 1951"],"explanation":"","tags":["公共政策","XX1010","第1章","单选"]},{"question":"“政策分析”作为学术术语是由美国耶鲁大学教授林德布洛姆于1956年出版的_____一书中首先提出的（）","answer":"A","options":["A. 《政策分析》","B. 《政策研究》","C. 《政策问题》","D. 《公共政策》"],"explanation":"","tags":["公共政策","XX1010","第1章","单选"]},{"question":"政策分析乃是一种_____结合的活动（）","answer":"A","options":["A. 科学与艺术","B. 科学与实践","C. 理论与实践","D. 理论与艺术"],"explanation":"","tags":["公共政策","XX1010","第1章","单选"]},{"question":"上古时代直到20世纪中期的政策研究，统称为（）","answer":"C","options":["A. 古代的政策研究","B. 前现代公共政策学时期的政策研究","C. 前公共政策学时期的政策研究","D. 近代的政策研究"],"explanation":"","tags":["公共政策","XX1010","第1章","单选"]},{"question":"公共政策学的学科要素有三个（）","answer":"ACD","options":["A. 研究对象","B. 研究方案","C. 研究方法","D. 概念体系"],"explanation":"","tags":["公共政策","XX1010","第1章","多选"]},{"question":"公共政策学的概念体系在内部构成上区分为三个层次（）","answer":"BCD","options":["A. 中心概念","B. 核心概念","C. 次级概念","D. 边际概念"],"explanation":"","tags":["公共政策","XX1010","第1章","多选"]},{"question":"后现代主义是对科学理性精神的呼唤。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第1章","判断"]},{"question":"公共政策学","answer":"公共政策学是这样一门学科，它尽可能地运用科学方法研究公共政策的内容、过程与产出，探索其固有规律，形成系统性知识，并运用这种知识进行政策分析，进而通过公共权力机关将研究成果转化为政策实践。","options":[],"explanation":"","tags":["公共政策","XX1010","第1章","名词解释"]},{"question":"公共政策学的边际概念","answer":"指的是从其他学科引进或移植过来的概念。","options":[],"explanation":"","tags":["公共政策","XX1010","第1章","名词解释"]},{"question":"如何进行公共政策研究程序的设计？","answer":"（1）提出拟研究的政策问题。（2）确定假设。（3）收集系统资料。（4）资料分析。（5）做操作性研究。（6）写作研究报告。","options":[],"explanation":"","tags":["公共政策","XX1010","第1章","简答"]},{"question":"为什么要学习公共政策学？","answer":"（1）是为了改进政策系统，提高政策质量。（2）是为了教育群众理解公共政策，运用政策争取和保护自身的和公共的利益，以适当的方式向公共组织特别是公共权力组织提出政策建议。（3）是为了推动社会科学和自然科学各学科的研究工作具有公共政策研究的取向。","options":[],"explanation":"","tags":["公共政策","XX1010","第1章","简答"]},{"question":"“以民为本”的思想资源有哪些内容？","answer":"（1）“立君为民”；（2）“以百姓心为心”；（3）“因民之所利而利之”；（4）“与民同情”；（5）“爱民养生”；（6）“取信于民”。","options":[],"explanation":"","tags":["公共政策","XX1010","第1章","简答"]},{"question":"小武和小陈都是在外省市读大学获得硕士学位以后来到北京中关村一家科技公司工作的，小陈已工作10年，小武也有4年，他们的爱人都还没落上北京户口。小武学过公共政策学，养成凡事都找相关政策看看的习惯。一年前，小陈突然听说单位给小武解决了妻子户口进京的问题，而自己妻子户口进京一事却杳无音信。他既讶异又窝火，决定找小武问个究竟。小武说：“这个不难呀，你去人事科那里说一下，自己写一份要求解决夫妻两地分居的申请书，单位领导签个字，你再递交一些有关证明就行了。”小陈将信将疑。小武好像看透了对方的心思，又说：“这是按已有的政策办事接着，他建议小陈从互联网上搜索自20世纪90年代以来国家有关部委和北京市政府有关部门制定的一系列政策文件，如《关于解决中级专业技术干部夫妻两地分居问题的通知》、《关于解决民营科技与高新技术产业单位在市、区、县人才服务中心存档人员的夫妻两地分居问题的通知》等。小陈按图索骥，获取了有关政策信息，依照小武的介绍来了个如法炮制。结果，不到半年时间，他妻子的北京户口顺利到手。小陈乐滋滋地逢人便说：“原来解决北京户口最好的门道是懂政策，真是醉了。”请问：（1）结合本案例，谈谈学习公共政策学对人们的生活和工作有哪些作用。（2）分析本案例中小陈是如何学会运用政策去争取和保护自身利益的？","answer":"（1）结合本案例，谈谈学习公共政策学对人们的生活和工作有哪些作用。公共政策学是一门具有很强的社会应用性的学科，同时它也是一个需要进行广泛而深入的理论探讨的领域。我们学习和研究公共政策学，其必要性或者基本的意义有以下几个方面：一是为了改进政策系统，提高政策质量；二是为了教育群众理解公共政策，运用政策争取和保护自身的和公共的利益，以适当的方式向公共组织特别是公共权力组织提出政策建议；三是为了推动社会科学和自然科学各学科的研究工作具有公共政策研究的取向。（2）分析本案例中小陈是如何学会运用政策去争取和保护自身利益的？小陈根据小武的提示，从互联网上搜索自20世纪90年代以来国家有关部委和北京市政府有关部门制定的一系列政策文件，如《关于解决中级专业技术干部夫妻两地分居问题的通知》、《关于解决民营科技与高新技术产业单位在市、区、县人才服务中心存档人员的夫妻两地分居问题的通知》等。小陈按图索骥，获取了有关政策信息，依照小武的介绍来了个如法炮制。结果，不到半年时间，他妻子的北京户口顺利到手。","options":[],"explanation":"","tags":["公共政策","XX1010","第1章","案例分析"]},{"question":"_____便成为推动整个社会发展的直接动力（）","answer":"C","options":["A. 阶级矛盾","B. 生产力和生产关系","C. 阶级斗争","D. 经济基础和上层建筑"],"explanation":"","tags":["公共政策","XX1010","第2章","单选"]},{"question":"以下选项哪_____项不属于政府机构赋予政策的特征（）","answer":"D","options":["A. 合法性","B. 普遍性","C. 强制性","D. 合理性"],"explanation":"","tags":["公共政策","XX1010","第2章","单选"]},{"question":"社会学制度主义的理论基础是建立在“_____”假设之上的（）","answer":"A","options":["A. 社会人","B. 经济人","C. 理性人","D. 政治人"],"explanation":"","tags":["公共政策","XX1010","第2章","单选"]},{"question":"我国现在仍处于_____阶段。因此，各项政策应该建立在现阶段的经济基础之上，并且要为经济基础服务（）","answer":"B","options":["A. 社会主义高级阶段","B. 社会主义的初级","C. 社会主义的中级阶段","D. 社会主义"],"explanation":"","tags":["公共政策","XX1010","第2章","单选"]},{"question":"从系统分析的内容来看，对公共政策系统的分析通常三个方面（）","answer":"ABC","options":["A. 政策系统的环境分析","B. 政策系统的目标分析","C. 政策系统的结构分析","D. 政策系统的效果分析"],"explanation":"","tags":["公共政策","XX1010","第2章","多选"]},{"question":"中华人民共和国成立以后，我国逐步形成了“两个阶级一个阶层”是指（）","answer":"ABC","options":["A. 工人阶级","B. 知识分子阶层","C. 农民阶级","D. 新阶层"],"explanation":"","tags":["公共政策","XX1010","第2章","多选"]},{"question":"非正式约束是人们在长期的社会交往中无意识地形成的，主要包括价值观念、伦理规范、道德观念、风俗习惯、意识形态等因素。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","判断"]},{"question":"理性选择制度主义从“社会人”假设出发。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","判断"]},{"question":"社会主义国家公共政策的制定应当坚持马克思主义的立场、观点和方法，政策研究和政策分析同样应当坚持马克思主义的世界观和方法论。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","判断"]},{"question":"新制度主义是传统制度主义的否定之否定。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","判断"]},{"question":"社会形态（马克思）","answer":"就是生产力发展一定阶段的经济基础和上层建筑的统一，或者说是一定社会发展阶段上经济制度、政治制度和思想文化体系的总称，是这个阶段生产力和生产关系、经济基础和上层建筑的具体的、历史的统一。","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","名词解释"]},{"question":"狭义的制度","answer":"狭义的制度指的就是正式约束及其结构化的形式，特别是组织机构及其所遵循的规则。","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","名词解释"]},{"question":"公共政策价值观","answer":"指的是“政策制定者以及其他涉及决策过程的人共有的偏好、个人愿望和目标。","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","名词解释"]},{"question":"矛盾分析法在当代中国公共政策中的应用体现在哪些方面？","answer":"（1）矛盾普遍性和特殊性的辩证关系要求我们在普遍性原理的指导下，具体地分析矛盾的特殊性。分析政策问题、制定和执行政策，必须坚持具体问题具体分析，反对不问具体情况的“一刀切”，反对把马克思主义当作教条的错误思想和做法。（2）主要矛盾与次要矛盾的辩证关系要求我们在分析政策问题、制定和执行政策时首先要善于抓住重点，抓住关键，集中主要力量去解决主要矛盾，同时又要学会统筹兼顾，恰当地处理次要矛盾，学会“弹钢琴”。（3）矛盾的主、次方面的辩证关系要求我们在分析政策问题、制定和执行政策时要善于抓住重点，分清事物的主流和支流，坚持两点论和重点论的统一。","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","简答"]},{"question":"新制度主义的三大流派有哪些？","answer":"（1）新制度主义是在传统制度分析的基础上，批判吸收了行为主义的研究方法，同时借鉴了社会学、制度经济学以及其他社会科学的研究成果，因此在其内部形成了多种分支。（2）按照彼得·霍尔和罗斯玛丽·泰勒的划分，我们着重介绍“历史制度主义”、“理性选择制度主义”和“社会学制度主义”这三大流派。","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","简答"]},{"question":"价值分析在公共政策研究中有着极其重要的意义与作用？","answer":"（1）价值规范是由一定社会的政治、经济、历史、地理、文化、心理等诸因素所决定的既成力量，它是政策分析的指导准则，而不是政策过程的结果。（2）价值观念在很大程度上反映了人们的社会需求与行为方向，因此运用价值分析方法，可以了解人们价值观念的变化与趋向，从而有助于我们把握某种新的价值观念以及价值规范的形成过程，并在公共政策的分析与决策中确立新的价值准则。（3）社会的价值观念并不因为公共政策系统中个别的决策行为而改变，但随着整个社会政策系统的展开，人们的价值观念将随之而发生新的转变。","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","简答"]},{"question":"运用历史或比较的方法，撰写一个公共政策学案例。","answer":"中国共产党在不同历史时期的土地政策（1）土地革命时期：《井冈山土地法》、《兴国土地法》；（2）抗日战争时期：地主减租减息、农民交租交息；（3）解放战争时期：《中国土地法大纲》，实现‘耕者有其田’；中华人民共和国土地改革法；（4）社会主义革命时期：社会主义改造；（5）社会主义建设时期：大跃进人民公社化；（6）改革开放新时期：家庭联产承包责任制、所有权使用权分离；（7）新时代中国特色社会主义：土地流转为集约化经营，实现所有权使用权经营权三权分离。","options":[],"explanation":"","tags":["公共政策","XX1010","第2章","案例分析"]},{"question":"政策调查资料的收集方法主要分为自填问卷法和（）","answer":"B","options":["A. 网络搜集法","B. 结构访谈法。","C. 非结构访谈法","D. 随机访问法"],"explanation":"","tags":["公共政策","XX1010","第3章","单选"]},{"question":"_____是指政策研究者对访谈的走向和步骤起主导作用，按照自己事先设计好的具有固定结构的统一问卷进行访谈的方法（）","answer":"A","options":["A. 结构访谈法","B. 非结构访谈法","C. 概率抽样法","D. 非概率抽样法"],"explanation":"","tags":["公共政策","XX1010","第3章","单选"]},{"question":"_____是用经验证据来说明某种政策理论或概念的方法（）","answer":"D","options":["A. 经验研究法","B. 案例分析法","C. 经验分享法","D. 举例说明法"],"explanation":"","tags":["公共政策","XX1010","第3章","单选"]},{"question":"_____访谈法又称无结构访谈法，是一种非标准化、非格式化的政策研究资料的收集方法（）","answer":"C","options":["A. 直接访谈法","B. 提纲访谈法","C. 深度访谈法","D. 第一访谈法"],"explanation":"","tags":["公共政策","XX1010","第3章","单选"]},{"question":"研究方式的选择往往根据以下三项原则（）","answer":"ABD","options":["A. 研究对象优先","B. 研究效率优先","C. 研究结果优先","D. 方法资源优先"],"explanation":"","tags":["公共政策","XX1010","第3章","多选"]},{"question":"所谓测试的层次，是根据测试的精确程度，将测度的水平分成_____层次（）","answer":"ABCD","options":["A. 定类测量","B. 定序测量","C. 定距测定","D. 定比测量"],"explanation":"","tags":["公共政策","XX1010","第3章","多选"]},{"question":"解决政策过程中的线性规划问题有三个步骤（）","answer":"ABC","options":["A. 建立模型","B. 问题求解","C. 敏感性分析","D. 结果规划"],"explanation":"","tags":["公共政策","XX1010","第3章","多选"]},{"question":"抽样调查与全面调查相比，样本量大大减少，从而可以显著地节省人力、物力和财力。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","判断"]},{"question":"定性资料分析不如定量资料分析科学。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","判断"]},{"question":"结构访谈法是一手资料分析法。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","判断"]},{"question":"标准差是表示所有变量值的离散趋势的统计量。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","判断"]},{"question":"非概率抽样","answer":"又称非随机抽样，是指抽样时不遵循随机原则，而是按照政策研究人员的主观判断或仅仅按照方便的原则抽选样本。","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","名词解释"]},{"question":"“大数据”","answer":"原意是指海量数据，目前是指体量特别大、数据类别特别多的数据集。","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","名词解释"]},{"question":"公共政策中的基本研究方式划分为哪四种类型？","answer":"（1）调查研究。这是政策研究经常采用的方式，主要是釆用自填问卷、结构式访谈的方法，系统地、直接地从一个取自总体的样本收集量化资料，并通过对这些资料的统计分析来认识公共政策现象及其规律。（2）实验研究。政策过程中存在许多变量，变量之间互相作用、互相依存，从而影响着政策的制定和执行。（3）实地研究。这种研究方式主要用于获得定性资料。（4）非介入性研究。这种研究方式也被称为无回应性研究或者文献研究。","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","简答"]},{"question":"网上调査的方法主要有哪些？","answer":"主要可以分为交互式计算机辅助电话访谈系统、网上问卷方法和网上调査系统三种基本类型。","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","简答"]},{"question":"定量分析方法的局限性有哪些？","answer":"（1）定量方法的工具基础是数学，即运用数学方法获得最优解。（2）定量方法借助的数学模型在建立时，往往也是依据一定的靠主观判断的假定和研究框架来完成的。（3）数学方法运用于解决常规性问题十分有效，但对于大量的非常规性问题，定量方法的应用至今尚不尽如人意。（4）定量方法本身的特点决定了它不易被非专业人员接受或掌握，因为它过于依赖特定的符号和话语。另外，定量分析方法一般来说成本较高，需要投入大量的人力、物力、财力。（5）定量分析方法处理不好过去的政策和价值标准对公共政策制度化的影响问题，这就可能妨碍政策分析人员做出合理的分析结论。","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","简答"]},{"question":"大数据对政策研究、政策分析初步的影响有哪些？","answer":"大致可以概括如下：（1）对于政策规划产生影响。（2）对于政策预测产生影响。（3）获取政策信息的能力得到加强。（4）大数据必将提高公众参与政策制定的积极性。","options":[],"explanation":"","tags":["公共政策","XX1010","第3章","论述"]},{"question":"_____是一个有目的的活动过程（）","answer":"C","options":["A. 决策","B. 对策","C. 决定","D. 决议"],"explanation":"","tags":["公共政策","XX1010","第4章","单选"]},{"question":"政策当主体被限定为国家、政府、公共权力机关时，指的都是（）","answer":"A","options":["A. 公共政策","B. 公共问题","C. 私人决策","D. 公共利益"],"explanation":"","tags":["公共政策","XX1010","第4章","单选"]},{"question":"政策的社会本质：_____的对立统一（）","answer":"A","options":["A. 公共性与偏好性","B. 普遍性与特殊性","C. 公共性与私人性","D. 公共性与特殊性"],"explanation":"","tags":["公共政策","XX1010","第4章","单选"]},{"question":"公共政策的产生必须有三个初始条件（）","answer":"ABD","options":["A. 公共问题的形成","B. 公共权力机关的产生","C. 公共政策主体","D. 公共强制机构的出现"],"explanation":"","tags":["公共政策","XX1010","第4章","多选"]},{"question":"以同一政策体系内的各项政策相互间是否存在着涵盖与衍生的关系为标准，公共政策可以划分为（）","answer":"ABC","options":["A. 元政策","B. 基本政策","C. 部门政策","D. 行业政策"],"explanation":"","tags":["公共政策","XX1010","第4章","多选"]},{"question":"依政策内容的社会领域的不同，公共政策可划分成如下的基本类型（）","answer":"ABCD","options":["A. 政治政策","B. 经济政策","C. 文化政策","D. 社会政策"],"explanation":"","tags":["公共政策","XX1010","第4章","多选"]},{"question":"政策是法的来源和动力，并且对法的制定和执行具有方向性的引导作用；法为政策提供保障，定型化为法律的政策具有更强的稳定性和连续性。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","判断"]},{"question":"政策的认识论本质：理论与实践的中间环节","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","判断"]},{"question":"政策的社会本质：公共性与偏好性的对立统一","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","判断"]},{"question":"政策工具，指的是被设定为旨在实现一定政策目标的各种措施、策略、方法、技术、机制、行动、作为以及配置的人力、资金、设备、资源等手段。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","判断"]},{"question":"公共政策","answer":"公共政策是公共权力机关经由政治过程所选择和制定的为解决公共问题、达成公共目标、实现公共利益的方案。","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","名词解释"]},{"question":"社会价值的分配","answer":"所谓社会价值的分配，指的是作为政策成本的社会资源投入后，随着政策目标的实现而获取的政策收益在不同的社会群体间的分布。","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","名词解释"]},{"question":"元政策","answer":"或者叫作总政策，是政策体系中管总的或具有统摄性的政策，对其他各项政策起指导和规范的作用，是其他各项政策的出发点和基本依据，是政策主体用以指导一定历史时期全局性行动的高度原则性的指针。","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","名词解释"]},{"question":"公共政策的基本功能？","answer":"（1）管制功能；（2）引导功能；（3）调控功能；（4）分配功能。","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","简答"]},{"question":"公共政策的基本特征？","answer":"（1）政治性、权威性与强制性；（2）应然与实然的对立统一；（3）回应性与普遍性的统一。","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","简答"]},{"question":"影响政策工具选择的重要因素？","answer":"（1）政策主体；（2）政策问题选择；（3）政策目标；（4）目标人群；（5）政策工具特性；（6）工具实施环境；（7）政策工具选择的国际借鉴。","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","简答"]},{"question":"试比较中国和美国公共政策的横向形式构成与纵向形式构成，如中美两国在司法决策上有什么重大差异","answer":"（1）中国的纵向政策类型根据现行宪法，当代中国作为单一制国家，基本政策的制定权属于中央，地方政策的制定必须在中央政策的指导下进行，其目标、方向和行为规范为中央政策所决定，所以地方政策只是中央政策的具体化。从形式上看，当代中国地方政府有两个、三个、四个层级。在实行单一制国家结构的中国，地方政策、基层政策仍具有一定的能动性。当今世界各国（国土狭小、人口不多的国家另当别论），不管采取哪种国家结构形式，中央政策都只能是一些原则规定，可称之为宏观政策。地方人大决策获得法的形态的那一部分是地方性法规、自治条例和单行条例。中国是单一制国家，进行地方立法通常只是执行国家立法和补充国家立法的结果。地方行政决策获得法的形态的那一部分是地方性规章，根据现行宪法和地方政权组织法，地方各级政府中，有权制定规章的只是法律明确授权的地方政府，即：省、自治区、直辖市的人民政府；经国务院批准的284个设区的市的人民政府。地方政策中未获得法的形态的那一部分，以及基层政策，是地方政府以及基层政府发布的行政措施、决议和命令。（2）美国作为联邦制国家，中央政府（联邦政府、全国政府）与州政府的关系，不同于当代中国中央政府与省（自治区、直辖市）政府之间那样的中央与地方的关系。虽然宪法规定联邦地位高于各州，联邦政府制定的诸项政策在各州必须得以实施，但是中央政策与州政策之间却不是决定与被决定、服从与被服从的关系。","options":[],"explanation":"","tags":["公共政策","XX1010","第4章","论述"]},{"question":"所谓_____，就是公共政策直接作用与影响的公众群体或那些受公共政策规范、激励、管制、调节和制约的社会成员（）","answer":"B","options":["A. 特定人群","B. 目标人群","C. 目标客体","D. 目标对象"],"explanation":"","tags":["公共政策","XX1010","第5章","单选"]},{"question":"_____是民众作为利益表达主体，为实现其利益诉求，通过一定的渠道直接或间接地向政策系统输入有关信息，同时政府有针对性地予以回应，而形成的有效互动的程序、方式和制度的总称（）","answer":"A","options":["A. 民意表达机制","B. 民意反馈机制","C. 民意上传机制","D. 民意解决机制"],"explanation":"","tags":["公共政策","XX1010","第5章","单选"]},{"question":"_____则是运用国家制度管理社会各方面事务的能力（）","answer":"A","options":["A. 治理能力","B. 治理效能","C. 治理智慧","D. 治理效果"],"explanation":"","tags":["公共政策","XX1010","第5章","单选"]},{"question":"民意有“显性民意”与“_____民意”之别（）","answer":"B","options":["A. 显性","B. 潜在","C. 真实","D. 虚假"],"explanation":"","tags":["公共政策","XX1010","第5章","单选"]},{"question":"政策监控系统的基本功能有（）","answer":"ABC","options":["A. 建立政策监控标准","B. 监测政策绩效","C. 发现和纠正政策执行偏差","D. 监测完成情况"],"explanation":"","tags":["公共政策","XX1010","第5章","多选"]},{"question":"政策评估系统由五（）","answer":"ABCD","options":["A. 政策评估主体","B. 评估对象","C. 评估目的","D. 评估标准和评估方法"],"explanation":"","tags":["公共政策","XX1010","第5章","多选"]},{"question":"从政策的社会效果来看，利益与代价的对应关系存在四种基本类型是指（）","answer":"ABCD","options":["A. 利益范围宽、代价范围宽","B. 利益范围广、代价范围窄","C. 利益范围窄、代价范围宽","D. 利益范围窄、代价范围窄"],"explanation":"","tags":["公共政策","XX1010","第5章","多选"]},{"question":"民意表面上是群体意见，实则是个体意见的集合。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","判断"]},{"question":"利益集团参与和影响政治过程，以夺取和执掌政权为目标。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","判断"]},{"question":"民意表达实质上是公民民主政治权利的行使。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","判断"]},{"question":"政策系统","answer":"是指一个由政策主体和其他利益相关者，以及将他们与政策客体、政策环境联系起来的政策支持系统、政策反馈系统等所组成的有机整体。","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","名词解释"]},{"question":"公共政策主体","answer":"是相对于政策客体而言的。它是指那些在特定政策环境中直接或间接地参与公共政策制定、实施、评估、监控的行为者。","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","名词解释"]},{"question":"政策网络","answer":"是指在政策系统和政策过程中，政策行为者围绕特定的议题，基于共同的、实际上是不断协商的信念和利益而结成的正式的（制度性的）和非正式的联系。","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","名词解释"]},{"question":"政策网络的主要特征有哪些？","answer":"（1）政策网络是现代民主社会里，由公共部门、私人部门和第三部门等多元、异质的参与主体组成的，包括政府官员、行政人员、国会议员、专家学者、利益团体、大众媒体等与某项特定政策有关的利益相关者，他们围绕政策过程进行互动而形成一种组织结构，这种结构的紧密程度并不一致，从松散的议题网络到关系密切的政策社群，成为一个广泛的类型谱系。（2）政策网络的多元主体之间在资源等方面相互依赖，或者以共同的价值取向和共同的话语体系为纽带，在特定的政策领域进行合作，以协调行动，实现共赢。（3）政策网络的规模和边界并不是由正式的制度决定的，而是政策行为者对功能和结构认知的结果。","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","简答"]},{"question":"政策环境有哪些？","answer":"（1）政策系统的一般环境政策系统的一般环境，也就是作用和影响公共政策的所有外部条件的总和，包括地理自然环境、经济环境、政治法治环境、社会文化环境、国际环境等。（2）政策系统的工作环境政策系统的工作环境是政策一般环境中的不同部分在特定时间点上的聚合，因而具有多样性、变动性、主观性和人为性等特点。","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","简答"]},{"question":"何谓决策规则？基本的决策规则有哪些？","answer":"所谓决策规则，就是决策主体择定最终政策方案的程序和方法。政策制定主体可选择和实行的基本决策规则有以下两种：（1）全体一致规则。（2）多数规则①简单多数规则。②绝对多数规则。","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","论述"]},{"question":"当今世界各主要国家的公共决策体制可划分为哪些类型？","answer":"在人类历史发展的不同时代，出现过各种不同类型的公共决策体制。以最高决策权的最终归属为标准，这些决策体制可划分为原始民主制、神权制、君权制、议会制、人民代表大会制、法西斯制和军人独裁制等。而当今世界各主要国家的公共决策体制，则可区分为以下几种类型：总统制、议会制、半总统半议会制、超级总统制、委员会制、人民代表大会制、军人独裁制。","options":[],"explanation":"","tags":["公共政策","XX1010","第5章","案例分析"]},{"question":"多元决策可能表现为一种冲突，解决冲突的方法有使用武力、_____、协商三种（）","answer":"A","options":["A. 博弈","B. 合作","C. 斗争","D. 消灭"],"explanation":"","tags":["公共政策","XX1010","第6章","单选"]},{"question":"构建公共政策过程模型必须借助于两种资源：第一是理论；第二是（）","answer":"C","options":["A. 思想","B. 概念","C. 社会实践","D. 知识"],"explanation":"","tags":["公共政策","XX1010","第6章","单选"]},{"question":"西蒙提出了决策者_____理性命题（）","answer":"C","options":["A. 绝对","B. 全部","C. 有限","D. 全能"],"explanation":"","tags":["公共政策","XX1010","第6章","单选"]},{"question":"德洛尔的三分法把政策过程划分为（）","answer":"ABD","options":["A. 前决策阶段","B. 决策中阶段","C. 决策后阶段","D. 后决策阶段"],"explanation":"","tags":["公共政策","XX1010","第6章","多选"]},{"question":"施米特把组合主义划分（）","answer":"AC","options":["A. 国家组合主义","B. 人类组合主义","C. 社会组合主义","D. 政府组合主义"],"explanation":"","tags":["公共政策","XX1010","第6章","多选"]},{"question":"政策过程理论模型可以分成（）","answer":"AB","options":["A. 描述模型","B. 规范模型","C. 历史模型","D. 比较模型"],"explanation":"","tags":["公共政策","XX1010","第6章","多选"]},{"question":"金敦认为政策过程通常分为_____四阶段（）","answer":"ABCD","options":["A. 议程设定","B. 方案陈述","C. 权威性选择","D. 决策执行"],"explanation":"","tags":["公共政策","XX1010","第6章","多选"]},{"question":"就实际的政策过程来说，环节缺失往往成为常态。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","判断"]},{"question":"科学是国家治理体系和治理能力的重要依托，是治国理政不可或缺的重要手段。科学决策是国家治理体系的中心环节和治国理政的基本方式。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","判断"]},{"question":"布里沃和德龙把政策过程划分为创议、预评、选择、执行、评估、终止六个阶段。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","判断"]},{"question":"政策过程","answer":"就是政策的生命过程，就是一项政策从问题认定到政策终结的整个运行过程。","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","名词解释"]},{"question":"政策过程研究","answer":"指的是对影响政策过程的各种主要因素之间的因果关系的发现和检验。","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","名词解释"]},{"question":"理性主义模型","answer":"决策者依据完整而综合的信息做出理性的决策，即他遵循以最小的投入获得最大的产出的原则，选择最优方案，使用最佳、最适当的手段，达到最大值的政策结果。由这样一组假设构成的一个分析路径，就被叫作理性主义模型。","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","名词解释"]},{"question":"精英主义政策过程理论模型的命题是什么？","answer":"（1）社会分为有权的少数和无权的多数。（2）统治人的少数不代表被统治者的多数。精英大多出自社会经济的上等阶层。（3）为了保持稳定和避免发生革命，非精英上升到精英地位的过程必须缓慢而又不间断。（4）精英们在现行社会制度的基本价值和如何维护该制度等方面有相同的理念，只是在很少一些问题上有分歧。（5）公共政策并不反映民众的要求，而只反映盛行于精英中的价值观。（6）相对说来，行动积极的精英受态度冷漠的民众的直接影响很少。精英对民众的影响多于民众对精英的影响。","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","简答"]},{"question":"为什么对政策过程的研究需要借助于模型：","answer":"（1）由于政策过程与政治过程、政府过程具有同一性，政策内容从根本上来说取决于社会、政治因素，取决于决策者的政治行为，因此揭示政策过程的政治实质是政策过程研究的一项根本任务。（2）政策过程的研究强调从个别到一般、从特殊到普遍、从具体到抽象，强调从中发现有关因素之间的因果关系或一定的相关性，发现事物运动的规律。（3）从实践中总结出来的政策过程理论模型有助于我们对政策过程中各种政治行为的把握，为政策制定和执行提供了有价值的参考框架。（4）无论是对政策过程的研究者，还是对实际决策者，政策过程理论模型都是激发他们的想象力和洞察力，帮助他们观察现实世界和系统地获取有关影响政策过程的各种因素的信息的指南。（5）政策过程理论模型可以分成描述模型与规范模型。","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","论述"]},{"question":"“上下来去”——基于中国经验的政策过程理论模型","answer":"新中国成立以来，中国从一个贫穷落后、一盘散沙的弱国，逐渐发展成一个极富活力、日益繁荣、统一团结的强国。特别是改革开放以来，中国实现了现代化进程的成功启动和顺利发展，在经济、社会和政治上都有了巨大的飞跃。尽管在前进的道路上也曾经走了一些弯路，遭遇一些挫折，而且现在仍面临着许多困难和问题，但是中国的现代化事业无可置疑地取得了举世瞩目的成就。“中国的工业化进程规模如此之大、速度如此之快，这在世界上是前所未见的。中国如今在用几年的时间去完成美国和欧洲花了几十年才完成的事情。中国还打算用几十年的时间去完成美国和欧洲花了数百年才完成的事情，且中国实施这一进程的规模要远远大于后者。”“上下来去”政策过程模型是一个以本土经验为依据、具有鲜明的中国特色的政策过程模型。与其他已有的政策过程模型相比较，除了据以抽象的实践经验不同以外，“上下来去”模型还具有以下特征：（1）这一模型遵循的哲学路线是辩证唯物主义和历史唯物主义，而其他政策过程模型遵循的哲学路线则是逻辑实证主义或后现代主义。（2）在“上下来去”模型中，政策运作的逻辑流程是“上”“下”互动的双向流程；而其他模型如多元主义模型和精英主义模型，其政策运行的逻辑流程则是单向的（自下而上或自上而下）。（3）在“上下来去”模型中，“一切经过试验”对于政策的正常运行起着十分重要的作用；而在其他模型中，则未见有关于政策试验的设计。（4）“上下来去”模型明确地把公共政策的制定与执行设定为社会集体行为，即公共政策不仅是领导者集体决策的产物，而且是群众与领导、地方与中央、下级与上级、间接决策者与直接决策者、外围决策者与核心决策者互动的结果。（5）“上下来去”模型的根本诉求是公共决策的科学化与民主化，所以乐于容纳具有同样诉求的其他政策过程模型。","options":[],"explanation":"","tags":["公共政策","XX1010","第6章","案例分析"]},{"question":"政策问题的_____表现在政策问题是发生在社会公共领域的，一般都影响到国家或某一地区的大多数人，与多数人的生活息息相关，并且它必须通过公共权力机构来加以解决（）","answer":"B","options":["A. 关联性","B. 公共性","C. 客观性","D. 主观性"],"explanation":"","tags":["公共政策","XX1010","第7章","单选"]},{"question":"_____是公共问题最直接和最重要的提出主体（）","answer":"A","options":["A. 政府部门","B. 行政人员","C. 政党组织","D. 利益集团"],"explanation":"","tags":["公共政策","XX1010","第7章","单选"]},{"question":"提出公共问题的重要主体（）","answer":"D","options":["A. 政治人物","B. 政府部门","C. 非政府组织","D. 政党组织"],"explanation":"","tags":["公共政策","XX1010","第7章","单选"]},{"question":"_____法是指由一定数目的人员，尤其是一些专家学者或利益当事人，从各个角度共同讨论有关的公共问题，并因而激发大量新构想的一种分析过程和方法。包含阶段：组建团体、意见产出、意见评估、意见排序（）","answer":"A","options":["A. 头脑风暴","B. 德尔菲法","C. 无领导小组讨论","D. 结构化面试"],"explanation":"","tags":["公共政策","XX1010","第7章","单选"]},{"question":"邓恩把问题认定划分为四个相互衔接的步骤（）","answer":"ABCD","options":["A. 问题搜索","B. 问题决定","C. 问题详述","D. 问题感知"],"explanation":"","tags":["公共政策","XX1010","第7章","多选"]},{"question":"约翰·金登的三源流模型。他的模型建立在_____的基础上（）","answer":"ABC","options":["A. 问题流","B. 政策流","C. 政治流","D. 意识流"],"explanation":"","tags":["公共政策","XX1010","第7章","多选"]},{"question":"除了传统的_____等的影响外，互联网等新媒体的发展使得大众传媒更具有前所未有的影响力（）","answer":"ABCD","options":["A. 报纸","B. 杂志","C. 广播","D. 电视"],"explanation":"","tags":["公共政策","XX1010","第7章","多选"]},{"question":"政党组织是公共问题最直接和最重要的提出主体","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","判断"]},{"question":"自媒体不属于大众传媒","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","判断"]},{"question":"问题认定也可以称为“问题界定”。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","判断"]},{"question":"政策问题","answer":"指统治集团或社会大多数人感觉到现实中出现的某种情况与他们的利益、期望、价值和规范有相当严重的矛盾和冲突，进而通过团体或组织活动要求由政府或者通过政府采取行动加以解决，并被后者列入政策议程的社会或公共问题。","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","名词解释"]},{"question":"正常的问题察觉机制","answer":"是指能对各种政策问题经常保持警觉，并能对有关问题及时进行相关讨论、分析和研究，以便形成政策议程构建的机制。这就要求社会和政府建立社会问题信息收集和分析方面常设性的专门机构和队伍，进行正常的问题察觉和研究工作；有关领导人也要经常亲自调查研究，以防下级报喜不报忧，延误问题的察觉和解决进程。","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","名词解释"]},{"question":"问题认定","answer":"就是对需要由公共政策来解决的公共问题进行性质、范围、涉及领域及相关利益关系的界定过程。","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","名词解释"]},{"question":"政策问题的基本内涵有哪些方面？","answer":"（1）客观性内涵：任何问题都源自客观存在的社会现实，政策问题也不例外。政策问题来源于一些可以观察到的，能够表述出来的事实和问题情境。（2）察觉性内涵：这种客观的事实或情境已为社会大多数人或统治集团及其少数权威统治者所察觉，从各自的角度感觉到了问题的存在。（3）冲突性内涵：社会所存在的客观现实状况与统治者或社会大多数人的利益、期望、价值和规范等有相当严重的冲突。（4）组织性内涵社会或公共问题演变为公共政策问题往往不单纯是少数个人行动所致。（5）对策性内涵政策问题要求人们所察觉的问题必须在政府或公共组织的职权范围之内，通常都不可能仅靠少数人或一些私人部门的努力来解决，而必须由有关政府组织或社会公共组织纳入政策议程并依法采取相应的政策行动来加以解决。","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","简答"]},{"question":"进入政策议程的条件？","answer":"（1）事件或问题必须明朗而严重。（2）要有政治权威领导人及专家学者的预测性发动。（3）要有正常、民主和开放的察觉机制与过程。应当说，上述两种条件都仅属一些特别的条件，它们并不能经常地发挥作用；即使能经常发挥作用，世并不是经常单独发挥作用，而必须与正常、民主和开放的问题察觉机制与过程相配合才能奏效。价值分析在公共政策研究中有着极其重要的意义与作用？","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","简答"]},{"question":"进入政策议程的障碍","answer":"（1）与正向条件相对应的反向条件均可构成政策议程的障碍因素。（2）有学者早就专门研究过导致不能进入政策议程的一些障碍因素。（3）一项公共问题能否进入政策议程还在一定程度上与对该问题的表达方式和技巧等有一定的关系。","options":[],"explanation":"","tags":["公共政策","XX1010","第7章","论述"]},{"question":"方案评估与择优的两种主要方法：一是预测性评估，二是（）","answer":"B","options":["A. 阶段性评估","B. 可行性评估","C. 全过程评估","D. 未来性评估"],"explanation":"","tags":["公共政策","XX1010","第8章","单选"]},{"question":"_____就是决策者正式同意釆用某一政策方案来解决列在政策议程中的某个问题。这是政策抉择的最后一环（）","answer":"D","options":["A. 政策规划","B. 政策问题","C. 政策设计","D. 政策采纳"],"explanation":"","tags":["公共政策","XX1010","第8章","单选"]},{"question":"_____就是决策者择定的政策在内容上不能与既定宪法和法律相抵触，必须合乎有关法律的原则甚至具体规定（）","answer":"A","options":["A. 政策内容的合法化","B. 政策过程合法化","C. 政策结果的合法化","D. 决策程序的合法化"],"explanation":"","tags":["公共政策","XX1010","第8章","单选"]},{"question":"_____指立论理由及其立论依据压倒驳斥理由及其立论依据的程度（）","answer":"C","options":["A. 可效度","B. 根据度","C. 可信度","D. 立论度"],"explanation":"","tags":["公共政策","XX1010","第8章","单选"]},{"question":"政策目标的三大特征是（）","answer":"ABC","options":["A. 问题的针对性","B. 未来的预期性","C. 目的的多元性","D. 定位的超越性"],"explanation":"","tags":["公共政策","XX1010","第8章","多选"]},{"question":"依据政策所服务的主体是普通社会大众还是社会少数人群体，可有（）","answer":"AD","options":["A. 公益性政策目标","B. 经济政策","C. 政治政策","D. 特殊性政策目标"],"explanation":"","tags":["公共政策","XX1010","第8章","多选"]},{"question":"邓恩把预测性评估归纳为三种方法（）","answer":"ABC","options":["A. 外推预测","B. 理论预测","C. 判断预测","D. 内推预测"],"explanation":"","tags":["公共政策","XX1010","第8章","多选"]},{"question":"政策制定是政策过程的核心阶段","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","判断"]},{"question":"公共政策的基本目标是：自由公平民主法治","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","判断"]},{"question":"政策移植只可以发生在议程建立阶段，政策移植的作用尤为重要。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","判断"]},{"question":"政策采纳是政策抉择的最后一环。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","判断"]},{"question":"公共政策制定","answer":"就是公共组织特别是政府针对有关的重要政策问题，依照一定的程序和原则确定政策目标，拟订、评估和最终择定有关政策方案并予以合法化的过程。","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","名词解释"]},{"question":"政策移植","answer":"政策移植就是一个政策借用国釆纳其他国家的公共政策、行政体制、制度及思想等来解决本国所面临的政策问题。","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","名词解释"]},{"question":"确定政策目标的意义？","answer":"（1）它能为制定政策方案提供方向性指导。（2）它能为政策方案的规划和实施提供核心的评估标准。","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","简答"]},{"question":"确定政策目标的原则？","answer":"（1）实事求是；（2）面向未来；（3）系统协调；（4）明确具体；（5）伦理考量。","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","简答"]},{"question":"政策方案的设计原则","answer":"（1）紧扣政策目标；（2）规划多重方案；（3）方案彼此独立；（4）方案要有创新；（5）方案切实可行。","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","简答"]},{"question":"政策规划与政策设计的联系与区别？","answer":"（1）政策规划是政策科学发展的早期阶段的分析概念，指的是公共政策形成的一个重要过程，带有明显的“阶段论”特点。政策规划重点考虑解决方案的形成和研判，偏重理性和技术层面的分析。（2）而政策设计在很大程度上是打破阶段论划分的新概念，主张政策设计的学者一般反对具有逻辑顺序特点的政策阶段理论。政策设计从范围来看更为广阔，它“不仅着重解决方案的研拟，也非常重视政策方案的执行问题；不仅是重视技术分析，也重视政治分析”。从政策设计的结构逻辑来看，它将政策问题和政策方案、政策制定和政策执行都联系起来，贯穿于整个政策制定过程，而不强调政策阶段划分。它将各阶段融合起来，用更加系统的方法来探讨政策方案的形成及其执行问题。","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","论述"]},{"question":"公共政策抉择的合法化的问题","answer":"政策的合法化不仅涉及政策抉择的程序化和一定情况下的政策法律化问题，而且还有一个常为人忽视但却极端重要的问题，即政策在实质内容方面也要合乎既定法律的问题。试想如果仅有程序上的合法性，而没有实质内容上的合法性，那么所谓的合法性也仅仅是徒具形式意义。因此，我们的界定是：政策合法化是有关政策抉择主体依据有关法律，按照法定程序对政策方案加以审査、通过或批准、签署及发布的过程。这一概念涵盖了三方面内容：政策内容的合法化、决策过程的合法化和政策文本的法律化。现分别阐述如下。（1）政策内容的合法化政策内容的合法化，就是决策者择定的政策在内容上不能与既定宪法和法律相抵触，必须合乎有关法律的原则甚至具体规定。具体说来，政策内容的合法化要求所制定的政策与既定的法律相一致。当然，如果既定的有关法律或政策在新形势下存在一些严重的问题，新制定的政策可以不与该项政策的规定相一致，但应注明处理同类问题以新政策为准，这就在实际上废止了已有法律或政策及其某些具体规定。（2）决策程序的合法化政策合法化的另一个重要方面就是政策抉择过程应合乎法定的程序要求。这就是说，法定的决策程序在政策合法化中占有极其重要的地位。在法学中，人们历来强调程序的正义，在决策上我们同样要重视程序正义原则。政策的抉择程序通常是非常复杂的，这不仅表现在它本身的具体程序繁多，而且不同机构、不同主体的抉择程序也是各有不同的。（3）政策文本的法律化政策文本的法律化就是有立法权的国家机关将有些成熟、稳定的政策上升为法律的过程，也称政策立法。它实际上就是一种立法过程，它遵循的就是立法程序。政策立法的主体，一为立法机关，二为有权将一般的行政决策上升为行政法规的那些行政机关。从政策立法的政策范围来说，并不是所有的政策都要法律化，而是那些有立法必要的、比较成熟和稳定的政策。从政策制定过程本身来看，政策文本的法律化是政策合法化的一种极其重要的形式。","options":[],"explanation":"","tags":["公共政策","XX1010","第8章","案例分析"]},{"question":"影响公共政策执行的政策环境可区分为自然环境和（）","answer":"A","options":["A. 社会环境","B. 文化环境","C. 历史环境","D. 人文环境"],"explanation":"","tags":["公共政策","XX1010","第9章","单选"]},{"question":"_____是政策执行的主体行为（）","answer":"A","options":["A. 下级行政人员","B. 上级领导","C. 中层干部","D. 中央领导"],"explanation":"","tags":["公共政策","XX1010","第9章","单选"]},{"question":"_____是制定后继政策的基本依据（）","answer":"A","options":["A. 公共政策执行","B. 公共政策预测","C. 公共政策实施","D. 公共政策抉择"],"explanation":"","tags":["公共政策","XX1010","第9章","单选"]},{"question":"公共政策执行是公共政策的具体实践过程，它具有_____特点（）","answer":"ABCD","options":["A. 目标的导向性","B. 内容的务实性","C. 行为的能动性","D. 手段的权威性"],"explanation":"","tags":["公共政策","XX1010","第9章","多选"]},{"question":"政策试验一定要按照科学方法进行，大致包括三个步骤（）","answer":"ABC","options":["A. 选择试验对象","B. 设计试验方案","C. 总结试验结果","D. 设计试验过程"],"explanation":"","tags":["公共政策","XX1010","第9章","多选"]},{"question":"有效的政策执行要遵循_____原则（）","answer":"ABCD","options":["A. 忠实","B. 民主","C. 法治","D. 创新"],"explanation":"","tags":["公共政策","XX1010","第9章","多选"]},{"question":"政策执行是一个“从群众中来，到群众中去”的过程。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","判断"]},{"question":"公共政策的无效执行是政策失灵的主要表现之一。","answer":"正确","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","判断"]},{"question":"政策执行机关自身建设具有法制性，是指政策执行机关设置符合宪法有关规定即可。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","判断"]},{"question":"政策缺乏稳定性和连续是执行偏差产生的主观原因。","answer":"错误","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","判断"]},{"question":"公共政策执行","answer":"就是政策执行主体为了实现公共政策目标，通过各种措施和手段作用于公共政策对象，使公共政策内容变为现实的行动过程。","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","名词解释"]},{"question":"政策执行偏差","answer":"是指执行者在实施政策过程中，由于主、客观因素的作用，其行为效果偏离政策目标并产生了不良后果的政策现象。","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","名词解释"]},{"question":"简述公共政策执行的地位和作用。","answer":"（1）公共政策执行是实现政策目标的重要途径。（2）公共政策执行是检验政策质量的唯一环节。（3）公共政策执行是制定后继政策的基本依据。","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","简答"]},{"question":"戴尼丝·施柏丽在对联邦制国家结构中环境政策的执行的研究中得出结论，将府际的运作关系分为哪些类型？","answer":"（1）“合作共事型”。（2）合作但维持地方自主型”。（3）“逃避式各自为政型”。（4）争斗式各自为政型“。","options":[],"explanation":"","tags":["公共政策","XX1010","第9章","简答"]},{"question":"政策执行的工具有哪些？","answer":"（1）行政工具；（2）法律工具；（3）经济工具；（4）思想政治教育工具；（5）技术工具。","options":[],"
