name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # macos-14 会解析到 arm64 机型（macos-14-arm64-us-xl），部分账号不支持。
    # 改用官方仍在维护的 Intel runner，避开 arm64 调度问题。
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode with iOS platform
        run: |
          # 选一个真正带 iPhoneOS SDK 的 Xcode，避免 generic/platform=iOS 找不到平台。
          # 优先 Xcode 16（兼容 iOS 14 部署目标）。
          XC=""
          # 镜像默认 Xcode 是 16.4，带 iOS 18.5 SDK；优先用它，避开老 Xcode 16.0 的平台问题。
          if ls /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk >/dev/null 2>&1; then
            XC=/Applications/Xcode.app
          fi
          if [ -z "$XC" ]; then
            for APP in $(ls -d /Applications/Xcode_16.4*.app /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | sort -u); do
              if ls "$APP"/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk >/dev/null 2>&1; then
                XC="$APP"
                break
              fi
            done
          fi
          if [ -z "$XC" ]; then
            XC=/Applications/Xcode.app
            echo "iPhoneOS SDK missing, trying to download iOS platform..."
            sudo xcode-select -s "$XC/Contents/Developer"
            xcodebuild -downloadPlatform iOS || true
          fi
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Show available signing identities
        run: security find-identity -v -p codesigning || true

      # 这里不强求 ad-hoc 签名：GitHub 云 Mac 没有证书，Sideloadly 会在用户电脑上重新签名，
      # 所以直接产出未签名 .app 再手工打包 IPA，能避开签名/描述文件导致的 exit code 66。
      - name: Build (unsigned .app, signed later by Sideloadly)
        run: |
          mkdir -p build
          set +e
          xcodebuild \
            -project TipScan.xcodeproj \
            -scheme TipScan \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            clean archive -archivePath build/TipScan.xcarchive 2>&1 | tee build/xcodebuild.log
          RC=${PIPESTATUS[0]}
          # 把每条编译错误抛成 GitHub annotation，方便从公开 API 直接读取
          grep -E "error:|fatal error|FAILED|The following build commands failed" build/xcodebuild.log | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $RC

      - name: Package .ipa manually
        run: |
          set -e
          APP=$(find build/TipScan.xcarchive/Products/Applications -name '*.app' -print -quit 2>/dev/null)
          if [ -z "$APP" ]; then
            APP=$(find build/Build/Products -name 'TipScan.app' -print -quit 2>/dev/null)
          fi
          test -n "$APP" || { echo "No .app found"; exit 1; }
          mkdir -p build/export/Payload
          cp -R "$APP" build/export/Payload/
          cd build/export
          zip -qry TipScan.ipa Payload
          ls -lh TipScan.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: List build output
        run: find build -name "*.ipa" -o -name "*.app" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TipScan-IPA
          path: |
            build/export/*.ipa
            build/export/Payload/*.app
          if-no-files-found: warn
          retention-days: 30
